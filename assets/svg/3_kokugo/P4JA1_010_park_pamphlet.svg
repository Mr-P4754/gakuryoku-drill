<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="img" aria-label="さくら公園のパンフレット（地図と広場の説明表）">
  <defs><style>.t { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif; }</style></defs>
  <rect width="720" height="620" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="2"/>
  <text x="360" y="36" text-anchor="middle" class="t" font-size="19" font-weight="700" fill="#9D174D">さくら公園のパンフレット</text>

  <!-- Park Map outer frame -->
  <rect x="34" y="68" width="652" height="278" rx="16" fill="#FFFFFF" stroke="#334155" stroke-width="2.2"/>

  <!-- North gate -->
  <rect x="316" y="52" width="88" height="32" rx="6" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="360" y="74" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#1E3A8A">北口</text>

  <!-- South gate -->
  <rect x="316" y="330" width="88" height="32" rx="6" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="360" y="352" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#1E3A8A">南口</text>

  <!-- Top row: 3 smaller plazas (第1, 第2, 第3) -->
  <rect x="58" y="98" width="184" height="102" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="150" y="156" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#14532D">第1広場</text>

  <rect x="268" y="98" width="184" height="102" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="360" y="156" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#14532D">第2広場</text>

  <rect x="478" y="98" width="184" height="102" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="570" y="156" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#14532D">第3広場</text>

  <!-- Bottom row: 2 wider plazas (第4, 第5) -->
  <rect x="58" y="216" width="290" height="104" rx="10" fill="#ECFDF5" stroke="#15803D" stroke-width="2"/>
  <text x="203" y="275" text-anchor="middle" class="t" font-size="19" font-weight="700" fill="#14532D">第4広場</text>

  <rect x="372" y="216" width="290" height="104" rx="10" fill="#ECFDF5" stroke="#15803D" stroke-width="2"/>
  <text x="517" y="275" text-anchor="middle" class="t" font-size="19" font-weight="700" fill="#14532D">第5広場</text>

  <!-- Info Table -->
  <g transform="translate(34, 380)">
    <!-- Table Header -->
    <rect x="0" y="0" width="652" height="40" fill="#E2E8F0"/>
    <text x="58" y="26" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#0F172A">広場</text>
    <text x="332" y="26" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#0F172A">広場の説明</text>
    <text x="600" y="26" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#0F172A">ボール遊び</text>

    <!-- Rows -->
    <rect x="0" y="40" width="652" height="36" fill="#FFFFFF"/>
    <text x="58" y="64" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#1E293B">第1広場</text>
    <text x="132" y="64" class="t" font-size="14.5" fill="#1E293B">楽しい遊具がたくさんあります。</text>
    <text x="600" y="65" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#DC2626">×</text>

    <rect x="0" y="76" width="652" height="36" fill="#F8FAFC"/>
    <text x="58" y="100" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#1E293B">第2広場</text>
    <text x="132" y="100" class="t" font-size="14.5" fill="#1E293B">花畑をながめながら散歩（さんぽ）ができます。</text>
    <text x="600" y="101" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#DC2626">×</text>

    <rect x="0" y="112" width="652" height="36" fill="#FFFFFF"/>
    <text x="58" y="136" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#1E293B">第3広場</text>
    <text x="132" y="136" class="t" font-size="14.5" fill="#1E293B">グラウンドがあります。</text>
    <text x="600" y="137" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#16A34A">○</text>

    <rect x="0" y="148" width="652" height="36" fill="#F8FAFC"/>
    <text x="58" y="172" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#1E293B">第4広場</text>
    <text x="132" y="172" class="t" font-size="14.5" fill="#1E293B">工事中のため利用（りよう）できません。</text>
    <text x="600" y="173" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#DC2626">×</text>

    <rect x="0" y="184" width="652" height="36" fill="#FFFFFF"/>
    <text x="58" y="208" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#1E293B">第5広場</text>
    <text x="132" y="208" class="t" font-size="14.5" fill="#1E293B">しばふが広がり、ピクニックに最適（さいてき）です。</text>
    <text x="600" y="209" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#16A34A">○</text>

    <!-- Table borders -->
    <rect x="0" y="0" width="652" height="220" fill="none" stroke="#475569" stroke-width="1.8"/>
    <line x1="116" y1="0" x2="116" y2="220" stroke="#64748B" stroke-width="1.3"/>
    <line x1="548" y1="0" x2="548" y2="220" stroke="#64748B" stroke-width="1.3"/>
    <line x1="0" y1="40" x2="652" y2="40" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="76" x2="652" y2="76" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="112" x2="652" y2="112" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="148" x2="652" y2="148" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="184" x2="652" y2="184" stroke="#CBD5E1" stroke-width="1"/>
  </g>
</svg>
