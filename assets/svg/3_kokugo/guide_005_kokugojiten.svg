  <rect x="656" y="186" width="44" height="22" rx="5" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="678" y="202" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#1E40AF">ん</text>
  <rect x="20" y="236" width="342" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="34" y="259" class="t" font-size="14" font-weight="700" fill="#991B1B">① 1字目→2字目→3字目</text>
  <text x="34" y="280" class="t" font-size="12.5" fill="#334155">同じ字なら次の字をくらべるよ</text>
  <text x="34" y="298" class="t" font-size="12.5" font-weight="700" fill="#DC2626">例：さか → さくら → ささ → さとう</text>
  <rect x="378" y="236" width="342" height="72" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="392" y="259" class="t" font-size="14" font-weight="700" fill="#1E40AF">② にごる音・半濁音</text>
  <text x="392" y="280" class="t" font-size="12.5" fill="#334155">清音 → 濁音(゛) → 半濁音(゜)</text>
  <text x="392" y="298" class="t" font-size="12.5" font-weight="700" fill="#2563EB">例：ホール → ボール → ポール</text>
  <rect x="20" y="318" width="342" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="34" y="341" class="t" font-size="14" font-weight="700" fill="#065F46">③ のばす音「ー」</text>
  <text x="34" y="362" class="t" font-size="12.5" fill="#334155">前の音の母音(あいうえお)にする</text>
  <text x="34" y="380" class="t" font-size="12.5" font-weight="700" fill="#059669">例：シート(シイト)→しっと→しつど</text>
  <rect x="378" y="318" width="342" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="392" y="341" class="t" font-size="14" font-weight="700" fill="#92400E">④ 小さい字・言い切り</text>
  <text x="392" y="362" class="t" font-size="12.5" fill="#334155">っ・ゃ・ゅ・ょは大きい字と同じあつかい</text>
  <text x="392" y="380" class="t" font-size="12.5" font-weight="700" fill="#D97706">言い切りの形で引く（書いた→書く）</text>
</svg>
