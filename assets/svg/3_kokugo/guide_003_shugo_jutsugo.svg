<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" role="img" aria-label="主語と述語の見つけ方の図">
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#DC2626"/>
    </marker>
    <style>.t { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif; }</style>
  </defs>
  <rect width="740" height="330" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
  <text x="370" y="34" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#92400E">主語と述語の見つけ方（3つのステップ）</text>

  <!-- Example 1 -->
  <g transform="translate(36, 92)">
    <rect x="0" y="0" width="144" height="50" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
    <text x="72" y="32" text-anchor="middle" class="t" font-size="21" font-weight="700" fill="#991B1B">わたしは、</text>
    <text x="72" y="72" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#DC2626">主語（だれは）</text>

    <rect x="166" y="0" width="122" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    <text x="227" y="32" text-anchor="middle" class="t" font-size="19" fill="#475569">きのう、</text>

    <rect x="308" y="0" width="126" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    <text x="371" y="32" text-anchor="middle" class="t" font-size="19" fill="#475569">公園で</text>

    <rect x="456" y="0" width="210" height="50" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="561" y="32" text-anchor="middle" class="t" font-size="21" font-weight="700" fill="#1E40AF">遊びました。</text>
    <text x="561" y="72" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#2563EB">述語（どうした）</text>

    <path d="M72,-4 Q316,-44 554,-6" fill="none" stroke="#DC2626" stroke-width="2.8" marker-end="url(#arr-red)"/>
    <text x="316" y="-29" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#B91C1C">すぐ前において確かめよう！「わたしは 遊びました。」→ ○</text>
  </g>

  <!-- 3 Steps Box -->
  <g transform="translate(26, 186)">
    <rect x="0" y="0" width="220" height="120" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.8"/>
    <text x="110" y="26" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#1E40AF">① まず述語をさがす</text>
    <text x="110" y="54" text-anchor="middle" class="t" font-size="13" fill="#334155">「どうする」「どんなだ」</text>
    <text x="110" y="75" text-anchor="middle" class="t" font-size="13" fill="#334155">「なんだ」に当たる言葉</text>
    <text x="110" y="102" text-anchor="middle" class="t" font-size="12.5" font-weight="700" fill="#2563EB">（文の終わりにあることが多い）</text>

    <rect x="234" y="0" width="220" height="120" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.8"/>
    <text x="344" y="26" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#991B1B">② つぎに主語をさがす</text>
    <text x="344" y="54" text-anchor="middle" class="t" font-size="13" fill="#334155">「何が（は）」「だれが（は）」</text>
    <text x="344" y="75" text-anchor="middle" class="t" font-size="13" fill="#334155">「〜も」に注目しよう！</text>
    <text x="344" y="102" text-anchor="middle" class="t" font-size="12.5" font-weight="700" fill="#DC2626">例：犬が／手は／わたしも</text>

    <rect x="468" y="0" width="220" height="120" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.8"/>
    <text x="578" y="26" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#065F46">③ 2つを並べて読む</text>
    <text x="578" y="54" text-anchor="middle" class="t" font-size="13" fill="#334155">主語を述語のすぐ前に</text>
    <text x="578" y="75" text-anchor="middle" class="t" font-size="13" fill="#334155">おいて意味が通じればOK!</text>
    <text x="578" y="102" text-anchor="middle" class="t" font-size="12.5" font-weight="700" fill="#059669">例：「犬が ほえた。」</text>
  </g>
</svg>
