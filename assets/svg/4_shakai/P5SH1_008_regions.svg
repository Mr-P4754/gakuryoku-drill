      <!-- Student 1 (dark hair, light skin, raising hand) -->
      <g transform="translate(352, 166)">
        <line x1="50" y1="48" x2="58" y2="14" stroke="#FDE68A" stroke-width="7" stroke-linecap="round"/>
        <circle cx="58" cy="12" r="5" fill="#FDE68A" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="32" cy="30" r="16" fill="#FDE68A" stroke="#1E293B" stroke-width="1.6"/>
        <path d="M 16,28 Q 20,10 42,14 Q 48,20 48,30 Q 34,20 16,28 Z" fill="#1E293B"/>
        <circle cx="27" cy="30" r="1.8" fill="#0F172A"/><circle cx="36" cy="30" r="1.8" fill="#0F172A"/>
