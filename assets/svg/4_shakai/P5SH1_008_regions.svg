      <rect x="358" y="52" width="184" height="88" rx="4" fill="#166534" stroke="#92400E" stroke-width="5"/>
      <text x="372" y="76" font-size="11.5" font-weight="700" fill="#FFFFFF">こんにちは</text>
      <text x="372" y="96" font-size="11.5" font-weight="700" fill="#FDE047">Hello!</text>
      <text x="372" y="116" font-size="11.5" font-weight="700" fill="#93C5FD">Olá! / 你好!</text>
      <!-- Simple globe drawing on chalkboard -->
      <circle cx="502" cy="96" r="24" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
      <path d="M 488,88 Q 498,82 508,92 Q 515,102 502,110 Q 490,104 488,88 Z" fill="#4ADE80"/>
      <path d="M 508,82 Q 518,86 516,96" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>
