      <polyline points="550,56 626,64" fill="none" stroke="#64748B" stroke-width="1.4"/>
      <polygon points="558,57 572,58 564,74" fill="#EF4444"/>
      <polygon points="576,59 590,60 582,76" fill="#3B82F6"/>
      <polygon points="594,61 608,62 600,78" fill="#22C55E"/>
      <polygon points="610,63 624,64 616,80" fill="#FACC15"/>

