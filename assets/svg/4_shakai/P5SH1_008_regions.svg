      <path d="M 46,198 Q 38,180 44,162 L 56,162 Q 62,180 54,198 Z" fill="#2563EB" stroke="#1E293B" stroke-width="1.4"/>
      <ellipse cx="50" cy="162" rx="7" ry="2.5" fill="#93C5FD" stroke="#1E293B" stroke-width="1.2"/>
      <!-- Earthy ceramic tea bowls (stacked) -->
      <path d="M 70,192 Q 74,208 88,208 Q 102,208 106,192 Z" fill="#F97316" stroke="#451A03" stroke-width="1.4"/>
      <ellipse cx="88" cy="192" rx="18" ry="5" fill="#FED7AA" stroke="#451A03" stroke-width="1.3"/>
