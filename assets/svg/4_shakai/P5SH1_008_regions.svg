        <path d="M 10,20 Q 14,5 32,9 Q 38,14 38,24 Z" fill="#451A03"/>
        <circle cx="19" cy="22" r="1.6" fill="#0F172A"/><circle cx="27" cy="22" r="1.6" fill="#0F172A"/>
        <path d="M 20,27 Q 23,30 27,27" fill="none" stroke="#0F172A" stroke-width="1.3"/>
        <rect x="10" y="36" width="28" height="48" rx="6" fill="#6366F1" stroke="#1E293B" stroke-width="1.5"/>
      </g>

