      <path d="M 76,184 Q 88,188 100,184" fill="none" stroke="#1D4ED8" stroke-width="2"/>
      <!-- Ceramic teapot -->
      <circle cx="128" cy="192" r="13" fill="#B45309" stroke="#451A03" stroke-width="1.4"/>
      <path d="M 140,188 L 150,182" stroke="#B45309" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 116,184 Q 128,166 140,184" fill="none" stroke="#451A03" stroke-width="2"/>
