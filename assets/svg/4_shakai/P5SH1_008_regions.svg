      <polygon points="15,96 76,68 138,96" fill="#475569" stroke="#1E293B" stroke-width="1.5"/>
      <!-- Traditional Noren curtain -->
      <rect x="34" y="102" width="22" height="28" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="58" y="102" width="22" height="28" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="82" y="102" width="22" height="28" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="1"/>
      <!-- Background shop -->
