      <rect x="20" y="38" width="292" height="110" fill="#E0F2FE"/>
      <path d="M 20,125 Q 90,82 175,112 Q 245,86 312,118 L 312,155 L 20,155 Z" fill="#86EFAC"/>
      <!-- Street pavement -->
      <rect x="20" y="150" width="292" height="150" fill="#E2E8F0"/>
      <!-- Traditional Japanese craft shop buildings on left & background -->
