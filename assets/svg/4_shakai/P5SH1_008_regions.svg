        <rect x="14" y="80" width="36" height="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
      </g>
      <!-- Student 2 (blonde/brown wavy hair, medium-tan skin, smiling & raising hand) -->
      <g transform="translate(432, 174)">
        <line x1="12" y1="46" x2="4" y2="12" stroke="#D9A066" stroke-width="7" stroke-linecap="round"/>
        <circle cx="4" cy="10" r="5" fill="#D9A066" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="34" cy="30" r="16" fill="#D9A066" stroke="#1E293B" stroke-width="1.6"/>
        <path d="M 17,28 Q 18,9 36,10 Q 52,12 51,32 Q 44,24 34,20 Q 24,22 17,28 Z" fill="#92400E"/>
        <circle cx="29" cy="30" r="1.8" fill="#0F172A"/><circle cx="39" cy="30" r="1.8" fill="#0F172A"/>
        <path d="M 30,36 Q 34,40 38,36" fill="none" stroke="#0F172A" stroke-width="1.4"/>
        <rect x="18" y="46" width="32" height="36" rx="6" fill="#EC4899" stroke="#1E293B" stroke-width="1.6"/>
