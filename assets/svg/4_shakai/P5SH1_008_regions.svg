      <rect x="62" y="210" width="16" height="16" rx="3" fill="#0F766E" stroke="#1E293B" stroke-width="1.3"/>
      <rect x="112" y="206" width="18" height="14" rx="4" fill="#F8FAFC" stroke="#334155" stroke-width="1.3"/>

