  <g id="reg-u">
    <g clip-path="url(#rc3)">
      <!-- Crisp winter blue sky -->
      <rect x="648" y="38" width="292" height="125" fill="#BAE6FD"/>
      <!-- Soft clouds -->
      <g fill="#FFFFFF" fill-opacity="0.85">
        <ellipse cx="705" cy="64" rx="28" ry="9"/><ellipse cx="870" cy="70" rx="34" ry="10"/>
      </g>
      <!-- Majestic snow-capped mountain range (Shiretoko mountain range style) -->
      <polygon points="644,162 710,74 758,128 815,62 872,118 914,82 945,162" fill="#475569" stroke="#1E293B" stroke-width="1.4"/>
      <!-- Snow caps & ridges -->
      <polygon points="710,74 686,108 704,102 718,112 732,98" fill="#FFFFFF"/>
      <polygon points="815,62 784,106 804,98 818,110 834,94 846,104" fill="#FFFFFF"/>
      <polygon points="914,82 894,110 910,104 926,112 934,104" fill="#FFFFFF"/>
      <!-- Snow slopes highlight -->
      <path d="M 656,160 L 710,98 L 750,160 M 765,160 L 815,96 L 865,160" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-opacity="0.6"/>

      <!-- Deep Arctic blue sea -->
      <rect x="648" y="160" width="292" height="140" fill="#0369A1"/>
      <!-- Distant drift ice horizon band -->
      <rect x="648" y="162" width="292" height="16" fill="#E0F2FE"/>

      <!-- Drift ice floes (流氷) floating in the sea -->
      <polygon points="648,195 724,186 762,202 718,218 648,212" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <polygon points="784,188 864,182 918,198 882,216 802,212" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <!-- Large foreground drift ice floes -->
      <polygon points="644,232 768,218 824,244 794,296 644,302" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
      <polygon points="644,292 794,284 824,244 824,258 794,302 644,302" fill="#CBD5E1"/>
      <polygon points="812,248 944,228 944,302 820,302" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
      <polygon points="820,288 944,274 944,302 820,302" fill="#CBD5E1"/>

      <!-- Wild Steller's Sea Eagle 1 (オオワシ perched on left ice floe) -->
      <g transform="translate(722, 206)">
        <!-- Body & dark wings -->
        <ellipse cx="18" cy="28" rx="11" ry="18" fill="#1E293B" transform="rotate(-12 18 28)"/>
        <!-- Characteristic white shoulder patch & tail -->
        <ellipse cx="14" cy="20" rx="5" ry="7" fill="#FFFFFF"/>
        <polygon points="22,42 30,52 18,50" fill="#FFFFFF" stroke="#334155" stroke-width="0.8"/>
        <!-- Head & bright yellow hooked beak -->
        <circle cx="15" cy="9" r="7" fill="#1E293B"/>
        <polygon points="9,8 1,11 9,14" fill="#FACC15" stroke="#854D0E" stroke-width="0.8"/>
        <circle cx="13" cy="8" r="1.2" fill="#FFFFFF"/>
        <!-- Legs -->
        <line x1="14" y1="45" x2="12" y2="54" stroke="#F59E0B" stroke-width="2.2"/>
        <line x1="20" y1="45" x2="22" y2="54" stroke="#F59E0B" stroke-width="2.2"/>
      </g>

      <!-- Wild Sea Eagle 2 (perched on right ice floe) -->
      <g transform="translate(838, 212)">
        <ellipse cx="18" cy="26" rx="10" ry="16" fill="#1E293B" transform="rotate(10 18 26)"/>
        <ellipse cx="22" cy="19" rx="4.5" ry="6.5" fill="#FFFFFF"/>
        <polygon points="14,39 8,49 19,47" fill="#FFFFFF" stroke="#334155" stroke-width="0.8"/>
        <circle cx="21" cy="9" r="6.5" fill="#1E293B"/>
        <polygon points="27,8 34,11 27,13.5" fill="#FACC15" stroke="#854D0E" stroke-width="0.8"/>
        <circle cx="23" cy="8" r="1.2" fill="#FFFFFF"/>
        <line x1="16" y1="42" x2="14" y2="50" stroke="#F59E0B" stroke-width="2.2"/>
        <line x1="22" y1="42" x2="24" y2="50" stroke="#F59E0B" stroke-width="2.2"/>
      </g>
    </g>
    <rect x="648" y="38" width="292" height="262" rx="10" fill="none" stroke="#1E293B" stroke-width="1.8"/>
