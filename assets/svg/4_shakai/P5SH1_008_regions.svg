        <path d="M 11,22 Q 16,6 34,10 Q 42,16 40,26 Q 28,16 11,22 Z" fill="#1E293B"/>
        <circle cx="21" cy="24" r="1.8" fill="#0F172A"/><circle cx="30" cy="24" r="1.8" fill="#0F172A"/>
        <path d="M 22,30 Q 26,33 30,30" fill="none" stroke="#0F172A" stroke-width="1.4"/>
        <path d="M 8,42 Q 26,38 44,42 L 48,108 L 4,108 Z" fill="#EF4444" stroke="#1E293B" stroke-width="1.6"/>
        <!-- Holding a teacup -->
