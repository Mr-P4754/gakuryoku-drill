<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="特色ある地域のまちづくりや取り組みの3つのイラスト（ア・イ・ウ）">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="960" height="320" fill="#FFFFFF"/>

  <defs>
    <clipPath id="rc1"><rect x="20" y="38" width="292" height="262" rx="10"/></clipPath>
    <clipPath id="rc2"><rect x="334" y="38" width="292" height="262" rx="10"/></clipPath>
    <clipPath id="rc3"><rect x="648" y="38" width="292" height="262" rx="10"/></clipPath>
  </defs>
  <circle cx="38" cy="20" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
  <text x="38" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">ア</text>
  <circle cx="352" cy="20" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
  <text x="352" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">イ</text>
  <circle cx="666" cy="20" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
  <text x="666" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">ウ</text>
  <g id="reg-a">
    <g clip-path="url(#rc1)">
