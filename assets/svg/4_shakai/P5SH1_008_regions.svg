        <rect x="16" y="80" width="38" height="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
      </g>
      <!-- Student 3 (curly dark hair, warm brown skin, waving/holding notebook) -->
      <g transform="translate(514, 170)">
        <line x1="52" y1="46" x2="60" y2="12" stroke="#A16207" stroke-width="7" stroke-linecap="round"/>
        <circle cx="60" cy="10" r="5" fill="#A16207" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="32" cy="30" r="16" fill="#B47B46" stroke="#1E293B" stroke-width="1.6"/>
        <path d="M 15,28 Q 14,10 32,8 Q 50,10 49,28 Q 42,18 32,18 Q 22,18 15,28 Z" fill="#1E293B"/>
        <circle cx="27" cy="30" r="1.8" fill="#0F172A"/><circle cx="37" cy="30" r="1.8" fill="#0F172A"/>
        <path d="M 28,36 Q 32,40 36,36" fill="none" stroke="#0F172A" stroke-width="1.4"/>
        <rect x="16" y="46" width="32" height="36" rx="6" fill="#22C55E" stroke="#1E293B" stroke-width="1.6"/>
        <!-- Desk -->
        <rect x="4" y="76" width="60" height="44" fill="#F59E0B" stroke="#78350F" stroke-width="1.6"/>
        <rect x="14" y="80" width="36" height="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
      </g>
