<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="水をきれいにするしせつ（あ）とダム（い）の模式図">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="920" height="420" fill="#FFFFFF"/>

  <g id="panel-a">
    <defs>
      <clipPath id="clip-a"><rect x="20" y="20" width="430" height="380" rx="10"/></clipPath>
    </defs>
    <g clip-path="url(#clip-a)">
      <!-- Ground & roads -->
      <rect x="20" y="20" width="430" height="380" fill="#E2E8F0"/>
      <!-- River along top -->
      <path d="M 15,78 Q 140,62 245,52 T 460,36 L 460,15 L 15,15 Z" fill="#60A5FA"/>
      <path d="M 15,78 Q 140,62 245,52 T 460,36" fill="none" stroke="#1D4ED8" stroke-width="2"/>
      <!-- Water ripples -->
      <path d="M 85,55 Q 100,52 115,55 M 185,43 Q 202,40 218,43 M 310,36 Q 326,33 342,36 M 395,28 Q 412,25 426,28" fill="none" stroke="#DBEAFE" stroke-width="2" stroke-linecap="round"/>
      <!-- Green riverbank embankment -->
      <path d="M 15,78 Q 140,62 245,52 T 460,36 L 460,54 Q 340,68 245,74 T 15,96 Z" fill="#86EFAC" stroke="#15803D" stroke-width="1"/>
      <!-- Intake pipe from river into plant -->
      <rect x="112" y="68" width="14" height="36" fill="#64748B" stroke="#1E293B" stroke-width="1.2"/>
      <polygon points="119,108 113,98 125,98" fill="#1E293B"/>

      <!-- Main plant paved compound -->
      <polygon points="36,112 428,74 440,342 54,358" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>

      <!-- Left: Circular flocculation / sedimentation tanks (2 columns x 4 rows) -->
      <g fill="#93C5FD" stroke="#1E3A8A" stroke-width="1.5">
        <circle cx="88" cy="158" r="21"/><circle cx="138" cy="154" r="21"/>
        <circle cx="92" cy="206" r="21"/><circle cx="142" cy="202" r="21"/>
        <circle cx="96" cy="254" r="21"/><circle cx="146" cy="250" r="21"/>
        <circle cx="100" cy="302" r="21"/><circle cx="150" cy="298" r="21"/>
      </g>
      <!-- Center scraper bridges in circular tanks -->
      <g stroke="#334155" stroke-width="1.5">
        <line x1="69" y1="158" x2="107" y2="158"/><circle cx="88" cy="158" r="4" fill="#E2E8F0"/>
        <line x1="119" y1="154" x2="157" y2="154"/><circle cx="138" cy="154" r="4" fill="#E2E8F0"/>
        <line x1="73" y1="206" x2="111" y2="206"/><circle cx="92" cy="206" r="4" fill="#E2E8F0"/>
        <line x1="123" y1="202" x2="161" y2="202"/><circle cx="142" cy="202" r="4" fill="#E2E8F0"/>
        <line x1="77" y1="254" x2="115" y2="254"/><circle cx="96" cy="254" r="4" fill="#E2E8F0"/>
        <line x1="127" y1="250" x2="165" y2="250"/><circle cx="146" cy="250" r="4" fill="#E2E8F0"/>
        <line x1="81" y1="302" x2="119" y2="302"/><circle cx="100" cy="302" r="4" fill="#E2E8F0"/>
        <line x1="131" y1="298" x2="169" y2="298"/><circle cx="150" cy="298" r="4" fill="#E2E8F0"/>
      </g>

      <!-- Center: Large rectangular settling & filtration basins (2 banks) -->
      <!-- Upper bank (rapid sand filter grid) -->
      <g transform="translate(182, 114) skewY(-4.5)">
        <rect x="0" y="0" width="128" height="96" fill="#CBD5E1" stroke="#334155" stroke-width="1.6"/>
        <rect x="7" y="7" width="24" height="36" fill="#38BDF8" stroke="#0369A1" stroke-width="1"/>
        <rect x="37" y="7" width="24" height="36" fill="#38BDF8" stroke="#0369A1" stroke-width="1"/>
        <rect x="67" y="7" width="24" height="36" fill="#38BDF8" stroke="#0369A1" stroke-width="1"/>
        <rect x="97" y="7" width="24" height="36" fill="#38BDF8" stroke="#0369A1" stroke-width="1"/>
        <rect x="7" y="53" width="24" height="36" fill="#38BDF8" stroke="#0369A1" stroke-width="1"/>
        <rect x="37" y="53" width="24" height="36" fill="#38BDF8" stroke="#0369A1" stroke-width="1"/>
        <rect x="67" y="53" width="24" height="36" fill="#38BDF8" stroke="#0369A1" stroke-width="1"/>
        <rect x="97" y="53" width="24" height="36" fill="#38BDF8" stroke="#0369A1" stroke-width="1"/>
      </g>

      <!-- Lower bank (clean water settling pools) -->
      <g transform="translate(188, 224) skewY(-4.5)">
        <rect x="0" y="0" width="128" height="86" fill="#CBD5E1" stroke="#334155" stroke-width="1.6"/>
        <rect x="8" y="8" width="112" height="19" fill="#7DD3FC" stroke="#0284C7" stroke-width="1"/>
        <rect x="8" y="33" width="112" height="19" fill="#7DD3FC" stroke="#0284C7" stroke-width="1"/>
        <rect x="8" y="58" width="112" height="19" fill="#7DD3FC" stroke="#0284C7" stroke-width="1"/>
      </g>

      <!-- Right: Management / Water-quality testing buildings -->
      <g transform="translate(328, 102) skewY(-4.5)">
        <!-- Upper building -->
        <rect x="0" y="0" width="78" height="46" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
        <rect x="6" y="6" width="66" height="12" fill="#94A3B8"/>
        <rect x="10" y="24" width="12" height="12" fill="#BAE6FD" stroke="#334155" stroke-width="0.9"/>
        <rect x="28" y="24" width="12" height="12" fill="#BAE6FD" stroke="#334155" stroke-width="0.9"/>
        <rect x="46" y="24" width="12" height="12" fill="#BAE6FD" stroke="#334155" stroke-width="0.9"/>
        <!-- Middle tanks -->
        <rect x="4" y="62" width="72" height="58" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.4"/>
        <line x1="4" y1="81" x2="76" y2="81" stroke="#0369A1" stroke-width="1.2"/>
        <line x1="4" y1="100" x2="76" y2="100" stroke="#0369A1" stroke-width="1.2"/>
        <!-- Main control building -->
        <rect x="0" y="136" width="84" height="68" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8"/>
        <rect x="8" y="144" width="68" height="16" fill="#64748B"/>
        <rect x="10" y="168" width="14" height="14" fill="#93C5FD" stroke="#334155" stroke-width="1"/>
        <rect x="30" y="168" width="14" height="14" fill="#93C5FD" stroke="#334155" stroke-width="1"/>
        <rect x="50" y="168" width="14" height="14" fill="#93C5FD" stroke="#334155" stroke-width="1"/>
        <rect x="32" y="188" width="18" height="16" fill="#475569"/>
      </g>

      <!-- Bottom street & neighborhood houses (context) -->
      <rect x="20" y="362" width="430" height="40" fill="#CBD5E1"/>
      <g fill="#FEF3C7" stroke="#475569" stroke-width="1.2">
        <rect x="45" y="366" width="32" height="24"/><polygon points="42,366 61,354 80,366" fill="#D97706"/>
        <rect x="92" y="368" width="30" height="22"/><polygon points="89,368 107,356 125,368" fill="#B45309"/>
        <rect x="295" y="366" width="34" height="24"/><polygon points="292,366 312,354 332,366" fill="#64748B"/>
        <rect x="348" y="366" width="38" height="24"/><polygon points="345,366 367,354 389,366" fill="#D97706"/>
      </g>
      <!-- Trees along perimeter -->
      <g fill="#22C55E" stroke="#15803D" stroke-width="1">
        <circle cx="46" cy="145" r="10"/><circle cx="44" cy="195" r="10"/><circle cx="48" cy="245" r="10"/><circle cx="50" cy="295" r="10"/>
        <circle cx="172" cy="368" r="11"/><circle cx="195" cy="372" r="10"/><circle cx="242" cy="370" r="11"/>
      </g>
    </g>
    <rect x="20" y="20" width="430" height="380" rx="10" fill="none" stroke="#1E293B" stroke-width="2"/>
    <!-- Badge あ -->
    <circle cx="48" cy="48" r="18" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2"/>
    <text x="48" y="55" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">あ</text>
  </g>
  <g id="panel-i">
    <defs>
      <clipPath id="clip-i"><rect x="470" y="20" width="430" height="380" rx="10"/></clipPath>
    </defs>
    <g clip-path="url(#clip-i)">
      <!-- Sky -->
      <rect x="470" y="20" width="430" height="120" fill="#E0F2FE"/>
      <!-- Distant forested mountains -->
      <path d="M 465,135 Q 535,45 620,105 Q 690,65 765,98 Q 840,42 908,118 L 908,210 L 465,210 Z" fill="#4ADE80" stroke="#166534" stroke-width="1.5"/>
      <!-- Reservoir Lake (dammed water) -->
      <path d="M 495,120 Q 590,115 665,105 Q 745,105 855,140 L 820,248 L 545,252 Z" fill="#38BDF8" stroke="#0369A1" stroke-width="1.2"/>
      <!-- Reservoir water ripples -->
      <path d="M 625,138 Q 650,135 675,138 M 695,160 Q 725,157 755,160 M 615,182 Q 645,179 678,182 M 665,208 Q 700,205 735,208 M 580,224 Q 608,221 632,224" fill="none" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round"/>

      <!-- Left forested mountain slope (foreground) -->
      <path d="M 465,70 Q 545,115 588,185 Q 610,225 608,295 L 555,325 L 465,335 Z" fill="#22C55E" stroke="#14532D" stroke-width="1.6"/>
      <!-- Right forested mountain slope -->
      <path d="M 908,60 Q 828,110 786,188 Q 765,228 776,305 L 825,335 L 908,335 Z" fill="#22C55E" stroke="#14532D" stroke-width="1.6"/>

      <!-- Concrete Gravity Dam Wall -->
      <polygon points="580,244 795,222 818,312 604,344" fill="#E2E8F0" stroke="#334155" stroke-width="2"/>
      <!-- Top crest roadway across dam -->
      <polygon points="576,238 798,216 800,226 579,248" fill="#94A3B8" stroke="#334155" stroke-width="1.5"/>
      <!-- Dam spillway gates & ribs -->
      <g stroke="#475569" stroke-width="1.4">
        <line x1="635" y1="242" x2="652" y2="335"/>
        <line x1="668" y1="239" x2="686" y2="331"/>
        <line x1="702" y1="235" x2="720" y2="326"/>
        <line x1="736" y1="232" x2="754" y2="321"/>
        <line x1="766" y1="229" x2="784" y2="317"/>
      </g>
      <!-- Spillway dark gate slots -->
      <g fill="#475569">
        <polygon points="638,243 665,240 667,252 640,255"/>
        <polygon points="671,240 699,237 701,249 673,252"/>
        <polygon points="705,236 733,233 735,245 707,248"/>
      </g>
      <!-- Water cascading down middle spillway -->
      <polygon points="673,252 701,249 718,334 686,338" fill="#7DD3FC" fill-opacity="0.85"/>
      <path d="M 684,256 L 698,332 M 693,254 L 708,330" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4"/>

      <!-- Downstream river & mist foam -->
      <path d="M 650,336 L 780,318 L 835,408 L 690,408 Z" fill="#38BDF8" stroke="#0369A1" stroke-width="1.4"/>
      <ellipse cx="705" cy="336" rx="34" ry="9" fill="#FFFFFF" fill-opacity="0.88"/>
      <ellipse cx="722" cy="344" rx="22" ry="6" fill="#E0F2FE" fill-opacity="0.9"/>

      <!-- Foreground rocky/forested banks framing bottom corners -->
      <path d="M 465,275 Q 548,270 618,312 Q 665,345 700,408 L 465,408 Z" fill="#16A34A" stroke="#14532D" stroke-width="1.6"/>
      <path d="M 908,268 Q 845,280 806,325 Q 785,360 802,408 L 908,408 Z" fill="#16A34A" stroke="#14532D" stroke-width="1.6"/>

      <!-- Small dam control office on left embankment -->
      <rect x="526" y="256" width="38" height="24" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.4"/>
      <polygon points="522,256 545,244 568,256" fill="#64748B" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="534" y="263" width="9" height="8" fill="#93C5FD"/>
      <rect x="548" y="263" width="9" height="8" fill="#93C5FD"/>

      <!-- Dense Forest Tree Texture (emphasizes 森林 = 緑のダム!) -->
      <g fill="#15803D" stroke="#14532D" stroke-width="0.9">
        <!-- Left slope trees -->
        <circle cx="496" cy="148" r="14"/><circle cx="520" cy="162" r="15"/><circle cx="492" cy="182" r="14"/>
        <circle cx="542" cy="186" r="14"/><circle cx="516" cy="204" r="15"/><circle cx="562" cy="212" r="13"/>
        <circle cx="490" cy="222" r="15"/><circle cx="534" cy="230" r="14"/>
        <!-- Bottom-left forest -->
        <circle cx="505" cy="318" r="17"/><circle cx="538" cy="330" r="18"/><circle cx="490" cy="356" r="18"/>
        <circle cx="572" cy="348" r="17"/><circle cx="532" cy="372" r="19"/><circle cx="608" cy="374" r="18"/>
        <circle cx="648" cy="390" r="16"/>
        <!-- Right slope trees -->
        <circle cx="878" cy="128" r="15"/><circle cx="854" cy="150" r="15"/><circle cx="884" cy="166" r="15"/>
        <circle cx="826" cy="176" r="14"/><circle cx="856" cy="196" r="15"/><circle cx="806" cy="208" r="13"/>
        <circle cx="884" cy="214" r="15"/><circle cx="836" cy="232" r="14"/>
        <!-- Bottom-right forest -->
        <circle cx="866" cy="316" r="17"/><circle cx="836" cy="344" r="16"/><circle cx="880" cy="358" r="18"/>
        <circle cx="848" cy="384" r="17"/>
        <!-- Distant hilltop trees -->
        <circle cx="562" cy="90" r="10"/><circle cx="585" cy="96" r="11"/><circle cx="782" cy="84" r="11"/><circle cx="810" cy="76" r="11"/>
      </g>
    </g>
    <rect x="470" y="20" width="430" height="380" rx="10" fill="none" stroke="#1E293B" stroke-width="2"/>
    <!-- Badge い -->
    <circle cx="498" cy="48" r="18" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2"/>
    <text x="498" y="55" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">い</text>
  </g>
</svg>
