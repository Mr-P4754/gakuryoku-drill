<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="地震に備えて机の下にかくれる児童と階段をひなんする児童のイラスト">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="860" height="360" fill="#FFFFFF"/>

  <g id="drill-desk">
    <defs><clipPath id="cd1"><rect x="20" y="20" width="400" height="320" rx="12"/></clipPath></defs>
    <g clip-path="url(#cd1)">
      <!-- Classroom wall & floor -->
      <rect x="20" y="20" width="400" height="225" fill="#FEF9C3"/>
      <rect x="20" y="245" width="400" height="95" fill="#E2E8F0"/>
      <line x1="20" y1="245" x2="420" y2="245" stroke="#94A3B8" stroke-width="2"/>

      <!-- Back desk & student 1 -->
      <!-- Student 1 crouching under back desk -->
      <g transform="translate(80, 148)">
        <!-- Legs & shoes -->
        <path d="M 40,104 L 78,108 L 88,120 L 42,118 Z" fill="#1E3A8A" stroke="#1E293B" stroke-width="1.6"/>
        <!-- Torso hunched low -->
        <path d="M 28,62 Q 60,46 92,72 L 88,108 L 36,104 Z" fill="#F97316" stroke="#1E293B" stroke-width="1.8"/>
        <!-- Head tucked safely under desk -->
        <circle cx="30" cy="78" r="21" fill="#FDE68A" stroke="#1E293B" stroke-width="1.8"/>
        <path d="M 10,74 Q 16,52 44,58 Q 52,66 48,80 Q 34,68 10,74 Z" fill="#1E293B"/>
        <!-- Arms gripping desk leg -->
        <path d="M 38,88 L 12,102 L 18,112 L 48,98 Z" fill="#FDE68A" stroke="#1E293B" stroke-width="1.6"/>
      </g>

      <!-- Back School Desk -->
      <g>
        <!-- Steel legs -->
        <rect x="74" y="130" width="8" height="145" fill="#64748B" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="234" y="118" width="8" height="145" fill="#64748B" stroke="#1E293B" stroke-width="1.5"/>
        <!-- Desk top & storage box -->
        <polygon points="56,120 228,104 268,128 96,144" fill="#F59E0B" stroke="#1E293B" stroke-width="2"/>
        <polygon points="56,120 96,144 96,162 56,138" fill="#D97706" stroke="#1E293B" stroke-width="1.6"/>
        <polygon points="96,144 268,128 268,146 96,162" fill="#B45309" stroke="#1E293B" stroke-width="1.6"/>
        <!-- Notebook & pencil case on desk -->
        <polygon points="102,118 168,112 184,122 118,128" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
        <polygon points="184,110 222,107 232,113 194,116" fill="#38BDF8" stroke="#334155" stroke-width="1.4"/>
      </g>

      <!-- Front Student 2 crouching under front desk -->
      <g transform="translate(162, 185)">
        <!-- Knees & socks/shoes -->
        <path d="M 102,94 L 154,104 L 166,118 L 104,118 Z" fill="#1E40AF" stroke="#1E293B" stroke-width="1.8"/>
        <ellipse cx="166" cy="116" rx="14" ry="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
        <!-- Sweater / torso -->
        <path d="M 52,58 Q 105,36 146,74 L 138,108 L 58,104 Z" fill="#3B82F6" stroke="#1E293B" stroke-width="1.8"/>
        <!-- Head tucked down -->
        <circle cx="48" cy="78" r="23" fill="#FDE68A" stroke="#1E293B" stroke-width="1.8"/>
        <path d="M 26,72 Q 34,48 64,56 Q 74,66 68,82 Q 48,66 26,72 Z" fill="#1E293B"/>
        <!-- Arm firmly grabbing front desk leg! -->
        <path d="M 54,88 L 18,108 L 24,119 L 64,98 Z" fill="#FDE68A" stroke="#1E293B" stroke-width="1.8"/>
        <circle cx="18" cy="113" r="7" fill="#FDE68A" stroke="#1E293B" stroke-width="1.6"/>
      </g>

      <!-- Front School Desk -->
      <g>
        <!-- Steel desk legs -->
        <rect x="174" y="182" width="10" height="136" fill="#64748B" stroke="#1E293B" stroke-width="1.8"/>
        <rect x="378" y="164" width="10" height="136" fill="#64748B" stroke="#1E293B" stroke-width="1.8"/>
        <!-- Desk top -->
        <polygon points="132,162 356,142 406,174 182,194" fill="#FBBF24" stroke="#1E293B" stroke-width="2"/>
        <polygon points="132,162 182,194 182,216 132,184" fill="#D97706" stroke="#1E293B" stroke-width="1.8"/>
        <polygon points="182,194 406,174 406,196 182,216" fill="#B45309" stroke="#1E293B" stroke-width="1.8"/>
        <!-- Open textbook on desk -->
        <polygon points="222,158 310,150 332,166 244,174" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
        <line x1="266" y1="154" x2="288" y2="170" stroke="#94A3B8" stroke-width="1.4"/>
      </g>

      <!-- Motion shake lines around desk to indicate earthquake -->
      <g fill="none" stroke="#DC2626" stroke-width="2.4" stroke-linecap="round">
        <path d="M 42,102 Q 36,112 42,122"/><path d="M 33,106 Q 28,113 33,120"/>
        <path d="M 398,128 Q 405,138 398,148"/><path d="M 407,132 Q 412,139 407,146"/>
      </g>
    </g>
    <rect x="20" y="20" width="400" height="320" rx="12" fill="none" stroke="#1E293B" stroke-width="2"/>
  </g>
  <g id="drill-stairs">
    <defs><clipPath id="cd2"><rect x="440" y="20" width="400" height="320" rx="12"/></clipPath></defs>
    <g clip-path="url(#cd2)">
      <!-- Hallway wall -->
      <rect x="440" y="20" width="400" height="320" fill="#F0F9FF"/>
      <!-- Staircase wall shadow -->
      <polygon points="440,20 585,20 585,255 440,255" fill="#E2E8F0"/>

      <!-- Wide concrete staircase descending from top-center to bottom-right/left -->
      <g fill="#FFFFFF" stroke="#334155" stroke-width="1.6">
        <rect x="575" y="70" width="110" height="22"/>
        <rect x="588" y="92" width="120" height="22"/>
        <rect x="601" y="114" width="130" height="22"/>
        <rect x="614" y="136" width="140" height="22"/>
        <rect x="627" y="158" width="150" height="22"/>
        <rect x="640" y="180" width="160" height="22"/>
        <rect x="653" y="202" width="170" height="22"/>
        <rect x="666" y="224" width="180" height="22"/>
        <rect x="679" y="246" width="180" height="24"/>
      </g>
      <!-- Landing floor -->
      <rect x="440" y="270" width="400" height="70" fill="#CBD5E1" stroke="#334155" stroke-width="1.6"/>
      <!-- Stair handrail (left & right) -->
      <line x1="680" y1="54" x2="835" y2="210" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <line x1="566" y1="62" x2="668" y2="258" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

      <!-- Student 1 (top of stairs, helmet) -->
      <g transform="translate(572, 46)">
        <circle cx="24" cy="24" r="14" fill="#FDE68A" stroke="#1E293B" stroke-width="1.6"/>
        <circle cx="20" cy="27" r="1.5" fill="#0F172A"/><circle cx="28" cy="27" r="1.5" fill="#0F172A"/>
        <!-- White safety helmet -->
        <path d="M 9,23 Q 10,6 24,6 Q 38,6 39,23 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8"/>
        <line x1="7" y1="23" x2="41" y2="23" stroke="#1E293B" stroke-width="2"/>
        <!-- Body -->
        <rect x="13" y="38" width="22" height="32" rx="6" fill="#22C55E" stroke="#1E293B" stroke-width="1.6"/>
        <rect x="14" y="70" width="9" height="22" fill="#1E3A8A" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="25" y="70" width="9" height="22" fill="#1E3A8A" stroke="#1E293B" stroke-width="1.5"/>
      </g>

      <!-- Student 2 (middle of stairs, helmet, holding rail) -->
      <g transform="translate(612, 114)">
        <circle cx="26" cy="24" r="15" fill="#FDE68A" stroke="#1E293B" stroke-width="1.6"/>
        <circle cx="21" cy="27" r="1.6" fill="#0F172A"/><circle cx="30" cy="27" r="1.6" fill="#0F172A"/>
        <path d="M 10,23 Q 11,5 26,5 Q 41,5 42,23 Z" fill="#FEF08A" stroke="#1E293B" stroke-width="1.8"/>
        <line x1="8" y1="23" x2="44" y2="23" stroke="#1E293B" stroke-width="2"/>
        <!-- Body -->
        <rect x="14" y="39" width="24" height="34" rx="6" fill="#3B82F6" stroke="#1E293B" stroke-width="1.6"/>
        <!-- Arm reaching toward handrail -->
        <line x1="14" y1="48" x2="0" y2="60" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>
        <rect x="15" y="73" width="10" height="24" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="27" y="73" width="10" height="24" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
      </g>

      <!-- Student 3 (lower stairs, bousai-zukin / helmet) -->
      <g transform="translate(672, 178)">
        <circle cx="28" cy="26" r="16" fill="#FDE68A" stroke="#1E293B" stroke-width="1.6"/>
        <!-- Protective hood / helmet -->
        <path d="M 10,25 Q 12,4 28,4 Q 44,4 46,25 L 48,38 L 8,38 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8"/>
        <circle cx="28" cy="26" r="12" fill="#FDE68A"/>
        <circle cx="24" cy="28" r="1.6" fill="#0F172A"/><circle cx="32" cy="28" r="1.6" fill="#0F172A"/>
        <path d="M 12,24 Q 14,6 28,6 Q 42,6 44,24 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
        <!-- Shirt & skirt -->
        <rect x="14" y="42" width="28" height="34" rx="6" fill="#F43F5E" stroke="#1E293B" stroke-width="1.6"/>
        <polygon points="14,72 42,72 48,96 8,96" fill="#1E3A8A" stroke="#1E293B" stroke-width="1.6"/>
        <!-- Legs walking down -->
        <rect x="17" y="96" width="8" height="22" fill="#FDE68A" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="31" y="96" width="8" height="22" fill="#FDE68A" stroke="#1E293B" stroke-width="1.5"/>
        <ellipse cx="21" cy="120" rx="8" ry="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
        <ellipse cx="35" cy="120" rx="8" ry="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
      </g>

      <!-- Student 4 (at bottom landing, waiting calmly) -->
      <g transform="translate(502, 204)">
        <circle cx="24" cy="24" r="15" fill="#FDE68A" stroke="#1E293B" stroke-width="1.6"/>
        <circle cx="19" cy="27" r="1.6" fill="#0F172A"/><circle cx="28" cy="27" r="1.6" fill="#0F172A"/>
        <path d="M 8,23 Q 10,5 24,5 Q 38,5 40,23 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8"/>
        <line x1="6" y1="23" x2="42" y2="23" stroke="#1E293B" stroke-width="2"/>
        <rect x="12" y="39" width="24" height="36" rx="6" fill="#F59E0B" stroke="#1E293B" stroke-width="1.6"/>
        <rect x="14" y="75" width="9" height="24" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="25" y="75" width="9" height="24" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
      </g>

      <!-- Green Emergency Exit Sign on wall (icon only, no answer text!) -->
      <rect x="462" y="42" width="56" height="26" rx="4" fill="#16A34A" stroke="#14532D" stroke-width="1.5"/>
      <circle cx="484" cy="51" r="3" fill="#FFFFFF"/>
      <path d="M 480,55 L 488,55 L 492,63 M 484,55 L 478,63 M 498,55 L 510,55 M 506,51 L 511,55 L 506,59" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="440" y="20" width="400" height="320" rx="12" fill="none" stroke="#1E293B" stroke-width="2"/>
  </g>
</svg>
