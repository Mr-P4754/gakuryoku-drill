<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" role="img" aria-label="湖から山にトンネルをほって平らな土地に水を引く用水路と、低い位置の大きな川の断面図">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="860" height="310" fill="#FFFFFF"/>

  <defs>
    <clipPath id="cs-clip"><rect x="24" y="20" width="812" height="270" rx="10"/></clipPath>
    <marker id="water-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1,1 L 9,5 L 1,9 Z" fill="#1D4ED8"/>
    </marker>
  </defs>
  <g clip-path="url(#cs-clip)">
    <!-- Soft sky background -->
    <rect x="24" y="20" width="812" height="270" fill="#F0F9FF"/>

    <!-- High-elevation Lake Water (湖) -->
    <polygon points="150,174 286,174 252,204 185,202" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5"/>

    <!-- Lower-elevation Big River Water (大きな川) at bottom-right! -->
    <polygon points="712,232 768,232 752,250 724,250" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5"/>

    <!-- Earth cross-section profile:
         Left mountain -> Lake basin (y=174..202) -> Tall Mountain (peak y=94) ->
         Flat plateau (y=214, x=480..700) -> Deep lower valley for Big River (y=232..250) -> Far right slope -->
    <path d="M 24,102
             Q 52,145 92,168
             Q 125,174 152,174
             Q 192,202 222,202
             Q 255,200 282,174
             Q 325,140 356,94
             Q 372,76 388,94
             Q 426,154 484,212
             L 682,214
             Q 702,216 716,236
             Q 734,252 752,248
             Q 766,244 776,226
             Q 804,222 836,178
             L 836,290 L 24,290 Z"
          fill="#E5E7EB" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Subtle green topsoil line on mountains & flat land -->
    <path d="M 24,102 Q 52,145 92,168 Q 125,174 152,174" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <path d="M 282,174 Q 325,140 356,94 Q 372,76 388,94 Q 426,154 484,212 L 682,214" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <path d="M 776,226 Q 804,222 836,178" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>

    <!-- Irrigation Canal Tunnel cut straight through the Mountain from Lake -> Flat Land! -->
    <polygon points="274,174 484,211 484,219 272,182" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <polygon points="274,177 484,214 484,218 273,181" fill="#38BDF8"/>
    <!-- Subtle flow arrow inside tunnel -->
    <line x1="335" y1="189" x2="395" y2="200" stroke="#1D4ED8" stroke-width="2" marker-end="url(#water-arr)"/>
    <!-- Canal extending across flat plateau with gentle downward grade -->
    <line x1="484" y1="216" x2="704" y2="226" stroke="#38BDF8" stroke-width="4.5"/>
    <line x1="484" y1="214" x2="704" y2="224" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="484" y1="219" x2="704" y2="229" stroke="#1E293B" stroke-width="1.2"/>

    <!-- Cute village houses sitting on Flat Land (平らな土地) -->
    <!-- House 1 -->
    <g transform="translate(592, 178)">
      <rect x="4" y="14" width="32" height="22" fill="#FEF3C7" stroke="#334155" stroke-width="1.5"/>
      <polygon points="0,15 20,0 40,15" fill="#EA580C" stroke="#334155" stroke-width="1.5"/>
      <rect x="10" y="20" width="8" height="8" fill="#BAE6FD" stroke="#334155" stroke-width="1"/>
      <rect x="22" y="20" width="8" height="16" fill="#92400E" stroke="#334155" stroke-width="1"/>
    </g>
    <!-- House 2 -->
    <g transform="translate(634, 180)">
      <rect x="4" y="14" width="28" height="20" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
      <polygon points="0,15 18,2 36,15" fill="#2563EB" stroke="#334155" stroke-width="1.5"/>
      <rect x="9" y="20" width="7" height="7" fill="#BAE6FD" stroke="#334155" stroke-width="1"/>
      <rect x="20" y="20" width="7" height="14" fill="#64748B" stroke="#334155" stroke-width="1"/>
    </g>
    <!-- House 3 -->
    <g transform="translate(670, 183)">
      <rect x="4" y="12" width="26" height="19" fill="#FEF9C3" stroke="#334155" stroke-width="1.5"/>
      <polygon points="0,13 17,1 34,13" fill="#16A34A" stroke="#334155" stroke-width="1.5"/>
      <rect x="9" y="18" width="7" height="7" fill="#BAE6FD" stroke="#334155" stroke-width="1"/>
      <rect x="19" y="18" width="6" height="13" fill="#78350F" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Crisp Labels matching PDF Page 19! -->
    <text x="218" y="156" text-anchor="middle" font-size="18" font-weight="700" fill="#0369A1">湖</text>
    <text x="372" y="64" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">山</text>
    <text x="536" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">平らな土地</text>
    <text x="760" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#0369A1">大きな川</text>
    <line x1="752" y1="194" x2="740" y2="230" stroke="#0369A1" stroke-width="1.5"/>
    <circle cx="740" cy="230" r="2.5" fill="#0369A1"/>
  </g>
  <rect x="24" y="20" width="812" height="270" rx="10" fill="none" stroke="#1E293B" stroke-width="2"/>
</svg>
