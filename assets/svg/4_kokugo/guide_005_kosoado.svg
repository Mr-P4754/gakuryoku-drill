<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="こそあど言葉の使い分け図">
  <defs>
    <style>
      .t { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
    </style>
  </defs>
  <rect width="720" height="280" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#0F172A">こそあど言葉の使い分け（位置と距離）</text>

  <!-- こ -->
  <rect x="24" y="56" width="160" height="196" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <circle cx="104" cy="88" r="22" fill="#DC2626"/>
  <text x="104" y="95" text-anchor="middle" class="t" font-size="22" font-weight="700" fill="#FFFFFF">こ</text>
  <text x="104" y="132" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#991B1B">話し手の近く</text>
  <!-- Mini icon: speaker + near box -->
  <circle cx="84" cy="162" r="10" fill="#FCA5A5" stroke="#991B1B" stroke-width="1.5"/>
  <rect x="104" y="154" width="16" height="16" rx="3" fill="#DC2626"/>
  <text x="104" y="204" text-anchor="middle" class="t" font-size="13.5" fill="#334155">これ・この</text>
  <text x="104" y="226" text-anchor="middle" class="t" font-size="13.5" fill="#334155">ここ・こちら</text>

  <!-- そ -->
  <rect x="196" y="56" width="160" height="196" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
  <circle cx="276" cy="88" r="22" fill="#2563EB"/>
  <text x="276" y="95" text-anchor="middle" class="t" font-size="22" font-weight="700" fill="#FFFFFF">そ</text>
  <text x="276" y="132" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#1E40AF">聞き手の近く</text>
  <circle cx="242" cy="162" r="9" fill="#CBD5E1" stroke="#475569" stroke-width="1.4"/>
  <circle cx="294" cy="162" r="10" fill="#93C5FD" stroke="#1E40AF" stroke-width="1.5"/>
  <rect x="310" y="154" width="16" height="16" rx="3" fill="#2563EB"/>
  <text x="276" y="204" text-anchor="middle" class="t" font-size="13.5" fill="#334155">それ・その</text>
  <text x="276" y="226" text-anchor="middle" class="t" font-size="13.5" fill="#334155">そこ・そちら</text>

  <!-- あ -->
  <rect x="368" y="56" width="160" height="196" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/>
  <circle cx="448" cy="88" r="22" fill="#059669"/>
  <text x="448" y="95" text-anchor="middle" class="t" font-size="22" font-weight="700" fill="#FFFFFF">あ</text>
  <text x="448" y="132" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#065F46">両方から遠い</text>
  <circle cx="406" cy="162" r="8" fill="#CBD5E1" stroke="#475569" stroke-width="1.3"/>
  <circle cx="428" cy="162" r="8" fill="#CBD5E1" stroke="#475569" stroke-width="1.3"/>
  <line x1="442" y1="162" x2="474" y2="162" stroke="#059669" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="480" y="154" width="16" height="16" rx="3" fill="#059669"/>
  <text x="448" y="204" text-anchor="middle" class="t" font-size="13.5" fill="#334155">あれ・あの</text>
  <text x="448" y="226" text-anchor="middle" class="t" font-size="13.5" fill="#334155">あそこ・あちら</text>

  <!-- ど -->
  <rect x="540" y="56" width="156" height="196" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.2"/>
  <circle cx="618" cy="88" r="22" fill="#D97706"/>
  <text x="618" y="95" text-anchor="middle" class="t" font-size="22" font-weight="700" fill="#FFFFFF">ど</text>
  <text x="618" y="132" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#92400E">わからないもの</text>
  <text x="618" y="172" text-anchor="middle" class="t" font-size="28" font-weight="700" fill="#D97706">？</text>
  <text x="618" y="204" text-anchor="middle" class="t" font-size="13.5" fill="#334155">どれ・どの</text>
  <text x="618" y="226" text-anchor="middle" class="t" font-size="13.5" fill="#334155">どこ・どちら</text>
</svg>
