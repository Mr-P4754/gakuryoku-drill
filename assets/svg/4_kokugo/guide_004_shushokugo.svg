<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="修飾語のかかり方の図">
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#2563EB"/>
    </marker>
    <style>
      .t { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
    </style>
  </defs>
  <rect width="720" height="260" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#92400E">修飾語は「どの言葉をくわしく説明しているか」で考えよう</text>

  <!-- Sentence boxes -->
  <g transform="translate(44, 108)">
    <!-- 白い -->
    <rect x="0" y="0" width="110" height="52" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
    <text x="55" y="32" text-anchor="middle" class="t" font-size="22" font-weight="700" fill="#991B1B">白い</text>
    <text x="55" y="76" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#DC2626">修飾語（どんな）</text>

    <!-- 犬が -->
    <rect x="148" y="0" width="110" height="52" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="203" y="32" text-anchor="middle" class="t" font-size="22" font-weight="700" fill="#0F172A">犬が</text>
    <text x="203" y="76" text-anchor="middle" class="t" font-size="14" fill="#475569">主語</text>

    <!-- うろうろ -->
    <rect x="296" y="0" width="136" height="52" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="364" y="32" text-anchor="middle" class="t" font-size="22" font-weight="700" fill="#1E40AF">うろうろ</text>
    <text x="364" y="76" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#2563EB">修飾語（どのように）</text>

    <!-- 歩いています。 -->
    <rect x="468" y="0" width="164" height="52" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="550" y="32" text-anchor="middle" class="t" font-size="20" font-weight="700" fill="#0F172A">歩いています。</text>
    <text x="550" y="76" text-anchor="middle" class="t" font-size="14" fill="#475569">述語</text>

    <!-- Curved Arrows -->
    <path d="M55,-4 Q129,-48 200,-6" fill="none" stroke="#DC2626" stroke-width="3" marker-end="url(#arr-red)"/>
    <text x="129" y="-36" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#DC2626">くわしく説明</text>

    <path d="M364,-4 Q457,-48 546,-6" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arr-blue)"/>
    <text x="457" y="-36" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#2563EB">くわしく説明</text>
  </g>

  <!-- Tip bar -->
  <rect x="44" y="206" width="632" height="36" rx="8" fill="#FEF3C7"/>
  <text x="360" y="229" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#78350F">コツ：2つの言葉をすぐ続けて読んで、意味が通じる組み合わせをさがそう！</text>
</svg>
