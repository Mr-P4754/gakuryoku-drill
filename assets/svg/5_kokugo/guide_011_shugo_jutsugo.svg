<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="主語と述語の対応と敬語チェックのポイント">
  <defs>
    <style>
      .t { font-family: 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
    </style>
  </defs>

  <rect width="720" height="320" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#4C1D95">文の組み立て（主語と述語の対応）＆敬語チェックのコツ</text>

  <!-- Left: 主語と述語の対応 -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="332" height="248" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.2"/>
    <rect x="0" y="0" width="332" height="34" rx="12" fill="#7C3AED"/>
    <text x="166" y="22" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#FFFFFF">主語と述語を正しく対応させよう</text>

    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="114" height="34" rx="7" fill="#EDE9FE"/>
      <text x="57" y="22" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#5B21B6">〜場面は、</text>
      <text x="132" y="22" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#7C3AED">→</text>
      <rect x="148" y="0" width="152" height="34" rx="7" fill="#F3E8FF" stroke="#A78BFA"/>
      <text x="224" y="22" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#4C1D95">〜場面です。</text>

      <rect x="0" y="44" width="114" height="34" rx="7" fill="#EDE9FE"/>
      <text x="57" y="66" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#5B21B6">〜のは、</text>
      <text x="132" y="66" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#7C3AED">→</text>
      <rect x="148" y="44" width="152" height="34" rx="7" fill="#F3E8FF" stroke="#A78BFA"/>
      <text x="224" y="66" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#4C1D95">〜からです。</text>

      <rect x="0" y="88" width="114" height="34" rx="7" fill="#EDE9FE"/>
      <text x="57" y="110" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#5B21B6">〜理由は、</text>
      <text x="132" y="110" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#7C3AED">→</text>
      <rect x="148" y="88" width="152" height="34" rx="7" fill="#F3E8FF" stroke="#A78BFA"/>
      <text x="224" y="110" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#4C1D95">〜ため（から）です。</text>

      <rect x="0" y="132" width="114" height="34" rx="7" fill="#EDE9FE"/>
      <text x="57" y="154" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#5B21B6">〜ことは、</text>
      <text x="132" y="154" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#7C3AED">→</text>
      <rect x="148" y="132" width="152" height="34" rx="7" fill="#F3E8FF" stroke="#A78BFA"/>
      <text x="224" y="154" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#4C1D95">〜ことです。</text>
    </g>
  </g>

  <!-- Right: 敬語チェック -->
  <g transform="translate(374, 52)">
    <rect x="0" y="0" width="322" height="248" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.2"/>
    <rect x="0" y="0" width="322" height="34" rx="12" fill="#0284C7"/>
    <text x="161" y="22" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#FFFFFF">敬語は「だれが動作するか」で決める！</text>

    <rect x="16" y="48" width="290" height="84" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="28" y="70" class="t" font-size="13.5" font-weight="700" fill="#1D4ED8">相手（先生・お客様）の動作 → 尊敬語</text>
    <text x="28" y="94" class="t" font-size="12.5" fill="#1E293B">・お客様が くださった／いらっしゃった</text>
    <text x="28" y="116" class="t" font-size="12.5" fill="#1E293B">・先生が つりを なさる（×いたす）</text>

    <rect x="16" y="146" width="290" height="86" rx="9" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="26" y="168" class="t" font-size="12.2" font-weight="700" fill="#C2410C">自分や家族（父・姉）の動作 → けんじょう語</text>
    <text x="28" y="192" class="t" font-size="12.5" fill="#1E293B">・みんなで いただきましょう（×めし上がり）</text>
    <text x="28" y="214" class="t" font-size="12.5" fill="#1E293B">・父が 申していました（×おっしゃって）</text>
  </g>
</svg>
