<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" role="img" aria-label="修飾語のかかり方の図解">
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
    <style>
      .t { font-family: 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
    </style>
  </defs>

  <rect width="720" height="332" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#92400E">修飾語のかかり方は「2つの言葉を続けて読んで」確かめよう</text>

  <!-- Example 1 -->
  <text x="34" y="62" class="t" font-size="13.5" font-weight="700" fill="#78350F">例① すぐうしろの言葉をくわしく説明する場合</text>
  <g transform="translate(34, 102)">
    <rect x="0" y="0" width="106" height="44" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
    <text x="53" y="28" text-anchor="middle" class="t" font-size="19" font-weight="700" fill="#991B1B">白い</text>

    <rect x="132" y="0" width="106" height="44" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="185" y="28" text-anchor="middle" class="t" font-size="19" font-weight="700" fill="#0F172A">犬が</text>

    <rect x="278" y="0" width="134" height="44" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
    <text x="345" y="28" text-anchor="middle" class="t" font-size="19" font-weight="700" fill="#1E40AF">うろうろ</text>

    <rect x="444" y="0" width="208" height="44" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="548" y="28" text-anchor="middle" class="t" font-size="19" font-weight="700" fill="#0F172A">歩いています。</text>

    <path d="M53,-4 Q119,-32 182,-5" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arr-red)"/>
    <text x="119" y="-22" text-anchor="middle" class="t" font-size="12" font-weight="700" fill="#DC2626">どんな</text>

    <path d="M345,-4 Q446,-32 544,-5" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arr-blue)"/>
    <text x="446" y="-22" text-anchor="middle" class="t" font-size="12" font-weight="700" fill="#2563EB">どのように</text>
  </g>

  <!-- Example 2 (distant modifier) -->
  <text x="34" y="178" class="t" font-size="13.5" font-weight="700" fill="#78350F">例② はなれた言葉をくわしく説明する場合（よく出る！）</text>
  <g transform="translate(34, 232)">
    <rect x="0" y="0" width="112" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/>
    <text x="56" y="25" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#334155">お母さんは、</text>

    <rect x="122" y="0" width="96" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2.2"/>
    <text x="170" y="25" text-anchor="middle" class="t" font-size="15.5" font-weight="700" fill="#065F46">わたしに</text>

    <rect x="228" y="0" width="76" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="266" y="25" text-anchor="middle" class="t" font-size="14.5" fill="#475569">いつも</text>

    <rect x="314" y="0" width="84" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="356" y="25" text-anchor="middle" class="t" font-size="14.5" fill="#475569">おいしい</text>

    <rect x="408" y="0" width="88" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="452" y="25" text-anchor="middle" class="t" font-size="14.5" fill="#475569">ケーキを</text>

    <rect x="506" y="0" width="146" height="40" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <text x="579" y="25" text-anchor="middle" class="t" font-size="15.5" font-weight="700" fill="#0F172A">焼いてくれます。</text>

    <path d="M170,-4 Q374,-40 574,-5" fill="none" stroke="#059669" stroke-width="2.8" marker-end="url(#arr-green)"/>
    <text x="374" y="-28" text-anchor="middle" class="t" font-size="12.5" font-weight="700" fill="#059669">「わたしに → 焼いてくれます」（意味が通じる！）</text>
  </g>

  <!-- Tip bar -->
  <rect x="34" y="284" width="652" height="34" rx="8" fill="#FEF3C7"/>
  <text x="360" y="306" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#78350F">ポイント：いつ・どこで・だれの・だれに・何を・どんな・どのように → 続けて読んで確認！</text>
</svg>
