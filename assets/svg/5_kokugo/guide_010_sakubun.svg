<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="121字から180字の2段落作文の組み立て方">
  <defs>
    <style>
      .t { font-family: 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
    </style>
  </defs>

  <rect width="720" height="320" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#9A3412">伝わる文章の書き方（2段落構成・121〜180字）</text>

  <!-- Step flow -->
  <g transform="translate(26, 48)">
    <rect x="0" y="0" width="196" height="36" rx="18" fill="#EA580C"/>
    <text x="98" y="23" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#FFFFFF">① 作文メモを作る</text>

    <path d="M204,18 L230,18 M223,11 L231,18 L223,25" fill="none" stroke="#EA580C" stroke-width="2.6" stroke-linecap="round"/>

    <rect x="236" y="0" width="204" height="36" rx="18" fill="#2563EB"/>
    <text x="338" y="23" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#FFFFFF">② 2段落で原こう用紙に書く</text>

    <path d="M448,18 L474,18 M467,11 L475,18 L467,25" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round"/>

    <rect x="480" y="0" width="188" height="36" rx="18" fill="#059669"/>
    <text x="574" y="23" text-anchor="middle" class="t" font-size="13.5" font-weight="700" fill="#FFFFFF">③ 読み直して点検する</text>
  </g>

  <!-- Two paragraph cards -->
  <rect x="26" y="100" width="310" height="122" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.2"/>
  <rect x="26" y="100" width="310" height="34" rx="12" fill="#EA580C"/>
  <text x="181" y="122" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#FFFFFF">1つめの段落（書き出し1マスあけ）</text>
  <text x="44" y="158" class="t" font-size="13.5" font-weight="700" fill="#9A3412">テーマの答えをはっきり書く</text>
  <text x="44" y="182" class="t" font-size="12.5" fill="#334155">・いちばんおもしろかったこと</text>
  <text x="44" y="204" class="t" font-size="12.5" fill="#334155">・上級生としてがんばっていること</text>

  <path d="M344,161 L376,161 M368,152 L378,161 L368,170" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>

  <rect x="384" y="100" width="310" height="122" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
  <rect x="384" y="100" width="310" height="34" rx="12" fill="#2563EB"/>
  <text x="539" y="122" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#FFFFFF">2つめの段落（行をかえて1マスあけ）</text>
  <text x="402" y="158" class="t" font-size="13.5" font-weight="700" fill="#1E40AF">くわしい内容・行動・気持ちをかく</text>
  <text x="402" y="182" class="t" font-size="12.5" fill="#334155">・どんなところがおもしろかったか</text>
  <text x="402" y="204" class="t" font-size="12.5" fill="#334155">・具体的にどのような行動をしているか</text>

  <!-- Rules & length bar -->
  <rect x="26" y="236" width="668" height="68" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="360" y="261" text-anchor="middle" class="t" font-size="14.5" font-weight="700" fill="#92400E">字数のめやす：7行〜9行（121字〜180字の間）に収めよう！</text>
  <text x="360" y="287" text-anchor="middle" class="t" font-size="13" fill="#78350F">原こう用紙のきまり：句読点（。、）やかぎかっこ（「」）も1マス ／ 行の初めの「。、」は前行の最後のマスへ</text>
</svg>
