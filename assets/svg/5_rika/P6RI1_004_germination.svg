<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97706"/>
    </marker>
    
  </defs>
  <rect width="620" height="260" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="310" y="27" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">種子の発芽に必要な条件（バーミキュライトの実験）</text>

    <rect x="22" y="42" width="576" height="202" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="38" y="54" width="266" height="26" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="171" y="72" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#92400E">水をあたえ、あたたかい部屋の中に置く。</text>

    <!-- Glass of water -->
    <g transform="translate(46, 114)">
      <path d="M6,0 L48,0 L43,72 L11,72 Z" fill="#E0F2FE" stroke="#475569" stroke-width="1.6"/>
      <path d="M8,22 L46,22 L43,72 L11,72 Z" fill="#7DD3FC" opacity="0.8"/>
      <ellipse cx="27" cy="22" rx="19" ry="4" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.1"/>
      <ellipse cx="27" cy="0" rx="21" ry="4.5" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
      <text x="27" y="92" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#0369A1">水</text>
    </g>

    <!-- Pouring arrow -->
    <path d="M78,108 Q106,86 138,104" fill="none" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrBlue)"/>

    <!-- Vermiculite cup with seeds -->
    <g transform="translate(122, 102)">
      <path d="M12,18 L124,18 L112,92 L24,92 Z" fill="#D6D3D1" stroke="#57534E" stroke-width="1.8"/>
      <ellipse cx="68" cy="18" rx="56" ry="13" fill="#A8A29E" stroke="#57534E" stroke-width="1.6"/>
      <!-- Vermiculite texture dots -->
      <g fill="#78716C">
        <circle cx="38" cy="17" r="2"/><circle cx="54" cy="22" r="2"/><circle cx="82" cy="15" r="2"/>
        <circle cx="96" cy="21" r="2"/><circle cx="68" cy="14" r="2"/>
      </g>
      <!-- Bean seeds -->
      <ellipse cx="48" cy="18" rx="7" ry="4.5" fill="#78350F" stroke="#451A03" stroke-width="1"/>
      <ellipse cx="74" cy="20" rx="7" ry="4.5" fill="#78350F" stroke="#451A03" stroke-width="1"/>
      <ellipse cx="92" cy="17" rx="7" ry="4.5" fill="#78350F" stroke="#451A03" stroke-width="1"/>
    </g>

    <!-- Label for vermiculite -->
    <line x1="234" y1="142" x2="256" y2="142" stroke="#475569" stroke-width="1.3"/>
    <text x="260" y="138" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#1E293B">種子をまいた</text>
    <text x="260" y="156" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#1E293B">バーミキュライト</text>
    <text x="260" y="173" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" fill="#475569">（肥料をふくまない土）</text>

    <!-- Big arrow right -->
    <polygon points="396,136 420,136 420,127 438,144 420,161 420,152 396,152" fill="#10B981" stroke="#047857" stroke-width="1.3"/>

    <!-- Result callout box (matches PDF ④⑤) -->
    <rect x="448" y="96" width="136" height="98" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
    <text x="516" y="122" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#065F46">3つの条件がそろって</text>
    <text x="516" y="148" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#065F46">[ ④ ] ので、</text>
    <text x="516" y="176" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#065F46">発芽 [ ⑤ ]。</text>

    <!-- Footnote -->
    <text x="310" y="232" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#475569">※ 土は肥料をふくまないバーミキュライトを使い、空気にもふれている</text>
    </svg>
