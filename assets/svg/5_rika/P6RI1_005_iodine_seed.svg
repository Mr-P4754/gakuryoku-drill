<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 245" width="600" height="245">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97706"/>
    </marker>
    
  </defs>
  <rect width="600" height="245" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="300" y="27" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">ヨウ素液による種子の養分の変化（ア・イ）</text>

    <rect x="26" y="44" width="260" height="184" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.8"/>
    <rect x="38" y="54" width="32" height="24" rx="6" fill="#4F46E5"/>
    <text x="54" y="71" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">ア</text>
    <!-- Dropper -->
    <g transform="translate(216, 56) rotate(28)">
      <rect x="-5" y="0" width="10" height="22" rx="4" fill="#B45309"/>
      <path d="M-4,22 L4,22 L2,44 L-2,44 Z" fill="#FEF3C7" stroke="#475569" stroke-width="1.2"/>
      <circle cx="0" cy="52" r="3.5" fill="#92400E"/>
    </g>
    <text x="244" y="70" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10.5" font-weight="bold" fill="#92400E">ヨウ素液</text>
    <!-- Plump stained split bean -->
    <g transform="translate(150, 128)">
      <path d="M-56,0 C-56,-34 12,-42 46,-18 C58,-8 56,12 40,22 C8,40 -56,30 -56,0 Z"
            fill="#312E81" stroke="#1E1B4B" stroke-width="2"/>
      <path d="M-50,2 C-20,12 18,12 48,-2" fill="none" stroke="#818CF8" stroke-width="2.2"/>
      <path d="M-44,-14 C-16,-24 14,-22 34,-10" fill="none" stroke="#6366F1" stroke-width="1.5" opacity="0.7"/>
    </g>
    <text x="156" y="192" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#312E81">ふっくらした種子</text>
    <text x="156" y="212" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#4338CA">ヨウ素液でこい色に変化した</text>
    
    <rect x="314" y="44" width="260" height="184" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
    <rect x="326" y="54" width="32" height="24" rx="6" fill="#475569"/>
    <text x="342" y="71" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">イ</text>
    <!-- Shriveled wrinkled cotyledon -->
    <g transform="translate(444, 128)">
      <path d="M-48,4 C-44,-18 -14,-24 12,-20 C34,-18 52,-12 46,4 C38,20 14,24 -10,22 C-34,20 -52,18 -48,4 Z"
            fill="#FEF3C7" stroke="#A16207" stroke-width="1.8"/>
      <!-- Wrinkles -->
      <path d="M-34,-4 Q-12,-12 12,-6 Q28,-2 38,-8" fill="none" stroke="#D97706" stroke-width="1.3"/>
      <path d="M-30,8 Q-6,2 16,8 Q30,10 38,4" fill="none" stroke="#D97706" stroke-width="1.3"/>
      <path d="M-16,-14 Q-4,0 -12,16" fill="none" stroke="#CA8A04" stroke-width="1.1"/>
      <path d="M12,-14 Q20,0 14,16" fill="none" stroke="#CA8A04" stroke-width="1.1"/>
    </g>
    <text x="444" y="192" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#78350F">しわしわにしぼんだ種子</text>
    <text x="444" y="212" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#475569">ヨウ素液をつけても色は変化しない</text>
    </svg>
