<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97706"/>
    </marker>
    
  </defs>
  <rect width="640" height="330" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="27" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">ろ過（ろか）のしかた</text>

    <rect x="18" y="42" width="238" height="272" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="32" y="52" width="210" height="24" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="137" y="69" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">手順のポイント</text>

    <!-- Folding sequence -->
    <g transform="translate(36, 90)">
      <!-- Circle -->
      <circle cx="24" cy="24" r="20" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
      <line x1="4" y1="24" x2="44" y2="24" stroke="#94A3B8" stroke-width="1.1" stroke-dasharray="3,2"/>
      <text x="54" y="28" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#0284C7">→</text>
      <!-- Half circle -->
      <path d="M72,34 A20,20 0 0,1 112,34 Z" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
      <line x1="92" y1="14" x2="92" y2="34" stroke="#94A3B8" stroke-width="1.1" stroke-dasharray="3,2"/>
      <text x="122" y="28" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#0284C7">→</text>
      <!-- Quarter cone -->
      <path d="M144,36 L144,12 A24,24 0 0,1 168,36 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    </g>
    <text x="137" y="150" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#334155">半分に2回折って開く</text>

    <!-- Callout box 1 (glass rod) -->
    <rect x="32" y="168" width="210" height="58" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.4"/>
    <text x="137" y="191" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#166534">液をガラスぼうに伝わらせて</text>
    <text x="137" y="211" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#166534">少しずつ入れる。</text>

    <!-- Callout box 2 (beveled tip — matches PDF ⑨!) -->
    <rect x="32" y="238" width="210" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="137" y="262" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#92400E">ろうとの先の [ ⑤ ] を、</text>
    <text x="137" y="284" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#92400E">ビーカーの内側につける。</text>
    
    <rect x="270" y="42" width="352" height="272" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Wooden funnel stand (ろうと台) -->
    <polygon points="354,284 494,284 522,262 384,262" fill="#FDE68A" stroke="#92400E" stroke-width="1.6"/>
    <rect x="354" y="284" width="140" height="12" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <!-- Vertical pole -->
    <rect x="464" y="88" width="11" height="184" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
    <!-- Funnel holder arm -->
    <polygon points="366,184 480,184 492,172 378,172" fill="#FDE68A" stroke="#92400E" stroke-width="1.5"/>
    <ellipse cx="422" cy="178" rx="22" ry="6" fill="#FFFFFF" stroke="#92400E" stroke-width="1.3"/>

    <!-- Lower receiving beaker (shifted so beveled funnel tip visibly touches right inner wall!) -->
    <g transform="translate(362, 206)">
      <path d="M4,0 L66,0 L66,66 Q66,72 60,72 L10,72 Q4,72 4,66 Z" fill="#F8FAFC" stroke="#475569" stroke-width="1.8"/>
      <path d="M5,42 L65,42 L65,66 Q65,71 60,71 L10,71 Q5,71 5,66 Z" fill="#BAE6FD" opacity="0.82"/>
      <ellipse cx="35" cy="42" rx="30" ry="4.5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
      <ellipse cx="35" cy="0" rx="31" ry="5" fill="none" stroke="#475569" stroke-width="1.5"/>
    </g>

    <!-- Funnel (ろうと) with beveled stem touching RIGHT inner wall of beaker (x=427) -->
    <g transform="translate(386, 136)">
      <!-- Cone -->
      <polygon points="0,0 72,0 44,44 28,44" fill="#E0F2FE" fill-opacity="0.7" stroke="#0284C7" stroke-width="1.8"/>
      <!-- Filter paper cone protruding slightly -->
      <polygon points="4,-3 68,-3 42,40 30,40" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
      <!-- Solid residue trapped inside filter -->
      <ellipse cx="36" cy="24" rx="14" ry="5" fill="#94A3B8" opacity="0.7"/>
      <!-- Beveled stem: longer tip on RIGHT touching inner beaker wall (386+41 = 427 = beaker right wall!) -->
      <path d="M31,44 L31,80 L41,92 L41,44 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
      <!-- Drops running cleanly down wall -->
      <circle cx="40" cy="100" r="2.5" fill="#0284C7"/>
    </g>

    <!-- Upper pouring beaker + glass rod (cleanly inside card y>=48) -->
    <g transform="translate(426, 78) rotate(-30)">
      <path d="M0,0 L44,0 L44,48 Q44,54 38,54 L6,54 Q0,54 0,48 Z" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
      <path d="M1,22 L43,22 L43,48 Q43,53 38,53 L6,53 Q1,53 1,48 Z" fill="#93C5FD" opacity="0.8"/>
    </g>
    <!-- Glass rod guiding liquid into funnel -->
    <line x1="400" y1="68" x2="416" y2="152" stroke="#0284C7" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="400" y1="68" x2="416" y2="152" stroke="#E0F2FE" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Liquid stream along rod -->
    <path d="M412,102 L418,144" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

    <!-- Magnified inset of beveled funnel tip touching inner wall -->
    <circle cx="556" cy="230" r="46" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="556" y="176" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#B45309">先の拡大図</text>
    <!-- Beaker inner wall in inset -->
    <line x1="576" y1="194" x2="576" y2="262" stroke="#475569" stroke-width="3"/>
    <!-- Beveled tip in inset -->
    <path d="M548,196 L548,224 L574,242 L574,196" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.2"/>
    <circle cx="574" cy="242" r="3.8" fill="#DC2626"/>
    <text x="546" y="259" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10" font-weight="bold" fill="#B91C1C">内側につける</text>
    <!-- Dashed zoom connector -->
    <line x1="430" y1="228" x2="510" y2="230" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Labels -->
    <text x="328" y="92" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#0369A1">ガラスぼう</text>
    <line x1="364" y1="88" x2="402" y2="96" stroke="#0284C7" stroke-width="1.2"/>
    <text x="312" y="242" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#334155">ビーカー</text>
    <line x1="342" y1="240" x2="364" y2="240" stroke="#475569" stroke-width="1.2"/>
    </svg>
