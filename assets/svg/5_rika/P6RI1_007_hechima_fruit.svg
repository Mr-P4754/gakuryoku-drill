<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97706"/>
    </marker>
    
  </defs>
  <rect width="620" height="250" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="310" y="27" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">ヘチマの実や種子のでき方</text>

    <rect x="20" y="42" width="580" height="192" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="34" y="52" width="66" height="24" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="67" y="69" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#92400E">ヘチマ</text>

    <!-- Male flower (おばな) -->
    <g transform="translate(106, 156)">
      <path d="M-4,24 L-12,48" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/>
      <g fill="#FDE047" stroke="#CA8A04" stroke-width="1.4">
        <ellipse cx="0" cy="-22" rx="14" ry="18"/>
        <ellipse cx="22" cy="-6" rx="18" ry="13"/>
        <ellipse cx="14" cy="18" rx="15" ry="14"/>
        <ellipse cx="-14" cy="18" rx="15" ry="14"/>
        <ellipse cx="-22" cy="-6" rx="18" ry="13"/>
      </g>
      <circle cx="0" cy="0" r="9" fill="#F59E0B" stroke="#B45309" stroke-width="1.4"/>
      <text x="0" y="66" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">おばな</text>
    </g>

    <!-- Female flower (めばな) -->
    <g transform="translate(264, 156)">
      <ellipse cx="-14" cy="36" rx="10" ry="16" transform="rotate(24 -14 36)" fill="#4ADE80" stroke="#15803D" stroke-width="1.6"/>
      <g fill="#FDE047" stroke="#CA8A04" stroke-width="1.4">
        <ellipse cx="0" cy="-22" rx="14" ry="18"/>
        <ellipse cx="22" cy="-6" rx="18" ry="13"/>
        <ellipse cx="14" cy="18" rx="15" ry="14"/>
        <ellipse cx="-14" cy="18" rx="15" ry="14"/>
        <ellipse cx="-22" cy="-6" rx="18" ry="13"/>
      </g>
      <circle cx="0" cy="0" r="8" fill="#86EFAC" stroke="#15803D" stroke-width="1.5"/>
      <text x="0" y="66" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">めばな</text>
    </g>

    <!-- Curved pollination arrow from male to female -->
    <path d="M108,144 Q186,86 258,142" fill="none" stroke="#EA580C" stroke-width="2.8" marker-end="url(#arrAmber)"/>
    <text x="186" y="96" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#C2410C">めしべの先に [ ① ] がつく。</text>

    <!-- Transition arrow -->
    <polygon points="336,148 368,148 368,138 390,156 368,174 368,164 336,164" fill="#10B981" stroke="#047857" stroke-width="1.3"/>

    <!-- Hanging Hechima fruit (実) -->
    <g transform="translate(446, 62)">
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#15803D" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#15803D" stroke-width="2.5"/>
      <path d="M-12,18 C-18,46 -22,96 -16,136 C-12,154 12,154 16,136 C22,96 18,46 12,18 Z"
            fill="#4ADE80" stroke="#15803D" stroke-width="1.8"/>
      <path d="M-6,22 C-8,62 -8,108 -5,144 M6,22 C8,62 8,108 5,144" fill="none" stroke="#16A34A" stroke-width="1.2"/>
    </g>
    <line x1="464" y1="108" x2="492" y2="100" stroke="#475569" stroke-width="1.3"/>
    <text x="514" y="105" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#15803D">実</text>

    <!-- Seeds (種子) -->
    <g transform="translate(534, 168)">
      <ellipse cx="-16" cy="0" rx="14" ry="9" transform="rotate(-15 -16 0)" fill="#475569" stroke="#1E293B" stroke-width="1.4"/>
      <ellipse cx="18" cy="-4" rx="14" ry="9" transform="rotate(20 18 -4)" fill="#475569" stroke="#1E293B" stroke-width="1.4"/>
      <ellipse cx="2" cy="24" rx="14" ry="9" transform="rotate(-8 2 24)" fill="#475569" stroke="#1E293B" stroke-width="1.4"/>
    </g>
    <text x="536" y="144" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#334155">種子</text>
    </svg>
