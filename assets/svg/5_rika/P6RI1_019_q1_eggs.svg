<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97706"/>
    </marker>
    
  </defs>
  <rect width="640" height="280" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="27" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">メダカと人の受精卵からの育ち方</text>

    <rect x="20" y="42" width="600" height="106" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="32" y="52" width="114" height="24" rx="6" fill="#E0F2FE"/>
    <text x="89" y="69" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#0369A1">メダカの育ち方</text>
    <!-- Stage 1: egg -->
    <circle cx="206" cy="96" r="24" fill="#FEFCE8" stroke="#64748B" stroke-width="1.8"/>
    <circle cx="200" cy="102" r="4" fill="#FDE047" stroke="#CA8A04" stroke-width="0.9"/>
    <circle cx="212" cy="100" r="3.5" fill="#FDE047" stroke="#CA8A04" stroke-width="0.9"/>
    <text x="206" y="136" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" fill="#475569">受精卵</text>

    <line x1="242" y1="96" x2="288" y2="96" stroke="#0284C7" stroke-width="2.4" stroke-dasharray="4,3" marker-end="url(#arrBlue)"/>

    <!-- Stage 2: developing egg -->
    <circle cx="326" cy="96" r="24" fill="#FEFCE8" stroke="#64748B" stroke-width="1.8"/>
    <path d="M312,92 C318,78 338,78 342,96 C344,108 330,116 318,112" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <circle cx="320" cy="88" r="4.5" fill="#0F172A"/><circle cx="334" cy="90" r="4.5" fill="#0F172A"/>

    <line x1="364" y1="96" x2="410" y2="96" stroke="#0284C7" stroke-width="2.4" stroke-dasharray="4,3" marker-end="url(#arrBlue)"/>

    <!-- Stage 3: baby medaka -->
    <g transform="translate(432, 94)">
      <path d="M0,0 C12,-10 38,-10 66,-6 L154,-3 L162,0 L154,3 L66,6 C38,10 12,10 0,0 Z" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
      <ellipse cx="44" cy="10" rx="16" ry="8" fill="#FEF08A" stroke="#D97706" stroke-width="1.4"/>
      <circle cx="16" cy="-2" r="5.5" fill="#0F172A"/><circle cx="14.5" cy="-3.5" r="1.5" fill="#FFFFFF"/>
    </g>
    <text x="514" y="136" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" fill="#475569">子メダカ</text>
    
    <rect x="20" y="158" width="600" height="108" rx="10" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.5"/>
    <rect x="32" y="168" width="114" height="24" rx="6" fill="#FCE7F3"/>
    <text x="89" y="185" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#9D174D">人の育ち方</text>

    <!-- Stage 1: human fertilized egg -->
    <circle cx="206" cy="212" r="14" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.6"/>
    <circle cx="206" cy="212" r="9" fill="#FFFFFF" stroke="#F472B6" stroke-width="1.2"/>
    <circle cx="206" cy="212" r="4" fill="#EC4899"/>
    <text x="206" y="252" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" fill="#475569">受精卵</text>

    <line x1="234" y1="212" x2="280" y2="212" stroke="#DB2777" stroke-width="2.4" stroke-dasharray="4,3" marker-end="url(#arrRed)"/>

    <!-- Stage 2: fetus in womb -->
    <g transform="translate(326, 212)">
      <ellipse cx="0" cy="0" rx="34" ry="30" fill="#DBEAFE" stroke="#DB2777" stroke-width="1.8"/>
      <path d="M-16,-24 Q4,-32 24,-18" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-12" cy="10" r="11" fill="#FED7AA" stroke="#9A3412" stroke-width="1.3"/>
      <ellipse cx="8" cy="-2" rx="14" ry="10" transform="rotate(-30 8 -2)" fill="#FED7AA" stroke="#9A3412" stroke-width="1.3"/>
      <path d="M4,-2 Q10,-14 6,-22" fill="none" stroke="#FB7185" stroke-width="2.2"/>
    </g>

    <line x1="372" y1="212" x2="418" y2="212" stroke="#DB2777" stroke-width="2.4" stroke-dasharray="4,3" marker-end="url(#arrRed)"/>

    <!-- Stage 3: newborn baby -->
    <g transform="translate(514, 210)">
      <ellipse cx="-14" cy="4" rx="28" ry="16" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/>
      <circle cx="24" cy="-4" r="17" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/>
      <path d="M16,-18 Q26,-26 38,-14 C36,-20 26,-24 16,-18 Z" fill="#334155"/>
      <path d="M19,-4 Q22,-2 25,-4 M29,-4 Q32,-2 35,-4" fill="none" stroke="#7C2D12" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M-38,10 Q-50,14 -52,6 M-36,-4 Q-48,-10 -46,-2" fill="none" stroke="#9A3412" stroke-width="5" stroke-linecap="round"/>
      <path d="M-38,10 Q-50,14 -52,6 M-36,-4 Q-48,-10 -46,-2" fill="none" stroke="#FED7AA" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="514" y="254" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" fill="#475569">人の子（赤ちゃん）</text>
    </svg>
