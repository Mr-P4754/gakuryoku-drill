<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97706"/>
    </marker>
    
  </defs>
  <rect width="600" height="300" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="300" y="27" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">約36週目の母親のおなかの中のつくり</text>

    <rect x="22" y="42" width="556" height="242" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Enlarged uterine cross-section -->
    <g transform="translate(68, 56)">
      <!-- Mother outline -->
      <path d="M50,0 C40,46 16,100 18,158 C20,192 38,214 50,224 L190,224 C202,202 252,166 250,114 C248,60 210,22 190,0 Z"
            fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/>
      <!-- Uterine wall -->
      <ellipse cx="144" cy="116" rx="82" ry="92" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.4"/>
      <!-- Amniotic fluid sac (羊水) -->
      <ellipse cx="144" cy="118" rx="70" ry="79" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>

      <!-- Placenta (たいばん) on upper wall -->
      <path d="M104,46 Q146,28 192,52 Q186,68 156,64 Q124,60 104,46 Z" fill="#F43F5E" stroke="#BE123C" stroke-width="1.8"/>

      <!-- Baby head-down curled peacefully -->
      <!-- Back & torso -->
      <path d="M114,132 C122,94 156,74 178,86 C198,98 196,136 168,148 C148,156 124,154 114,132 Z"
            fill="#FED7AA" stroke="#9A3412" stroke-width="1.8"/>
      <!-- Head -->
      <circle cx="116" cy="156" r="24" fill="#FED7AA" stroke="#9A3412" stroke-width="1.8"/>
      <!-- Closed peaceful eye & tiny nose/mouth -->
      <path d="M104,158 Q109,161 114,158" fill="none" stroke="#7C2D12" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M102,168 Q106,170 109,168" fill="none" stroke="#9A3412" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Curled arm & leg -->
      <path d="M132,140 C142,130 156,136 154,148" fill="none" stroke="#9A3412" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M168,86 C154,96 146,112 162,118" fill="none" stroke="#9A3412" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Umbilical cord (へそのお) from placenta to baby's navel -->
      <path d="M160,60 C168,80 146,96 142,118" fill="none" stroke="#FB7185" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M160,60 C168,80 146,96 142,118" fill="none" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="4,3"/>
    </g>

    <!-- Leader lines & callout badges ①, ②, ③ on right -->
    <!-- ① Placenta (PDF ⑥) -->
    <line x1="242" y1="104" x2="366" y2="104" stroke="#BE123C" stroke-width="1.8"/>
    <circle cx="242" cy="104" r="3.5" fill="#BE123C"/>
    <circle cx="386" cy="104" r="14" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/><text x="386" y="108.5" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#9F1239">①</text>
    <text x="410" y="100" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#9F1239">おなかのかべにある</text>
    <text x="410" y="118" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#475569">養分をやりとりするつくり</text>

    <!-- ② Umbilical cord (PDF ⑦) -->
    <line x1="226" y1="154" x2="366" y2="168" stroke="#D97706" stroke-width="1.8"/>
    <circle cx="226" cy="154" r="3.5" fill="#D97706"/>
    <circle cx="386" cy="168" r="14" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="386" y="172.5" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#B45309">②</text>
    <text x="410" y="164" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#B45309">①と子どもをつなぐ</text>
    <text x="410" y="182" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#475569">ひものようなくだ</text>

    <!-- ③ Amniotic fluid (PDF ⑧) -->
    <line x1="262" y1="224" x2="366" y2="232" stroke="#2563EB" stroke-width="1.8"/>
    <circle cx="262" cy="224" r="3.5" fill="#2563EB"/>
    <circle cx="386" cy="232" r="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="386" y="236.5" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1D4ED8">③</text>
    <text x="410" y="228" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#1D4ED8">子どもを守るえき</text>
    <text x="410" y="246" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#475569">ふくろの中を満たしている</text>
    </svg>
