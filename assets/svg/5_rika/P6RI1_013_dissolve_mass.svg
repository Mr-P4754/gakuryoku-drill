<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97706"/>
    </marker>
    
  </defs>
  <rect width="620" height="260" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="310" y="27" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">物が水にとけたときの重さ</text>

    <rect x="20" y="42" width="580" height="202" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Left beaker: 水 50g -->
    
    <g transform="translate(76,56)">
      <path d="M6,6 L86,6 L86,102 Q86,110 78,110 L14,110 Q6,110 6,102 Z" fill="#F8FAFC" stroke="#475569" stroke-width="1.8"/>
      <path d="M7,54 L85,54 L85,102 Q85,109 78,109 L14,109 Q7,109 7,102 Z" fill="#93C5FD" opacity="0.82"/>
      <ellipse cx="46" cy="54" rx="39" ry="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
      <path d="M2,6 Q6,6 6,10 M86,6 Q90,6 90,6" stroke="#475569" stroke-width="1.8"/>
      <ellipse cx="46" cy="6" rx="40" ry="6" fill="none" stroke="#475569" stroke-width="1.6"/>
      <!-- Scale marks -->
      <line x1="66" y1="32" x2="80" y2="32" stroke="#475569" stroke-width="1.2"/>
      <text x="62" y="36" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10" fill="#475569">100</text>
      <line x1="66" y1="68" x2="80" y2="68" stroke="#475569" stroke-width="1.2"/>
      <text x="62" y="72" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10" fill="#475569">50</text>
    </g>
    
    <text x="52" y="114" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#0369A1">水</text>
    <text x="52" y="132" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#0369A1">50g</text>

    <!-- Plus -->
    <text x="204" y="122" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="28" font-weight="bold" fill="#334155">＋</text>

    <!-- Weighing paper with salt 15g -->
    <g transform="translate(244, 72)">
      <polygon points="10,76 34,26 116,26 138,76" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
      <path d="M46,60 Q74,30 104,60 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
      <g fill="#64748B">
        <circle cx="64" cy="52" r="1.2"/><circle cx="76" cy="48" r="1.2"/><circle cx="86" cy="54" r="1.2"/>
        <circle cx="70" cy="56" r="1.2"/><circle cx="80" cy="57" r="1.2"/>
      </g>
      <text x="74" y="14" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A">食塩 15g</text>
    </g>

    <!-- Equals -->
    <text x="414" y="122" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="28" font-weight="bold" fill="#334155">＝</text>

    <!-- Right beaker: 食塩の水よう液 -->
    
    <g transform="translate(444,56)">
      <path d="M6,6 L86,6 L86,102 Q86,110 78,110 L14,110 Q6,110 6,102 Z" fill="#F8FAFC" stroke="#475569" stroke-width="1.8"/>
      <path d="M7,54 L85,54 L85,102 Q85,109 78,109 L14,109 Q7,109 7,102 Z" fill="#BAE6FD" opacity="0.82"/>
      <ellipse cx="46" cy="54" rx="39" ry="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
      <path d="M2,6 Q6,6 6,10 M86,6 Q90,6 90,6" stroke="#475569" stroke-width="1.8"/>
      <ellipse cx="46" cy="6" rx="40" ry="6" fill="none" stroke="#475569" stroke-width="1.6"/>
      <!-- Scale marks -->
      <line x1="66" y1="32" x2="80" y2="32" stroke="#475569" stroke-width="1.2"/>
      <text x="62" y="36" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10" fill="#475569">100</text>
      <line x1="66" y1="68" x2="80" y2="68" stroke="#475569" stroke-width="1.2"/>
      <text x="62" y="72" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10" fill="#475569">50</text>
    </g>
    
    <text x="562" y="108" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#065F46">食塩の</text>
    <text x="562" y="126" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#065F46">とけた液</text>

    <!-- Formula bar at bottom -->
    <rect x="42" y="178" width="536" height="54" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="310" y="200" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">水の重さ　＋　とかした物の重さ　＝　[ ② ] の重さ</text>
    <text x="310" y="222" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#1D4ED8">50g　　＋　　15g　　＝　　[ ③ ] g</text>
    </svg>
