<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 255" width="640" height="255">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97706"/>
    </marker>
    
  </defs>
  <rect width="640" height="255" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="27" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">川の上流・中流・下流のようすと石の形</text>

    <rect x="20" y="42" width="600" height="198" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Sky -->
    <rect x="21" y="43" width="598" height="111" rx="11" fill="#F0F9FF"/>
    <!-- Mountain to plain profile -->
    <path d="M21,54 L96,64 L196,112 L360,128 L540,136 L619,138 L619,154 L21,154 Z" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.4"/>
    <!-- River ribbon flowing smoothly down mountain slope -->
    <path d="M32,68 C82,78 136,102 204,118 C306,134 440,138 619,142 L619,154 L148,154 C118,128 72,90 32,74 Z" fill="#38BDF8" opacity="0.88"/>
    <path d="M46,74 C104,92 162,116 250,132 C360,144 490,146 610,147" fill="none" stroke="#E0F2FE" stroke-width="1.6" stroke-dasharray="6,4"/>

    <!-- Zone dividers -->
    <line x1="220" y1="44" x2="220" y2="238" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="420" y1="44" x2="420" y2="238" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- Zone labels -->
    <rect x="78" y="48" width="76" height="22" rx="6" fill="#065F46"/>
    <text x="116" y="64" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF">上流</text>
    <rect x="282" y="48" width="76" height="22" rx="6" fill="#0284C7"/>
    <text x="320" y="64" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF">中流</text>
    <rect x="482" y="48" width="76" height="22" rx="6" fill="#D97706"/>
    <text x="520" y="64" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF">下流</text>

    <!-- Bottom stone comparison boxes -->
    <!-- 上流: large angular rocks -->
    <g transform="translate(120, 192)">
      <polygon points="-44,12 -36,-14 -6,-18 14,-6 6,16 -24,18" fill="#94A3B8" stroke="#334155" stroke-width="1.8"/>
      <polygon points="16,14 26,-10 50,-4 46,16 24,18" fill="#CBD5E1" stroke="#334155" stroke-width="1.6"/>
    </g>
    <text x="120" y="230" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#334155">大きくて角ばった石</text>

    <!-- 中流: medium slightly rounded stones -->
    <g transform="translate(320, 194)">
      <path d="M-36,4 C-38,-8 -20,-14 -8,-8 C2,-2 -2,12 -18,14 C-30,14 -36,10 -36,4 Z" fill="#94A3B8" stroke="#334155" stroke-width="1.6"/>
      <path d="M4,6 C4,-6 22,-10 34,-2 C40,6 32,16 18,16 C8,16 4,12 4,6 Z" fill="#CBD5E1" stroke="#334155" stroke-width="1.5"/>
    </g>
    <text x="320" y="230" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#334155">少し丸くなった石</text>

    <!-- 下流: small smooth round pebbles & sand -->
    <g transform="translate(520, 196)">
      <ellipse cx="-26" cy="4" rx="10" ry="7" fill="#CBD5E1" stroke="#475569" stroke-width="1.4"/>
      <ellipse cx="-2" cy="8" rx="8" ry="6" fill="#94A3B8" stroke="#475569" stroke-width="1.4"/>
      <ellipse cx="20" cy="4" rx="9" ry="6.5" fill="#CBD5E1" stroke="#475569" stroke-width="1.4"/>
      <circle cx="38" cy="10" r="4" fill="#94A3B8" stroke="#475569" stroke-width="1.1"/>
      <circle cx="-12" cy="-5" r="3" fill="#94A3B8"/>
      <circle cx="10" cy="-6" r="2.5" fill="#64748B"/>
      <circle cx="-38" cy="11" r="2.5" fill="#64748B"/>
    </g>
    <text x="520" y="230" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#334155">小さくて丸い石・すな</text>
    </svg>
