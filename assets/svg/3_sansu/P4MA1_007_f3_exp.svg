<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 215" width="500" height="215" role="img" aria-label="43×26の筆算解説">
  <title>43×26の筆算解説</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="500" height="215" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="250" y="28" text-anchor="middle" class="title">43 × 26 ＝ 1118 の筆算</text>
  <text x="200" y="70" text-anchor="middle" class="num-lg">3</text>
  <text x="172" y="70" text-anchor="middle" class="num-lg">4</text>
  <text x="144" y="98" text-anchor="middle" class="num-lg">×</text>
  <text x="200" y="98" text-anchor="middle" class="num-lg">6</text>
  <text x="172" y="98" text-anchor="middle" class="num-lg">2</text>
  <line x1="80" y1="108" x2="216" y2="108" stroke="#1E293B" stroke-width="2.2"/>
  <text x="200" y="134" text-anchor="middle" class="num-lg" fill="#2563EB">8</text>
  <text x="172" y="134" text-anchor="middle" class="num-lg" fill="#2563EB">5</text>
  <text x="144" y="134" text-anchor="middle" class="num-lg" fill="#2563EB">2</text>
  <text x="228" y="132" text-anchor="start" class="lbl-xs" fill="#2563EB">← 43 × 6 ＝ 258</text>
  <text x="172" y="162" text-anchor="middle" class="num-lg" fill="#D97706">6</text>
  <text x="144" y="162" text-anchor="middle" class="num-lg" fill="#D97706">8</text>
  <rect x="189" y="143" width="22" height="24" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="200" y="162" text-anchor="middle" class="lbl-sm" fill="#D97706">0</text>
  <text x="228" y="160" text-anchor="start" class="lbl-xs" fill="#D97706">← 43 × 20 ＝ 860（1けた左へ）</text>
  <line x1="80" y1="172" x2="216" y2="172" stroke="#1E293B" stroke-width="2.2"/>
  <text x="200" y="198" text-anchor="middle" class="num-lg" fill="#0F766E">8</text>
  <text x="172" y="198" text-anchor="middle" class="num-lg" fill="#0F766E">1</text>
  <text x="144" y="198" text-anchor="middle" class="num-lg" fill="#0F766E">1</text>
  <text x="116" y="198" text-anchor="middle" class="num-lg" fill="#0F766E">1</text>
</svg>
