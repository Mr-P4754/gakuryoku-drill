  <text x="508.0" y="98" text-anchor="middle" class="lbl-sm" fill="#64748B">↓</text>
  <rect x="474.0" y="104" width="68" height="34" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="508.0" y="128" text-anchor="middle" class="num-lg" fill="#B45309">48</text>
  <text x="225" y="68" text-anchor="middle" class="num-lg">×</text>
  <text x="225" y="128" text-anchor="middle" class="num-lg">×</text>
  <text x="403" y="68" text-anchor="middle" class="num-lg">＝</text>
