<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="□を使った式（かけ算）ガイド">
  <title>□を使った式（かけ算）ガイド</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="320" y="28" text-anchor="middle" class="title">ことばの式を使って □ の式をつくろう（かけ算）</text>
  <rect x="48" y="44" width="156" height="34" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="126.0" y="67" text-anchor="middle" class="lbl-sm" fill="#1D4ED8">1人分の数</text>
  <text x="126.0" y="98" text-anchor="middle" class="lbl-sm" fill="#64748B">↓</text>
  <rect x="92.0" y="104" width="68" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="126.0" y="128" text-anchor="middle" class="num-lg" fill="#1D4ED8">□</text>
  <rect x="246" y="44" width="136" height="34" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="314.0" y="67" text-anchor="middle" class="lbl-sm" fill="#047857">何人分</text>
  <text x="314.0" y="98" text-anchor="middle" class="lbl-sm" fill="#64748B">↓</text>
  <rect x="280.0" y="104" width="68" height="34" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="314.0" y="128" text-anchor="middle" class="num-lg" fill="#047857">8</text>
