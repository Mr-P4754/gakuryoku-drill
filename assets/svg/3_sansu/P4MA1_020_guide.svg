  <text x="127.5" y="186" text-anchor="middle" class="lbl-xs" fill="#1D4ED8">□</text>
  <rect x="155.0" y="166" width="55.0" height="28" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>
  <text x="182.5" y="186" text-anchor="middle" class="lbl-xs" fill="#64748B">□</text>
  <rect x="210.0" y="166" width="55.0" height="28" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>
  <text x="237.5" y="186" text-anchor="middle" class="lbl-xs" fill="#64748B">□</text>
  <rect x="265.0" y="166" width="55.0" height="28" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>
  <text x="292.5" y="186" text-anchor="middle" class="lbl-xs" fill="#64748B">□</text>
  <rect x="320.0" y="166" width="55.0" height="28" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>
  <text x="347.5" y="186" text-anchor="middle" class="lbl-xs" fill="#64748B">□</text>
  <rect x="375.0" y="166" width="55.0" height="28" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>
  <text x="402.5" y="186" text-anchor="middle" class="lbl-xs" fill="#64748B">□</text>
  <rect x="430.0" y="166" width="55.0" height="28" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>
  <text x="457.5" y="186" text-anchor="middle" class="lbl-xs" fill="#64748B">□</text>
  <rect x="485.0" y="166" width="55.0" height="28" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>
  <text x="512.5" y="186" text-anchor="middle" class="lbl-xs" fill="#64748B">□</text>
  <text x="320" y="216" text-anchor="middle" class="lbl-sm" fill="#0F766E">□まい が 8人分 で ぜんぶで 48まい → □ × 8 ＝ 48</text>
</svg>
