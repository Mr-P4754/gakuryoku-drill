    </style>
  </defs>
  <rect x="0" y="0" width="460" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="230" y="28" text-anchor="middle" class="title">1.9 ＋ 2.1 の筆算（.0 を消す）</text>
  <line x1="148" y1="48" x2="148" y2="146" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="126" y="57" text-anchor="middle" class="carry">1</text>
  <text x="126" y="80" text-anchor="middle" class="num-lg">1</text>
  <circle cx="148" cy="78" r="2.6" fill="#1E293B"/>
  <text x="170" y="80" text-anchor="middle" class="num-lg">9</text>
  <text x="90" y="110" text-anchor="middle" class="num-lg">＋</text>
  <text x="126" y="110" text-anchor="middle" class="num-lg">2</text>
  <circle cx="148" cy="108" r="2.6" fill="#1E293B"/>
  <text x="170" y="110" text-anchor="middle" class="num-lg">1</text>
  <line x1="76" y1="120" x2="194" y2="120" stroke="#1E293B" stroke-width="2.2"/>
  <text x="126" y="148" text-anchor="middle" class="num-lg" fill="#0F766E">4</text>
  <circle cx="148" cy="146" r="2.6" fill="#94A3B8"/>
