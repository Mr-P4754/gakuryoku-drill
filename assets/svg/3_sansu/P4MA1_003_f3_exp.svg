  <line x1="142" y1="154" x2="182" y2="128" stroke="#DC2626" stroke-width="2.4"/>
  <rect x="220" y="64" width="218" height="78" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.4"/>
  <text x="329" y="92" text-anchor="middle" class="lbl" fill="#DC2626">4.0 の「.0」は消すよ！</text>
  <text x="329" y="120" text-anchor="middle" class="num" fill="#0F766E">答え：4</text>
  <line x1="184" y1="138" x2="218" y2="108" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4,2"/>
