<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 185" width="500" height="185" role="img" aria-label="168×4の筆算解説">
  <title>168×4の筆算解説</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="500" height="185" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="250" y="28" text-anchor="middle" class="title">168 × 4 ＝ 672 の筆算</text>
  <text x="160" y="74" text-anchor="middle" class="num-lg">8</text>
  <text x="132" y="74" text-anchor="middle" class="num-lg">6</text>
  <text x="104" y="74" text-anchor="middle" class="num-lg">1</text>
  <text x="76" y="102" text-anchor="middle" class="num-lg">×</text>
  <text x="160" y="102" text-anchor="middle" class="num-lg">4</text>
  <line x1="68" y1="112" x2="176" y2="112" stroke="#1E293B" stroke-width="2.2"/>
  <text x="160" y="138" text-anchor="middle" class="num-lg" fill="#0F766E">2</text>
  <text x="132" y="138" text-anchor="middle" class="num-lg" fill="#0F766E">7</text>
  <text x="104" y="138" text-anchor="middle" class="num-lg" fill="#0F766E">6</text>
  <rect x="204" y="50" width="274" height="114" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="220" y="78" class="lbl-sm" fill="#2563EB">① 4 × 8 ＝ 32（3くり上がる）</text>
  <text x="220" y="108" class="lbl-sm" fill="#D97706">② 4 × 6 ＋ 3 ＝ 27（2くり上がる）</text>
  <text x="220" y="138" class="lbl-sm" fill="#0F766E">③ 4 × 1 ＋ 2 ＝ 6 → 672</text>
</svg>
