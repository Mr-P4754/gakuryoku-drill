<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="ちえさんの家から学校までの道のりの地図">
  <title>ちえさんの家から学校までの道のりの地図</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 14px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="480" height="270" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="240" y="26" text-anchor="middle" class="title">道にそった長さ ＝ 道のり</text>
  <line x1="50" y1="198" x2="420" y2="198" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
  <line x1="50" y1="198" x2="420" y2="198" stroke="#FEFCE8" stroke-width="12" stroke-linecap="round"/>
  <line x1="348" y1="56" x2="348" y2="224" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
  <line x1="348" y1="56" x2="348" y2="224" stroke="#FEFCE8" stroke-width="12" stroke-linecap="round"/>
  <line x1="92" y1="198" x2="348" y2="66" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5,4"/>
  <path d="M 92.0 198.0 Q 209.9 112.4 348.0 66.0" fill="none" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="214.2" y="125.7" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B" class="halo">600m（道ではない）</text>

  <polyline points="92,198 348,198 348,66" fill="none" stroke="#2563EB" stroke-width="3.2" stroke-dasharray="7,4"/>
  <circle cx="92" cy="198" r="5" fill="#1E293B"/>
  <circle cx="348" cy="198" r="4.5" fill="#1E293B"/>
  <circle cx="348" cy="66" r="5" fill="#1E293B"/>
  <path d="M 92.0 198.0 Q 220.0 232.0 348.0 198.0" fill="none" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="220.0" y="222.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8" class="halo">480m</text>

  <path d="M 348.0 66.0 Q 384.0 132.0 348.0 198.0" fill="none" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="368.9" y="137.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8" class="halo">360m</text>

  <rect x="44.0" y="138.0" width="104.0" height="28" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="96.0" y="157.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">ちえさんの家</text>
  <rect x="392.0" y="52.0" width="48.0" height="28" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="416.0" y="71.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065F46">学校</text>
  <rect x="92" y="236" width="296" height="24" rx="6" fill="#DBEAFE"/>
  <text x="240" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">道のり ＝ 480m ＋ 360m ＝ 840m</text>
</svg>
