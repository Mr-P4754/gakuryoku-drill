<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 224" width="560" height="224" role="img" aria-label="●・■・▲の重さの解説図">
  <title>●・■・▲の重さの解説図</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 14px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="560" height="224" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="280" y="26" text-anchor="middle" class="title">3つのはかりを全部たして、半分にしよう！</text>
  <rect x="20" y="42" width="160" height="34" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="100" y="64" text-anchor="middle" font-size="14" font-weight="700">● ＋ ■ ＝ 500g</text>
  <rect x="200" y="42" width="160" height="34" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="280" y="64" text-anchor="middle" font-size="14" font-weight="700">■ ＋ ▲ ＝ 800g</text>
  <rect x="380" y="42" width="160" height="34" rx="7" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="460" y="64" text-anchor="middle" font-size="14" font-weight="700">● ＋ ▲ ＝ 700g</text>
  <text x="280" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">↓ 3つ全部あわせると、それぞれ2こずつ！</text>
  <rect x="44" y="110" width="472" height="36" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="280" y="134" text-anchor="middle" font-size="14.5" font-weight="700" fill="#B91C1C">(●＋■＋▲)×2 ＝ 500＋800＋700 ＝ 2000g → 半分にして 1000g</text>
  <rect x="20" y="160" width="164" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
  <text x="102" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">1000 − 800</text>
  <text x="102" y="196" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1E3A8A">● ＝ 200g</text>
  <rect x="198" y="160" width="164" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="280" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">1000 − 700</text>
  <text x="280" y="196" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400E">■ ＝ 300g</text>
  <rect x="376" y="160" width="164" height="44" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.4"/>
  <text x="458" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">1000 − 500</text>
  <text x="458" y="196" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065F46">▲ ＝ 500g</text>
</svg>
