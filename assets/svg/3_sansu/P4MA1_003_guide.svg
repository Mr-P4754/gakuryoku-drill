  <line x1="243.6" y1="112" x2="243.6" y2="120" stroke="#64748B" stroke-width="1.2"/>
  <line x1="254.8" y1="112" x2="254.8" y2="120" stroke="#64748B" stroke-width="1.2"/>
  <line x1="266.0" y1="102" x2="266.0" y2="120" stroke="#1E293B" stroke-width="2.2"/>
