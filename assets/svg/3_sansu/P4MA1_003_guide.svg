  <line x1="299.6" y1="112" x2="299.6" y2="120" stroke="#64748B" stroke-width="1.2"/>
  <line x1="310.8" y1="112" x2="310.8" y2="120" stroke="#64748B" stroke-width="1.2"/>
  <line x1="322.0" y1="107" x2="322.0" y2="120" stroke="#334155" stroke-width="1.6"/>
  <line x1="333.2" y1="112" x2="333.2" y2="120" stroke="#64748B" stroke-width="1.2"/>
  <line x1="344.4" y1="112" x2="344.4" y2="120" stroke="#64748B" stroke-width="1.2"/>
  <line x1="355.6" y1="112" x2="355.6" y2="120" stroke="#64748B" stroke-width="1.2"/>
  <line x1="366.8" y1="112" x2="366.8" y2="120" stroke="#64748B" stroke-width="1.2"/>
  <line x1="378.0" y1="102" x2="378.0" y2="120" stroke="#1E293B" stroke-width="2.2"/>
  <text x="378.0" y="96" text-anchor="middle" class="num">3</text>
  <circle cx="53.2" cy="120" r="3.8" fill="#2563EB"/>
  <line x1="53.2" y1="148" x2="53.2" y2="129" stroke="#2563EB" stroke-width="2"/>
  <polygon points="53.2,125 48.7,133 57.7,133" fill="#2563EB"/>
  <text x="57.2" y="166" text-anchor="middle" class="num" fill="#2563EB">0.1</text>
  <circle cx="322.0" cy="120" r="3.8" fill="#059669"/>
