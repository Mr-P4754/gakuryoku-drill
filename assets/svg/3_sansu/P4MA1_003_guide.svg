  <polygon points="322.0,125 317.5,133 326.5,133" fill="#059669"/>
  <text x="322.0" y="166" text-anchor="middle" class="num" fill="#059669">2.5</text>
  <text x="214" y="192" text-anchor="middle" class="lbl-xs">2 と 0.5 をあわせた数 ＝ 2.5</text>
  <rect x="424" y="44" width="196" height="162" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="522" y="66" text-anchor="middle" class="lbl-sm" fill="#1D4ED8">小数点をたてにそろえる</text>
  <line x1="524" y1="78" x2="524" y2="178" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="504" y="88" text-anchor="middle" class="carry">1</text>
  <text x="504" y="110" text-anchor="middle" class="num-lg">1</text>
  <circle cx="524" cy="108" r="2.6" fill="#2563EB"/>
  <text x="544" y="110" text-anchor="middle" class="num-lg">8</text>
  <text x="470" y="140" text-anchor="middle" class="num-lg">＋</text>
  <text x="504" y="140" text-anchor="middle" class="num-lg">4</text>
  <circle cx="524" cy="138" r="2.6" fill="#2563EB"/>
  <text x="544" y="140" text-anchor="middle" class="num-lg">5</text>
  <line x1="454" y1="149" x2="570" y2="149" stroke="#1E293B" stroke-width="2.2"/>
  <text x="504" y="176" text-anchor="middle" class="num-lg" fill="#0F766E">6</text>
  <circle cx="524" cy="174" r="3" fill="#DC2626"/>
  <text x="544" y="176" text-anchor="middle" class="num-lg" fill="#0F766E">3</text>
  <text x="522" y="198" text-anchor="middle" class="lbl-xs" fill="#1D4ED8">答えにも小数点をわすれずに！</text>
