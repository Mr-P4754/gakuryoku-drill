  <text x="214" y="66" text-anchor="middle" class="lbl-sm" fill="#1E293B">1を10等分した1こ分 ＝ 0.1（25こ分で 2.5）</text>
  <line x1="38" y1="120" x2="392.0" y2="120" stroke="#1E293B" stroke-width="2.2"/>
