<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 224" width="640" height="224" role="img" aria-label="コンパスを使った二等辺三角形のかき方">
  <title>コンパスを使った二等辺三角形のかき方</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
