<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 175" width="540" height="175" role="img" aria-label="公園の子どものテープ図解説">
  <title>公園の子どものテープ図解説</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="540" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 70 70 Q 185.0 46 300 70" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-dasharray="5,3"/>

  <rect x="147.0" y="36" width="76" height="28" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="185.0" y="56" text-anchor="middle" class="num" fill="#1D4ED8">□ 人</text>
  <path d="M 300 70 Q 385.0 46 470 70" fill="none" stroke="#059669" stroke-width="1.7" stroke-dasharray="5,3"/>

  <rect x="347.0" y="36" width="76" height="28" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
  <text x="385.0" y="56" text-anchor="middle" class="num" fill="#047857">6 人</text>
  <rect x="70" y="74" width="230" height="38" fill="#DBEAFE" stroke="#1E293B" stroke-width="2"/>
  <text x="185.0" y="99" text-anchor="middle" class="lbl-xs" fill="#1D4ED8">はじめの人数</text>
  <rect x="300" y="74" width="170" height="38" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/>
  <text x="385.0" y="99" text-anchor="middle" class="lbl-xs" fill="#047857">来た人数</text>
  <path d="M 70 116 Q 270.0 142 470 116" fill="none" stroke="#D97706" stroke-width="1.7" stroke-dasharray="5,3"/>

  <rect x="212.0" y="132" width="116" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="270.0" y="152" text-anchor="middle" class="num" fill="#B45309">ぜんぶ 14 人</text>
</svg>
