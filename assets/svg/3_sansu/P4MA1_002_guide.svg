<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="10000より大きい数の位取り表">
  <title>10000より大きい数の位取り表</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="210" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="320" y="28" text-anchor="middle" class="title">10000より大きい数の位取り表（4けたずつ区切る）</text>
  <rect x="70" y="42" width="55" height="26" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="97.5" y="60" text-anchor="middle" class="num" fill="#2563EB">億</text>
  <rect x="125" y="42" width="220" height="26" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
  <text x="235" y="60" text-anchor="middle" class="num" fill="#059669">万</text>
  <rect x="345" y="42" width="220" height="26" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
  <text x="455" y="60" text-anchor="middle" class="num" fill="#475569">一</text>
  <rect x="70" y="68" width="55" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="97.5" y="87" text-anchor="middle" class="lbl-sm">一億</text>
  <rect x="70" y="96" width="55" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <rect x="125" y="68" width="55" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="152.5" y="87" text-anchor="middle" class="lbl-sm">千万</text>
  <rect x="125" y="96" width="55" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="152.5" y="122" text-anchor="middle" class="num-lg" fill="#1E293B">6</text>
  <rect x="180" y="68" width="55" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="207.5" y="87" text-anchor="middle" class="lbl-sm">百万</text>
  <rect x="180" y="96" width="55" height="38" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="207.5" y="122" text-anchor="middle" class="num-lg" fill="#D97706">0</text>
  <rect x="235" y="68" width="55" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="262.5" y="87" text-anchor="middle" class="lbl-sm">十万</text>
  <rect x="235" y="96" width="55" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="262.5" y="122" text-anchor="middle" class="num-lg" fill="#1E293B">8</text>
  <rect x="290" y="68" width="55" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="317.5" y="87" text-anchor="middle" class="lbl-sm">一万</text>
  <rect x="290" y="96" width="55" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="317.5" y="122" text-anchor="middle" class="num-lg" fill="#1E293B">5</text>
  <rect x="345" y="68" width="55" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="372.5" y="87" text-anchor="middle" class="lbl-sm">千</text>
  <rect x="345" y="96" width="55" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="372.5" y="122" text-anchor="middle" class="num-lg" fill="#1E293B">9</text>
  <rect x="400" y="68" width="55" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="427.5" y="87" text-anchor="middle" class="lbl-sm">百</text>
  <rect x="400" y="96" width="55" height="38" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="427.5" y="122" text-anchor="middle" class="num-lg" fill="#D97706">0</text>
  <rect x="455" y="68" width="55" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="482.5" y="87" text-anchor="middle" class="lbl-sm">十</text>
  <rect x="455" y="96" width="55" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="482.5" y="122" text-anchor="middle" class="num-lg" fill="#1E293B">2</text>
  <rect x="510" y="68" width="55" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="537.5" y="87" text-anchor="middle" class="lbl-sm">一</text>
  <rect x="510" y="96" width="55" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="537.5" y="122" text-anchor="middle" class="num-lg" fill="#1E293B">7</text>
  <line x1="125" y1="42" x2="125" y2="134" stroke="#1E293B" stroke-width="2.4"/>
  <line x1="345" y1="42" x2="345" y2="134" stroke="#1E293B" stroke-width="2.4"/>
  <text x="320" y="162" text-anchor="middle" class="lbl-sm" fill="#1E293B">例：六千八十五万 九千二十七 → 6085｜9027 ＝ 60859027</text>
  <text x="320" y="186" text-anchor="middle" class="lbl-xs">一万を10こで十万（100000）／ 千万を10こで一億（100000000）</text>
</svg>
