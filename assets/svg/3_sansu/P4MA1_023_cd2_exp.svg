<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180" role="img" aria-label="イヌ・ネコ・サルの体重の求め方">
  <title>イヌ・ネコ・サルの体重の求め方</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 14px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="520" height="180" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="260" y="26" text-anchor="middle" class="title">3びきの体重の合計の求め方</text>
  <rect x="20" y="42" width="150" height="34" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="95" y="64" text-anchor="middle" font-size="13.5" font-weight="700">イヌ＋ネコ ＝ 16kg</text>
  <rect x="185" y="42" width="150" height="34" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="260" y="64" text-anchor="middle" font-size="13.5" font-weight="700">ネコ＋サル ＝ 13kg</text>
  <rect x="350" y="42" width="150" height="34" rx="7" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="425" y="64" text-anchor="middle" font-size="13.5" font-weight="700">イヌ＋サル ＝ 19kg</text>
  <text x="260" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">↓ 全部たすと，3びきが2ひき分ずつになる！</text>
  <rect x="38" y="112" width="444" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="260" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">2ひき分ずつ：16 ＋ 13 ＋ 19 ＝ 48kg</text>
  <text x="260" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#DC2626">3びきあわせて：48 ÷ 2 ＝ 24kg</text>
</svg>
