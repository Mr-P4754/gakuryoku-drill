<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 225" width="640" height="225" role="img" aria-label="万の位の位取り表">
  <title>万の位の位取り表</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="225" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="320" y="30" text-anchor="middle" class="title">万の位の位取り表（あいた位には 0 を書く）</text>
  <rect x="200" y="44" width="68" height="28" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
  <text x="234.0" y="64" text-anchor="middle" class="num" fill="#059669">万</text>
  <rect x="268" y="44" width="272" height="28" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
  <text x="404" y="64" text-anchor="middle" class="num" fill="#475569">一</text>
  <rect x="200" y="72" width="68" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="234.0" y="91" text-anchor="middle" class="lbl-sm">一万</text>
  <rect x="268" y="72" width="68" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="302.0" y="91" text-anchor="middle" class="lbl-sm">千</text>
  <rect x="336" y="72" width="68" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="370.0" y="91" text-anchor="middle" class="lbl-sm">百</text>
  <rect x="404" y="72" width="68" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="438.0" y="91" text-anchor="middle" class="lbl-sm">十</text>
  <rect x="472" y="72" width="68" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="506.0" y="91" text-anchor="middle" class="lbl-sm">一</text>
  <text x="188" y="124" text-anchor="end" font-size="13.5" font-weight="600" fill="#334155">例1 四万七百三十五</text>
  <rect x="200" y="100" width="68" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="234.0" y="126" text-anchor="middle" class="num-lg" fill="#1E293B">4</text>
  <rect x="268" y="100" width="68" height="38" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="302.0" y="126" text-anchor="middle" class="num-lg" fill="#D97706">0</text>
  <rect x="336" y="100" width="68" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="370.0" y="126" text-anchor="middle" class="num-lg" fill="#1E293B">7</text>
  <rect x="404" y="100" width="68" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="438.0" y="126" text-anchor="middle" class="num-lg" fill="#1E293B">3</text>
  <rect x="472" y="100" width="68" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="506.0" y="126" text-anchor="middle" class="num-lg" fill="#1E293B">5</text>
  <text x="188" y="162" text-anchor="end" font-size="13.5" font-weight="600" fill="#334155">例2 1万×7, 千×8, 百×6</text>
  <rect x="200" y="138" width="68" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="234.0" y="164" text-anchor="middle" class="num-lg" fill="#1E293B">7</text>
  <rect x="268" y="138" width="68" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="302.0" y="164" text-anchor="middle" class="num-lg" fill="#1E293B">8</text>
  <rect x="336" y="138" width="68" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="370.0" y="164" text-anchor="middle" class="num-lg" fill="#1E293B">6</text>
  <rect x="404" y="138" width="68" height="38" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="438.0" y="164" text-anchor="middle" class="num-lg" fill="#D97706">0</text>
  <rect x="472" y="138" width="68" height="38" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="506.0" y="164" text-anchor="middle" class="num-lg" fill="#D97706">0</text>
  <line x1="268" y1="44" x2="268" y2="176" stroke="#1E293B" stroke-width="2.4"/>
  <text x="320" y="204" text-anchor="middle" class="lbl-sm" fill="#B45309">ポイント：読みに出てこない位（あいた位）には、必ず「0」を書こう！</text>
