<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 175" width="560" height="175" role="img" aria-label="(4×8)×5の考え方図">
  <title>(4×8)×5の考え方図</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="560" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="280" y="28" text-anchor="middle" class="title">1箱の本数を先にもとめる式：(4 × 8) × 5</text>
  <rect x="34" y="48" width="88" height="62" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="78" y="72" text-anchor="middle" class="lbl-xs" fill="#1D4ED8">1箱目</text>
  <text x="78" y="96" text-anchor="middle" class="lbl-sm" fill="#1D4ED8">4本×8セット</text>
  <rect x="134" y="48" width="88" height="62" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="178" y="72" text-anchor="middle" class="lbl-xs" fill="#334155">2箱目</text>
  <text x="178" y="96" text-anchor="middle" class="lbl-sm" fill="#334155">4本×8セット</text>
  <rect x="234" y="48" width="88" height="62" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="278" y="72" text-anchor="middle" class="lbl-xs" fill="#334155">3箱目</text>
  <text x="278" y="96" text-anchor="middle" class="lbl-sm" fill="#334155">4本×8セット</text>
  <rect x="334" y="48" width="88" height="62" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="378" y="72" text-anchor="middle" class="lbl-xs" fill="#334155">4箱目</text>
  <text x="378" y="96" text-anchor="middle" class="lbl-sm" fill="#334155">4本×8セット</text>
  <rect x="434" y="48" width="88" height="62" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="478" y="72" text-anchor="middle" class="lbl-xs" fill="#334155">5箱目</text>
  <text x="478" y="96" text-anchor="middle" class="lbl-sm" fill="#334155">4本×8セット</text>
  <path d="M 34 114 Q 78.0 128 122 114" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-dasharray="5,3"/>

  <text x="78" y="142" text-anchor="middle" class="lbl-xs" fill="#1D4ED8">1箱：(4×8)</text>
  <path d="M 34 114 Q 278.0 140 522 114" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-dasharray="5,3"/>

  <text x="315" y="156" text-anchor="middle" class="num" fill="#0F766E">これが5箱分 → (4 × 8) × 5</text>
</svg>
