<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 235" width="640" height="235" role="img" aria-label="ひき算の筆算くり下がりガイド">
  <title>ひき算の筆算くり下がりガイド</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
