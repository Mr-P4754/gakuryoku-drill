    </style>
  </defs>
  <rect x="0" y="0" width="640" height="235" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="320" y="28" text-anchor="middle" class="title">ひき算の筆算：十の位が 0 のくり下がり（602 － 238）</text>
  <rect x="20" y="44" width="184" height="174" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
