<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" width="640" height="254" role="img" aria-label="かけ算の筆算ガイド">
  <title>かけ算の筆算ガイド</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="254" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="320" y="28" text-anchor="middle" class="title">かけ算の筆算（一の位から・2けたの十の位は左へ1けたずらす）</text>
  <rect x="18" y="44" width="242" height="192" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="139" y="66" text-anchor="middle" class="lbl-sm" fill="#1E293B">① 2けた × 1けた</text>
  <text x="132" y="104" text-anchor="middle" class="num-lg">6</text>
  <text x="105" y="104" text-anchor="middle" class="num-lg">3</text>
  <text x="78" y="132" text-anchor="middle" class="num-lg">×</text>
  <text x="132" y="132" text-anchor="middle" class="num-lg">8</text>
  <line x1="43" y1="142" x2="148" y2="142" stroke="#1E293B" stroke-width="2.2"/>
  <text x="132" y="168" text-anchor="middle" class="num-lg" fill="#0F766E">8</text>
  <text x="105" y="168" text-anchor="middle" class="num-lg" fill="#0F766E">8</text>
  <text x="78" y="168" text-anchor="middle" class="num-lg" fill="#0F766E">2</text>
  <text x="158" y="114" class="lbl-xs" fill="#2563EB">八六 48</text>
  <text x="158" y="136" class="lbl-xs" fill="#DC2626">4 くり上がる</text>
  <text x="158" y="158" class="lbl-xs" fill="#0F766E">八三 24＋4＝28</text>
  <text x="139" y="218" text-anchor="middle" class="lbl-xs" fill="#475569">答え：288</text>
  <rect x="274" y="44" width="348" height="192" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="448" y="66" text-anchor="middle" class="lbl-sm" fill="#1D4ED8">② 2けた × 2けた（左へ1けたずらす！）</text>
  <text x="416" y="96" text-anchor="middle" class="num-lg">4</text>
  <text x="390" y="96" text-anchor="middle" class="num-lg">8</text>
  <text x="364" y="124" text-anchor="middle" class="num-lg">×</text>
  <text x="416" y="124" text-anchor="middle" class="num-lg">7</text>
  <text x="390" y="124" text-anchor="middle" class="num-lg">3</text>
  <line x1="304" y1="134" x2="432" y2="134" stroke="#1E293B" stroke-width="2.2"/>
  <text x="416" y="160" text-anchor="middle" class="num-lg" fill="#2563EB">8</text>
  <text x="390" y="160" text-anchor="middle" class="num-lg" fill="#2563EB">8</text>
  <text x="364" y="160" text-anchor="middle" class="num-lg" fill="#2563EB">5</text>
  <text x="444" y="158" text-anchor="start" class="lbl-xs" fill="#2563EB">← 84 × 7</text>
  <text x="390" y="188" text-anchor="middle" class="num-lg" fill="#D97706">2</text>
  <text x="364" y="188" text-anchor="middle" class="num-lg" fill="#D97706">5</text>
  <text x="338" y="188" text-anchor="middle" class="num-lg" fill="#D97706">2</text>
  <rect x="405" y="169" width="22" height="24" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="416" y="188" text-anchor="middle" class="lbl-sm" fill="#D97706">0</text>
  <text x="444" y="186" text-anchor="start" class="lbl-xs" fill="#D97706">← 84 × 30（1けた左へ）</text>
  <line x1="304" y1="198" x2="432" y2="198" stroke="#1E293B" stroke-width="2.2"/>
  <text x="416" y="224" text-anchor="middle" class="num-lg" fill="#0F766E">8</text>
  <text x="390" y="224" text-anchor="middle" class="num-lg" fill="#0F766E">0</text>
  <text x="364" y="224" text-anchor="middle" class="num-lg" fill="#0F766E">1</text>
  <text x="338" y="224" text-anchor="middle" class="num-lg" fill="#0F766E">3</text>
</svg>
