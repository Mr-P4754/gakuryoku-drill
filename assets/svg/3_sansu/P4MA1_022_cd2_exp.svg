<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 178" width="540" height="178" role="img" aria-label="4人が図書館に来たじゅんと時こくの図">
  <title>4人が図書館に来たじゅんと時こくの図</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 14px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="540" height="178" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="270" y="24" text-anchor="middle" class="title">4人が図書館に着いた時こく</text>
  <line x1="36" y1="88" x2="504" y2="88" stroke="#1E293B" stroke-width="2.4"/>
  <line x1="362" y1="78" x2="362" y2="98" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="3,2"/>
  <text x="362" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B">3時</text>
  <circle cx="62" cy="88" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="62" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">ゆきさん</text>
  <text x="62" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">2時45分</text>
  <circle cx="162" cy="88" r="5.5" fill="#059669" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="162" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">たくやさん</text>
  <text x="162" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">2時50分</text>
  <circle cx="402" cy="88" r="5.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="390" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">ようたさん</text>
  <text x="390" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">3時2分</text>
  <circle cx="422" cy="88" r="5.5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="446" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#7C3AED">りかさん</text>
  <text x="446" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">3時3分（＋18分）</text>
  <text x="112" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">＋5分</text>
  <text x="278" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">＋12分（合計17分おくれ）</text>
</svg>
