  <rect x="472" y="48" width="128" height="72" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.8" stroke-dasharray="5,3"/>
  <circle cx="512" cy="84" r="10" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.8"/>
  <circle cx="560" cy="84" r="10" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.8"/>
  <text x="536" y="138" text-anchor="middle" class="lbl-sm" fill="#DC2626">あまり 2こ</text>
  <rect x="44" y="152" width="556" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.4"/>
  <text x="322" y="178" text-anchor="middle" class="lbl" fill="#B45309">大切なきまり：あまり(2) は、かならず わる数(4) より小さくなるよ！</text>
