    </style>
  </defs>
  <rect x="0" y="0" width="640" height="210" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="320" y="28" text-anchor="middle" class="title">あまりのあるわり算（14 ÷ 4 ＝ 3 あまり 2）</text>
  <rect x="44" y="48" width="114" height="72" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="101" y="138" text-anchor="middle" class="lbl-xs" fill="#1D4ED8">1ふくろ目 (4こ)</text>
  <circle cx="76" cy="68" r="10" fill="#FDE68A" stroke="#D97706" stroke-width="1.8"/>
