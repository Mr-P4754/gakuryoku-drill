  <rect x="182" y="48" width="114" height="72" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="239" y="138" text-anchor="middle" class="lbl-xs" fill="#1D4ED8">2ふくろ目 (4こ)</text>
  <circle cx="214" cy="68" r="10" fill="#FDE68A" stroke="#D97706" stroke-width="1.8"/>
  <circle cx="264" cy="68" r="10" fill="#FDE68A" stroke="#D97706" stroke-width="1.8"/>
  <circle cx="214" cy="100" r="10" fill="#FDE68A" stroke="#D97706" stroke-width="1.8"/>
