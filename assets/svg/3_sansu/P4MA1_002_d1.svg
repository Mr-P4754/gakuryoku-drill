<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 148" width="600" height="148" role="img" aria-label="8けたの位取り表">
  <title>8けたの位取り表</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="600" height="148" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="300" y="26" text-anchor="middle" class="lbl-sm" fill="#334155">位取り表を使って考えよう（4けた区切り）</text>
  <rect x="60" y="38" width="240" height="24" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="180" y="55" text-anchor="middle" class="lbl-sm" fill="#059669">万のグループ</text>
  <rect x="300" y="38" width="240" height="24" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="420" y="55" text-anchor="middle" class="lbl-sm" fill="#475569">一のグループ</text>
  <rect x="60" y="62" width="60" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="90.0" y="81" text-anchor="middle" class="lbl-sm">千万</text>
  <rect x="60" y="90" width="60" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <rect x="120" y="62" width="60" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="150.0" y="81" text-anchor="middle" class="lbl-sm">百万</text>
  <rect x="120" y="90" width="60" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <rect x="180" y="62" width="60" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="210.0" y="81" text-anchor="middle" class="lbl-sm">十万</text>
  <rect x="180" y="90" width="60" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <rect x="240" y="62" width="60" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="270.0" y="81" text-anchor="middle" class="lbl-sm">一万</text>
  <rect x="240" y="90" width="60" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <rect x="300" y="62" width="60" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="330.0" y="81" text-anchor="middle" class="lbl-sm">千</text>
  <rect x="300" y="90" width="60" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <rect x="360" y="62" width="60" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="390.0" y="81" text-anchor="middle" class="lbl-sm">百</text>
  <rect x="360" y="90" width="60" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <rect x="420" y="62" width="60" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="450.0" y="81" text-anchor="middle" class="lbl-sm">十</text>
  <rect x="420" y="90" width="60" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <rect x="480" y="62" width="60" height="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="510.0" y="81" text-anchor="middle" class="lbl-sm">一</text>
  <rect x="480" y="90" width="60" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <line x1="300" y1="38" x2="300" y2="128" stroke="#1E293B" stroke-width="2.4"/>
</svg>
