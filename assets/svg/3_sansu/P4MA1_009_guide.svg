<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 215" width="640" height="215" role="img" aria-label="わり算の考え方ガイド">
  <title>わり算の考え方ガイド</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="215" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="320" y="28" text-anchor="middle" class="title">わり算の考え方（九九を使う ・ 位ごとに分ける）</text>
  <rect x="20" y="44" width="290" height="154" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="165" y="68" text-anchor="middle" class="lbl-sm" fill="#1D4ED8">① 九九を使って考える</text>
  <text x="165" y="102" text-anchor="middle" class="num-lg">14 ÷ <tspan fill="#2563EB">2</tspan> ＝ <tspan fill="#0F766E">□</tspan></text>
  <text x="165" y="128" text-anchor="middle" class="lbl-sm" fill="#475569">↓  2のだんの九九でさがす</text>
  <text x="165" y="156" text-anchor="middle" class="num"><tspan fill="#2563EB">2</tspan> × <tspan fill="#0F766E">7</tspan> ＝ 14 （二七 14）</text>
  <text x="165" y="184" text-anchor="middle" class="num" fill="#0F766E">だから 14 ÷ 2 ＝ 7</text>
  <rect x="330" y="44" width="290" height="154" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.4"/>
  <text x="475" y="68" text-anchor="middle" class="lbl-sm" fill="#047857">② 2けた÷1けた（位ごとに分ける）</text>
  <text x="475" y="98" text-anchor="middle" class="num-lg">55 ÷ 5</text>
  <line x1="452" y1="104" x2="412" y2="122" stroke="#059669" stroke-width="1.8"/>
  <line x1="482" y1="104" x2="532" y2="122" stroke="#059669" stroke-width="1.8"/>
  <rect x="348" y="124" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
  <text x="408" y="144" text-anchor="middle" class="lbl-sm" fill="#047857">50 ÷ 5 ＝ 10</text>
  <rect x="482" y="124" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
  <text x="542" y="144" text-anchor="middle" class="lbl-sm" fill="#047857">5 ÷ 5 ＝ 1</text>
  <text x="475" y="182" text-anchor="middle" class="num" fill="#0F766E">あわせて 10 ＋ 1 ＝ 11</text>
</svg>
