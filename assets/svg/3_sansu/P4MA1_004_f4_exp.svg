<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 165" width="580" height="165" role="img" aria-label="4/5-3/5のテープ図解説">
  <title>4/5-3/5のテープ図解説</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="580" height="165" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="290" y="28" text-anchor="middle" class="title">1/5 の何こ分かで考えよう（4/5 － 3/5 ＝ 1/5）</text>
  <rect x="40.0" y="62" width="100.0" height="34" fill="#A7F3D0" stroke="#334155" stroke-width="1.4"/>
  <rect x="140.0" y="62" width="100.0" height="34" fill="#FEE2E2" stroke="#334155" stroke-width="1.4"/>
  <line x1="150.0" y1="68" x2="230.0" y2="90" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4,3"/>
  <rect x="240.0" y="62" width="100.0" height="34" fill="#FEE2E2" stroke="#334155" stroke-width="1.4"/>
  <line x1="250.0" y1="68" x2="330.0" y2="90" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4,3"/>
  <rect x="340.0" y="62" width="100.0" height="34" fill="#FEE2E2" stroke="#334155" stroke-width="1.4"/>
  <line x1="350.0" y1="68" x2="430.0" y2="90" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4,3"/>
  <rect x="440.0" y="62" width="100.0" height="34" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
  <path d="M 40 59 Q 240.0 46 440.0 59" fill="none" stroke="#1E293B" stroke-width="1.7" stroke-dasharray="5,3"/>

  <text x="240.0" y="46" text-anchor="middle" class="lbl-xs">はじめ 4こ分 (4/5)</text>
  <path d="M 40 99 Q 90.0 114 140.0 99" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-dasharray="5,3"/>

  <text x="90.0" y="134" text-anchor="middle" class="num" fill="#0F766E">のこり 1/5</text>
  <path d="M 140.0 99 Q 290.0 114 440.0 99" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-dasharray="5,3"/>

  <text x="290.0" y="134" text-anchor="middle" class="lbl-sm" fill="#DC2626">3こ分 (3/5) をひく</text>
</svg>
