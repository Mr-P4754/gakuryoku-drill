<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 175" width="540" height="175" role="img" aria-label="あめの数のテープ図（解説）">
  <title>あめの数のテープ図（解説）</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="540" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 70 70 Q 270.0 44 470 70" fill="none" stroke="#334155" stroke-width="1.7" stroke-dasharray="5,3"/>

  <rect x="220.0" y="36" width="100" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="270.0" y="56" text-anchor="middle" class="ans-num" fill="#B45309">27 こ</text>
  <rect x="70" y="74" width="130" height="38" fill="#FEE2E2" stroke="#1E293B" stroke-width="2"/>
  <text x="135.0" y="99" text-anchor="middle" class="lbl-xs" fill="#B91C1C">食べた数</text>
  <rect x="200" y="74" width="270" height="38" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/>
  <text x="335.0" y="99" text-anchor="middle" class="lbl-xs" fill="#047857">のこりの数</text>
  <path d="M 70 116 Q 135.0 136 200 116" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-dasharray="5,3"/>

  <rect x="99.0" y="130" width="72" height="28" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="135.0" y="150" text-anchor="middle" class="num" fill="#DC2626">□ こ</text>
  <path d="M 200 116 Q 335.0 136 470 116" fill="none" stroke="#059669" stroke-width="1.7" stroke-dasharray="5,3"/>

  <rect x="287.0" y="130" width="96" height="28" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
  <text x="335.0" y="150" text-anchor="middle" class="ans-num" fill="#047857">19 こ</text>
</svg>
