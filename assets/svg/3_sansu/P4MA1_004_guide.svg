<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" width="640" height="285" role="img" aria-label="分数とその計算ガイド">
  <title>分数とその計算ガイド</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .num { font-size: 17px; font-weight: 700; }
      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="285" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="320" y="28" text-anchor="middle" class="title">分数の表し方 と 同じ分母のたし算・ひき算</text>
  <text x="58" y="78" text-anchor="end" class="num">1</text>
  <rect x="70.0" y="56" width="50.0" height="32" fill="#93C5FD" stroke="#334155" stroke-width="1.4"/>
  <rect x="120.0" y="56" width="50.0" height="32" fill="#DBEAFE" stroke="#334155" stroke-width="1.4"/>
  <rect x="170.0" y="56" width="50.0" height="32" fill="#DBEAFE" stroke="#334155" stroke-width="1.4"/>
  <rect x="220.0" y="56" width="50.0" height="32" fill="#DBEAFE" stroke="#334155" stroke-width="1.4"/>
  <rect x="270.0" y="56" width="50.0" height="32" fill="#DBEAFE" stroke="#334155" stroke-width="1.4"/>
  <rect x="320.0" y="56" width="50.0" height="32" fill="#DBEAFE" stroke="#334155" stroke-width="1.4"/>
  <rect x="370.0" y="56" width="50.0" height="32" fill="#DBEAFE" stroke="#334155" stroke-width="1.4"/>
  <rect x="420.0" y="56" width="50.0" height="32" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
  <rect x="470.0" y="56" width="50.0" height="32" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
  <rect x="520.0" y="56" width="50.0" height="32" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
  <text x="70" y="48" text-anchor="middle" class="lbl-xs">0</text>
  <text x="570" y="48" text-anchor="middle" class="lbl-xs">1</text>
  <path d="M 70 91 Q 95.0 104 120.0 91" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-dasharray="5,3"/>

  <text x="95.0" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">1</text>
  <line x1="85.0" y1="119" x2="105.0" y2="119" stroke="#2563EB" stroke-width="1.8"/>
  <text x="95.0" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">10</text>

  <path d="M 70 91 Q 245.0 116 420.0 91" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-dasharray="5,3"/>

  <text x="285.0" y="126" text-anchor="end" class="lbl-sm" fill="#0F766E">1/10 の 7こ分 ＝</text>
  <text x="305.0" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#0F766E">7</text>
  <line x1="294.0" y1="120" x2="316.0" y2="120" stroke="#0F766E" stroke-width="1.8"/>
  <text x="305.0" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#0F766E">10</text>

  <text x="58" y="202" text-anchor="end" class="num">1</text>
  <rect x="70.0" y="180" width="60.0" height="32" fill="#BFDBFE" stroke="#334155" stroke-width="1.4"/>
  <rect x="130.0" y="180" width="60.0" height="32" fill="#BFDBFE" stroke="#334155" stroke-width="1.4"/>
  <rect x="190.0" y="180" width="60.0" height="32" fill="#A7F3D0" stroke="#334155" stroke-width="1.4"/>
  <rect x="250.0" y="180" width="60.0" height="32" fill="#A7F3D0" stroke="#334155" stroke-width="1.4"/>
  <rect x="310.0" y="180" width="60.0" height="32" fill="#A7F3D0" stroke="#334155" stroke-width="1.4"/>
  <rect x="370.0" y="180" width="60.0" height="32" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
  <rect x="430.0" y="180" width="60.0" height="32" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
  <path d="M 70 177 Q 130.0 162 190.0 177" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-dasharray="5,3"/>

  <text x="130.0" y="162" text-anchor="middle" class="lbl-xs" fill="#2563EB">1/7 が 2こ分</text>
  <path d="M 190.0 177 Q 280.0 162 370.0 177" fill="none" stroke="#059669" stroke-width="1.7" stroke-dasharray="5,3"/>

  <text x="280.0" y="162" text-anchor="middle" class="lbl-xs" fill="#059669">1/7 が 3こ分</text>
  <path d="M 70 215 Q 220.0 232 370.0 215" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-dasharray="5,3"/>

  <text x="220.0" y="248" text-anchor="middle" class="lbl-sm" fill="#0F766E">あわせて 1/7 が 2＋3＝5こ分</text>
  <text x="518" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">2</text>
  <line x1="508.0" y1="197" x2="528.0" y2="197" stroke="#2563EB" stroke-width="1.8"/>
  <text x="518" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">7</text>

  <text x="538" y="203" text-anchor="middle" class="num">＋</text>
  <text x="558" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">3</text>
  <line x1="548.0" y1="197" x2="568.0" y2="197" stroke="#059669" stroke-width="1.8"/>
  <text x="558" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">7</text>

  <text x="578" y="203" text-anchor="middle" class="num">＝</text>
  <text x="598" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">5</text>
  <line x1="587.0" y1="197" x2="609.0" y2="197" stroke="#0F766E" stroke-width="1.8"/>
  <text x="598" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">7</text>

  <text x="320" y="272" text-anchor="middle" class="lbl-xs" fill="#B45309">分母はそのまま！分子だけたし算・ひき算するよ</text>
</svg>
