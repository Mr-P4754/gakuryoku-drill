      .num-lg { font-size: 22px; font-weight: 700; }
      .num-sm { font-size: 14px; font-weight: 700; }
      .carry { font-size: 13px; font-weight: 700; fill: #DC2626; }
      .borrow { font-size: 13px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 17px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="540" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 70 70 Q 200.0 46 330 70" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-dasharray="5,3"/>

  <rect x="156.0" y="36" width="88" height="28" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="200.0" y="56" text-anchor="middle" class="ans-num">□ 本</text>
  <path d="M 330 70 Q 400.0 46 470 70" fill="none" stroke="#059669" stroke-width="1.7" stroke-dasharray="5,3"/>

  <rect x="356.0" y="36" width="88" height="28" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
  <text x="400.0" y="56" text-anchor="middle" class="ans-num" fill="#047857">4 本</text>
  <rect x="70" y="74" width="260" height="38" fill="#DBEAFE" stroke="#1E293B" stroke-width="2"/>
