  <rect x="330" y="74" width="140" height="38" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/>
  <text x="400.0" y="99" text-anchor="middle" class="lbl-xs" fill="#047857">買った数</text>
  <path d="M 70 116 Q 270.0 142 470 116" fill="none" stroke="#475569" stroke-width="1.7" stroke-dasharray="5,3"/>

  <rect x="220.0" y="132" width="100" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="270.0" y="152" text-anchor="middle" class="ans-num" fill="#B45309">12 本</text>
