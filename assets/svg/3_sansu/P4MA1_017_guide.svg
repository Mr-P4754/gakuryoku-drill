<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 264" width="560" height="264" role="img" aria-label="二等辺三角形と正三角形の特ちょう">
  <title>二等辺三角形と正三角形の特ちょう</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 14px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="560" height="264" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="14" y="14" width="260" height="236" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="144" y="38" text-anchor="middle" class="title blue">二等辺三角形</text>
  <polygon points="144,72 60,154 228,154" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="144" y1="72" x2="144" y2="154" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="144" y1="72" x2="60" y2="154" stroke="#2563EB" stroke-width="3.0"/>
  <line x1="144" y1="72" x2="228" y2="154" stroke="#2563EB" stroke-width="3.0"/>
  <path d="M 82 154 A 22 22 0 0 0 75.7 138.6" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  <path d="M 206 154 A 22 22 0 0 1 212.3 138.6" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  <text x="144" y="64" text-anchor="middle" class="lbl-sm">ア</text>
  <text x="46" y="160" text-anchor="middle" class="lbl-sm">イ</text>
  <text x="242" y="160" text-anchor="middle" class="lbl-sm">ウ</text>
  <text x="82.0" y="113.0" text-anchor="middle" class="lbl-sm blue">4cm</text>
  <text x="206.0" y="113.0" text-anchor="middle" class="lbl-sm blue">4cm</text>
  <text x="144" y="172" text-anchor="middle" class="lbl-sm">6cm</text>
  <text x="144" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E40AF">2つの辺の長さが等しい</text>
  <text x="144" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C2410C">2つの角の大きさも等しい</text>
  <rect x="286" y="14" width="260" height="236" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="416" y="38" text-anchor="middle" class="title teal">正三角形</text>
  <polygon points="416.0,61.0 360.0,158.0 472.0,158.0" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 380.0 158.0 A 20 20 0 0 0 370.0 140.7" fill="none" stroke="#EA580C" stroke-width="2.4"/>
  <path d="M 452.0 158.0 A 20 20 0 0 1 462.0 140.7" fill="none" stroke="#EA580C" stroke-width="2.4"/>
  <path d="M 406.0 78.3 A 20 20 0 0 0 426.0 78.3" fill="none" stroke="#EA580C" stroke-width="2.4"/>
  <text x="366.0" y="113.5" text-anchor="middle" class="lbl-sm teal">4cm</text>
  <text x="466.0" y="113.5" text-anchor="middle" class="lbl-sm teal">4cm</text>
  <text x="416" y="176" text-anchor="middle" class="lbl-sm teal">4cm</text>
  <text x="416" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F766E">3つの辺の長さがみな等しい</text>
  <text x="416" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C2410C">3つの角の大きさもみな等しい</text>
</svg>
