 font-size="10.5" font-weight="bold" fill="#1E293B">20</text><line x1="118" y1="192.0" x2="125" y2="192.0" stroke="#334155" stroke-width="0.9"/><line x1="118" y1="187.5" x2="125" y2="187.5" stroke="#334155" stroke-width="0.9"/><line x1="118" y1="183.0" x2="125" y2="183.0" stroke="#334155" stroke-width="0.9"/><line x1="118" y1="178.5" x2="125" y2="178.5" stroke="#334155" stroke-width="0.9"/><line x1="118" y1="174.0" x2="131" y2="174.0" stroke="#334155" stroke-width="1.4"/><text x="148" y="177.5" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10.5" font-weight="bold" fill="#1E293B">25</text>

