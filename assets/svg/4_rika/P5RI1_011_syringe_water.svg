  <text x="160" y="33" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#0284C7">とじこめた水をおす</text>

  <!-- Push down arrow -->
