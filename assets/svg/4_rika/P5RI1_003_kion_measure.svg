<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250">
  <rect width="600" height="250" rx="14" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="300" y="28" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">気温をはかるときのじょうけん</text>

  <!-- Ground -->
  <rect x="20" y="206" width="560" height="24" rx="6" fill="#BBF7D0"/>
  <line x1="20" y1="206" x2="580" y2="206" stroke="#16A34A" stroke-width="2"/>

  <!-- Left: Sun blocked + Thermometer on stand -->
  <g transform="translate(50, 44)">
    <!-- Sun with red cross / shade -->
    <circle cx="32" cy="24" r="14" fill="#FACC15" stroke="#EAB308" stroke-width="2"/>
    <g stroke="#EAB308" stroke-width="2">
      <line x1="32" y1="2" x2="32" y2="7"/><line x1="32" y1="41" x2="32" y2="46"/>
      <line x1="10" y1="24" x2="15" y2="24"/><line x1="49" y1="24" x2="54" y2="24"/>
      <line x1="16" y1="8" x2="20" y2="12"/><line x1="44" y1="36" x2="48" y2="40"/>
      <line x1="48" y1="8" x2="44" y2="12"/><line x1="20" y1="36" x2="16" y2="40"/>
    </g>
    <!-- Shade screen / board -->
    <path d="M62,36 L88,20 L88,78 L62,94 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
    <!-- Thermometer in shade -->
    <rect x="116" y="42" width="12" height="66" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <rect x="120" y="66" width="4" height="36" fill="#EF4444"/>
    <circle cx="122" cy="100" r="6" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
    <!-- Height arrow -->
    <line x1="154" y1="75" x2="154" y2="160" stroke="#0284C7" stroke-width="2"/>
    <polygon points="154,70 149,80 159,80" fill="#0284C7"/>
    <polygon points="154,162 149,152 159,152" fill="#0284C7"/>
    <rect x="164" y="102" width="84" height="34" rx="8" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="206" y="123" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#0369A1">高さ [④] m</text>
    <!-- Wind breeze lines -->
    <path d="M182,56 Q204,48 226,56 M190,68 Q214,60 236,68" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
    <text x="210" y="45" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" fill="#0369A1">[③] がよい</text>
    <text x="36" y="66" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#B45309">[②] を</text>
    <text x="36" y="81" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#B45309">当てない</text>
  </g>

  <!-- Right: Stevenson Screen (百葉箱) without spoiling its name -->
  <g transform="translate(360, 48)">
    <!-- Legs -->
    <line x1="56" y1="110" x2="50" y2="158" stroke="#64748B" stroke-width="6"/>
    <line x1="134" y1="110" x2="140" y2="158" stroke="#64748B" stroke-width="6"/>
    <line x1="53" y1="138" x2="137" y2="138" stroke="#94A3B8" stroke-width="3"/>
    <!-- White box body -->
    <rect x="44" y="34" width="102" height="78" rx="3" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <!-- Louvers (よろい戸) -->
    <g stroke="#94A3B8" stroke-width="1.5">
      <line x1="52" y1="46" x2="138" y2="46"/>
      <line x1="52" y1="56" x2="138" y2="56"/>
      <line x1="52" y1="66" x2="138" y2="66"/>
      <line x1="52" y1="76" x2="138" y2="76"/>
      <line x1="52" y1="86" x2="138" y2="86"/>
      <line x1="52" y1="96" x2="138" y2="96"/>
    </g>
    <!-- Slanted white roof -->
    <polygon points="34,36 95,12 156,36" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
    <!-- Label [⑤] -->
    <rect x="160" y="56" width="52" height="30" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="186" y="76" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#B45309">[⑤]</text>
    <line x1="146" y1="71" x2="160" y2="71" stroke="#F59E0B" stroke-width="1.8"/>
  </g>
</svg>
