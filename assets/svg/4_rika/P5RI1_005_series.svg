      <rect x="0" y="0" width="74" height="28" rx="4" fill="#10B981" stroke="#065F46" stroke-width="1.6"/>
      <rect x="0" y="0" width="22" height="28" rx="3" fill="#DC2626"/>
      <text x="11" y="19.0" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">＋</text>
      <text x="62" y="19.0" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">－</text>
    </g>
    <g transform="translate(136,104)">
      <rect x="-6" y="8.0" width="7" height="12" rx="1.5" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
      <rect x="0" y="0" width="74" height="28" rx="4" fill="#10B981" stroke="#065F46" stroke-width="1.6"/>
      <rect x="0" y="0" width="22" height="28" rx="3" fill="#DC2626"/>
      <text x="11" y="19.0" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">＋</text>
      <text x="62" y="19.0" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">－</text>
    </g>
    <text x="48" y="96" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#DC2626">＋</text>
    <text x="104" y="96" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#2563EB">－</text>
    <text x="142" y="96" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#DC2626">＋</text>
    <text x="198" y="96" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#2563EB">－</text>
