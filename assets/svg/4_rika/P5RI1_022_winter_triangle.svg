<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 310" width="380" height="310">
  <defs>
    <radialGradient id="winterSky" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </radialGradient>
  </defs>
  <rect width="380" height="310" rx="16" fill="url(#winterSky)" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Orion hunter silhouette on right -->
  <path d="M242,84 C256,66 286,74 294,102 C310,114 334,132 336,166 C336,192 316,214 302,222 L310,256 L278,244 L256,262 L248,220 C236,194 238,162 246,144 L214,124 L232,96 Z"
        fill="#64748B" fill-opacity="0.22" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="1.3"/>
  <!-- Shield arc on far right -->
  <path d="M326,96 C350,122 352,166 332,202" fill="none" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="3"/>

  <!-- Orion constellation lines -->
  <g stroke="#94A3B8" stroke-width="1.4" opacity="0.8">
    <line x1="254" y1="126" x2="306" y2="132"/>
    <line x1="254" y1="126" x2="274" y2="180"/>
    <line x1="306" y1="132" x2="294" y2="176"/>
    <line x1="274" y1="180" x2="284" y2="178"/>
    <line x1="284" y1="178" x2="294" y2="176"/>
    <line x1="274" y1="180" x2="262" y2="236"/>
    <line x1="294" y1="176" x2="314" y2="230"/>
    <line x1="262" y1="236" x2="314" y2="230"/>
    <!-- Club / head -->
    <line x1="254" y1="126" x2="246" y2="76"/>
    <line x1="280" y1="104" x2="254" y2="126"/>
    <line x1="280" y1="104" x2="306" y2="132"/>
  </g>
  <!-- Orion stars -->
  <g fill="#E2E8F0">
    <circle cx="306" cy="132" r="3.5"/><circle cx="274" cy="180" r="3"/><circle cx="284" cy="178" r="3"/>
    <circle cx="294" cy="176" r="3"/><circle cx="262" cy="236" r="3"/><circle cx="314" cy="230" r="4.5" fill="#93C5FD"/>
    <circle cx="280" cy="104" r="2.2"/><circle cx="246" cy="76" r="2.2"/>
  </g>

  <!-- Background stars -->
  <g fill="#CBD5E1" opacity="0.5">
    <circle cx="44" cy="48" r="1.4"/><circle cx="118" cy="40" r="1.6"/><circle cx="188" cy="54" r="1.3"/>
    <circle cx="48" cy="242" r="1.3"/><circle cx="104" cy="276" r="1.4"/><circle cx="212" cy="278" r="1.2"/>
    <circle cx="352" cy="48" r="1.4"/><circle cx="356" cy="264" r="1.2"/>
  </g>

  <!-- Winter Triangle Dashed Lines -->
  <polygon points="64,140 254,126 162,268" fill="#38BDF8" fill-opacity="0.08" stroke="#F8FAFC" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- The 3 Bright 1st-Magnitude Stars -->
  <g>
      <circle cx="64" cy="140" r="18.2" fill="#E0F2FE" opacity="0.28"/>
      <polygon points="64,128.3 67.2,136.8 75.7,140 67.2,143.2 64,151.7 60.8,143.2 52.3,140 60.8,136.8" fill="#FFFFFF"/>
    </g>
  <g>
      <circle cx="254" cy="126" r="19.0" fill="#FB923C" opacity="0.28"/>
      <polygon points="254,113.8 257.4,122.6 266.2,126 257.4,129.4 254,138.2 250.6,129.4 241.8,126 250.6,122.6" fill="#FDBA74"/>
    </g>
  <g>
      <circle cx="162" cy="268" r="21.0" fill="#60A5FA" opacity="0.28"/>
      <polygon points="162,254.5 165.8,264.2 175.5,268 165.8,271.8 162,281.5 158.2,271.8 148.5,268 158.2,264.2" fill="#E0F2FE"/>
    </g>

  <!-- Label inside triangle -->
  <rect x="114" y="162" width="104" height="30" rx="8" fill="#0F172A" fill-opacity="0.82" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="166" y="182" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">冬の大三角</text>
</svg>
