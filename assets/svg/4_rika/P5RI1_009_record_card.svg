<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 310" width="380" height="310">
  <rect width="380" height="310" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  <!-- Card Title tab -->
  <rect x="16" y="14" width="124" height="28" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="78" y="33" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#065F46">月の動き方</text>

  <!-- Date & Name bar -->
  <rect x="16" y="48" width="348" height="30" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="26" y="68" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#0F172A">9月13日 午後6時</text>
  <text x="352" y="68" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#0F172A">平山 こうた</text>

  <!-- Observation drawing area -->
  <rect x="16" y="78" width="348" height="164" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.2"/>
  <!-- Moon in upper sky -->
  <path d="M190,94 A14,14 0 0,1 190,122 Z" fill="#FACC15" stroke="#B45309" stroke-width="1.5"/>
  <!-- School building & trees landmark -->
  <g transform="translate(106, 152)">
    <!-- School building -->
    <rect x="26" y="10" width="116" height="52" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <rect x="22" y="4" width="124" height="8" fill="#CBD5E1" stroke="#475569" stroke-width="1.4"/>
    <!-- Windows -->
    <g fill="#BAE6FD" stroke="#64748B" stroke-width="1">
      <rect x="36" y="18" width="14" height="12"/><rect x="58" y="18" width="14" height="12"/>
      <rect x="82" y="18" width="14" height="12"/><rect x="104" y="18" width="14" height="12"/>
      <rect x="124" y="18" width="12" height="12"/>
      <rect x="36" y="36" width="14" height="12"/><rect x="58" y="36" width="14" height="12"/>
      <rect x="104" y="36" width="14" height="12"/><rect x="124" y="36" width="12" height="12"/>
    </g>
    <rect x="78" y="40" width="20" height="22" fill="#E2E8F0" stroke="#475569" stroke-width="1.2"/>
    <!-- Tree on right -->
    <rect x="158" y="44" width="7" height="18" fill="#92400E"/>
    <circle cx="161" cy="34" r="14" fill="#4ADE80" stroke="#15803D" stroke-width="1.3"/>
    <!-- Small house on far right -->
    <rect x="176" y="42" width="26" height="20" fill="#FEF3C7" stroke="#64748B" stroke-width="1.2"/>
    <polygon points="172,42 189,28 206,42" fill="#F87171" stroke="#991B1B" stroke-width="1.2"/>
    <!-- Ground line -->
    <line x1="-80" y1="62" x2="248" y2="62" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="190" y="234" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">南</text>

  <!-- Memo area at bottom -->
  <rect x="16" y="242" width="348" height="54" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="26" y="264" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#334155">南の空に月が見えた。</text>
  <text x="26" y="286" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#334155">月はどのように動くのだろうか。</text>
</svg>
