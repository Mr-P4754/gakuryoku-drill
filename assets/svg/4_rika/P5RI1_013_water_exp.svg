<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" width="640" height="285">
  <defs>
    <marker id="arrW13" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
    <linearGradient id="hotW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="coldW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="640" height="285" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- CENTER: Normal tube (water right at red mark y=28) -->
  <g transform="translate(260, 12)">
    
      <!-- Test tube -->
      <path d="M48,60 L48,144 A12,12 0 0,0 72,144 L72,60" fill="#BAE6FD" stroke="#475569" stroke-width="2"/>
      <!-- Rubber stopper -->
      <polygon points="47,50 73,50 71,66 49,66" fill="#475569" stroke="#1E293B" stroke-width="1.4"/>
      <!-- Thin glass pipe -->
      <rect x="57" y="4" width="6" height="60" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/>
      <!-- Water column inside glass pipe -->
      <rect x="58" y="28" width="4" height="36" fill="#0284C7"/>
      <!-- Initial mark line -->
      <line x1="51" y1="28" x2="69" y2="28" stroke="#DC2626" stroke-width="2"/>
    
    <!-- Callout labels neatly above curved arrows -->
    <line x1="70" y1="28" x2="94" y2="18" stroke="#DC2626" stroke-width="1.3"/>
    <text x="98" y="16" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#DC2626">はじめの水面の位置に</text>
    <text x="98" y="30" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#DC2626">しるしをつけておく</text>
    <line x1="72" y1="54" x2="94" y2="50" stroke="#475569" stroke-width="1.2"/>
    <text x="98" y="51" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#334155">ゴムせんをつけた</text>
    <text x="98" y="65" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#334155">ガラス管</text>
    <line x1="72" y1="126" x2="92" y2="126" stroke="#0284C7" stroke-width="1.3"/>
    <text x="96" y="131" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#0369A1">水</text>
  </g>

  <!-- Curved Arrows (placed cleanly below top labels) -->
  <path d="M286,96 Q226,98 190,124" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrW13)"/>
  <text x="226" y="92" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#DC2626">あたためる</text>
  <path d="M202,150 Q240,128 286,124" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrW13)"/>
  <text x="246" y="154" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#2563EB">冷やす</text>

  <path d="M358,136 Q408,140 442,160" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrW13)"/>
  <text x="400" y="166" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#2563EB">冷やす</text>
  <path d="M450,128 Q418,104 370,100" fill="none" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrW13)"/>
  <text x="434" y="100" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#DC2626">あたためる</text>

  <!-- LEFT: Hot water beaker (water rises ABOVE red mark: y=12!) -->
  <g transform="translate(56, 68)">
    <path d="M10,74 L10,152 C10,158 16,162 24,162 L96,162 C104,162 110,158 110,152 L110,74" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <ellipse cx="60" cy="74" rx="50" ry="7" fill="none" stroke="#475569" stroke-width="1.8"/>
    <rect x="12" y="92" width="96" height="68" rx="4" fill="url(#hotW2)"/>
    <ellipse cx="60" cy="92" rx="48" ry="6" fill="#FED7AA" stroke="#EA580C" stroke-width="1.2"/>
    
      <!-- Test tube -->
      <path d="M48,60 L48,144 A12,12 0 0,0 72,144 L72,60" fill="#BAE6FD" stroke="#475569" stroke-width="2"/>
      <!-- Rubber stopper -->
      <polygon points="47,50 73,50 71,66 49,66" fill="#475569" stroke="#1E293B" stroke-width="1.4"/>
      <!-- Thin glass pipe -->
      <rect x="57" y="4" width="6" height="60" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/>
      <!-- Water column inside glass pipe -->
      <rect x="58" y="12" width="4" height="52" fill="#0284C7"/>
      <!-- Initial mark line -->
      <line x1="51" y1="28" x2="69" y2="28" stroke="#DC2626" stroke-width="2"/>
    
    <!-- Upward indicator -->
    <text x="82" y="20" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#DC2626">↑上がる</text>
    <line x1="106" y1="130" x2="128" y2="130" stroke="#DC2626" stroke-width="1.4"/>
    <text x="132" y="135" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#C2410C">湯</text>
    <text x="60" y="186" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#334155">温度…[①]</text>
    <text x="60" y="204" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#065F46">水の体積…[②]なる</text>
  </g>

  <!-- RIGHT: Ice water beaker (water drops BELOW red mark: y=44!) -->
  <g transform="translate(454, 68)">
    <path d="M10,74 L10,152 C10,158 16,162 24,162 L96,162 C104,162 110,158 110,152 L110,74" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <ellipse cx="60" cy="74" rx="50" ry="7" fill="none" stroke="#475569" stroke-width="1.8"/>
    <rect x="12" y="92" width="96" height="68" rx="4" fill="url(#coldW2)"/>
    <ellipse cx="60" cy="92" rx="48" ry="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <g fill="#FFFFFF" fill-opacity="0.85" stroke="#0284C7" stroke-width="1">
      <rect x="18" y="100" width="16" height="14" rx="3" transform="rotate(-10 26 107)"/>
      <rect x="82" y="102" width="16" height="14" rx="3" transform="rotate(14 90 109)"/>
      <rect x="24" y="122" width="14" height="12" rx="3" transform="rotate(8 31 128)"/>
      <rect x="80" y="124" width="15" height="13" rx="3" transform="rotate(-12 87 130)"/>
    </g>
    
      <!-- Test tube -->
      <path d="M48,60 L48,144 A12,12 0 0,0 72,144 L72,60" fill="#BAE6FD" stroke="#475569" stroke-width="2"/>
      <!-- Rubber stopper -->
      <polygon points="47,50 73,50 71,66 49,66" fill="#475569" stroke="#1E293B" stroke-width="1.4"/>
      <!-- Thin glass pipe -->
      <rect x="57" y="4" width="6" height="60" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/>
      <!-- Water column inside glass pipe -->
      <rect x="58" y="44" width="4" height="20" fill="#0284C7"/>
      <!-- Initial mark line -->
      <line x1="51" y1="28" x2="69" y2="28" stroke="#DC2626" stroke-width="2"/>
    
    <!-- Downward indicator -->
    <text x="82" y="46" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#2563EB">↓下がる</text>
    <line x1="106" y1="130" x2="128" y2="130" stroke="#0284C7" stroke-width="1.4"/>
    <text x="132" y="135" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#0369A1">氷水</text>
    <text x="60" y="186" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#334155">温度…[③]</text>
    <text x="60" y="204" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#065F46">水の体積…[④]なる</text>
  </g>
</svg>
