<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="420" height="270">
  <defs>
    <linearGradient id="rodHeat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="30%" stop-color="#FB923C"/>
      <stop offset="60%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="plateHeat" cx="15%" cy="80%" r="80%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="32%" stop-color="#FB923C"/>
      <stop offset="62%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <marker id="arrRed19" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="420" height="270" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="210" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">金ぞくのあたたまり方</text>

  <!-- TOP: Metal Rod heated at left end -->
  <g transform="translate(36, 44)">
    <!-- Direction arrow -->
    <line x1="48" y1="12" x2="296" y2="12" stroke="#DC2626" stroke-width="3" marker-end="url(#arrRed19)"/>
    <!-- Metal rod -->
    <rect x="44" y="26" width="268" height="14" rx="7" fill="url(#rodHeat)" stroke="#475569" stroke-width="1.6"/>
    <!-- Flame under left end -->
    <path d="M56,42 C48,54 48,66 56,72 C64,66 64,54 56,42 Z" fill="#F97316"/>
    <path d="M56,50 C52,57 52,64 56,68 C60,64 60,57 56,50 Z" fill="#FEF08A"/>
    <rect x="48" y="72" width="16" height="14" rx="2" fill="#94A3B8" stroke="#475569"/>
  </g>

  <!-- BOTTOM: Metal Plate heated at front-left corner -->
  <g transform="translate(36, 138)">
    <!-- Perspective diamond/parallelogram metal plate -->
    <polygon points="48,66 184,18 320,66 184,114" fill="url(#plateHeat)" stroke="#475569" stroke-width="1.8"/>
    <!-- Concentric heat propagation arcs & arrows from heated corner -->
    <path d="M84,53 Q102,66 84,79" fill="none" stroke="#991B1B" stroke-width="1.4" stroke-dasharray="4,3"/>
    <path d="M126,38 Q154,66 126,94" fill="none" stroke="#C2410C" stroke-width="1.4" stroke-dasharray="4,3"/>
    <path d="M174,22 Q208,66 174,110" fill="none" stroke="#B45309" stroke-width="1.4" stroke-dasharray="4,3"/>
    <!-- Radiating arrows -->
    <line x1="68" y1="60" x2="146" y2="38" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrRed19)"/>
    <line x1="72" y1="66" x2="180" y2="66" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrRed19)"/>
    <line x1="68" y1="72" x2="146" y2="94" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrRed19)"/>
    <!-- Flame under corner -->
    <path d="M56,70 C48,82 48,94 56,100 C64,94 64,82 56,70 Z" fill="#F97316"/>
    <path d="M56,78 C52,85 52,92 56,96 C60,92 60,85 56,78 Z" fill="#FEF08A"/>
    <rect x="48" y="100" width="16" height="14" rx="2" fill="#94A3B8" stroke="#475569"/>
  </g>

  <!-- Label 金ぞく -->
  <line x1="330" y1="78" x2="366" y2="122" stroke="#475569" stroke-width="1.4"/>
  <line x1="316" y1="202" x2="366" y2="142" stroke="#475569" stroke-width="1.4"/>
  <text x="366" y="136" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#0F172A">金ぞく</text>
</svg>
