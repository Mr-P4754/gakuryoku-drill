<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="380" height="260">
  <defs>
    <marker id="arrHotA" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrColdA" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="380" height="260" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="190" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">空気のあたたまり方</text>

  <!-- Clear Convection Box / Room -->
  <rect x="92" y="42" width="186" height="196" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="2.2"/>
  <rect x="98" y="48" width="174" height="184" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>

  <!-- Electric / Oil Heater in bottom-left corner -->
  <g transform="translate(116, 174)">
    <rect x="0" y="42" width="44" height="12" rx="3" fill="#475569"/>
    <rect x="6" y="14" width="32" height="30" rx="4" fill="#E2E8F0" stroke="#334155" stroke-width="1.6"/>
    <!-- Glowing heating coil -->
    <rect x="13" y="22" width="18" height="14" rx="2" fill="#F97316"/>
    <line x1="15" y1="26" x2="29" y2="26" stroke="#FEF08A" stroke-width="2"/>
    <line x1="15" y1="32" x2="29" y2="32" stroke="#FEF08A" stroke-width="2"/>
    <rect x="12" y="8" width="20" height="6" rx="2" fill="#64748B"/>
  </g>

  <!-- Convection Loop Arrows -->
  <path d="M138,168 L138,76 Q138,62 154,62 L218,62" fill="none" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrHotA)"/>
  <path d="M242,72 L242,196 Q242,212 224,212 L176,212" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrColdA)"/>

  <!-- Labels -->
  <text x="46" y="122" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#DC2626">あたたまった</text>
  <text x="46" y="138" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#DC2626">空気（上へ）</text>

  <line x1="278" y1="126" x2="306" y2="122" stroke="#475569" stroke-width="1.5"/>
  <text x="312" y="127" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">空気</text>
  <text x="328" y="152" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#2563EB">冷たい空気</text>
  <text x="328" y="168" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#2563EB">（下へ）</text>
</svg>
