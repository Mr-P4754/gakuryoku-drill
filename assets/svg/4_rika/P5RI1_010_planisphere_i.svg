<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="540" height="240">
  <rect width="540" height="240" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/>
  <!-- Badge イ -->
  <rect x="14" y="14" width="32" height="28" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="30" y="33" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#1D4ED8">イ</text>

  <!-- Left: Student holding planisphere up to starry sky -->
  <g transform="translate(24, 38)">
    <!-- Night sky corner -->
    <path d="M0,0 L168,0 L168,186 L0,186 Z" fill="#F8FAFC" rx="8"/>
    <!-- Sparkly stars above -->
    <g fill="#F59E0B">
      <circle cx="52" cy="18" r="3"/><circle cx="88" cy="12" r="2.2"/><circle cx="128" cy="24" r="2.8"/>
      <circle cx="34" cy="40" r="2"/><circle cx="144" cy="44" r="2"/>
    </g>
    <!-- Student torso & head looking up -->
    <path d="M56,184 L58,128 C58,118 86,118 90,128 L96,184 Z" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1.8"/>
    <!-- Head tilted up-right -->
    <circle cx="68" cy="96" r="20" fill="#FEF3C7" stroke="#78350F" stroke-width="1.8"/>
    <!-- Hair -->
    <path d="M48,96 C46,74 74,70 84,82 C72,78 58,82 54,104 C48,108 42,102 48,96 Z" fill="#1E293B"/>
    <!-- Eye looking up -->
    <circle cx="77" cy="90" r="2.2" fill="#0F172A"/>
    <!-- Arms raised holding planisphere -->
    <path d="M84,126 L122,94 L112,56" fill="none" stroke="#FEF3C7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M84,126 L122,94 L112,56" fill="none" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Planisphere held overhead tilted toward eyes -->
    <ellipse cx="106" cy="54" rx="28" ry="14" fill="#1E3A8A" stroke="#0F172A" stroke-width="2" transform="rotate(-38 106 54)"/>
    <ellipse cx="106" cy="54" rx="20" ry="8" fill="#93C5FD" opacity="0.6" transform="rotate(-38 106 54)"/>
    <text x="84" y="176" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#1E3A8A">上にかざして見る</text>
  </g>

  <!-- Zoom connector -->
  <line x1="154" y1="78" x2="256" y2="34" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="154" y1="106" x2="256" y2="206" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Right: Zoomed Planisphere with 北 at bottom, 西 at left, 東 at right -->
  <g transform="translate(380, 120)">
    <!-- Outer month ring -->
    <circle cx="0" cy="0" r="102" fill="#E2E8F0" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="88" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <!-- Dark cover mask -->
    <circle cx="0" cy="0" r="78" fill="#F8FAFC" stroke="#334155" stroke-width="1.6"/>
    <!-- Oval Star Window -->
    <ellipse cx="0" cy="-8" rx="64" ry="48" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <!-- Star grid lines & dots inside window -->
    <g stroke="#475569" stroke-width="0.8" fill="none">
      <ellipse cx="0" cy="-8" rx="40" ry="30"/>
      <ellipse cx="0" cy="-8" rx="20" ry="15"/>
      <line x1="-64" y1="-8" x2="64" y2="-8"/>
      <line x1="0" y1="-56" x2="0" y2="40"/>
    </g>
    <g fill="#FEF08A">
      <circle cx="-26" cy="-24" r="2.2"/><circle cx="-12" cy="-16" r="1.8"/><circle cx="14" cy="-32" r="2.4"/>
      <circle cx="32" cy="-18" r="2"/><circle cx="20" cy="6" r="2.2"/><circle cx="-30" cy="10" r="1.8"/>
      <circle cx="0" cy="-10" r="2.8"/>
    </g>
    <!-- Direction markings matching PDF page 15 exactly: 西 left, 東 right, 北 at bottom! -->
    <text x="-60" y="34" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#0F172A" transform="rotate(30 -60 34)">西</text>
    <text x="60" y="34" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#0F172A" transform="rotate(-30 60 34)">東</text>
    <!-- Highlighted 北 at bottom -->
    <rect x="-22" y="48" width="44" height="24" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
    <text x="0" y="66" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#B45309">北</text>
    <!-- Small label at top -->
    <text x="0" y="-62" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#475569">星ざ早見</text>
  </g>
</svg>
