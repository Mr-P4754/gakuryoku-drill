    <path d="M168,102 L204,102 L204,144 L168,144 M204,122 L204,42 L138,42" fill="none" stroke="#334155" stroke-width="3"/>
    <circle cx="48" cy="102" r="3.5" fill="#334155"/><circle cx="204" cy="102" r="3.5" fill="#334155"/>
    <!-- Light Bulb (normal brightness) -->
    <g transform="translate(126, 36)">
