      <rect x="-6" y="7.0" width="7" height="12" rx="1.5" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
      <rect x="0" y="0" width="78" height="26" rx="4" fill="#10B981" stroke="#065F46" stroke-width="1.6"/>
      <rect x="0" y="0" width="22" height="26" rx="3" fill="#DC2626"/>
      <text x="11" y="18.0" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">＋</text>
      <text x="66" y="18.0" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">－</text>
