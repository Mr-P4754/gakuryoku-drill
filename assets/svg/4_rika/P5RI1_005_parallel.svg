<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230">
  <rect width="560" height="230" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="280" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">かん電池のつなぎ方 B（[⑥] つなぎ）</text>

  <!-- Left box: Light bulb in parallel -->
  <g transform="translate(18, 40)">
    <rect width="252" height="174" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
