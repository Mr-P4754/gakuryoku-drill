<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
  <defs>
    <marker id="arrB13" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
    <linearGradient id="hotWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="coldWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="640" height="270" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- CENTER: Normal test tube with flat soap film -->
  <g transform="translate(306, 26)">
    <!-- Test tube -->
    <path d="M0,6 L0,104 A14,14 0 0,0 28,104 L28,6" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
    <line x1="-3" y1="6" x2="31" y2="6" stroke="#475569" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Flat soap film -->
    <ellipse cx="14" cy="7" rx="13" ry="3" fill="#A7F3D0" stroke="#059669" stroke-width="1.5"/>
    <!-- Labels -->
    <line x1="26" y1="7" x2="54" y2="7" stroke="#059669" stroke-width="1.3"/>
    <text x="58" y="12" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#065F46">せっけん水のまく</text>
    <line x1="22" y1="42" x2="54" y2="42" stroke="#475569" stroke-width="1.3"/>
    <text x="58" y="47" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#334155">空気</text>
  </g>

  <!-- Curved arrows Center <-> Left (湯) -->
  <path d="M286,70 Q222,74 186,102" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrB13)"/>
  <text x="228" y="68" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#DC2626">あたためる</text>
  <path d="M198,128 Q236,106 286,102" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrB13)"/>
  <text x="248" y="132" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" fill="#2563EB">冷やす</text>

  <!-- Curved arrows Center <-> Right (氷水) -->
  <path d="M354,108 Q404,112 442,134" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB13)"/>
  <text x="396" y="140" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#2563EB">冷やす</text>
  <path d="M454,104 Q422,82 368,78" fill="none" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrB13)"/>
  <text x="434" y="76" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" fill="#DC2626">あたためる</text>

  <!-- LEFT: Hot water beaker + swollen soap bubble -->
  <g transform="translate(56, 74)">
    <!-- Beaker -->
    <path d="M10,54 L10,136 C10,142 16,146 24,146 L96,146 C104,146 110,142 110,136 L110,54" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <ellipse cx="60" cy="54" rx="50" ry="7" fill="none" stroke="#475569" stroke-width="1.8"/>
    <!-- Hot water inside -->
    <rect x="12" y="76" width="96" height="68" rx="4" fill="url(#hotWater)"/>
    <ellipse cx="60" cy="76" rx="48" ry="6" fill="#FED7AA" stroke="#EA580C" stroke-width="1.2"/>
    <!-- Test tube dipped in hot water -->
    <path d="M47,28 L47,128 A13,13 0 0,0 73,128 L73,28" fill="#FFFFFF" fill-opacity="0.85" stroke="#475569" stroke-width="2"/>
    <!-- BULGING soap bubble dome on top! -->
    <path d="M47,28 C47,6 73,6 73,28 Z" fill="#6EE7B7" fill-opacity="0.7" stroke="#059669" stroke-width="2"/>
    <path d="M53,18 Q58,12 63,16" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Hot water label -->
    <line x1="106" y1="112" x2="128" y2="112" stroke="#DC2626" stroke-width="1.4"/>
    <text x="132" y="117" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#C2410C">湯</text>
    <!-- Blanks below -->
    <text x="60" y="168" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#334155">温度…[①]</text>
    <text x="60" y="186" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#065F46">空気の体積…[②]なる</text>
  </g>

  <!-- RIGHT: Ice water beaker + sunken soap film -->
  <g transform="translate(454, 74)">
    <!-- Beaker -->
    <path d="M10,54 L10,136 C10,142 16,146 24,146 L96,146 C104,146 110,142 110,136 L110,54" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <ellipse cx="60" cy="54" rx="50" ry="7" fill="none" stroke="#475569" stroke-width="1.8"/>
    <!-- Ice water inside -->
    <rect x="12" y="76" width="96" height="68" rx="4" fill="url(#coldWater)"/>
    <ellipse cx="60" cy="76" rx="48" ry="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <!-- Ice cubes -->
    <g fill="#FFFFFF" fill-opacity="0.85" stroke="#0284C7" stroke-width="1">
      <rect x="18" y="84" width="16" height="14" rx="3" transform="rotate(-10 26 91)"/>
      <rect x="82" y="86" width="16" height="14" rx="3" transform="rotate(14 90 93)"/>
      <rect x="24" y="106" width="14" height="12" rx="3" transform="rotate(8 31 112)"/>
      <rect x="80" y="108" width="15" height="13" rx="3" transform="rotate(-12 87 114)"/>
    </g>
    <!-- Test tube dipped in ice water -->
    <path d="M47,28 L47,128 A13,13 0 0,0 73,128 L73,28" fill="#FFFFFF" fill-opacity="0.85" stroke="#475569" stroke-width="2"/>
    <!-- SUNKEN soap film inside tube! -->
    <path d="M47,48 Q60,56 73,48" fill="none" stroke="#059669" stroke-width="2.5"/>
    <path d="M47,48 Q60,55 73,48 L73,45 Q60,52 47,45 Z" fill="#6EE7B7" opacity="0.8"/>
    <!-- Ice water label -->
    <line x1="106" y1="112" x2="128" y2="112" stroke="#0284C7" stroke-width="1.4"/>
    <text x="132" y="117" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#0369A1">氷水</text>
    <!-- Blanks below -->
    <text x="60" y="168" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#334155">温度…[③]</text>
    <text x="60" y="186" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#065F46">空気の体積…[④]なる</text>
  </g>
</svg>
