<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250">
  <rect width="460" height="250" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Left: Table & cold PET bottle -->
  <g transform="translate(18, 22)">
    <!-- Table -->
    <polygon points="10,164 190,164 210,192 0,192" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/>
    <rect x="0" y="192" width="210" height="8" fill="#CBD5E1" stroke="#64748B" stroke-width="1.4"/>
    <rect x="16" y="200" width="12" height="24" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <rect x="182" y="200" width="12" height="24" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>

    <!-- Cold PET Bottle -->
    <rect x="97" y="76" width="16" height="10" rx="2" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.2"/>
    <path d="M98,86 L90,104 L90,174 C90,178 94,180 105,180 C116,180 120,178 120,174 L120,104 L112,86 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/>
    <!-- Cold ice water inside -->
    <rect x="92" y="128" width="26" height="48" rx="3" fill="#7DD3FC" opacity="0.8"/>
    <!-- Label -->
    <text x="105" y="34" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#0369A1">冷やしたペットボトル</text>
    <line x1="68" y1="42" x2="96" y2="80" stroke="#0284C7" stroke-width="1.4"/>
  </g>

  <!-- Zoom lines to magnifier circle -->
  <line x1="138" y1="150" x2="294" y2="54" stroke="#64748B" stroke-width="1.4"/>
  <line x1="138" y1="168" x2="306" y2="194" stroke="#64748B" stroke-width="1.4"/>

  <!-- Right: Magnified view showing surface droplets -->
  <circle cx="358" cy="124" r="88" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.2"/>
  <clipPath id="clipPet"><circle cx="358" cy="124" r="86"/></clipPath>
  <g clip-path="url(#clipPet)">
    <!-- Zoomed PET bottle -->
    <rect x="342" y="38" width="32" height="18" rx="4" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
    <path d="M344,56 L324,84 L324,206 L392,206 L392,84 L372,56 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
    <rect x="326" y="138" width="64" height="68" fill="#BAE6FD" opacity="0.75"/>
    <!-- Bottle ribs -->
    <line x1="324" y1="154" x2="392" y2="154" stroke="#93C5FD" stroke-width="1.5"/>
    <line x1="324" y1="176" x2="392" y2="176" stroke="#93C5FD" stroke-width="1.5"/>
    <!-- Droplets on exterior surface! -->
    <ellipse cx="334" cy="94" rx="2.6" ry="3.5" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="352" cy="88" rx="2.1" ry="2.8" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="368" cy="96" rx="2.4" ry="3.2" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="384" cy="92" rx="1.9" ry="2.5" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="342" cy="114" rx="2.8" ry="3.8" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="360" cy="110" rx="2.2" ry="3.0" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="378" cy="116" rx="2.6" ry="3.5" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="330" cy="132" rx="2.2" ry="3.0" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="350" cy="136" rx="3.0" ry="4.0" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="372" cy="134" rx="2.1" ry="2.8" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="386" cy="144" rx="2.6" ry="3.5" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="340" cy="154" rx="2.4" ry="3.2" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="362" cy="158" rx="2.7" ry="3.6" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="380" cy="162" rx="2.1" ry="2.8" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="346" cy="174" rx="2.2" ry="3.0" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/><ellipse cx="368" cy="176" rx="2.5" ry="3.4" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" opacity="0.85"/>
  </g>
  <rect x="314" y="218" width="88" height="24" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="358" y="235" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#065F46">表面の [①]</text>
</svg>
