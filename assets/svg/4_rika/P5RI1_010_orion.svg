<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280">
  <defs>
    <linearGradient id="orionSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="460" height="280" rx="14" fill="url(#orionSky)" stroke="#334155" stroke-width="1.8"/>

  <!-- Background tiny stars -->
  <g fill="#E2E8F0" opacity="0.55">
    <circle cx="42" cy="40" r="1.2"/><circle cx="110" cy="28" r="1.4"/><circle cx="194" cy="48" r="1.2"/>
    <circle cx="268" cy="30" r="1.5"/><circle cx="418" cy="52" r="1.3"/><circle cx="38" cy="222" r="1.2"/>
    <circle cx="242" cy="216" r="1.4"/><circle cx="412" cy="212" r="1.2"/>
  </g>

  <!-- 午後7時: lower-left, tilted counterclockwise (rising in SE) -->
  <g transform="translate(126,162) rotate(-34) scale(1.0)">
      <line x1="-26" y1="-42" x2="22" y2="-34" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="-26" y1="-42" x2="-10" y2="0" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="22" y1="-34" x2="10" y2="-4" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="-10" y1="0" x2="0" y2="-2" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="0" y1="-2" x2="10" y2="-4" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="-10" y1="0" x2="-20" y2="42" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="10" y1="-4" x2="26" y2="38" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="-20" y1="42" x2="26" y2="38" stroke="#93C5FD" stroke-width="1.6"/>
      <circle cx="-26" cy="-42" r="10.8" fill="#FCA5A5" opacity="0.25"/><circle cx="-26" cy="-42" r="4.5" fill="#FCA5A5"/>
      <circle cx="22" cy="-34" r="7.7" fill="#E0F2FE" opacity="0.25"/><circle cx="22" cy="-34" r="3.2" fill="#E0F2FE"/>
      <circle cx="-10" cy="0" r="6.7" fill="#FFFFFF" opacity="0.25"/><circle cx="-10" cy="0" r="2.8" fill="#FFFFFF"/>
      <circle cx="0" cy="-2" r="6.7" fill="#FFFFFF" opacity="0.25"/><circle cx="0" cy="-2" r="2.8" fill="#FFFFFF"/>
      <circle cx="10" cy="-4" r="6.7" fill="#FFFFFF" opacity="0.25"/><circle cx="10" cy="-4" r="2.8" fill="#FFFFFF"/>
      <circle cx="-20" cy="42" r="7.2" fill="#E0F2FE" opacity="0.25"/><circle cx="-20" cy="42" r="3.0" fill="#E0F2FE"/>
      <circle cx="26" cy="38" r="10.8" fill="#93C5FD" opacity="0.25"/><circle cx="26" cy="38" r="4.5" fill="#93C5FD"/>
    </g>
  <rect x="76" y="226" width="100" height="28" rx="8" fill="#0F172A" fill-opacity="0.8" stroke="#60A5FA"/>
  <text x="126" y="245" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">午後7時</text>

  <!-- Big movement arrow -->
  <g transform="translate(226, 134) rotate(-22)">
    <polygon points="-32,-8 12,-8 12,-18 36,0 12,18 12,8 -32,8" fill="#FACC15" stroke="#CA8A04" stroke-width="1.2"/>
  </g>

  <!-- 午後9時: upper-right, more upright (moving toward S/W) -->
  <g transform="translate(342,108) rotate(-6) scale(1.0)">
      <line x1="-26" y1="-42" x2="22" y2="-34" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="-26" y1="-42" x2="-10" y2="0" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="22" y1="-34" x2="10" y2="-4" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="-10" y1="0" x2="0" y2="-2" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="0" y1="-2" x2="10" y2="-4" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="-10" y1="0" x2="-20" y2="42" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="10" y1="-4" x2="26" y2="38" stroke="#93C5FD" stroke-width="1.6"/>
      <line x1="-20" y1="42" x2="26" y2="38" stroke="#93C5FD" stroke-width="1.6"/>
      <circle cx="-26" cy="-42" r="10.8" fill="#FCA5A5" opacity="0.25"/><circle cx="-26" cy="-42" r="4.5" fill="#FCA5A5"/>
      <circle cx="22" cy="-34" r="7.7" fill="#E0F2FE" opacity="0.25"/><circle cx="22" cy="-34" r="3.2" fill="#E0F2FE"/>
      <circle cx="-10" cy="0" r="6.7" fill="#FFFFFF" opacity="0.25"/><circle cx="-10" cy="0" r="2.8" fill="#FFFFFF"/>
      <circle cx="0" cy="-2" r="6.7" fill="#FFFFFF" opacity="0.25"/><circle cx="0" cy="-2" r="2.8" fill="#FFFFFF"/>
      <circle cx="10" cy="-4" r="6.7" fill="#FFFFFF" opacity="0.25"/><circle cx="10" cy="-4" r="2.8" fill="#FFFFFF"/>
      <circle cx="-20" cy="42" r="7.2" fill="#E0F2FE" opacity="0.25"/><circle cx="-20" cy="42" r="3.0" fill="#E0F2FE"/>
      <circle cx="26" cy="38" r="10.8" fill="#93C5FD" opacity="0.25"/><circle cx="26" cy="38" r="4.5" fill="#93C5FD"/>
    </g>
  <rect x="292" y="176" width="100" height="28" rx="8" fill="#0F172A" fill-opacity="0.8" stroke="#60A5FA"/>
  <text x="342" y="195" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">午後9時</text>

  <!-- Horizon reference -->
  <text x="24" y="266" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#CBD5E1">← 東の方（南東）</text>
  <text x="436" y="266" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#CBD5E1">西の方（南） →</text>
</svg>
