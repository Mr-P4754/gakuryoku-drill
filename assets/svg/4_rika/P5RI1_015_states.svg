<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330">
  <defs>
    <marker id="arrRed15" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrBlue15" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrBlk15" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="640" height="330" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- TOP: State Change Diagram -->
  <g transform="translate(24, 16)">
    <!-- Box: 氷 -->
    <rect x="46" y="18" width="66" height="34" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="79" y="41" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#0369A1">氷</text>
    <text x="79" y="74" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#065F46">([②])体</text>

    <!-- Arrows 氷 <-> 水 -->
    <line x1="126" y1="28" x2="254" y2="28" stroke="#DC2626" stroke-width="2.4" marker-end="url(#arrRed15)"/>
    <text x="192" y="20" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#DC2626">あたためる。</text>
    <line x1="258" y1="44" x2="130" y2="44" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrBlue15)"/>
    <text x="192" y="64" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1D4ED8">([③])。</text>

    <!-- Box: 水 -->
    <rect x="270" y="18" width="66" height="34" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="303" y="41" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#1E40AF">水</text>
    <text x="303" y="74" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#334155">えき体</text>

    <!-- Arrows 水 <-> 水じょう気 -->
    <line x1="350" y1="28" x2="466" y2="28" stroke="#DC2626" stroke-width="2.4" marker-end="url(#arrRed15)"/>
    <text x="410" y="20" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#DC2626">([①])。</text>
    <line x1="470" y1="44" x2="354" y2="44" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrBlue15)"/>
    <text x="410" y="64" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1D4ED8">冷やす。</text>

    <!-- Box: 水じょう気 -->
    <rect x="480" y="18" width="102" height="34" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
    <text x="531" y="41" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#B91C1C">水じょう気</text>
    <text x="531" y="74" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#065F46">([④])体</text>
  </g>

  <!-- BOTTOM: Heating Curve Graph (0℃ & 100℃ plateaus) -->
  <g transform="translate(68, 118)">
    <rect x="0" y="14" width="538" height="178" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.8"/>
    <text x="-8" y="10" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#334155">温度</text>

    <!-- 100℃ dashed line -->
    <line x1="0" y1="46" x2="310" y2="46" stroke="#EF4444" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="-8" y="51" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#DC2626">100℃</text>

    <!-- 0℃ dashed line -->
    <line x1="0" y1="146" x2="62" y2="146" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="-8" y="151" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#2563EB">0℃</text>

    <!-- Heating Curve: Ice rises to 0℃ -> flat -> Water rises to 100℃ -> flat -> Steam rises -->
    <polyline points="0,178 48,146 160,146 306,46 418,46 456,14" fill="none" stroke="#0F172A" stroke-width="3.2" stroke-linejoin="round"/>

    <!-- State badges along curve -->
    <rect x="18" y="160" width="28" height="22" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <text x="32" y="176" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#0369A1">氷</text>

    <rect x="206" y="72" width="28" height="22" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
    <text x="220" y="88" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E40AF">水</text>

    <rect x="444" y="26" width="84" height="24" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
    <text x="486" y="43" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#B91C1C">水じょう気</text>

    <!-- Annotation for 0℃ plateau (⑤) -->
    <line x1="118" y1="114" x2="106" y2="138" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrBlk15)"/>
    <text x="20" y="96" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#1E40AF">水は ([⑤])℃で</text>
    <text x="20" y="114" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#1E40AF">こおる。</text>

    <!-- Annotation for 100℃ plateau (⑥) -->
    <line x1="390" y1="100" x2="360" y2="54" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrBlk15)"/>
    <text x="352" y="122" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#B91C1C">水は ([⑥])℃で</text>
    <text x="352" y="140" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#B91C1C">ふっとうする。</text>
  </g>
</svg>
