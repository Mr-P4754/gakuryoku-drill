<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <rect width="360" height="300" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Hand palm pointing upper-right (-45 deg) -->
  <g transform="translate(154, 162) rotate(-45)">
    <!-- Palm & Wrist -->
    <path d="M-92,-34 L-40,-46 C-10,-54 36,-54 74,-44 L138,-36 C148,-34 150,-22 140,-18 L92,-16 L152,-12 C164,-10 164,4 152,6 L94,6 L146,12 C156,14 156,27 144,28 L88,26 L128,34 C138,37 136,49 124,49 L44,50 C8,56 -28,54 -56,42 L-92,36 Z"
          fill="#FEF3C7" stroke="#92400E" stroke-width="2" stroke-linejoin="round"/>
    <!-- Finger crease lines -->
    <path d="M84,-16 L54,-14 M88,6 L56,6 M84,26 L56,24" stroke="#D97706" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Direction arrow from fingertips to Moon -->
  <line x1="254" y1="62" x2="292" y2="24" stroke="#1E293B" stroke-width="4"/>
  <polygon points="300,16 282,22 294,34" fill="#1E293B"/>
  <!-- Moon icon & label -->
  <path d="M318,14 A12,12 0 0,1 318,38 Z" fill="#FACC15" stroke="#B45309" stroke-width="1.5"/>
  <text x="336" y="32" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#0F172A">月</text>

  <!-- Dashed sight line from compass center toward Moon (along 南西) -->
  <line x1="154" y1="174" x2="250" y2="66" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- Compass body -->
  <circle cx="154" cy="174" r="74" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
  <circle cx="154" cy="174" r="68" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="154" cy="174" r="38" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <line x1="154.0" y1="112.0" x2="154.0" y2="106.0" stroke="#475569" stroke-width="2"/><text x="154.0" y="126.0" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">南</text><line x1="199.3" y1="128.7" x2="202.1" y2="125.9" stroke="#475569" stroke-width="1.2"/><text x="190.8" y="141.2" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10.5" font-weight="bold" fill="#059669">南西</text><line x1="216.0" y1="174.0" x2="222.0" y2="174.0" stroke="#475569" stroke-width="2"/><text x="206.0" y="178.0" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">西</text><line x1="199.3" y1="219.3" x2="202.1" y2="222.1" stroke="#475569" stroke-width="1.2"/><text x="190.8" y="214.8" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10.5" font-weight="normal" fill="#1E293B">北西</text><line x1="154.0" y1="236.0" x2="154.0" y2="242.0" stroke="#475569" stroke-width="2"/><text x="154.0" y="230.0" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#DC2626">北</text><line x1="108.7" y1="219.3" x2="105.9" y2="222.1" stroke="#475569" stroke-width="1.2"/><text x="117.2" y="214.8" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10.5" font-weight="normal" fill="#1E293B">北東</text><line x1="92.0" y1="174.0" x2="86.0" y2="174.0" stroke="#475569" stroke-width="2"/><text x="102.0" y="178.0" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">東</text><line x1="108.7" y1="128.7" x2="105.9" y2="125.9" stroke="#475569" stroke-width="1.2"/><text x="117.2" y="141.2" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10.5" font-weight="normal" fill="#1E293B">南東</text>

  <!-- Magnetic Needle: Colored (RED) half pointing DOWN to 北 (6 o'clock), White half pointing UP to 南 -->
  <polygon points="154,208 147,174 161,174" fill="#DC2626" stroke="#7F1D1D" stroke-width="1"/>
  <polygon points="154,140 147,174 161,174" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <circle cx="154" cy="174" r="4.5" fill="#334155"/>

  <text x="180" y="286" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" fill="#475569">色のついたはり（赤）を「北」に合わせる</text>
</svg>
