<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-label="米づくりの1年（春・夏・秋・冬）の作業の流れ図">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="880" height="390" fill="#FFFFFF"/>
  <rect x="12" y="12" width="856" height="366" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="440" y="44" text-anchor="middle" font-size="19" font-weight="700" fill="#78350F">米づくりの１年と主な作業</text>

  <!-- Step 1: 春 -->
  <g transform="translate(30, 68)">
    <rect x="0" y="0" width="186" height="248" rx="12" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <rect x="0" y="0" width="186" height="38" rx="12" fill="#FCE7F3"/>
    <rect x="0" y="24" width="186" height="14" fill="#FCE7F3"/>
    <text x="93" y="26" text-anchor="middle" font-size="16" font-weight="800" fill="#9D174D">春（4〜5月）</text>
    <!-- Tractor & paddy icon -->
    <rect x="20" y="54" width="146" height="72" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
    <rect x="26" y="100" width="134" height="20" rx="4" fill="#BAE6FD"/>
    <rect x="58" y="72" width="38" height="22" rx="4" fill="#EF4444" stroke="#991B1B" stroke-width="1.3"/>
    <rect x="74" y="60" width="18" height="14" rx="2" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.2"/>
    <circle cx="66" cy="96" r="10" fill="#334155"/><circle cx="66" cy="96" r="4" fill="#CBD5E1"/>
    <circle cx="92" cy="98" r="7" fill="#334155"/><circle cx="92" cy="98" r="3" fill="#CBD5E1"/>
    <!-- Little green seedlings -->
    <path d="M 118,108 L 114,98 M 118,108 L 122,98 M 136,108 L 132,98 M 136,108 L 140,98" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
    <text x="14" y="152" font-size="13.5" font-weight="700" fill="#0F172A">① 肥料をまく</text>
    <text x="14" y="176" font-size="14" font-weight="800" fill="#BE185D">② 田おこし</text>
    <text x="14" y="200" font-size="13.5" font-weight="700" fill="#0F172A">③ 水を入れて耕す</text>
    <text x="14" y="224" font-size="13.5" font-weight="700" fill="#0F172A">④ 田植え（なえを植える）</text>
  </g>

  <!-- Arrow 1->2 -->
  <polygon points="222,184 236,184 236,176 250,192 236,208 236,200 222,200" fill="#F59E0B"/>

  <!-- Step 2: 夏 -->
  <g transform="translate(256, 68)">
    <rect x="0" y="0" width="186" height="248" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <rect x="0" y="0" width="186" height="38" rx="12" fill="#DCFCE7"/>
    <rect x="0" y="24" width="186" height="14" fill="#DCFCE7"/>
    <text x="93" y="26" text-anchor="middle" font-size="16" font-weight="800" fill="#166534">夏（6〜8月）</text>
    <!-- Lush green rice & sun -->
    <rect x="20" y="54" width="146" height="72" rx="8" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="144" cy="72" r="11" fill="#FACC15" stroke="#EA580C" stroke-width="1.3"/>
    <rect x="20" y="102" width="146" height="24" rx="4" fill="#86EFAC"/>
    <g stroke="#15803D" stroke-width="2.2" stroke-linecap="round">
      <path d="M 42,114 Q 38,88 46,78 M 46,114 Q 52,88 58,82"/>
      <path d="M 78,114 Q 74,88 82,78 M 82,114 Q 88,88 94,82"/>
      <path d="M 114,114 Q 110,88 118,78 M 118,114 Q 124,88 130,82"/>
    </g>
    <text x="14" y="152" font-size="13.5" font-weight="700" fill="#0F172A">① 稲の生長を調べる</text>
    <text x="14" y="176" font-size="13.5" font-weight="700" fill="#0F172A">② 水の管理・草とり</text>
    <text x="14" y="202" font-size="14" font-weight="800" fill="#15803D">③ 農薬をまく</text>
    <text x="20" y="224" font-size="12" fill="#475569">（病気や害虫から守る）</text>
  </g>

  <!-- Arrow 2->3 -->
  <polygon points="448,184 462,184 462,176 476,192 462,208 462,200 448,200" fill="#F59E0B"/>

  <!-- Step 3: 秋 -->
  <g transform="translate(482, 68)">
    <rect x="0" y="0" width="186" height="248" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
    <rect x="0" y="0" width="186" height="38" rx="12" fill="#FFEDD5"/>
    <rect x="0" y="24" width="186" height="14" fill="#FFEDD5"/>
    <text x="93" y="26" text-anchor="middle" font-size="16" font-weight="800" fill="#9A3412">秋（9〜10月）</text>
    <!-- Golden rice ears & combine -->
    <rect x="20" y="54" width="146" height="72" rx="8" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
    <g stroke="#B45309" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M 42,118 Q 42,84 56,74"/>
      <path d="M 64,118 Q 64,84 78,74"/>
      <path d="M 86,118 Q 86,84 100,74"/>
    </g>
    <g fill="#EAB308" stroke="#A16207" stroke-width="0.9">
      <ellipse cx="58" cy="78" rx="7" ry="4" transform="rotate(25 58 78)"/>
      <ellipse cx="80" cy="78" rx="7" ry="4" transform="rotate(25 80 78)"/>
      <ellipse cx="102" cy="78" rx="7" ry="4" transform="rotate(25 102 78)"/>
    </g>
    <!-- Rice sack -->
    <rect x="120" y="84" width="34" height="36" rx="6" fill="#FDE68A" stroke="#92400E" stroke-width="1.4"/>
    <text x="137" y="108" text-anchor="middle" font-size="13" font-weight="800" fill="#92400E">米</text>
    <text x="14" y="152" font-size="13.5" font-weight="700" fill="#0F172A">① 実った稲をかる</text>
    <text x="14" y="178" font-size="14" font-weight="800" fill="#C2410C">② だっこくする</text>
    <text x="20" y="200" font-size="12" fill="#475569">（ほからもみを外す）</text>
    <text x="14" y="224" font-size="12.5" font-weight="700" fill="#1E293B">※機械（コンバイン等）</text>
  </g>

  <!-- Arrow 3->4 -->
  <polygon points="674,184 688,184 688,176 702,192 688,208 688,200 674,200" fill="#F59E0B"/>

  <!-- Step 4: 冬・消費の変化 -->
  <g transform="translate(708, 68)">
    <rect x="0" y="0" width="144" height="248" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="0" y="0" width="144" height="38" rx="12" fill="#DBEAFE"/>
    <rect x="0" y="24" width="144" height="14" fill="#DBEAFE"/>
    <text x="72" y="26" text-anchor="middle" font-size="15.5" font-weight="800" fill="#1E40AF">冬・まとめ</text>
    <text x="12" y="72" font-size="13" font-weight="700" fill="#0F172A">● 冬の作業</text>
    <text x="16" y="94" font-size="12" fill="#334155">・土づくり</text>
    <text x="16" y="114" font-size="12" fill="#334155">・機械の手入れ</text>
    <line x1="12" y1="132" x2="132" y2="132" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="12" y="156" font-size="13" font-weight="700" fill="#1E40AF">● 主な産地</text>
    <text x="16" y="178" font-size="12.5" font-weight="700" fill="#B91C1C">1位 新潟県</text>
    <text x="16" y="198" font-size="12.5" font-weight="700" fill="#B91C1C">2位 北海道</text>
    <text x="16" y="218" font-size="11.5" fill="#334155">東北・関東・中部</text>
    <text x="16" y="234" font-size="11.5" fill="#334155">の日本海側が盛ん</text>
  </g>

  <!-- Bottom ribbon -->
  <rect x="30" y="330" width="822" height="34" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.4"/>
  <text x="441" y="352" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400E">米の消費量は少しずつ「減って」いるため，国は1960年代から「米の生産量を減らす」方針をとってきました。</text>
</svg>
