<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-label="森林の働き・保全（ナショナルトラスト・白神山地）・林業の作業・防災工事（砂防ダム・ひなんタワー）のまとめ図">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="940" height="460" fill="#FFFFFF"/>
  <rect x="12" y="12" width="916" height="436" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="470" y="44" text-anchor="middle" font-size="19" font-weight="700" fill="#14532D">自然環境と国民生活（森林の働き・林業・防災）</text>

  <!-- Panel 1: 森林の働きと保全 (Left) -->
  <g transform="translate(26, 62)">
    <rect x="0" y="0" width="286" height="368" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8"/>
    <rect x="0" y="0" width="286" height="34" rx="12" fill="#16A34A"/>
    <rect x="0" y="20" width="286" height="14" fill="#16A34A"/>
    <text x="143" y="23" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">① 森林の働きと保全</text>

    <!-- Lush Forest illustration -->
    <rect x="14" y="44" width="258" height="114" rx="8" fill="#E0F2FE"/>
    <path d="M 14,132 Q 90,94 176,118 Q 226,102 272,126 L 272,158 L 14,158 Z" fill="#86EFAC"/>
    <!-- Trees -->
    <g>
      <rect x="46" y="106" width="8" height="24" fill="#78350F"/><circle cx="50" cy="96" r="18" fill="#15803D"/>
      <rect x="92" y="96" width="8" height="28" fill="#78350F"/><circle cx="96" cy="84" r="20" fill="#16A34A"/>
      <rect x="140" y="102" width="8" height="26" fill="#78350F"/><circle cx="144" cy="90" r="18" fill="#22C55E"/>
      <rect x="206" y="102" width="8" height="26" fill="#78350F"/><polygon points="210,66 190,108 230,108" fill="#15803D"/>
    </g>
    <!-- Water & O2 badges -->
    <rect x="18" y="50" width="134" height="22" rx="11" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.3"/>
    <text x="85" y="65" text-anchor="middle" font-size="11" font-weight="800" fill="#0369A1">酸素→空気をきれいに</text>
    <rect x="134" y="132" width="132" height="22" rx="11" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.3"/>
    <text x="200" y="147" text-anchor="middle" font-size="11" font-weight="800" fill="#0369A1">水をたくわえて流す</text>

    <text x="16" y="182" font-size="13" font-weight="800" fill="#14532D">● 森林の大切な働き</text>
    <text x="22" y="202" font-size="12" fill="#1E293B">・<tspan font-weight="700" fill="#0369A1">水</tspan>をたくわえる ・<tspan font-weight="700" fill="#0369A1">空気</tspan>をきれいに</text>
    <text x="22" y="220" font-size="12" fill="#1E293B">・災害を防ぐ ・動物のすみか</text>
    <text x="22" y="238" font-size="12" fill="#1E293B">・木材（例：世界最古の木造建築 <tspan font-weight="700" fill="#92400E">法隆寺</tspan>）</text>

    <line x1="16" y1="252" x2="270" y2="252" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="16" y="274" font-size="13" font-weight="800" fill="#14532D">● 自然を守る取り組み</text>
    <text x="22" y="294" font-size="12" fill="#1E293B">・トトロの森：<tspan font-weight="700" fill="#15803D">保全</tspan>活動</text>
    <text x="22" y="314" font-size="12" fill="#1E293B">・<tspan font-weight="700" fill="#15803D">ナショナルトラスト</tspan>運動</text>
    <text x="22" y="334" font-size="12" fill="#1E293B">・世界自然遺産：<tspan font-weight="700" fill="#15803D">白神山地</tspan>（ぶな林）</text>
    <text x="22" y="354" font-size="12" fill="#1E293B">・公害からの再生：<tspan font-weight="700" fill="#0369A1">水俣市</tspan></text>
  </g>

  <!-- Panel 2: 林業の作業 (Middle) -->
  <g transform="translate(326, 62)">
    <rect x="0" y="0" width="286" height="368" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
    <rect x="0" y="0" width="286" height="34" rx="12" fill="#D97706"/>
    <rect x="0" y="20" width="286" height="14" fill="#D97706"/>
    <text x="143" y="23" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">② 木を育てる「林業」の作業</text>

    <!-- 6 vertical steps flowchart -->
    <g transform="translate(26, 48)">
      <rect x="0" y="0" width="234" height="34" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
      <text x="117" y="22" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350F">1. なえ木を育てる</text>
      <polygon points="112,37 122,37 117,44" fill="#D97706"/>

      <rect x="0" y="46" width="234" height="34" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.8"/>
      <text x="117" y="68" text-anchor="middle" font-size="14" font-weight="800" fill="#C2410C">2. 植林（なえ木を植える）</text>
      <polygon points="112,83 122,83 117,90" fill="#D97706"/>

      <rect x="0" y="92" width="234" height="34" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
      <text x="117" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350F">3. 下草がり</text>
      <polygon points="112,129 122,129 117,136" fill="#D97706"/>

      <rect x="0" y="138" width="234" height="34" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.8"/>
      <text x="117" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#C2410C">4. えだ打ち（余分な枝を切る）</text>
      <polygon points="112,175 122,175 117,182" fill="#D97706"/>

      <rect x="0" y="184" width="234" height="34" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
      <text x="117" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350F">5. 間ばつ（日光を当てる）</text>
      <polygon points="112,221 122,221 117,228" fill="#D97706"/>

      <rect x="0" y="230" width="234" height="34" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
      <text x="117" y="252" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532D">6. 切り出し・はん出</text>
    </g>

    <rect x="16" y="320" width="254" height="38" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
    <text x="143" y="337" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">課題：林業で働く人が「減って」おり，</text>
    <text x="143" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">手入れ不足で山林があれ始めている。</text>
  </g>

  <!-- Panel 3: 自然災害と防災設備 (Right) -->
  <g transform="translate(626, 62)">
    <rect x="0" y="0" width="286" height="368" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
    <rect x="0" y="0" width="286" height="34" rx="12" fill="#2563EB"/>
    <rect x="0" y="20" width="286" height="14" fill="#2563EB"/>
    <text x="143" y="23" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">③ 災害を防ぐ防災工事</text>

    <!-- Top illustration: 砂防ダム (Sabo Dam) -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="258" height="132" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
      <text x="129" y="20" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1E40AF">砂防ダム（土石流を防ぐ）</text>
      <!-- Mountain slope + debris + concrete dam -->
      <path d="M 0,44 L 84,82 L 258,124 L 258,132 L 0,132 Z" fill="#84CC16"/>
      <!-- Mud/rocks stopped behind dam -->
      <path d="M 10,50 Q 64,68 118,86 L 118,108 L 10,82 Z" fill="#92400E" opacity="0.8"/>
      <circle cx="48" cy="70" r="6" fill="#78716C"/><circle cx="76" cy="78" r="7" fill="#57534E"/>
      <circle cx="96" cy="86" r="5" fill="#78716C"/>
      <!-- Concrete Sabo Dam wall -->
      <polygon points="116,64 134,64 142,118 112,112" fill="#CBD5E1" stroke="#334155" stroke-width="1.8"/>
      <!-- Water flowing safely over notch -->
      <path d="M 122,74 Q 146,84 156,118 L 246,126" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
      <!-- House safely downstream -->
      <rect x="206" y="96" width="24" height="18" fill="#FEF3C7" stroke="#92400E" stroke-width="1.2"/>
      <polygon points="202,96 218,84 234,96" fill="#EF4444"/>
      <rect x="10" y="101" width="128" height="20" rx="6" fill="#1E293B" fill-opacity="0.8"/>
      <text x="74" y="115" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">岩や土砂をせき止める</text>
    </g>

    <!-- Bottom illustration: ひなんタワー (Tsunami Evacuation Tower) -->
    <g transform="translate(14, 190)">
      <rect x="0" y="0" width="258" height="132" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
      <text x="129" y="20" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1E40AF">ひなんタワー（津波・高波に備える）</text>
      <!-- Ground & approaching tsunami wave -->
      <rect x="0" y="108" width="258" height="24" fill="#D6D3D1"/>
      <path d="M 0,68 Q 40,54 68,84 Q 90,104 126,108 L 0,108 Z" fill="#0284C7" opacity="0.85"/>
      <path d="M 12,72 Q 36,64 56,82" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="34" y="98" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">津波・高波</text>
      <!-- Tall Evacuation Tower -->
      <g transform="translate(154, 34)">
        <!-- Pillars -->
        <line x1="10" y1="24" x2="10" y2="74" stroke="#475569" stroke-width="4"/>
        <line x1="68" y1="24" x2="68" y2="74" stroke="#475569" stroke-width="4"/>
        <line x1="10" y1="48" x2="68" y2="74" stroke="#94A3B8" stroke-width="2"/>
        <line x1="68" y1="48" x2="10" y2="74" stroke="#94A3B8" stroke-width="2"/>
        <!-- Stairs -->
        <line x1="10" y1="74" x2="68" y2="24" stroke="#F59E0B" stroke-width="3.5"/>
        <!-- Top safe platform -->
        <rect x="0" y="16" width="78" height="12" rx="2" fill="#22C55E" stroke="#14532D" stroke-width="1.5"/>
        <line x1="2" y1="6" x2="2" y2="16" stroke="#14532D" stroke-width="1.5"/>
        <line x1="76" y1="6" x2="76" y2="16" stroke="#14532D" stroke-width="1.5"/>
        <line x1="2" y1="8" x2="76" y2="8" stroke="#14532D" stroke-width="1.5"/>
        <!-- Safe people on top -->
        <circle cx="28" cy="4" r="3.5" fill="#1E293B"/><rect x="25" y="8" width="6" height="8" fill="#EF4444"/>
        <circle cx="48" cy="4" r="3.5" fill="#1E293B"/><rect x="45" y="8" width="6" height="8" fill="#2563EB"/>
      </g>
    </g>

    <text x="143" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">ひなん場所・経路の確認や防災訓練も大切！</text>
  </g>
</svg>
