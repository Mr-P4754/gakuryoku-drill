  <!-- Right side key points card -->
  <g transform="translate(576, 66)">
    <rect x="0" y="0" width="314" height="450" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
    <rect x="0" y="0" width="314" height="38" rx="12" fill="#1E40AF"/>
    <rect x="0" y="24" width="314" height="14" fill="#1E40AF"/>
    <text x="157" y="26" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">工業がさかんな地域の特色</text>

    <text x="18" y="68" font-size="14" font-weight="800" fill="#991B1B">① 京浜工業地帯</text>
    <text x="26" y="88" font-size="12.5" fill="#334155">東京都・神奈川県にまたがる。</text>

    <text x="18" y="120" font-size="14" font-weight="800" fill="#92400E">② 中京工業地帯</text>
    <text x="26" y="140" font-size="12.5" fill="#334155">愛知県を中心に自動車など機械類が</text>
    <text x="26" y="158" font-size="12.5" fill="#334155">68.1%とトップ（工業生産額 日本一）。</text>

    <text x="18" y="190" font-size="14" font-weight="800" fill="#1E40AF">③ 阪神工業地帯</text>
    <text x="26" y="210" font-size="12.5" fill="#334155">大阪府・兵庫県にまたがる。</text>

    <text x="18" y="242" font-size="14" font-weight="800" fill="#065F46">④ 瀬戸内工業地域</text>
    <text x="26" y="262" font-size="12.5" fill="#334155">岡山・広島・香川県などにまたがる。</text>

    <line x1="18" y1="286" x2="296" y2="286" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="18" y="314" font-size="14.5" font-weight="800" fill="#0F172A">海沿いに集まる理由</text>
    <text x="18" y="340" font-size="13" fill="#1E293B">近くに港があり，外国から</text>
    <text x="18" y="362" font-size="13" font-weight="700" fill="#B91C1C">・原材料や燃料を「輸入」</text>
    <text x="18" y="384" font-size="13" font-weight="700" fill="#1D4ED8">・つくった製品を「輸出」</text>
    <text x="18" y="406" font-size="13" fill="#1E293B">するのにとても便利なため！</text>
  </g>
