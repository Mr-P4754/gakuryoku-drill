<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-label="地図1 世界地図（Aの大陸）、図（国の旗）、地図2 日本とまわりの国々（B・C・択捉島・沖ノ鳥島）">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="980" height="430" fill="#FFFFFF"/>

  <!-- Panel 1: 地図1 世界地図 -->
  <rect x="14" y="14" width="474" height="402" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="30" y="42" font-size="17" font-weight="700" fill="#0F172A">地図１　世界の大陸と海</text>

  <g transform="translate(26, 62)">
    <rect x="0" y="0" width="450" height="248" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Subtle lat/lon grid -->
    <line x1="0" y1="124" x2="450" y2="124" stroke="#7DD3FC" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="225" y1="0" x2="225" y2="248" stroke="#BAE6FD" stroke-width="1"/>
    
    <!-- Eurasia -->
    <path d="M 30,52 L 58,38 L 95,30 L 145,26 L 195,32 L 232,44 L 222,60 L 204,72 L 194,92 L 184,96 L 176,112 L 166,118 L 156,104 L 144,122 L 134,116 L 122,102 L 106,108 L 94,96 L 80,104 L 68,88 L 46,90 L 34,76 Z" fill="#BBF7D0" stroke="#334155" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Japan on world map -->
    <path d="M 206,72 Q 214,82 208,95 Q 202,99 196,101" fill="none" stroke="#DC2626" stroke-width="3.2" stroke-linecap="round"/>
    <!-- UK & SE Asia islands -->
    <ellipse cx="32" cy="64" rx="4" ry="6" fill="#BBF7D0" stroke="#334155" stroke-width="1"/>
    <path d="M 164,132 L 182,138 L 196,136 L 202,144 L 176,144 Z" fill="#BBF7D0" stroke="#334155" stroke-width="1"/>
    <!-- Africa -->
    <path d="M 40,98 L 68,94 L 90,104 L 100,122 L 94,138 L 84,166 L 70,180 L 60,174 L 54,148 L 40,134 L 32,116 Z" fill="#FEF08A" stroke="#334155" stroke-width="1.3" stroke-linejoin="round"/>
    <ellipse cx="96" cy="166" rx="4" ry="9" fill="#FEF08A" stroke="#334155" stroke-width="1"/>
    <!-- Australia (A) -->
    <path d="M 186,158 L 210,152 L 230,164 L 232,184 L 216,194 L 192,188 L 182,174 Z" fill="#FDBA74" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 244,192 L 252,184 L 254,198 L 246,204 Z" fill="#FDBA74" stroke="#334155" stroke-width="1"/>
    <!-- North America -->
    <path d="M 264,34 L 304,28 L 354,32 L 386,46 L 374,64 L 358,76 L 348,96 L 336,112 L 344,124 L 332,126 L 316,110 L 302,90 L 292,70 L 272,56 Z" fill="#DDD6FE" stroke="#334155" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Greenland -->
    <path d="M 384,18 L 414,16 L 418,36 L 394,42 Z" fill="#DDD6FE" stroke="#334155" stroke-width="1.1"/>
    <!-- South America -->
    <path d="M 342,126 L 368,124 L 394,142 L 390,166 L 372,190 L 360,210 L 350,206 L 346,174 L 336,148 Z" fill="#FBCFE8" stroke="#334155" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Antarctica -->
    <path d="M 55,226 Q 150,214 240,220 Q 330,214 410,226 L 410,236 L 55,236 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="1.1"/>

    <!-- Labels (NO spoiler for A or 太平洋) -->
    <text x="128" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#14532D">ユーラシア大陸</text>
    <text x="220" y="88" font-size="12" font-weight="700" fill="#DC2626">日本</text>
    <circle cx="209" cy="173" r="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.2"/>
    <text x="209" y="179" text-anchor="middle" font-size="16" font-weight="800" fill="#C2410C">A</text>
    <!-- Compass -->
    <g transform="translate(414, 214)">
      <circle cx="0" cy="0" r="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#64748B" stroke-width="1.3"/>
      <line x1="0" y1="13" x2="0" y2="-13" stroke="#0F172A" stroke-width="1.8"/>
      <line x1="-13" y1="0" x2="13" y2="0" stroke="#0F172A" stroke-width="1.4"/>
      <polygon points="0,-16 4,-7 -4,-7" fill="#DC2626"/>
      <text x="0" y="-18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#DC2626">北</text>
      <text x="17" y="3.5" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A">東</text>
      <text x="-17" y="3.5" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A">西</text>
      <text x="0" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A">南</text>
    </g>
  </g>
  <rect x="26" y="324" width="450" height="76" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="42" y="348" font-size="13" font-weight="700" fill="#1E3A8A">地図１の見方</text>
  <text x="42" y="369" font-size="12.5" fill="#1E293B">・赤い線が日本。日本から見た方角（北・南・東・西）をたしかめよう。</text>
  <text x="42" y="388" font-size="12.5" fill="#1E293B">・日本の西にユーラシア大陸，日本の南に <tspan font-weight="700" fill="#C2410C">A</tspan> の大陸があるよ。</text>

  <!-- Panel 2: 図 (Flag) -->
  <rect x="500" y="14" width="182" height="196" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="516" y="42" font-size="17" font-weight="700" fill="#0F172A">図</text>
  <text x="546" y="42" font-size="12.5" fill="#475569">（地図２の B）</text>
    <g id="kr-flag">
      <rect x="515" y="76" width="152" height="102" fill="#FFFFFF" stroke="#334155" stroke-width="1.8" rx="3"/>
      <g transform="rotate(-33.7 591.00 127.00)">
        <path d="M 564.99,127.00 A 26.01,26.01 0 0,1 617.01,127.00 A 13.01,13.01 0 0,1 591.00,127.00 A 13.01,13.01 0 0,0 564.99,127.00 Z" fill="#CD2E3A"/>
        <path d="M 617.01,127.00 A 26.01,26.01 0 0,1 564.99,127.00 A 13.01,13.01 0 0,1 591.00,127.00 A 13.01,13.01 0 0,0 617.01,127.00 Z" fill="#0047A0"/>
      </g>
      <rect x="545.97" y="103.56" width="26.01" height="4.16" fill="#111827" transform="rotate(-56.3 558.97 105.64)"/>
      <rect x="540.56" y="99.95" width="26.01" height="4.16" fill="#111827" transform="rotate(-56.3 553.56 102.03)"/>
      <rect x="535.15" y="96.34" width="26.01" height="4.16" fill="#111827" transform="rotate(-56.3 548.15 98.43)"/>
      <g transform="rotate(56.3 623.03 105.64)"><rect x="610.02" y="103.56" width="11.44" height="4.16" fill="#111827"/><rect x="624.59" y="103.56" width="11.44" height="4.16" fill="#111827"/></g>
      <rect x="615.43" y="99.95" width="26.01" height="4.16" fill="#111827" transform="rotate(56.3 628.44 102.03)"/>
      <g transform="rotate(56.3 633.85 98.43)"><rect x="620.84" y="96.34" width="11.44" height="4.16" fill="#111827"/><rect x="635.41" y="96.34" width="11.44" height="4.16" fill="#111827"/></g>
      <rect x="545.97" y="146.28" width="26.01" height="4.16" fill="#111827" transform="rotate(236.3 558.97 148.36)"/>
      <g transform="rotate(236.3 553.56 151.97)"><rect x="540.56" y="149.89" width="11.44" height="4.16" fill="#111827"/><rect x="555.12" y="149.89" width="11.44" height="4.16" fill="#111827"/></g>
      <rect x="535.15" y="153.49" width="26.01" height="4.16" fill="#111827" transform="rotate(236.3 548.15 155.57)"/>
      <g transform="rotate(123.7 623.03 148.36)"><rect x="610.02" y="146.28" width="11.44" height="4.16" fill="#111827"/><rect x="624.59" y="146.28" width="11.44" height="4.16" fill="#111827"/></g>
      <g transform="rotate(123.7 628.44 151.97)"><rect x="615.43" y="149.89" width="11.44" height="4.16" fill="#111827"/><rect x="630.00" y="149.89" width="11.44" height="4.16" fill="#111827"/></g>
      <g transform="rotate(123.7 633.85 155.57)"><rect x="620.84" y="153.49" width="11.44" height="4.16" fill="#111827"/><rect x="635.41" y="153.49" width="11.44" height="4.16" fill="#111827"/></g>
    </g>
  <text x="591" y="198" text-anchor="middle" font-size="12" fill="#475569">日本のとなりの国 B のしるし</text>

  <!-- Panel 3: 地図2 日本とまわりの国々 -->
  <rect x="694" y="14" width="272" height="402" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="710" y="42" font-size="17" font-weight="700" fill="#0F172A">地図２　日本とまわりの国</text>
  <g transform="translate(706, 54)">
    <rect x="0" y="0" width="248" height="348" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Russia / Continent top-left -->
    <path d="M 0,0 L 188,0 L 174,24 L 154,36 L 146,66 L 128,84 L 106,96 L 94,116 L 78,128 L 62,126 L 44,142 L 24,154 L 0,176 Z" fill="#E2E8F0" stroke="#64748B" stroke-width="1.3"/>
    <!-- Sakhalin -->
    <path d="M 152,18 L 160,46 L 164,96 L 156,112 L 148,96 L 146,42 Z" fill="#E2E8F0" stroke="#64748B" stroke-width="1.2"/>
    <!-- Korean Peninsula -->
    <path d="M 60,126 L 78,128 L 88,162 L 82,190 L 66,196 L 56,178 L 58,150 Z" fill="#FEF3C7" stroke="#64748B" stroke-width="1.3"/>
    <!-- Border line on peninsula -->
    <line x1="57" y1="160" x2="86" y2="158" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- China coast bottom-left -->
    <path d="M 0,176 L 26,184 L 30,214 L 18,248 L 0,264 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <!-- Japan archipelago (bow-shaped) -->
    <!-- Hokkaido -->
    <path d="M 154,116 L 172,130 L 194,130 L 192,144 L 174,154 L 156,148 L 146,158 L 140,148 L 150,134 Z" fill="#86EFAC" stroke="#15803D" stroke-width="1.5"/>
    <!-- Northern Territories (4 islands) -->
    <path d="M 196,126 L 204,119 L 208,122 L 199,129 Z" fill="#FCA5A5" stroke="#B91C1C" stroke-width="1.1"/>
    <path d="M 210,114 L 224,102 L 228,106 L 214,118 Z" fill="#FCA5A5" stroke="#B91C1C" stroke-width="1.2"/>
    <circle cx="204" cy="133" r="2.2" fill="#FCA5A5" stroke="#B91C1C" stroke-width="0.9"/>
    <circle cx="198" cy="136" r="1.8" fill="#FCA5A5" stroke="#B91C1C" stroke-width="0.9"/>
    <!-- Honshu -->
    <path d="M 142,164 L 156,164 L 160,186 L 152,216 L 132,232 L 110,236 L 90,232 L 80,238 L 76,230 L 96,216 L 118,210 L 136,192 Z" fill="#86EFAC" stroke="#15803D" stroke-width="1.5"/>
    <!-- Shikoku -->
    <path d="M 96,238 L 112,238 L 108,248 L 92,248 Z" fill="#86EFAC" stroke="#15803D" stroke-width="1.3"/>
    <!-- Kyushu -->
    <path d="M 74,242 L 88,242 L 86,264 L 74,268 L 68,254 Z" fill="#86EFAC" stroke="#15803D" stroke-width="1.4"/>
    <!-- Nansei / Okinawa chain -->
    <path d="M 64,278 L 58,284 M 50,294 L 44,302 M 34,308 L 28,312" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Izu / Ogasawara / Okinotorishima -->
    <circle cx="144" cy="252" r="1.5" fill="#15803D"/>
    <circle cx="148" cy="272" r="1.5" fill="#15803D"/>
    <circle cx="122" cy="316" r="3" fill="#DC2626" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Labels C, B, 択捉島, 沖ノ鳥島 -->
    <circle cx="104" cy="48" r="13" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="104" y="54" text-anchor="middle" font-size="15" font-weight="800" fill="#1D4ED8">C</text>

    <line x1="74" y1="176" x2="98" y2="176" stroke="#B45309" stroke-width="1.6"/>
    <circle cx="106" cy="176" r="13" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <text x="106" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#B45309">B</text>

    <line x1="220" y1="112" x2="210" y2="152" stroke="#B91C1C" stroke-width="1.4"/>
    <rect x="176" y="152" width="66" height="22" rx="4" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
    <text x="209" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">択捉島</text>

    <line x1="125" y1="316" x2="154" y2="316" stroke="#B91C1C" stroke-width="1.4"/>
    <rect x="154" y="305" width="84" height="22" rx="4" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
    <text x="196" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">沖ノ鳥島</text>

    <!-- 3000km span indicator -->
    <path d="M 228,116 Q 214,230 132,312" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="206" y="254" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">約3000km</text>
  </g>

  <!-- Mini summary card bottom-middle -->
  <rect x="500" y="222" width="182" height="194" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="591" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">日本の国土の特ちょう</text>
  <text x="514" y="280" font-size="12.5" font-weight="700" fill="#1E293B">● およそ6800の島々</text>
  <text x="514" y="306" font-size="12.5" font-weight="700" fill="#1E293B">● 北のはし：択捉島</text>
  <text x="514" y="330" font-size="12.5" font-weight="700" fill="#1E293B">● 南のはし：沖ノ鳥島</text>
  <text x="514" y="358" font-size="12" fill="#475569">北から南まで</text>
  <text x="514" y="378" font-size="13" font-weight="700" fill="#B91C1C">およそ3000km！</text>
  <text x="514" y="402" font-size="11.5" fill="#475569">（北方領土は4つの島々）</text>
</svg>
