<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="世界の6つの大陸・3つの海洋と日本のまわりの国々まとめ図">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="920" height="420" fill="#FFFFFF"/>
  <rect x="12" y="12" width="896" height="396" rx="14" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
  <text x="460" y="42" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">世界の６つの大陸・３つの海洋と日本</text>

  <!-- World map scaled 1.35x -->
  <g transform="translate(28, 56) scale(1.32)">
    <rect x="0" y="0" width="450" height="248" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
    <line x1="0" y1="124" x2="450" y2="124" stroke="#93C5FD" stroke-width="0.9" stroke-dasharray="4,4"/>
    
    <!-- Eurasia -->
    <path d="M 30,52 L 58,38 L 95,30 L 145,26 L 195,32 L 232,44 L 222,60 L 204,72 L 194,92 L 184,96 L 176,112 L 166,118 L 156,104 L 144,122 L 134,116 L 122,102 L 106,108 L 94,96 L 80,104 L 68,88 L 46,90 L 34,76 Z" fill="#BBF7D0" stroke="#334155" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Japan on world map -->
    <path d="M 206,72 Q 214,82 208,95 Q 202,99 196,101" fill="none" stroke="#DC2626" stroke-width="3.2" stroke-linecap="round"/>
    <!-- UK & SE Asia islands -->
    <ellipse cx="32" cy="64" rx="4" ry="6" fill="#BBF7D0" stroke="#334155" stroke-width="1"/>
    <path d="M 164,132 L 182,138 L 196,136 L 202,144 L 176,144 Z" fill="#BBF7D0" stroke="#334155" stroke-width="1"/>
    <!-- Africa -->
    <path d="M 40,98 L 68,94 L 90,104 L 100,122 L 94,138 L 84,166 L 70,180 L 60,174 L 54,148 L 40,134 L 32,116 Z" fill="#FEF08A" stroke="#334155" stroke-width="1.3" stroke-linejoin="round"/>
    <ellipse cx="96" cy="166" rx="4" ry="9" fill="#FEF08A" stroke="#334155" stroke-width="1"/>
    <!-- Australia (A) -->
    <path d="M 186,158 L 210,152 L 230,164 L 232,184 L 216,194 L 192,188 L 182,174 Z" fill="#FDBA74" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 244,192 L 252,184 L 254,198 L 246,204 Z" fill="#FDBA74" stroke="#334155" stroke-width="1"/>
    <!-- North America -->
    <path d="M 264,34 L 304,28 L 354,32 L 386,46 L 374,64 L 358,76 L 348,96 L 336,112 L 344,124 L 332,126 L 316,110 L 302,90 L 292,70 L 272,56 Z" fill="#DDD6FE" stroke="#334155" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Greenland -->
    <path d="M 384,18 L 414,16 L 418,36 L 394,42 Z" fill="#DDD6FE" stroke="#334155" stroke-width="1.1"/>
    <!-- South America -->
    <path d="M 342,126 L 368,124 L 394,142 L 390,166 L 372,190 L 360,210 L 350,206 L 346,174 L 336,148 Z" fill="#FBCFE8" stroke="#334155" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Antarctica -->
    <path d="M 55,226 Q 150,214 240,220 Q 330,214 410,226 L 410,236 L 55,236 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="1.1"/>

    <!-- 6 Continents labels -->
    <g paint-order="stroke" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round">
      <text x="122" y="68" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532D">ユーラシア大陸</text>
      <text x="122" y="81" text-anchor="middle" font-size="8.5" fill="#166534">（最も広い）</text>
      <text x="64" y="138" text-anchor="middle" font-size="10" font-weight="700" fill="#854D0E">アフリカ大陸</text>
      <text x="208" y="176" text-anchor="middle" font-size="9" font-weight="700" fill="#9A3412">オーストラリア大陸</text>
      <text x="208" y="187" text-anchor="middle" font-size="7.8" fill="#9A3412">（最もせまい）</text>
      <text x="330" y="70" text-anchor="middle" font-size="10.2" font-weight="700" fill="#5B21B6">北アメリカ大陸</text>
      <text x="366" y="160" text-anchor="middle" font-size="10.2" font-weight="700" fill="#9D174D">南アメリカ大陸</text>
      <text x="225" y="233" text-anchor="middle" font-size="10.2" font-weight="700" fill="#334155">南極大陸</text>
    </g>
    <!-- 3 Oceans labels -->
    <text x="268" y="122" text-anchor="middle" font-size="13" font-weight="800" fill="#0369A1">太平洋</text>
    <text x="136" y="172" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0369A1">インド洋</text>
    <text x="422" y="112" text-anchor="middle" font-size="11" font-weight="800" fill="#0369A1">大西洋</text>
    <text x="18" y="162" text-anchor="middle" font-size="10" font-weight="800" fill="#0369A1">大西洋</text>
    <!-- Japan badge -->
    <rect x="215" y="72" width="32" height="16" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
    <text x="231" y="84" text-anchor="middle" font-size="9.5" font-weight="800" fill="#B91C1C">日本</text>
  </g>

  <!-- Right summary cards -->
  <g transform="translate(640, 56)">
    <rect x="0" y="0" width="252" height="156" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="0" y="0" width="252" height="30" rx="10" fill="#1D4ED8"/>
    <rect x="0" y="18" width="252" height="12" fill="#1D4ED8"/>
    <text x="126" y="21" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">日本のまわりの主な国々</text>
    <text x="14" y="54" font-size="13" font-weight="700" fill="#0F172A">・ロシア連邦（北）</text>
    <text x="24" y="72" font-size="11.5" fill="#475569">北方領土を現在占領している</text>
    <text x="14" y="96" font-size="13" font-weight="700" fill="#0F172A">・大韓民国（西どなり）</text>
    <text x="24" y="114" font-size="11.5" fill="#475569">歴史や文化のつながりが深い</text>
    <text x="14" y="138" font-size="13" font-weight="700" fill="#0F172A">・中華人民共和国（西）</text>

    <rect x="0" y="170" width="252" height="157" rx="10" fill="#FEF2F2" stroke="#F87171" stroke-width="1.4"/>
    <text x="126" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">日本の国土のポイント</text>
    <text x="14" y="222" font-size="12.5" font-weight="700" fill="#1E293B">・形：細長い弓のような形</text>
    <text x="14" y="246" font-size="12.5" font-weight="700" fill="#1E293B">・北のはし：択捉島</text>
    <text x="14" y="270" font-size="12.5" font-weight="700" fill="#1E293B">・南のはし：沖ノ鳥島</text>
    <text x="14" y="294" font-size="12" font-weight="700" fill="#B91C1C">・北方領土の４つの島々：</text>
    <text x="20" y="314" font-size="11.5" fill="#7F1D1D">択捉島・国後島・色丹島・歯舞群島</text>
  </g>
</svg>
