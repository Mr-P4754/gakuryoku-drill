<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-label="まちの安全を守る消防しょ・消防団・けいさつしょのしくみまとめ図">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="840" height="350" fill="#FFFFFF"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">くらしの安全を守るしくみ（消防とけいさつ）</text>

  <!-- Left panel: 火事・救急 (119) -->
  <rect x="20" y="50" width="490" height="282" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <rect x="36" y="64" width="166" height="30" rx="15" fill="#DC2626"/>
  <text x="119" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">火事・救急は 119番</text>

  <!-- Flow: 119 -> 通信指令室 -> 消防しょ -->
  <rect x="36" y="108" width="124" height="58" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
  <text x="98" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">消防本部</text>
  <text x="98" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">通信指令室</text>

  <polygon points="168,132 184,132 184,126 196,137 184,148 184,142 168,142" fill="#DC2626"/>

  <rect x="204" y="108" width="290" height="118" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
  <text x="349" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">現場近くの消防しょが出動！</text>
  <text x="218" y="154" font-size="12.5" font-weight="600" fill="#0F172A">・消火活動（車の火事は化学車も出動）</text>
  <text x="218" y="176" font-size="12.5" font-weight="600" fill="#0F172A">・けが人を救急車で病院へ運ぶ</text>
  <text x="218" y="198" font-size="12.5" font-weight="600" fill="#0F172A">・火事の原因調査や学校でのひなん訓練</text>
  <text x="218" y="216" font-size="12" font-weight="600" fill="#475569">　※市役所ではなく消防本部に直接つながるよ</text>

  <!-- Community Fire Corps (消防団) box -->
  <rect x="36" y="240" width="458" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="52" y="264" font-size="14" font-weight="700" fill="#92400E">地いきの消防団（協力してまちを守る）</text>
  <text x="52" y="286" font-size="12.5" font-weight="600" fill="#0F172A">・ふだんは消防以外の仕事をしている地いきの人たちが参加！</text>
  <text x="52" y="306" font-size="12.5" font-weight="600" fill="#0F172A">・消火活動の協力や，火の用心の見回りを行っているよ。</text>

  <!-- Right panel: 事故・事件 (110) -->
  <rect x="530" y="50" width="290" height="282" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="546" y="64" width="168" height="30" rx="15" fill="#2563EB"/>
  <text x="630" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">事故・事件は 110番</text>

  <rect x="546" y="108" width="258" height="104" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="675" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">けいさつしょの仕事</text>
  <text x="558" y="154" font-size="12.5" font-weight="600" fill="#0F172A">・パトカーで地いきの見回り</text>
  <text x="558" y="176" font-size="12.5" font-weight="600" fill="#0F172A">・ちゅう車いはんなどの取りしまり</text>
  <text x="558" y="198" font-size="12.5" font-weight="600" fill="#0F172A">・交通安全教室・信号機の整備</text>

  <!-- Safety Map box -->
  <rect x="546" y="226" width="258" height="92" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
  <text x="675" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">通学路「安全マップ」の印</text>
  <text x="558" y="272" font-size="12.5" font-weight="600" fill="#0F172A">・見通しの悪い交差点</text>
  <text x="558" y="292" font-size="12.5" font-weight="600" fill="#0F172A">・信号のない横断歩道</text>
  <text x="558" y="310" font-size="12.5" font-weight="600" fill="#0F172A">・スピードを出す車が多い道</text>
</svg>
