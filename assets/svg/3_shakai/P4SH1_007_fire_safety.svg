<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-label="火事からくらしを守る4つの絵（あ：通信指令室への通報・い：消防自動車・う：救急車・え：消火器）">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <defs>
    <clipPath id="fs1"><rect x="24" y="34" width="374" height="226" rx="10"/></clipPath>
    <clipPath id="fs2"><rect x="422" y="34" width="374" height="226" rx="10"/></clipPath>
    <clipPath id="fs3"><rect x="24" y="310" width="374" height="226" rx="10"/></clipPath>
    <clipPath id="fs4"><rect x="422" y="310" width="374" height="226" rx="10"/></clipPath>
  </defs>
  <rect width="820" height="560" fill="#FFFFFF"/>

  <!-- あ: Fire HQ communications command center (通信指令室) + caller inset -->
  <circle cx="42" cy="18" r="13" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="42" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">あ</text>
  <g clip-path="url(#fs1)">
    <rect x="24" y="34" width="374" height="226" fill="#F1F5F9"/>
    <!-- Command wall map board & glowing dispatch lights -->
    <rect x="34" y="90" width="124" height="72" rx="4" fill="#1E293B" stroke="#0F172A" stroke-width="1.6"/>
    <rect x="42" y="98" width="108" height="36" fill="#0F172A"/>
    <!-- Grid lights on status board -->
    <g fill="#22C55E">
      <rect x="46" y="102" width="8" height="6"/><rect x="58" y="102" width="8" height="6"/><rect x="70" y="102" width="8" height="6"/>
      <rect x="82" y="102" width="8" height="6"/><rect x="94" y="102" width="8" height="6"/><rect x="106" y="102" width="8" height="6"/>
    </g>
    <rect x="118" y="102" width="24" height="14" fill="#EF4444"/>
    <rect x="46" y="114" width="60" height="14" fill="#38BDF8" fill-opacity="0.7"/>
    <!-- Red warning beacon on top -->
    <rect x="44" y="76" width="44" height="14" rx="5" fill="#EF4444" stroke="#7F1D1D" stroke-width="1.4"/>

    <!-- Dispatch Console Desk -->
    <polygon points="34,174 176,174 220,260 34,260" fill="#CBD5E1" stroke="#334155" stroke-width="1.6"/>
    <polygon points="44,184 146,184 162,216 56,216" fill="#1E293B"/>
    <rect x="58" y="190" width="38" height="18" fill="#60A5FA"/>
    <rect x="104" y="190" width="38" height="18" fill="#FEF08A"/>

    <!-- Command Operator wearing headset -->
    <g transform="translate(184, 118)">
      <circle cx="38" cy="34" r="22" fill="#FDE68A" stroke="#1E293B" stroke-width="1.6"/>
      <path d="M 18,24 Q 38,4 62,24 Q 60,36 52,36 Q 38,18 18,24 Z" fill="#1E293B"/>
      <circle cx="28" cy="32" r="2.2" fill="#0F172A"/>
      <!-- Headset -->
      <path d="M 38,12 Q 52,14 48,34" fill="none" stroke="#334155" stroke-width="3"/>
      <circle cx="46" cy="34" r="6" fill="#334155"/>
      <path d="M 44,38 Q 34,48 20,44" fill="none" stroke="#334155" stroke-width="2.2"/>
      <!-- Uniform -->
      <path d="M 12,62 Q 44,54 78,66 L 88,144 L 4,144 Z" fill="#3B82F6" stroke="#1E3A8A" stroke-width="1.8"/>
    </g>

    <!-- Caller inset bubble (top right) showing fire report -->
    <rect x="240" y="42" width="148" height="78" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <!-- Burning house outside window -->
    <rect x="250" y="50" width="64" height="58" rx="4" fill="#FEE2E2" stroke="#991B1B" stroke-width="1.3"/>
    <rect x="256" y="72" width="42" height="32" fill="#FDE68A" stroke="#78350F" stroke-width="1.2"/>
    <polygon points="252,72 277,54 302,72" fill="#64748B"/>
    <!-- Flames & smoke -->
    <path d="M 272,76 Q 278,56 286,70 Q 292,52 300,72 Q 306,82 292,88 Q 276,88 272,76 Z" fill="#F97316" stroke="#DC2626" stroke-width="1.2"/>
    <path d="M 280,78 Q 285,66 292,76 Q 288,84 280,78 Z" fill="#FACC15"/>
    <!-- Person calling on phone -->
    <circle cx="348" cy="76" r="14" fill="#FDE68A" stroke="#1E293B" stroke-width="1.5"/>
    <path d="M 336,68 Q 350,56 364,70 Q 362,82 356,82 Z" fill="#1E293B"/>
    <circle cx="343" cy="76" r="1.8" fill="#0F172A"/>
    <path d="M 332,90 Q 348,86 364,92 L 368,118 L 328,118 Z" fill="#10B981" stroke="#065F46" stroke-width="1.4"/>
    <!-- Telephone receiver -->
    <path d="M 334,74 Q 326,84 334,94" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
  </g>
  <rect x="24" y="34" width="374" height="226" rx="10" fill="none" stroke="#1E293B" stroke-width="1.8"/>

  <!-- い: Ladder Fire Truck (はしご消防自動車) -->
  <circle cx="440" cy="18" r="13" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="440" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">い</text>
  <g clip-path="url(#fs2)">
    <rect x="422" y="34" width="374" height="174" fill="#EFF6FF"/>
    <rect x="422" y="206" width="374" height="54" fill="#CBD5E1"/>
    <line x1="422" y1="206" x2="796" y2="206" stroke="#64748B" stroke-width="2"/>

    <!-- Fire Truck Body -->
    <g transform="translate(466, 62)">
      <!-- Rear equipment body -->
      <rect x="116" y="72" width="186" height="82" rx="5" fill="#DC2626" stroke="#7F1D1D" stroke-width="2"/>
      <rect x="128" y="84" width="44" height="44" rx="3" fill="#E2E8F0" stroke="#475569" stroke-width="1.4"/>
      <rect x="180" y="84" width="44" height="44" rx="3" fill="#E2E8F0" stroke="#475569" stroke-width="1.4"/>
      <rect x="232" y="84" width="56" height="44" rx="3" fill="#FCA5A5" stroke="#7F1D1D" stroke-width="1.4"/>
      <!-- Front Cab -->
      <path d="M 16,102 L 32,68 L 118,68 L 118,154 L 12,154 L 12,112 Z" fill="#EF4444" stroke="#7F1D1D" stroke-width="2"/>
      <!-- Windshield & Side Window with Firefighters -->
      <polygon points="34,76 82,76 82,110 24,110" fill="#BAE6FD" stroke="#1E293B" stroke-width="1.5"/>
      <rect x="88" y="76" width="24" height="34" fill="#BAE6FD" stroke="#1E293B" stroke-width="1.5"/>
      <!-- Firefighter helmets inside cab -->
      <circle cx="58" cy="96" r="8" fill="#FDE68A"/><path d="M 49,93 Q 58,83 67,93 Z" fill="#FACC15" stroke="#854D0E" stroke-width="1.2"/>
      <circle cx="98" cy="96" r="7" fill="#FDE68A"/><path d="M 90,93 Q 98,84 106,93 Z" fill="#FACC15" stroke="#854D0E" stroke-width="1.2"/>
      <!-- Front grille, headlights, red siren light -->
      <rect x="18" y="122" width="58" height="22" rx="3" fill="#E2E8F0" stroke="#334155" stroke-width="1.4"/>
      <rect x="22" y="130" width="12" height="8" fill="#FEF08A"/>
      <rect x="60" y="130" width="12" height="8" fill="#FEF08A"/>
      <rect x="44" y="56" width="34" height="12" rx="4" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.5"/>
      <!-- Heavy wheels -->
      <circle cx="62" cy="158" r="20" fill="#1E293B" stroke="#0F172A" stroke-width="2"/><circle cx="62" cy="158" r="9" fill="#CBD5E1"/>
      <circle cx="206" cy="158" r="20" fill="#1E293B" stroke="#0F172A" stroke-width="2"/><circle cx="206" cy="158" r="9" fill="#CBD5E1"/>
      <circle cx="254" cy="158" r="20" fill="#1E293B" stroke="#0F172A" stroke-width="2"/><circle cx="254" cy="158" r="9" fill="#CBD5E1"/>

      <!-- Tall metallic rescue ladder mounted on top! -->
      <g transform="rotate(14 140 40)">
        <rect x="-12" y="16" width="286" height="22" rx="2" fill="#F8FAFC" fill-opacity="0.85" stroke="#334155" stroke-width="2"/>
        <!-- Ladder rungs / truss -->
        <path d="M 10,38 L 28,16 L 46,38 L 64,16 L 82,38 L 100,16 L 118,38 L 136,16 L 154,38 L 172,16 L 190,38 L 208,16 L 226,38 L 244,16 L 262,38" fill="none" stroke="#475569" stroke-width="2"/>
        <!-- Rescue basket at tip -->
        <rect x="-32" y="8" width="32" height="32" rx="3" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.8"/>
      </g>
    </g>
  </g>
  <rect x="422" y="34" width="374" height="226" rx="10" fill="none" stroke="#1E293B" stroke-width="1.8"/>

  <!-- う: Ambulance (救急車) -->
  <circle cx="42" cy="294" r="13" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="42" y="299" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">う</text>
  <g clip-path="url(#fs3)">
    <rect x="24" y="310" width="374" height="174" fill="#EFF6FF"/>
    <rect x="24" y="482" width="374" height="54" fill="#CBD5E1"/>
    <line x1="24" y1="482" x2="398" y2="482" stroke="#64748B" stroke-width="2"/>

    <!-- Japanese Ambulance Van -->
    <g transform="translate(88, 344)">
      <!-- Flashing roof red light bar -->
      <rect x="78" y="4" width="84" height="14" rx="6" fill="#EF4444" stroke="#7F1D1D" stroke-width="1.6"/>
      <line x1="90" y1="-2" x2="84" y2="-10" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="120" y1="-4" x2="120" y2="-12" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="150" y1="-2" x2="156" y2="-10" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>
      <!-- White van body -->
      <path d="M 16,66 L 44,20 L 236,20 Q 252,20 252,36 L 252,134 L 12,134 L 12,80 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2"/>
      <!-- Bold red stripe along side -->
      <rect x="13" y="88" width="238" height="14" fill="#DC2626"/>
      <!-- Front windshield with two paramedics -->
      <polygon points="48,30 132,30 132,76 26,76" fill="#BAE6FD" stroke="#1E293B" stroke-width="1.6"/>
      <circle cx="64" cy="58" r="9" fill="#FDE68A"/><path d="M 54,54 Q 64,44 74,54 Z" fill="#2563EB"/>
      <circle cx="106" cy="58" r="9" fill="#FDE68A"/><path d="M 96,54 Q 106,44 116,54 Z" fill="#2563EB"/>
      <!-- Side windows -->
      <rect x="142" y="34" width="44" height="40" rx="3" fill="#BAE6FD" stroke="#1E293B" stroke-width="1.5"/>
      <rect x="194" y="34" width="44" height="40" rx="3" fill="#BAE6FD" stroke="#1E293B" stroke-width="1.5"/>
      <!-- Medical cross badge on door -->
      <rect x="164" y="108" width="16" height="5" fill="#DC2626"/>
      <rect x="169.5" y="102.5" width="5" height="16" fill="#DC2626"/>
      <!-- Front bumper & headlights -->
      <rect x="20" y="108" width="82" height="18" rx="3" fill="#E2E8F0" stroke="#334155" stroke-width="1.4"/>
      <rect x="24" y="112" width="14" height="9" fill="#FEF08A"/>
      <rect x="84" y="112" width="14" height="9" fill="#FEF08A"/>
      <!-- Wheels -->
      <circle cx="72" cy="138" r="20" fill="#1E293B" stroke="#0F172A" stroke-width="2"/><circle cx="72" cy="138" r="9" fill="#CBD5E1"/>
      <circle cx="204" cy="138" r="20" fill="#1E293B" stroke="#0F172A" stroke-width="2"/><circle cx="204" cy="138" r="9" fill="#CBD5E1"/>
    </g>
  </g>
  <rect x="24" y="310" width="374" height="226" rx="10" fill="none" stroke="#1E293B" stroke-width="1.8"/>

  <!-- え: Fire Extinguisher (消火器) -->
  <circle cx="440" cy="294" r="13" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="440" y="299" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">え</text>
  <g clip-path="url(#fs4)">
    <rect x="422" y="310" width="374" height="226" fill="#FFFBEB"/>
    <!-- Subtle floor shadow -->
    <ellipse cx="609" cy="512" rx="70" ry="11" fill="#CBD5E1"/>

    <!-- Fire Extinguisher Illustration -->
    <g transform="translate(556, 326)">
      <!-- Nozzle & flexible black hose -->
      <path d="M 46,38 C 2,36 -8,96 8,144" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
      <polygon points="2,138 15,136 22,164 4,166" fill="#334155" stroke="#0F172A" stroke-width="1.6"/>
      <!-- Valve head, safety pin, & squeeze levers -->
      <rect x="44" y="24" width="24" height="26" rx="3" fill="#94A3B8" stroke="#1E293B" stroke-width="1.8"/>
      <!-- Top & bottom squeeze handles -->
      <path d="M 62,28 L 106,10 L 109,18 L 66,35 Z" fill="#475569" stroke="#0F172A" stroke-width="1.6"/>
      <path d="M 64,38 L 114,42 L 114,49 L 64,46 Z" fill="#475569" stroke="#0F172A" stroke-width="1.6"/>
      <!-- Yellow safety pin ring -->
      <circle cx="52" cy="30" r="7" fill="none" stroke="#FACC15" stroke-width="2.6"/>
      <!-- Cylinder shoulder & bright red body -->
      <path d="M 24,84 Q 24,48 56,48 Q 88,48 88,84 L 88,176 Q 88,186 56,186 Q 24,186 24,176 Z" fill="#DC2626" stroke="#7F1D1D" stroke-width="2.2"/>
      <!-- Glossy cylinder highlight -->
      <rect x="33" y="72" width="8" height="98" rx="4" fill="#FCA5A5" fill-opacity="0.5"/>
      <!-- Instruction label on front (white + 3 indicator circles: ABC fire types!) -->
      <rect x="34" y="88" width="44" height="72" rx="3" fill="#FFFFFF" stroke="#475569" stroke-width="1.4"/>
      <circle cx="43" cy="104" r="5" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
      <circle cx="56" cy="104" r="5" fill="#FACC15" stroke="#854D0E" stroke-width="1.2"/>
      <circle cx="69" cy="104" r="5" fill="#3B82F6" stroke="#1E3A8A" stroke-width="1.2"/>
      <line x1="40" y1="120" x2="72" y2="120" stroke="#64748B" stroke-width="2"/>
      <line x1="40" y1="130" x2="72" y2="130" stroke="#94A3B8" stroke-width="2"/>
      <line x1="40" y1="140" x2="66" y2="140" stroke="#94A3B8" stroke-width="2"/>
      <line x1="40" y1="150" x2="72" y2="150" stroke="#94A3B8" stroke-width="2"/>
    </g>
  </g>
  <rect x="422" y="310" width="374" height="226" rx="10" fill="none" stroke="#1E293B" stroke-width="1.8"/>
</svg>
