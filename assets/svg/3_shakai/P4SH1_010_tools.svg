<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" role="img" aria-label="昔の道具（あ：たらいと洗濯板・い：ランプ・う：かまど・え：いど）と今の道具（ア：電気照明・イ：水道・ウ：洗濯機・エ：ガスコンロ）">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="880" height="490" fill="#FFFFFF"/>

  <!-- Section headers on left -->
  <rect x="14" y="42" width="44" height="176" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="36" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">昔</text>
  <text x="36" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">の</text>
  <text x="36" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">道</text>
  <text x="36" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">具</text>

  <rect x="14" y="274" width="44" height="176" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="36" y="320" text-anchor="middle" font-size="16" font-weight="700" fill="#1E40AF">今</text>
  <text x="36" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#1E40AF">の</text>
  <text x="36" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#1E40AF">道</text>
  <text x="36" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#1E40AF">具</text>

  <!-- ================= ROW 1: 昔の道具 (あ・い・う・え) ================= -->
  <!-- Card あ: たらい & せんたく板 (wooden washtub & washboard) -->
  <rect x="74" y="24" width="186" height="202" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <circle cx="96" cy="46" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
  <text x="96" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">あ</text>
  <g transform="translate(96, 60)">
    <!-- Wooden tub (たらい) -->
    <ellipse cx="72" cy="82" rx="60" ry="34" fill="#FDE68A" stroke="#78350F" stroke-width="2"/>
    <path d="M 12,82 L 22,126 Q 72,150 122,126 L 132,82" fill="#D97706" stroke="#78350F" stroke-width="2"/>
    <!-- Water inside tub -->
    <ellipse cx="72" cy="84" rx="52" ry="26" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.4"/>
    <!-- Metal/bamboo hoops -->
    <path d="M 16,102 Q 72,124 128,102" fill="none" stroke="#92400E" stroke-width="3"/>
    <path d="M 20,118 Q 72,140 124,118" fill="none" stroke="#92400E" stroke-width="3"/>
    <!-- Ridged wooden washboard (せんたく板) -->
    <g transform="rotate(-24 68 62)">
      <rect x="40" y="6" width="44" height="92" rx="5" fill="#F59E0B" stroke="#78350F" stroke-width="1.8"/>
      <rect x="46" y="24" width="32" height="66" fill="#FDE68A" stroke="#92400E" stroke-width="1.2"/>
      <line x1="48" y1="34" x2="76" y2="34" stroke="#92400E" stroke-width="2"/>
      <line x1="48" y1="44" x2="76" y2="44" stroke="#92400E" stroke-width="2"/>
      <line x1="48" y1="54" x2="76" y2="54" stroke="#92400E" stroke-width="2"/>
      <line x1="48" y1="64" x2="76" y2="64" stroke="#92400E" stroke-width="2"/>
      <line x1="48" y1="74" x2="76" y2="74" stroke="#92400E" stroke-width="2"/>
      <line x1="48" y1="84" x2="76" y2="84" stroke="#92400E" stroke-width="2"/>
      <rect x="55" y="12" width="14" height="6" rx="3" fill="#FFFBEB" stroke="#78350F" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Card い: Oil Lamp (ランプ) -->
  <rect x="276" y="24" width="186" height="202" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <circle cx="298" cy="46" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
  <text x="298" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">い</text>
  <g transform="translate(316, 48)">
    <!-- Handle ring -->
    <path d="M 38,24 Q 38,2 53,2 Q 68,2 68,24" fill="none" stroke="#475569" stroke-width="3.2"/>
    <!-- Chimney top -->
    <rect x="43" y="20" width="20" height="32" rx="4" fill="#E0F2FE" stroke="#334155" stroke-width="1.6"/>
    <!-- Shade -->
    <path d="M 36,48 L 10,80 Q 53,92 96,80 L 70,48 Z" fill="#FDE047" stroke="#854D0E" stroke-width="1.8"/>
    <!-- Glass globe & glowing warm flame -->
    <ellipse cx="53" cy="108" rx="26" ry="28" fill="#FEF9C3" fill-opacity="0.8" stroke="#334155" stroke-width="1.8"/>
    <path d="M 53,88 Q 62,102 53,112 Q 44,102 53,88 Z" fill="#F97316"/>
    <path d="M 53,95 Q 58,104 53,110 Q 48,104 53,95 Z" fill="#FEF08A"/>
    <!-- Brass oil reservoir base -->
    <ellipse cx="53" cy="134" rx="28" ry="12" fill="#D97706" stroke="#78350F" stroke-width="1.8"/>
    <rect x="33" y="138" width="40" height="16" rx="4" fill="#B45309" stroke="#78350F" stroke-width="1.8"/>
    <ellipse cx="53" cy="156" rx="28" ry="7" fill="#92400E" stroke="#451A03" stroke-width="1.6"/>
    <!-- Wick knob -->
    <circle cx="80" cy="126" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1.4"/>
  </g>

  <!-- Card う: Kamado clay stove (かまど) -->
  <rect x="478" y="24" width="186" height="202" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <circle cx="500" cy="46" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
  <text x="500" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">う</text>
  <g transform="translate(494, 70)">
    <!-- Clay stove body -->
    <polygon points="10,56 76,34 148,46 148,112 76,128 10,114" fill="#E2E8F0" stroke="#334155" stroke-width="2"/>
    <polygon points="10,56 76,34 148,46 82,68" fill="#CBD5E1" stroke="#334155" stroke-width="1.6"/>
    <!-- Iron rice pot (羽釜) with wooden lid & steam -->
    <ellipse cx="66" cy="44" rx="22" ry="9" fill="#334155" stroke="#0F172A" stroke-width="1.6"/>
    <ellipse cx="66" cy="36" rx="16" ry="6" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>
    <rect x="61" y="28" width="10" height="7" fill="#B45309" stroke="#78350F" stroke-width="1.2"/>
    <path d="M 54,22 Q 50,14 56,8 M 74,20 Q 78,12 72,6" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Second smaller pot -->
    <ellipse cx="114" cy="48" rx="15" ry="6" fill="#475569" stroke="#0F172A" stroke-width="1.4"/>
    <!-- Firebox arches with burning firewood -->
    <path d="M 74,122 L 74,88 Q 92,72 110,88 L 110,118 Z" fill="#1E293B"/>
    <path d="M 118,116 L 118,90 Q 130,78 142,90 L 142,110 Z" fill="#1E293B"/>
    <!-- Glowing fire & logs -->
    <path d="M 80,118 Q 88,92 94,108 Q 100,90 105,116 Z" fill="#F97316"/>
    <path d="M 85,118 Q 92,100 99,118 Z" fill="#FACC15"/>
    <line x1="76" y1="120" x2="108" y2="112" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
    <line x1="78" y1="112" x2="106" y2="122" stroke="#92400E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Card え: Well (いど) -->
  <rect x="680" y="24" width="186" height="202" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <circle cx="702" cy="46" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
  <text x="702" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">え</text>
  <g transform="translate(706, 48)">
    <!-- Wooden roof over well -->
    <polygon points="10,40 68,14 128,40" fill="#B45309" stroke="#451A03" stroke-width="1.8"/>
    <line x1="28" y1="40" x2="28" y2="114" stroke="#78350F" stroke-width="5"/>
    <line x1="108" y1="40" x2="108" y2="114" stroke="#78350F" stroke-width="5"/>
    <!-- Pulley wheel & rope -->
    <circle cx="68" cy="48" r="10" fill="#94A3B8" stroke="#1E293B" stroke-width="1.8"/>
    <line x1="68" y1="58" x2="68" y2="96" stroke="#78350F" stroke-width="2.2"/>
    <!-- Wooden water bucket -->
    <polygon points="54,94 82,94 78,116 58,116" fill="#D97706" stroke="#78350F" stroke-width="1.6"/>
    <ellipse cx="68" cy="94" rx="14" ry="4" fill="#38BDF8"/>
    <!-- Square wooden/stone well curb -->
    <polygon points="22,108 114,108 114,158 22,158" fill="#CBD5E1" stroke="#334155" stroke-width="2"/>
    <polygon points="16,102 120,102 114,112 22,112" fill="#E2E8F0" stroke="#334155" stroke-width="1.6"/>
    <line x1="22" y1="132" x2="114" y2="132" stroke="#64748B" stroke-width="1.4"/>
    <line x1="68" y1="112" x2="68" y2="158" stroke="#64748B" stroke-width="1.4"/>
  </g>

  <!-- Connecting guidance divider -->
  <line x1="74" y1="244" x2="866" y2="244" stroke="#CBD5E1" stroke-width="1.8" stroke-dasharray="6,6"/>

  <!-- ================= ROW 2: 今の道具 (㋐・㋑・㋒・㋓) ================= -->
  <!-- Card ㋐: Hanging Electric Ceiling Light (しょうめい) -->
  <rect x="74" y="264" width="186" height="202" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <circle cx="96" cy="286" r="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="96" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">㋐</text>
  <g transform="translate(106, 282)">
    <!-- Ceiling cord -->
    <line x1="60" y1="0" x2="60" y2="46" stroke="#475569" stroke-width="3.5"/>
    <!-- Soft light glow rays -->
    <polygon points="20,104 100,104 118,158 2,158" fill="#FEF08A" fill-opacity="0.45"/>
    <!-- Dome lamp shade -->
    <path d="M 10,96 Q 10,44 60,44 Q 110,44 110,96 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    <ellipse cx="60" cy="96" rx="50" ry="12" fill="#FEF9C3" stroke="#1E293B" stroke-width="1.8"/>
    <!-- Circular fluorescent ring inside -->
    <ellipse cx="60" cy="96" rx="34" ry="7" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
    <!-- Pull switch string -->
    <line x1="60" y1="98" x2="60" y2="144" stroke="#334155" stroke-width="1.8"/>
    <circle cx="60" cy="148" r="5" fill="#3B82F6" stroke="#1E3A8A" stroke-width="1.4"/>
  </g>

  <!-- Card ㋑: Water Faucet (水道のじゃ口) -->
  <rect x="276" y="264" width="186" height="202" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <circle cx="298" cy="286" r="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="298" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">㋑</text>
  <g transform="translate(296, 300)">
    <!-- Kitchen tiled wall & sink -->
    <rect x="14" y="18" width="132" height="84" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
    <polygon points="14,102 146,102 134,148 26,148" fill="#CBD5E1" stroke="#475569" stroke-width="1.8"/>
    <!-- Chrome wall faucet -->
    <circle cx="96" cy="54" r="13" fill="#E2E8F0" stroke="#334155" stroke-width="1.8"/>
    <!-- Cross handle -->
    <rect x="92" y="28" width="8" height="20" rx="2" fill="#94A3B8" stroke="#1E293B" stroke-width="1.4"/>
    <rect x="78" y="24" width="36" height="8" rx="3" fill="#CBD5E1" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Spout pipe extending left -->
    <path d="M 96,58 L 96,74 Q 96,86 80,86 L 44,86 L 44,98" fill="none" stroke="#94A3B8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 96,58 L 96,74 Q 96,86 80,86 L 44,86 L 44,98" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Running clear blue water stream! -->
    <path d="M 40,100 L 48,100 L 50,142 L 38,142 Z" fill="#38BDF8" fill-opacity="0.85"/>
    <ellipse cx="44" cy="142" rx="14" ry="4" fill="#7DD3FC"/>
  </g>

  <!-- Card ㋒: Electric Washing Machine (せんたく機) -->
  <rect x="478" y="264" width="186" height="202" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <circle cx="500" cy="286" r="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="500" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">㋒</text>
  <g transform="translate(514, 294)">
    <!-- Washer body (top-loading Japanese style) -->
    <rect x="16" y="34" width="102" height="122" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <!-- Open lid tilted up -->
    <polygon points="22,34 32,0 110,0 114,34" fill="#E2E8F0" stroke="#334155" stroke-width="1.8"/>
    <!-- Top drum opening & stainless tub -->
    <ellipse cx="67" cy="54" rx="34" ry="18" fill="#BAE6FD" stroke="#1E293B" stroke-width="1.8"/>
    <ellipse cx="67" cy="57" rx="22" ry="10" fill="#38BDF8" stroke="#0284C7" stroke-width="1.2"/>
    <!-- Control panel buttons -->
    <rect x="24" y="76" width="86" height="18" rx="3" fill="#E2E8F0" stroke="#475569" stroke-width="1.3"/>
    <rect x="30" y="81" width="18" height="8" rx="2" fill="#22C55E"/>
    <circle cx="62" cy="85" r="4" fill="#3B82F6"/>
    <circle cx="76" cy="85" r="4" fill="#F59E0B"/>
    <circle cx="96" cy="85" r="4.5" fill="#EF4444"/>
    <!-- Front clean panel lines -->
    <line x1="26" y1="104" x2="108" y2="104" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- Card ㋓: Two-burner Gas Stove (ガスコンロ) -->
  <rect x="680" y="264" width="186" height="202" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <circle cx="702" cy="286" r="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="702" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">㋓</text>
  <g transform="translate(698, 326)">
    <!-- Stove top surface -->
    <polygon points="14,32 42,10 152,22 134,58" fill="#E2E8F0" stroke="#334155" stroke-width="2"/>
    <!-- Front control face -->
    <polygon points="14,32 134,58 134,98 14,72" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <!-- Side face -->
    <polygon points="134,58 152,22 152,62 134,98" fill="#CBD5E1" stroke="#334155" stroke-width="2"/>
    <!-- Left burner & blue gas flames -->
    <ellipse cx="58" cy="30" rx="20" ry="10" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
    <ellipse cx="58" cy="30" rx="14" ry="6" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4,3"/>
    <!-- Right burner & blue gas flames -->
    <ellipse cx="110" cy="38" rx="20" ry="10" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
    <ellipse cx="110" cy="38" rx="14" ry="6" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4,3"/>
    <!-- Control knobs & grill door -->
    <circle cx="34" cy="58" r="8" fill="#94A3B8" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="52" y="54" width="44" height="28" rx="2" fill="#475569" stroke="#1E293B" stroke-width="1.4" transform="skewY(12)"/>
    <circle cx="114" cy="75" r="8" fill="#94A3B8" stroke="#1E293B" stroke-width="1.5"/>
  </g>
</svg>
