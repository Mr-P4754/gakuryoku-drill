<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" width="640" height="530" role="img" aria-label="学校の北・南や老人ホームの東などの位置ア〜エと4つの地図記号A〜D">
  <style>
