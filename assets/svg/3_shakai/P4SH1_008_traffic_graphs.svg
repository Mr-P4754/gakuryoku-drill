<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 946 420" width="946" height="420" role="img" aria-label="あ：県で起きた交通事故の件数、い：年代別にみた交通事故でけがをした人や死亡した人の数のグラフ">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="946" height="420" fill="#FFFFFF"/>
  <rect x="10" y="10" width="926" height="400" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title あ -->
  <circle cx="42" cy="40" r="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="42" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#1E40AF">あ</text>
  <text x="64" y="46" font-size="16" font-weight="700" fill="#0F172A">県で起きた交通事故の件数</text>

  <!-- Graph あ -->
  <rect x="82" y="74" width="280" height="260" fill="#FFFFFF"/>
  
  <text x="74" y="339.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">0</text>
  <line x1="82" y1="269.0" x2="362" y2="269.0" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="74" y="274.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">2000</text>
  <line x1="82" y1="204.0" x2="362" y2="204.0" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="74" y="209.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">4000</text>
  <line x1="82" y1="139.0" x2="362" y2="139.0" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="74" y="144.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">6000</text>
  <line x1="82" y1="74.0" x2="362" y2="74.0" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="74" y="79.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">8000</text>
  <text x="74" y="94" text-anchor="end" font-size="12.5" font-weight="700" fill="#475569">件</text>
  <rect x="82" y="74" width="280" height="260" fill="none" stroke="#1E293B" stroke-width="1.8"/>
  <rect x="100.3" y="100.0" width="34" height="234.0" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="117.3" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">2015</text>
  <text x="117.3" y="370" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">(平成27)</text>
  <rect x="152.7" y="155.2" width="34" height="178.8" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="169.7" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">17</text>
  <rect x="205.0" y="215.4" width="34" height="118.6" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="222.0" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">19</text>
  <text x="222.0" y="370" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">(令和元)</text>
  <rect x="257.3" y="246.2" width="34" height="87.8" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="274.3" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">21</text>
  <rect x="309.7" y="236.5" width="34" height="97.5" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="326.7" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">23年</text>
  <text x="362" y="390" text-anchor="end" font-size="11.5" fill="#475569">（三重県警察資料）</text>

  <!-- Title い -->
  <circle cx="430" cy="40" r="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <text x="430" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">い</text>
  <text x="452" y="46" font-size="16" font-weight="700" fill="#0F172A">年代別にみた交通事故でけがをした人や死亡した人の数</text>

  <!-- Graph い -->
  <rect x="456" y="74" width="462" height="260" fill="#FFFFFF"/>
  
  <text x="448" y="339.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">0</text>
  <line x1="456" y1="290.7" x2="918" y2="290.7" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="448" y="295.7" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">100</text>
  <line x1="456" y1="247.3" x2="918" y2="247.3" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="448" y="252.3" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">200</text>
  <line x1="456" y1="204.0" x2="918" y2="204.0" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="448" y="209.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">300</text>
  <line x1="456" y1="160.7" x2="918" y2="160.7" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="448" y="165.7" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">400</text>
  <line x1="456" y1="117.3" x2="918" y2="117.3" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="448" y="122.3" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">500</text>
  <line x1="456" y1="74.0" x2="918" y2="74.0" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="448" y="79.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1E293B">600</text>
  <text x="448" y="94" text-anchor="end" font-size="12.5" font-weight="700" fill="#475569">人</text>
  <rect x="456" y="74" width="462" height="260" fill="none" stroke="#1E293B" stroke-width="1.8"/>
  <text x="910" y="94" text-anchor="end" font-size="12.5" font-weight="700" fill="#334155">（2024年）</text>
  <rect x="472.0" y="273.3" width="34" height="60.7" fill="#34D399" stroke="#047857" stroke-width="1.5"/>
  <text x="489.0" y="355" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">19才以下</text>
  <rect x="538.0" y="95.7" width="34" height="238.3" fill="#34D399" stroke="#047857" stroke-width="1.5"/>
  <text x="555.0" y="355" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">20才代</text>
  <rect x="604.0" y="171.5" width="34" height="162.5" fill="#34D399" stroke="#047857" stroke-width="1.5"/>
  <text x="621.0" y="355" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">30才代</text>
  <rect x="670.0" y="160.7" width="34" height="173.3" fill="#34D399" stroke="#047857" stroke-width="1.5"/>
  <text x="687.0" y="355" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">40才代</text>
  <rect x="736.0" y="149.8" width="34" height="184.2" fill="#34D399" stroke="#047857" stroke-width="1.5"/>
  <text x="753.0" y="355" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">50才代</text>
  <rect x="802.0" y="188.8" width="34" height="145.2" fill="#34D399" stroke="#047857" stroke-width="1.5"/>
  <text x="819.0" y="355" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">60才代</text>
  <rect x="868.0" y="110.8" width="34" height="223.2" fill="#34D399" stroke="#047857" stroke-width="1.5"/>
  <text x="885.0" y="355" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">70才以上</text>
  <text x="918" y="390" text-anchor="end" font-size="11.5" fill="#475569">（三重県警察資料）</text>
</svg>
