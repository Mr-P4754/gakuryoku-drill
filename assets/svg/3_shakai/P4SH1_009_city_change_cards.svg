<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="920" height="230" role="img" aria-label="市の様子のうつり変わりをまとめたア・イ・ウのカードと今">
  <style>
    text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; }
  </style>
  <rect width="920" height="230" fill="#FFFFFF"/>

  <!-- Card ア -->
  <rect x="18" y="20" width="232" height="190" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="44" cy="46" r="15" fill="#2563EB"/>
  <text x="44" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">ア</text>
  <!-- Small boat icon -->
  <g transform="translate(198, 36)">
    <polygon points="0,14 34,14 28,22 6,22" fill="#3B82F6"/>
    <polygon points="16,0 16,14 30,14" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
  </g>
  <text x="34" y="92" font-size="15.5" font-weight="600" fill="#0F172A">地いきの人びとは，</text>
  <text x="34" y="118" font-size="15.5" font-weight="600" fill="#0F172A">海に船で出て，魚を</text>
  <text x="34" y="144" font-size="15.5" font-weight="600" fill="#0F172A">とって生活をして</text>
  <text x="34" y="170" font-size="15.5" font-weight="600" fill="#0F172A">いました。</text>

  <!-- Arrow 1 -->
  <polygon points="262,107 282,107 282,99 298,115 282,131 282,123 262,123" fill="#475569"/>

  <!-- Card イ -->
  <rect x="308" y="20" width="232" height="190" rx="12" fill="#FEFCE8" stroke="#CA8A04" stroke-width="2"/>
  <circle cx="334" cy="46" r="15" fill="#CA8A04"/>
  <text x="334" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">イ</text>
  <!-- Small train icon -->
  <g transform="translate(486, 36)">
    <rect x="0" y="4" width="38" height="18" rx="3" fill="#F59E0B" stroke="#92400E" stroke-width="1.2"/>
    <rect x="5" y="8" width="9" height="7" fill="#E0F2FE"/><rect x="18" y="8" width="14" height="7" fill="#E0F2FE"/>
    <circle cx="9" cy="23" r="3" fill="#1E293B"/><circle cx="29" cy="23" r="3" fill="#1E293B"/>
  </g>
  <text x="324" y="92" font-size="15.5" font-weight="600" fill="#0F172A">地いきに鉄道が通り，</text>
  <text x="324" y="118" font-size="15.5" font-weight="600" fill="#0F172A">鉄道を使って仕事に</text>
  <text x="324" y="144" font-size="15.5" font-weight="600" fill="#0F172A">行く人が多く住む</text>
  <text x="324" y="170" font-size="15.5" font-weight="600" fill="#0F172A">ようになりました。</text>

  <!-- Arrow 2 -->
  <polygon points="552,107 572,107 572,99 588,115 572,131 572,123 552,123" fill="#475569"/>

  <!-- Card ウ -->
  <rect x="598" y="20" width="232" height="190" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <circle cx="624" cy="46" r="15" fill="#16A34A"/>
  <text x="624" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">ウ</text>
  <!-- Small building icon -->
  <g transform="translate(784, 32)">
    <rect x="0" y="6" width="16" height="22" fill="#22C55E" stroke="#14532D" stroke-width="1.2"/>
    <rect x="18" y="0" width="16" height="28" fill="#16A34A" stroke="#14532D" stroke-width="1.2"/>
    <rect x="4" y="11" width="4" height="4" fill="#FFFFFF"/><rect x="22" y="6" width="4" height="4" fill="#FFFFFF"/>
    <rect x="22" y="14" width="4" height="4" fill="#FFFFFF"/>
  </g>
  <text x="614" y="92" font-size="15.5" font-weight="600" fill="#0F172A">道路やマンションが</text>
  <text x="614" y="118" font-size="15.5" font-weight="600" fill="#0F172A">新しくつくられて，</text>
  <text x="614" y="144" font-size="15.5" font-weight="700" fill="#166534">小学校や図書館</text>
  <line x1="614" y1="149" x2="725" y2="149" stroke="#166534" stroke-width="2.2"/>
  <text x="728" y="144" font-size="15.5" font-weight="600" fill="#0F172A">も</text>
  <text x="614" y="170" font-size="15.5" font-weight="600" fill="#0F172A">ふえました。</text>

  <!-- Arrow 3 & 今 -->
  <polygon points="838,107 852,107 852,100 864,115 852,130 852,123 838,123" fill="#475569"/>
  <rect x="868" y="88" width="40" height="54" rx="8" fill="#1E293B"/>
  <text x="888" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">今</text>
</svg>
