<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" width="660" height="280">
  <rect width="660" height="280" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="330" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">明かりがつくつなぎ方・つかないつなぎ方（5つの例）</text>

  <!-- Top Section: LIT (2 patterns) -->
  <rect x="18" y="38" width="624" height="108" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="32" y="58" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#065F46">○ 明かりがつく（＋きょくと－きょく、豆電球の底と横の金ぞくが1つのわになる）</text>

  <!-- Pattern 1: Socket loop -->
  <g transform="translate(56, 66)">
    <rect width="250" height="72" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.4"/>
    <path d="M84,52 L44,52 L44,24 L118,24" fill="none" stroke="#1E293B" stroke-width="2.6"/>
    <path d="M166,52 L206,52 L206,24 L132,24" fill="none" stroke="#1E293B" stroke-width="2.6"/>
    <!-- Battery -->
    <rect x="82" y="46" width="6" height="12" rx="1" fill="#CBD5E1" stroke="#475569"/>
    <rect x="88" y="40" width="76" height="24" rx="3" fill="#10B981" stroke="#065F46" stroke-width="1.5"/>
    <rect x="88" y="40" width="18" height="24" rx="2" fill="#DC2626"/>
    <text x="97" y="56" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#FFF">＋</text>
    <text x="155" y="56" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#FFF">－</text>
    <!-- Lit Bulb -->
    <circle cx="125" cy="14" r="10" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
    <rect x="119" y="22" width="12" height="8" fill="#94A3B8" stroke="#475569"/>
    <text x="26" y="42" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#059669">○</text>
    <text x="228" y="42" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#065F46">回路①</text>
  </g>

  <!-- Pattern 2: Direct touch on + nub + wire from side to - -->
  <g transform="translate(352, 66)">
    <rect width="250" height="72" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.4"/>
    <!-- Vertical battery -->
    <rect x="114" y="32" width="22" height="36" rx="3" fill="#10B981" stroke="#065F46" stroke-width="1.5"/>
    <rect x="114" y="32" width="22" height="10" rx="2" fill="#DC2626"/>
    <rect x="120" y="26" width="10" height="6" fill="#CBD5E1" stroke="#475569"/>
    <text x="102" y="42" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#DC2626">＋</text>
    <text x="102" y="64" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#2563EB">－</text>
    <!-- Bulb sitting on + nub -->
    <circle cx="125" cy="11" r="9" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
    <rect x="120" y="18" width="10" height="8" fill="#94A3B8" stroke="#475569"/>
    <!-- Wire from bulb side around to bottom - -->
    <path d="M130,22 L166,22 L166,68 L125,68" fill="none" stroke="#1E293B" stroke-width="2.6"/>
    <text x="26" y="42" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#059669">○</text>
    <text x="210" y="42" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#065F46">回路②</text>
  </g>

  <!-- Bottom Section: UNLIT (3 patterns) -->
  <rect x="18" y="156" width="624" height="110" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="32" y="176" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#991B1B">× 明かりがつかない（わになっていない／同じきょくだけ／片方しかふれていない）</text>

  <!-- Pattern 3: Both wires on + pole only -->
  <g transform="translate(30, 184)">
    <rect width="188" height="74" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.4"/>
    <rect x="74" y="42" width="66" height="20" rx="3" fill="#10B981" stroke="#065F46"/>
    <rect x="74" y="42" width="16" height="20" fill="#DC2626"/>
    <rect x="69" y="47" width="5" height="10" fill="#CBD5E1" stroke="#475569"/>
    <path d="M69,50 L44,50 L44,24 L94,24 M69,54 L54,54 L54,30 L104,30" fill="none" stroke="#1E293B" stroke-width="2.2"/>
    <circle cx="99" cy="14" r="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/>
    <rect x="94" y="21" width="10" height="8" fill="#CBD5E1" stroke="#475569"/>
    <text x="20" y="42" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#DC2626">×</text>
    <text x="166" y="34" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10" fill="#991B1B">＋だけ</text>
  </g>

  <!-- Pattern 4: Open circuit (one wire disconnected) -->
  <g transform="translate(236, 184)">
    <rect width="188" height="74" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.4"/>
    <rect x="64" y="42" width="66" height="20" rx="3" fill="#10B981" stroke="#065F46"/>
    <rect x="64" y="42" width="16" height="20" fill="#DC2626"/>
    <rect x="59" y="47" width="5" height="10" fill="#CBD5E1" stroke="#475569"/>
    <path d="M59,52 L36,52 L36,24 L92,24" fill="none" stroke="#1E293B" stroke-width="2.2"/>
    <path d="M102,24 L152,24 L152,44" fill="none" stroke="#1E293B" stroke-width="2.2"/>
    <circle cx="97" cy="14" r="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/>
    <rect x="92" y="21" width="10" height="8" fill="#CBD5E1" stroke="#475569"/>
    <text x="18" y="42" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#DC2626">×</text>
    <text x="158" y="58" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="9.5" font-weight="bold" fill="#991B1B">はなれている</text>
  </g>

  <!-- Pattern 5: Both wires on side of bulb only (skipping bottom contact) -->
  <g transform="translate(442, 184)">
    <rect width="188" height="74" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.4"/>
    <rect x="64" y="42" width="66" height="20" rx="3" fill="#10B981" stroke="#065F46"/>
    <rect x="64" y="42" width="16" height="20" fill="#DC2626"/>
    <rect x="59" y="47" width="5" height="10" fill="#CBD5E1" stroke="#475569"/>
    <path d="M59,52 L38,52 L38,24 L92,24" fill="none" stroke="#1E293B" stroke-width="2.2"/>
    <path d="M130,52 L154,52 L154,24 L102,24" fill="none" stroke="#1E293B" stroke-width="2.2"/>
    <circle cx="97" cy="14" r="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/>
    <rect x="92" y="21" width="10" height="9" fill="#CBD5E1" stroke="#475569"/>
    <circle cx="97" cy="31" r="2.2" fill="#DC2626"/>
    <text x="18" y="42" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#DC2626">×</text>
    <text x="160" y="16" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10" fill="#991B1B">横だけ</text>
  </g>
</svg>
