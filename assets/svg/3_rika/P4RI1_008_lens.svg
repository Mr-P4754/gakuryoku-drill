<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260">
  <defs>
    <radialGradient id="hotSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lensG8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <rect width="600" height="260" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="300" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">虫めがねで日光を集める実験</text>

  <!-- Left: Magnifying lens focusing sunlight onto dark paper -->
  <rect x="20" y="40" width="320" height="204" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>

  <!-- Sunbeams coming down parallel from upper left -->
  <polygon points="88,46 178,46 218,124 128,124" fill="#FEF08A" opacity="0.45"/>
  <g stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="5,4">
    <line x1="100" y1="48" x2="140" y2="122"/>
    <line x1="133" y1="48" x2="173" y2="122"/>
    <line x1="166" y1="48" x2="206" y2="122"/>
  </g>
  <text x="64" y="72" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#B45309">日光</text>

  <!-- Dark paper on ground -->
  <polygon points="104,218 264,174 316,204 156,236" fill="#334155" stroke="#0F172A" stroke-width="1.8"/>
  <text x="86" y="202" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#1E293B">色のこい紙</text>
  <line x1="116" y1="198" x2="136" y2="204" stroke="#334155" stroke-width="1.3"/>

  <!-- Converging cone of light below lens -->
  <polygon points="138,128 210,128 216,204" fill="#FDE047" opacity="0.65"/>

  <!-- Focused bright spot & smoke wisps -->
  <circle cx="216" cy="204" r="18" fill="url(#hotSpot)"/>
  <circle cx="216" cy="204" r="4.5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <path d="M214,194 Q210,180 218,170 M222,192 Q228,178 222,168" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Magnifying lens angled perpendicular to rays -->
  <g transform="translate(174, 126) rotate(-14)">
    <ellipse cx="0" cy="0" rx="44" ry="12" fill="url(#lensG8)" fill-opacity="0.88" stroke="#0284C7" stroke-width="3.2"/>
    <line x1="44" y1="0" x2="94" y2="0" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="278" y="92" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#0369A1">虫めがね</text>

  <!-- Right: Spot size comparison -->
  <rect x="356" y="40" width="224" height="204" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="468" y="64" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">集めた大きさのくらべ方</text>

  <!-- Large dull spot -->
  <rect x="374" y="76" width="188" height="66" rx="8" fill="#334155"/>
  <circle cx="416" cy="109" r="22" fill="#FEF08A" opacity="0.45"/>
  <text x="450" y="104" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">集めたところが</text>
  <text x="450" y="122" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#FDE047">大きいとき</text>

  <!-- Small bright hot spot -->
  <rect x="374" y="154" width="188" height="76" rx="8" fill="#1E293B"/>
  <circle cx="416" cy="192" r="20" fill="url(#hotSpot)"/>
  <circle cx="416" cy="192" r="5" fill="#FFFFFF"/>
  <text x="450" y="177" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">小さく集めたとき</text>
  <text x="450" y="197" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#FDBA74">明るさ → [①]</text>
  <text x="450" y="216" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#FDBA74">温度 → [②]</text>
</svg>
