<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330">
  <rect width="640" height="330" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">記ろくカードのかき方</text>

  <!-- Left: Record Card -->
  <g transform="translate(22, 40)">
    <rect width="264" height="272" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <!-- Card header -->
    <rect x="12" y="10" width="240" height="28" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4"/>
    <text x="132" y="29" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#065F46">見つけた生き物</text>
    <!-- Date & Name row -->
    <rect x="12" y="44" width="240" height="26" rx="4" fill="#FEFCE8" stroke="#EAB308" stroke-width="1.2"/>
    <text x="24" y="62" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">7月5日</text>
    <text x="240" y="62" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">山田 たかこ</text>

    <!-- Drawing box with Praying Mantis (オオカマキリ) -->
    <rect x="12" y="76" width="240" height="114" rx="6" fill="#F0FDF4" stroke="#94A3B8" stroke-width="1.2"/>
    <g transform="translate(46, 94)">
      <!-- Antennae -->
      <path d="M22,22 Q10,6 4,2 M25,20 Q20,4 22,-4" fill="none" stroke="#15803D" stroke-width="1.3"/>
      <!-- Triangular head -->
      <polygon points="18,18 32,18 25,30" fill="#4ADE80" stroke="#15803D" stroke-width="1.6"/>
      <circle cx="20" cy="20" r="2.2" fill="#0F172A"/>
      <circle cx="30" cy="20" r="2.2" fill="#0F172A"/>
      <!-- Forelegs (raptorial) -->
      <path d="M32,32 L14,44 L22,56 L12,62" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M36,34 L24,48 L36,56 L30,64" fill="none" stroke="#15803D" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Long prothorax -->
      <path d="M27,26 L74,40" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>
      <path d="M27,26 L74,40" stroke="#15803D" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Winged abdomen -->
      <ellipse cx="118" cy="46" rx="48" ry="11" fill="#4ADE80" stroke="#15803D" stroke-width="1.6" transform="rotate(6 118 46)"/>
      <path d="M76,42 Q118,40 164,51" fill="none" stroke="#15803D" stroke-width="1.1"/>
      <path d="M90,48 L104,52 M110,49 L126,53 M130,50 L146,54" stroke="#15803D" stroke-width="1" opacity="0.7"/>
      <!-- Middle & hind legs -->
      <path d="M76,44 L68,66 L58,76" fill="none" stroke="#15803D" stroke-width="2" stroke-linejoin="round"/>
      <path d="M88,46 L104,64 L118,78" fill="none" stroke="#15803D" stroke-width="2" stroke-linejoin="round"/>
      <path d="M96,47 L126,58 L142,76" fill="none" stroke="#15803D" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="132" y="182" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#065F46">オオカマキリ</text>

    <!-- Notes box -->
    <rect x="12" y="196" width="240" height="66" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="20" y="214" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#334155">見つけた場所…草むらや花のまわり</text>
    <text x="20" y="233" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#334155">虫めがねを近づけると、前あしを</text>
    <text x="20" y="250" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#334155">上げたので、びっくりした。</text>
  </g>

  <!-- Right: 4 Callout boxes with pointers -->
  <!-- Box 1: ① ② -->
  <polygon points="300,97 318,90 318,104" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.4"/>
  <rect x="316" y="68" width="302" height="56" rx="10" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.6"/>
  <text x="330" y="91" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#1E293B">調べた日の <tspan font-weight="bold" fill="#B45309">[①]</tspan> と、</text>
  <text x="330" y="112" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#1E293B">調べた人の <tspan font-weight="bold" fill="#B45309">[②]</tspan> をかく。</text>

  <!-- Box 2: ③ -->
  <polygon points="300,154 318,147 318,161" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <rect x="316" y="132" width="302" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="330" y="161" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#1E293B">調べたことを <tspan font-weight="bold" fill="#047857">[③]</tspan> と文でくわしくかく。</text>

  <!-- Box 3: ④ -->
  <polygon points="300,208 318,201 318,215" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <rect x="316" y="188" width="302" height="46" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="330" y="216" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#1E293B">実物や <tspan font-weight="bold" fill="#1D4ED8">[④]</tspan> をはってもよい。</text>

  <!-- Box 4: ⑤ -->
  <polygon points="300,270 318,263 318,277" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.4"/>
  <rect x="316" y="242" width="302" height="58" rx="10" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="330" y="266" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#1E293B">わかったこと、感想や</text>
  <text x="330" y="287" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#1E293B"><tspan font-weight="bold" fill="#BE185D">[⑤]</tspan> をかく。</text>
</svg>
