<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260">
  <rect width="620" height="260" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="310" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">こん虫の食べ物やすみか</text>

  <!-- Left: Shoryobatta on grass -->
  <g transform="translate(20, 40)">
    <rect width="282" height="204" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <rect x="64" y="10" width="154" height="26" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.4"/>
    <text x="141" y="28" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#166534">ショウリョウバッタ</text>

    <!-- Grass blades -->
    <g transform="translate(0, -14)">
      <path d="M16,174 Q112,118 264,76 Q178,128 36,184 Z" fill="#4ADE80" stroke="#15803D" stroke-width="1.5"/>
      <path d="M108,184 Q168,122 246,120 Q186,144 134,186 Z" fill="#86EFAC" stroke="#15803D" stroke-width="1.3"/>
      <path d="M40,184 Q78,104 128,66 Q94,122 64,184 Z" fill="#22C55E" stroke="#15803D" stroke-width="1.3" opacity="0.7"/>
      <!-- Slender Shoryobatta grasshopper -->
      <g transform="translate(62, 74)">
        <path d="M14,68 L138,26 L160,16 L138,38 L22,76 Z" fill="#84CC16" stroke="#3F6212" stroke-width="1.6"/>
        <polygon points="134,26 168,12 142,36" fill="#A3E635" stroke="#3F6212" stroke-width="1.5"/>
        <circle cx="152" cy="22" r="2.5" fill="#0F172A"/>
        <path d="M166,13 L184,2 M167,15 L186,8" stroke="#3F6212" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M98,42 L56,8 L18,64" fill="none" stroke="#3F6212" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M126,38 L136,54 L144,58 M112,42 L116,60 L122,64" fill="none" stroke="#3F6212" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="141" y="192" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#166534">[①] にすみ、草を食べる</text>
  </g>

  <!-- Right: Cicada on tree trunk -->
  <g transform="translate(318, 40)">
    <rect width="282" height="204" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="86" y="10" width="110" height="26" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/>
    <text x="141" y="28" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#92400E">セ　ミ</text>

    <!-- Tree trunk background -->
    <rect x="44" y="44" width="194" height="128" fill="#D6B48C" stroke="#92400E" stroke-width="1.4"/>
    <g stroke="#92400E" stroke-width="1.3" opacity="0.45">
      <path d="M68,46 L64,170 M94,46 L98,170 M184,46 L180,170 M212,46 L216,170"/>
      <path d="M80,76 L80,124 M198,64 L198,118"/>
    </g>
    <!-- Cicada perched vertically -->
    <g transform="translate(141, 108)">
      <!-- Legs -->
      <g stroke="#451A03" stroke-width="2.2" fill="none" stroke-linecap="round">
        <path d="M-16,-24 L-32,-34 L-36,-44"/>
        <path d="M16,-24 L32,-34 L36,-44"/>
        <path d="M-18,-8 L-36,-10 L-42,-2"/>
        <path d="M18,-8 L36,-10 L42,-2"/>
        <path d="M-16,10 L-32,18 L-36,28"/>
        <path d="M16,10 L32,18 L36,28"/>
      </g>
      <!-- Head & Thorax -->
      <ellipse cx="0" cy="-30" rx="18" ry="10" fill="#78350F" stroke="#451A03" stroke-width="1.5"/>
      <circle cx="-16" cy="-32" r="4.5" fill="#1E293B"/>
      <circle cx="16" cy="-32" r="4.5" fill="#1E293B"/>
      <ellipse cx="0" cy="-14" rx="20" ry="14" fill="#92400E" stroke="#451A03" stroke-width="1.5"/>
      <!-- Brown patterned wings -->
      <path d="M-14,-18 C-30,6 -28,44 -12,56 C-2,44 -2,6 -2,-12 Z" fill="#B45309" fill-opacity="0.82" stroke="#451A03" stroke-width="1.6"/>
      <path d="M14,-18 C30,6 28,44 12,56 C2,44 2,6 2,-12 Z" fill="#B45309" fill-opacity="0.82" stroke="#451A03" stroke-width="1.6"/>
      <!-- Wing vein lattice -->
      <path d="M-16,4 L-10,46 M-22,18 L-6,26 M16,4 L10,46 M22,18 L6,26" stroke="#FEF3C7" stroke-width="1" opacity="0.65"/>
    </g>
    <text x="141" y="192" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#92400E">木にすみ、[②] をすう</text>
  </g>
</svg>
