      <rect x="0" y="0" width="46" height="26" rx="2" fill="#EF4444" stroke="#1E293B" stroke-width="1.5"/>
      <rect x="46" y="0" width="46" height="26" rx="2" fill="#3B82F6" stroke="#1E293B" stroke-width="1.5"/>
      <text x="23" y="18" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">N</text>
      <text x="69" y="18" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">S</text>
