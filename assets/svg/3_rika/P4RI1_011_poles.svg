    <text x="254" y="20" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">S</text>
    <!-- Chains of clips hanging heavily from N end -->
    <g fill="none" stroke="#475569" stroke-width="2.2">
      <rect x="4" y="28" width="10" height="20" rx="5"/><rect x="4" y="45" width="10" height="20" rx="5"/><rect x="4" y="62" width="10" height="20" rx="5"/>
