<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
  <defs>
    <marker id="arrRed9" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#EA580C"/>
    </marker>
    <marker id="arrRed9Rev" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,1 L1,5 L10,9 z" fill="#EA580C"/>
    </marker>
  </defs>

  <rect width="640" height="270" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">風の強さと車の動くきょり</text>

  <!-- Start line -->
  <line x1="128" y1="42" x2="128" y2="254" stroke="#64748B" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="128" y="264" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#475569">スタート線</text>

  <!-- Top lane: STRONG wind -->
  <rect x="18" y="44" width="604" height="96" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <!-- Label badge -->
  <rect x="524" y="54" width="86" height="26" rx="6" fill="#2563EB"/>
  <text x="567" y="72" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">強い風</text>

  <!-- Electric fan (strong) -->
  <g transform="translate(56, 86)">
    <rect x="-18" y="26" width="36" height="10" rx="4" fill="#475569"/>
    <rect x="-6" y="12" width="12" height="16" fill="#64748B"/>
    <circle cx="0" cy="-6" r="24" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.4"/>
    <path d="M0,-6 L14,-16 M0,-6 L14,6 M0,-6 L-14,-10 M0,-6 L-10,12" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="5" fill="#1E40AF"/>
  </g>
  <!-- Strong wind waves -->
  <g stroke="#2563EB" stroke-width="2.8" fill="none" stroke-linecap="round">
    <path d="M92,70 Q116,60 140,70 T188,70"/>
    <path d="M94,86 Q120,76 146,86 T198,86"/>
    <path d="M92,102 Q116,92 140,102 T188,102"/>
  </g>
  <!-- Sail car far right -->
  <g transform="translate(446, 66)">
    <!-- Sail -->
    <path d="M12,34 L12,0 Q34,12 18,34 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <!-- Car body -->
    <rect x="0" y="32" width="56" height="14" rx="4" fill="#F97316" stroke="#9A3412" stroke-width="1.6"/>
    <!-- Wheels -->
    <circle cx="14" cy="48" r="7" fill="#1E293B"/><circle cx="14" cy="48" r="2.5" fill="#CBD5E1"/>
    <circle cx="42" cy="48" r="7" fill="#1E293B"/><circle cx="42" cy="48" r="2.5" fill="#CBD5E1"/>
  </g>
  <!-- Distance arrow -->
  <line x1="134" y1="126" x2="442" y2="126" stroke="#EA580C" stroke-width="2.4" marker-start="url(#arrRed9Rev)" marker-end="url(#arrRed9)"/>
  <text x="288" y="121" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#C2410C">動いたきょり（遠くまで動く！）</text>

  <!-- Bottom lane: WEAK wind -->
  <rect x="18" y="152" width="604" height="96" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="524" y="162" width="86" height="26" rx="6" fill="#64748B"/>
  <text x="567" y="180" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">弱い風</text>

  <!-- Electric fan (weak) -->
  <g transform="translate(56, 194)">
    <rect x="-18" y="26" width="36" height="10" rx="4" fill="#64748B"/>
    <rect x="-6" y="12" width="12" height="16" fill="#94A3B8"/>
    <circle cx="0" cy="-6" r="24" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <path d="M0,-6 L12,-14 M0,-6 L12,4 M0,-6 L-12,-8 M0,-6 L-8,10" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="5" fill="#475569"/>
  </g>
  <!-- Weak wind waves -->
  <g stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="5,4">
    <path d="M92,184 Q112,178 132,184 T168,184"/>
    <path d="M92,198 Q112,192 132,198 T168,198"/>
  </g>
  <!-- Sail car closer -->
  <g transform="translate(268, 174)">
    <path d="M12,34 L12,0 Q34,12 18,34 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="0" y="32" width="56" height="14" rx="4" fill="#FB923C" stroke="#9A3412" stroke-width="1.6"/>
    <circle cx="14" cy="48" r="7" fill="#1E293B"/><circle cx="14" cy="48" r="2.5" fill="#CBD5E1"/>
    <circle cx="42" cy="48" r="7" fill="#1E293B"/><circle cx="42" cy="48" r="2.5" fill="#CBD5E1"/>
  </g>
  <!-- Shorter distance arrow -->
  <line x1="134" y1="234" x2="264" y2="234" stroke="#EA580C" stroke-width="2.2" marker-start="url(#arrRed9Rev)" marker-end="url(#arrRed9)"/>
  <text x="199" y="229" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#C2410C">動いたきょり</text>
</svg>
