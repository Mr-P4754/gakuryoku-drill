<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270">
  <defs>
    <radialGradient id="soilPile" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#D6A87C"/>
      <stop offset="100%" stop-color="#9C6B3E"/>
    </radialGradient>
    <marker id="arrBlk" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="600" height="270" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="300" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">地面の温度のはかり方</text>

  <!-- Sun upper-left (①) -->
  <g transform="translate(66, 74)">
    <circle cx="0" cy="0" r="18" fill="#FACC15" stroke="#EA580C" stroke-width="2"/>
    <g stroke="#EA580C" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-26" x2="0" y2="-21"/><line x1="0" y1="21" x2="0" y2="26"/>
      <line x1="-26" y1="0" x2="-21" y2="0"/><line x1="21" y1="0" x2="26" y2="0"/>
      <line x1="-18" y1="-18" x2="-15" y2="-15"/><line x1="15" y1="15" x2="18" y2="18"/>
      <line x1="18" y1="-18" x2="15" y2="-15"/><line x1="-15" y1="15" x2="-18" y2="18"/>
    </g>
  </g>
  <circle cx="106" cy="54" r="13" fill="#FEF3C7" stroke="#EA580C" stroke-width="1.8"/>
  <text x="106" y="59" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#C2410C">①</text>

  <!-- Sunlight rays blocked by cover -->
  <g stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,4">
    <line x1="88" y1="88" x2="186" y2="122"/>
    <line x1="94" y1="80" x2="224" y2="112"/>
  </g>

  <!-- Ground soil bed -->
  <ellipse cx="290" cy="206" rx="196" ry="38" fill="#E7D3B8" stroke="#B45309" stroke-width="1.4" opacity="0.85"/>
  <!-- Soil dots -->
  <g fill="#92400E" opacity="0.4">
    <circle cx="160" cy="204" r="1.5"/><circle cx="188" cy="216" r="1.5"/><circle cx="240" cy="222" r="1.5"/>
    <circle cx="310" cy="218" r="1.5"/><circle cx="362" cy="208" r="1.5"/><circle cx="404" cy="214" r="1.5"/>
    <circle cx="272" cy="196" r="1.5"/><circle cx="332" cy="198" r="1.5"/>
  </g>

  <!-- Thermometer case (prop support underneath) -->
  <g transform="rotate(40 326 196)">
    <rect x="242" y="186" width="176" height="16" rx="6" fill="#CBD5E1" stroke="#475569" stroke-width="1.6"/>
    <circle cx="408" cy="194" r="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  </g>

  <!-- Thermometer resting tilted across the case -->
  <g transform="rotate(-11 280 184)">
    <rect x="180" y="177" width="198" height="12" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
    <!-- Red alcohol column -->
    <rect x="188" y="181" width="102" height="4" rx="2" fill="#EF4444"/>
    <!-- Bulb (③) -->
    <ellipse cx="188" cy="183" rx="9" ry="5" fill="#DC2626" stroke="#991B1B" stroke-width="1.2"/>
    <!-- Scale ticks -->
    <g stroke="#475569" stroke-width="0.9">
      <line x1="215" y1="178" x2="215" y2="181"/><line x1="235" y1="178" x2="235" y2="181"/>
      <line x1="255" y1="178" x2="255" y2="181"/><line x1="275" y1="178" x2="275" y2="181"/>
      <line x1="295" y1="178" x2="295" y2="181"/><line x1="315" y1="178" x2="315" y2="181"/>
      <line x1="335" y1="178" x2="335" y2="181"/><line x1="355" y1="178" x2="355" y2="181"/>
    </g>
  </g>

  <!-- Small mound of soil covering the bulb (④) -->
  <path d="M138,208 Q182,174 224,208 Q182,222 138,208 Z" fill="url(#soilPile)" fill-opacity="0.72" stroke="#78350F" stroke-width="1.4" stroke-dasharray="3,2"/>

  <!-- Curved cardboard shade cover (おおい) -->
  <g transform="rotate(-10 278 124)">
    <path d="M168,128 C168,104 190,104 190,128 L372,128 C372,104 350,104 350,128" fill="#FEF9C3" stroke="#92400E" stroke-width="1.8"/>
    <path d="M174,108 L356,108 C368,108 372,118 372,128 L190,128 C190,118 184,108 174,108 Z" fill="#FDE68A" stroke="#92400E" stroke-width="1.8"/>
  </g>
  <!-- Downward arrow かぶせる -->
  <line x1="264" y1="138" x2="264" y2="162" stroke="#334155" stroke-width="3" marker-end="url(#arrBlk)"/>
  <text x="252" y="156" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#1E293B">かぶせる</text>

  <!-- Labels & Callouts -->
  <line x1="230" y1="98" x2="210" y2="70" stroke="#475569" stroke-width="1.3"/>
  <text x="210" y="64" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#78350F">おおい（あつ紙など）</text>

  <line x1="378" y1="162" x2="438" y2="146" stroke="#475569" stroke-width="1.3"/>
  <text x="444" y="151" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">温度計</text>

  <line x1="398" y1="226" x2="440" y2="214" stroke="#475569" stroke-width="1.3"/>
  <text x="446" y="219" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#334155">温度計のケース</text>

  <!-- Badges ③ (bulb) and ④ (soil mound) -->
  <line x1="184" y1="196" x2="108" y2="232" stroke="#DC2626" stroke-width="1.6"/>
  <circle cx="94" cy="236" r="13" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="94" y="241" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#B91C1C">③</text>
  <text x="58" y="241" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#991B1B">赤い先</text>

  <line x1="166" y1="194" x2="112" y2="174" stroke="#92400E" stroke-width="1.6"/>
  <circle cx="98" cy="170" r="13" fill="#FEF3C7" stroke="#92400E" stroke-width="2"/>
  <text x="98" y="175" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#78350F">④</text>
  <text x="80" y="175" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#78350F">かける</text>
</svg>
