<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
    <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="soil2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6A87C"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <rect width="680" height="420" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="340" y="28" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15.5" font-weight="bold" fill="#065F46">ホウセンカの育ち方</text>

  <!-- Panel 1: たねをまく -->
  <g transform="translate(24, 42)">
    <rect width="190" height="154" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Pot -->
    <polygon points="56,90 134,90 124,142 66,142" fill="url(#potGrad)" stroke="#92400E" stroke-width="1.6"/>
    <rect x="50" y="80" width="90" height="12" rx="3" fill="#F59E0B" stroke="#92400E" stroke-width="1.6"/>
    <ellipse cx="95" cy="83" rx="36" ry="5" fill="#78350F"/>
    <!-- Seed dropping in -->
    <circle cx="62" cy="40" r="4.5" fill="#78350F" stroke="#451A03" stroke-width="1.2"/>
    <path d="M68,45 Q84,54 91,72" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrDark)"/>
    <text x="80" y="34" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#78350F">たね</text>
    <text x="95" y="172" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#334155">たねをまく</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="218" y1="118" x2="239" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arrDark)"/>

  <!-- Panel 2: めが出る (A = ①) -->
  <g transform="translate(245, 42)">
    <rect width="190" height="154" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Pot -->
    <polygon points="56,94 134,94 124,142 66,142" fill="url(#potGrad)" stroke="#92400E" stroke-width="1.6"/>
    <rect x="50" y="84" width="90" height="12" rx="3" fill="#F59E0B" stroke="#92400E" stroke-width="1.6"/>
    <ellipse cx="95" cy="87" rx="36" ry="5" fill="#78350F"/>
    <!-- Seedling cotyledons -->
    <line x1="95" y1="86" x2="95" y2="54" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/>
    <path d="M95,56 C84,42 54,44 54,58 C56,68 82,66 95,58 Z" fill="#4ADE80" stroke="#15803D" stroke-width="1.6"/>
    <path d="M95,56 C106,42 136,44 136,58 C134,68 108,66 95,58 Z" fill="#4ADE80" stroke="#15803D" stroke-width="1.6"/>
    <path d="M95,54 L92,46 M95,54 L98,46" stroke="#15803D" stroke-width="1.5"/>
    <!-- Pointer A -->
    <line x1="120" y1="48" x2="148" y2="24" stroke="#059669" stroke-width="1.6"/>
    <circle cx="158" cy="22" r="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
    <text x="158" y="27" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#065F46">A</text>
    <text x="95" y="172" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#334155">めが出る（A＝①）</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="439" y1="118" x2="460" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arrDark)"/>

  <!-- Panel 3: ②葉, ③くき, ④根 -->
  <g transform="translate(466, 42)">
    <rect width="190" height="154" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Underground soil section -->
    <rect x="1" y="96" width="188" height="57" rx="0" fill="url(#soil2)" opacity="0.38"/>
    <line x1="2" y1="96" x2="188" y2="96" stroke="#92400E" stroke-width="1.5"/>
    <!-- Roots (④) -->
    <g stroke="#92400E" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M84,96 Q74,114 54,126 M84,96 Q78,122 68,144"/>
      <path d="M84,96 Q84,124 84,146"/>
      <path d="M84,96 Q92,120 104,142 M84,96 Q100,112 118,126"/>
      <path d="M68,118 L52,136 M98,118 L114,138 M76,128 L64,140"/>
    </g>
    <!-- Stem (③) -->
    <path d="M84,96 L84,22" stroke="#16A34A" stroke-width="5" stroke-linecap="round"/>
    <!-- Pointed balsam leaves (②) -->
    <g fill="#22C55E" stroke="#15803D" stroke-width="1.3">
      <path d="M84,24 Q72,10 84,6 Q96,10 84,24 Z"/>
      <path d="M82,42 Q50,24 40,34 Q52,48 82,46 Z"/>
      <path d="M86,42 Q118,24 128,34 Q116,48 86,46 Z"/>
      <path d="M82,64 Q48,50 42,60 Q54,72 82,68 Z"/>
      <path d="M86,64 Q120,50 126,60 Q114,72 86,68 Z"/>
      <path d="M82,82 Q60,74 56,82 Q66,89 82,85 Z"/>
      <path d="M86,82 Q108,74 112,82 Q102,89 86,85 Z"/>
    </g>
    <!-- Pointers ②, ③, ④ -->
    <line x1="118" y1="36" x2="146" y2="36" stroke="#059669" stroke-width="1.5"/>
    <circle cx="160" cy="36" r="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
    <text x="160" y="41" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#065F46">②</text>

    <line x1="88" y1="74" x2="146" y2="74" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="160" cy="74" r="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
    <text x="160" y="79" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#0369A1">③</text>

    <line x1="108" y1="124" x2="146" y2="124" stroke="#B45309" stroke-width="1.5"/>
    <circle cx="160" cy="124" r="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
    <text x="160" y="129" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#92400E">④</text>
    <text x="95" y="172" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#334155">②・③・④が大きくなる</text>
  </g>

  <!-- Connector arrow from row 1 to row 2 -->
  <path d="M560,218 L560,226 L118,226 L118,236" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrDark)"/>

  <!-- Panel 4: ⑤花がさく -->
  <g transform="translate(24, 242)">
    <rect width="190" height="148" rx="10" fill="#FFFDF7" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="12" y1="138" x2="178" y2="138" stroke="#92400E" stroke-width="1.5"/>
    <!-- Stem & branches -->
    <path d="M95,138 L95,22" stroke="#16A34A" stroke-width="5" stroke-linecap="round"/>
    <!-- Leaves -->
    <g fill="#22C55E" stroke="#15803D" stroke-width="1.2">
      <path d="M93,34 Q64,20 56,28 Q68,40 93,38 Z"/>
      <path d="M97,34 Q126,20 134,28 Q122,40 97,38 Z"/>
      <path d="M93,64 Q56,48 46,58 Q60,72 93,68 Z"/>
      <path d="M97,64 Q134,48 144,58 Q130,72 97,68 Z"/>
      <path d="M93,96 Q58,82 50,92 Q64,104 93,100 Z"/>
      <path d="M97,96 Q132,82 140,92 Q126,104 97,100 Z"/>
    </g>
    <!-- Pink balsam flowers -->
    <g fill="#F43F5E" stroke="#9F1239" stroke-width="1.1">
      <circle cx="80" cy="52" r="8"/><circle cx="72" cy="58" r="6"/><circle cx="84" cy="60" r="6"/>
      <circle cx="112" cy="54" r="8"/><circle cx="120" cy="60" r="6"/><circle cx="108" cy="62" r="6"/>
      <circle cx="78" cy="84" r="8"/><circle cx="70" cy="90" r="6"/><circle cx="84" cy="92" r="6"/>
      <circle cx="114" cy="86" r="8"/><circle cx="122" cy="92" r="6"/><circle cx="108" cy="94" r="6"/>
    </g>
    <g fill="#FEF08A">
      <circle cx="78" cy="56" r="2.5"/><circle cx="114" cy="58" r="2.5"/>
      <circle cx="78" cy="88" r="2.5"/><circle cx="114" cy="90" r="2.5"/>
    </g>
    <circle cx="164" cy="24" r="13" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/>
    <text x="164" y="29" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#BE123C">⑤</text>
    <text x="95" y="166" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#334155">⑤がさく</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="218" y1="316" x2="239" y2="316" stroke="#475569" stroke-width="2" marker-end="url(#arrDark)"/>

  <!-- Panel 5: ⑥実ができる -->
  <g transform="translate(245, 242)">
    <rect width="190" height="148" rx="10" fill="#F0FDF4" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="12" y1="138" x2="178" y2="138" stroke="#92400E" stroke-width="1.5"/>
    <path d="M95,138 L95,22" stroke="#15803D" stroke-width="5" stroke-linecap="round"/>
    <!-- Leaves -->
    <g fill="#22C55E" stroke="#15803D" stroke-width="1.2">
      <path d="M93,34 Q64,20 56,28 Q68,40 93,38 Z"/>
      <path d="M97,34 Q126,20 134,28 Q122,40 97,38 Z"/>
      <path d="M93,68 Q56,52 46,62 Q60,76 93,72 Z"/>
      <path d="M97,68 Q134,52 144,62 Q130,76 97,72 Z"/>
      <path d="M93,102 Q58,88 50,98 Q64,110 93,106 Z"/>
      <path d="M97,102 Q132,88 140,98 Q126,110 97,106 Z"/>
    </g>
    <!-- Plump green seed pods -->
    <g fill="#84CC16" stroke="#3F6212" stroke-width="1.5">
      <ellipse cx="78" cy="58" rx="8" ry="12" transform="rotate(-28 78 58)"/>
      <ellipse cx="114" cy="60" rx="8" ry="12" transform="rotate(28 114 60)"/>
      <ellipse cx="76" cy="92" rx="8.5" ry="13" transform="rotate(-24 76 92)"/>
      <ellipse cx="115" cy="94" rx="8.5" ry="13" transform="rotate(24 115 94)"/>
    </g>
    <circle cx="164" cy="24" r="13" fill="#ECFCCB" stroke="#65A30D" stroke-width="2"/>
    <text x="164" y="29" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#3F6212">⑥</text>
    <text x="95" y="166" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#334155">⑥ができる</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="439" y1="316" x2="460" y2="316" stroke="#475569" stroke-width="2" marker-end="url(#arrDark)"/>

  <!-- Panel 6: ⑦かれる -->
  <g transform="translate(466, 242)">
    <rect width="190" height="148" rx="10" fill="#FFFBEB" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="12" y1="138" x2="178" y2="138" stroke="#92400E" stroke-width="1.5"/>
    <!-- Drooping brown withered stem -->
    <path d="M98,138 Q88,92 66,68 Q44,50 32,76" fill="none" stroke="#A16207" stroke-width="5" stroke-linecap="round"/>
    <path d="M84,96 Q116,74 148,92" fill="none" stroke="#A16207" stroke-width="4" stroke-linecap="round"/>
    <!-- Curled dry brown leaves -->
    <g fill="#CA8A04" stroke="#713F12" stroke-width="1.3">
      <path d="M62,68 Q46,84 44,98 Q56,94 64,76 Z"/>
      <path d="M36,74 Q24,90 30,104 Q40,94 40,78 Z"/>
      <path d="M116,84 Q124,104 116,114 Q106,104 112,86 Z"/>
      <path d="M144,92 Q158,108 152,120 Q140,112 140,94 Z"/>
      <!-- Fallen dry leaf -->
      <ellipse cx="42" cy="133" rx="14" ry="5" fill="#B45309"/>
    </g>
    <!-- Burst seeds -->
    <circle cx="122" cy="128" r="2.6" fill="#451A03"/>
    <circle cx="132" cy="132" r="2.6" fill="#451A03"/>
    <circle cx="114" cy="133" r="2.6" fill="#451A03"/>
    <circle cx="164" cy="24" r="13" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="164" y="29" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#92400E">⑦</text>
    <text x="95" y="166" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#334155">やがて ⑦</text>
  </g>
</svg>
