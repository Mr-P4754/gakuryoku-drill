<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250">
  <defs>
    <linearGradient id="vibBig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="vibSmall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="620" height="250" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="310" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">わゴムをはじいて音を出したときのようす</text>

  <!-- Left: Tissue box with rubber band -->
  <g transform="translate(22, 42)">
    <rect width="266" height="192" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <!-- Tissue box -->
    <rect x="34" y="64" width="198" height="72" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <rect x="34" y="114" width="198" height="22" rx="3" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Dark hole opening -->
    <ellipse cx="133" cy="90" rx="74" ry="16" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Stretched rubber band -->
    <line x1="34" y1="90" x2="232" y2="90" stroke="#EA580C" stroke-width="3.2"/>
    <!-- Vibration blur lines around center -->
    <path d="M58,90 Q133,76 208,90 M58,90 Q133,104 208,90" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Finger plucking -->
    <path d="M126,158 L126,102 C126,94 140,94 140,102 L140,158" fill="#FEF3C7" stroke="#92400E" stroke-width="1.8"/>
    <path d="M112,158 C112,140 154,140 154,158 L154,182 L112,182 Z" fill="#FEF3C7" stroke="#92400E" stroke-width="1.8"/>
    <ellipse cx="133" cy="102" rx="4.5" ry="5" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
    <!-- Label わゴム -->
    <line x1="88" y1="86" x2="88" y2="46" stroke="#EA580C" stroke-width="1.4"/>
    <text x="88" y="40" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#C2410C">わゴム</text>
  </g>

  <!-- Right: Big vs Small sound vibration photos -->
  <g transform="translate(304, 42)">
    <rect width="294" height="192" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>

    <!-- ●音が大きいとき -->
    <text x="18" y="26" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#B91C1C">● 音が大きいとき</text>
    <rect x="18" y="34" width="258" height="58" rx="6" fill="#1E293B"/>
    <!-- Wide spindle blur -->
    <path d="M24,63 Q147,36 270,63 Q147,90 24,63 Z" fill="url(#vibBig)"/>
    <path d="M24,63 Q147,42 270,63" fill="none" stroke="#FEF08A" stroke-width="1.6"/>
    <path d="M24,63 Q147,84 270,63" fill="none" stroke="#FEF08A" stroke-width="1.6"/>
    <!-- Amplitude double arrow -->
    <line x1="147" y1="42" x2="147" y2="84" stroke="#F87171" stroke-width="2" stroke-dasharray="3,2"/>

    <!-- ●音が小さいとき -->
    <text x="18" y="116" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#0369A1">● 音が小さいとき</text>
    <rect x="18" y="124" width="258" height="54" rx="6" fill="#1E293B"/>
    <!-- Narrow spindle blur -->
    <path d="M24,151 Q147,142 270,151 Q147,160 24,151 Z" fill="url(#vibSmall)"/>
    <path d="M24,151 Q147,144 270,151" fill="none" stroke="#BAE6FD" stroke-width="1.3"/>
    <path d="M24,151 Q147,158 270,151" fill="none" stroke="#BAE6FD" stroke-width="1.3"/>
  </g>
</svg>
