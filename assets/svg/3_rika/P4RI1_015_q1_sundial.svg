<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="580" height="270">
  <rect width="580" height="270" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="290" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">ある日の正午の日時計のようす</text>

  <!-- Isometric Lidded Box -->
  <g transform="translate(290, 152)">
    <!-- Box front & right side walls -->
    <polygon points="-172,26 112,26 112,68 -172,68" fill="#E2E8F0" stroke="#475569" stroke-width="1.8"/>
    <polygon points="112,26 184,-34 184,8 112,68" fill="#CBD5E1" stroke="#475569" stroke-width="1.8"/>
    <!-- Lid lip line -->
    <line x1="-172" y1="36" x2="112" y2="36" stroke="#64748B" stroke-width="1.3"/>
    <line x1="112" y1="36" x2="184" y2="-24" stroke="#64748B" stroke-width="1.3"/>

    <!-- Box top lid surface (parallelogram) -->
    <!-- Corners: Back-Left (-100,-34), Back-Right (184,-34), Front-Right (112,26), Front-Left (-172,26) -->
    <!-- Center: (6, -4) -->
    <polygon points="-100,-34 184,-34 112,26 -172,26" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>

    <!-- Crosshair lines through center (6, -4) -->
    <!-- Left-Right line (あ - う): (-136,-4) to (148,-4) -->
    <line x1="-136" y1="-4" x2="148" y2="-4" stroke="#64748B" stroke-width="1.6"/>
    <!-- Back-Front line (え - い): (42,-34) to (-30,26) -->
    <line x1="42" y1="-34" x2="-30" y2="26" stroke="#64748B" stroke-width="1.6"/>

    <!-- Pencil shadow extending down-front along line toward い! -->
    <!-- Center (6,-4) toward front-left (-30,26): direction (-36, +30) -->
    <polygon points="0,-4 12,-4 -24,22 -30,22" fill="#64748B" opacity="0.72"/>

    <!-- Upright Pencil at center (6, -4) -->
    <g transform="translate(6, -4)">
      <!-- Yellow hexagonal shaft -->
      <rect x="-6" y="-86" width="12" height="86" fill="#FACC15" stroke="#854D0E" stroke-width="1.5"/>
      <line x1="-2" y1="-86" x2="-2" y2="0" stroke="#CA8A04" stroke-width="1"/>
      <line x1="2" y1="-86" x2="2" y2="0" stroke="#CA8A04" stroke-width="1"/>
      <!-- Sharpened wood tip & graphite lead -->
      <polygon points="-6,-86 6,-86 0,-106" fill="#FDE68A" stroke="#854D0E" stroke-width="1.5"/>
      <polygon points="-2.5,-98 2.5,-98 0,-106" fill="#1E293B"/>
      <!-- Base ring -->
      <ellipse cx="0" cy="0" rx="6" ry="2.5" fill="#B45309"/>
    </g>

    <!-- 4 Circled direction markers あ, い, う, え matching PDF p.29 EXACTLY -->
    <!-- あ (Left arm = East) -->
    <circle cx="-86" cy="-4" r="15" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="-86" y="1" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#1D4ED8">あ</text>

    <!-- い (Front/Bottom arm = North, where noon shadow points!) -->
    <circle cx="-38" cy="14" r="15" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="-38" y="19" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">い</text>

    <!-- う (Right arm = West) -->
    <circle cx="96" cy="-4" r="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="96" y="1" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#B45309">う</text>

    <!-- え (Back/Top arm = South, opposite the shadow!) -->
    <circle cx="38" cy="-22" r="15" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
    <text x="38" y="-17" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#BE185D">え</text>

    <!-- Pointer label for えんぴつのかげ -->
    <line x1="-10" y1="8" x2="-96" y2="-66" stroke="#334155" stroke-width="1.6"/>
    <rect x="-184" y="-88" width="126" height="28" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <text x="-121" y="-69" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">えんぴつのかげ</text>
  </g>
  <text x="290" y="252" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" fill="#475569">正午（太陽が南にあるとき）のかげの向きから、あ〜えの方位を考えよう</text>
</svg>
