<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250">
  <rect width="640" height="250" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">音がつたわるときのようす</text>

  <!-- Left panel: String telephone (糸電話) -->
  <g transform="translate(18, 40)">
    <rect width="294" height="194" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="64" y="8" width="166" height="24" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.3"/>
    <text x="147" y="25" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#065F46">糸電話で話すとき</text>

    <!-- Left child (listening) -->
    <g transform="translate(26, 62)">
      <circle cx="28" cy="24" r="18" fill="#FEF3C7" stroke="#92400E" stroke-width="1.6"/>
      <path d="M10,22 Q28,0 46,22 Q36,12 10,22 Z" fill="#334155"/>
      <circle cx="24" cy="24" r="2" fill="#0F172A"/>
      <circle cx="34" cy="24" r="2" fill="#0F172A"/>
      <path d="M25,33 Q29,36 33,33" fill="none" stroke="#92400E" stroke-width="1.4"/>
      <path d="M10,44 L46,44 L52,118 L4,118 Z" fill="#F472B6" stroke="#BE185D" stroke-width="1.6"/>
      <!-- Cup at ear -->
      <polygon points="44,18 62,22 62,36 44,40" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8"/>
    </g>

    <!-- Right child (speaking) -->
    <g transform="translate(210, 62)">
      <circle cx="28" cy="24" r="18" fill="#FEF3C7" stroke="#92400E" stroke-width="1.6"/>
      <path d="M10,22 Q28,0 46,22 Z" fill="#1E293B"/>
      <circle cx="22" cy="24" r="2" fill="#0F172A"/>
      <path d="M10,44 L46,44 L52,118 L4,118 Z" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.6"/>
      <!-- Cup at mouth -->
      <polygon points="10,22 -8,24 -8,38 10,40" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8"/>
    </g>

    <!-- Taut string & vibration marks -->
    <line x1="88" y1="91" x2="202" y2="91" stroke="#EA580C" stroke-width="2.4"/>
    <path d="M106,82 Q114,76 122,82 M138,82 Q146,76 154,82 M170,82 Q178,76 186,82" fill="none" stroke="#F97316" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M106,100 Q114,106 122,100 M138,100 Q146,106 154,100 M170,100 Q178,106 186,100" fill="none" stroke="#F97316" stroke-width="1.8" stroke-linecap="round"/>
    <text x="147" y="130" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#C2410C">ピンと張った [②]</text>
  </g>

  <!-- Right panel: Tapping iron bar (鉄ぼう) -->
  <g transform="translate(328, 40)">
    <rect width="294" height="194" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="52" y="8" width="190" height="24" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
    <text x="147" y="25" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1D4ED8">鉄ぼうをそっとたたくとき</text>

    <!-- Horizontal iron bar & vertical posts -->
    <rect x="28" y="76" width="8" height="106" rx="2" fill="#94A3B8" stroke="#475569" stroke-width="1.4"/>
    <rect x="206" y="76" width="8" height="106" rx="2" fill="#94A3B8" stroke="#475569" stroke-width="1.4"/>
    <rect x="24" y="78" width="206" height="8" rx="3" fill="#CBD5E1" stroke="#334155" stroke-width="1.6"/>
    <!-- Vibration waves along bar -->
    <path d="M98,68 Q108,62 118,68 M132,68 Q142,62 152,68 M166,68 Q176,62 186,68" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
    <path d="M98,96 Q108,102 118,96 M132,96 Q142,102 152,96 M166,96 Q176,102 186,96" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>

    <!-- Left child pressing ear to bar -->
    <g transform="translate(46, 60)">
      <circle cx="20" cy="20" r="14" fill="#FEF3C7" stroke="#92400E" stroke-width="1.5"/>
      <path d="M6,18 Q20,2 34,18 Z" fill="#334155"/>
      <rect x="8" y="34" width="24" height="44" rx="5" fill="#4ADE80" stroke="#15803D" stroke-width="1.5"/>
      <line x1="14" y1="78" x2="14" y2="118" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
      <line x1="26" y1="78" x2="26" y2="118" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Right child gently tapping bar with stick -->
    <g transform="translate(226, 60)">
      <circle cx="24" cy="20" r="14" fill="#FEF3C7" stroke="#92400E" stroke-width="1.5"/>
      <path d="M10,18 Q24,2 38,18 Z" fill="#1E293B"/>
      <rect x="12" y="34" width="24" height="44" rx="5" fill="#FB923C" stroke="#C2410C" stroke-width="1.5"/>
      <line x1="18" y1="78" x2="18" y2="118" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
      <line x1="30" y1="78" x2="30" y2="118" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
      <!-- Arm & tapping stick -->
      <line x1="14" y1="46" x2="-4" y2="38" stroke="#FB923C" stroke-width="6" stroke-linecap="round"/>
      <line x1="-4" y1="38" x2="-16" y2="20" stroke="#78350F" stroke-width="2.6" stroke-linecap="round"/>
      <!-- Tap spark -->
      <path d="M-22,12 L-16,18 M-10,12 L-14,18 M-24,22 L-18,22" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="147" y="132" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">[③] がふるえる</text>
  </g>
</svg>
