<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" width="620" height="270">
  <defs>
    <marker id="arrY" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="620" height="270" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="310" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">かがみではね返した日光の進み方</text>

  <!-- Floor/ground plane -->
  <rect x="20" y="138" width="580" height="116" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.3"/>

  <!-- Incoming sunbeam from upper-left to mirror -->
  <polygon points="344,38 380,38 450,192 430,196" fill="#FEF08A" opacity="0.65"/>
  <line x1="364" y1="42" x2="436" y2="188" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrY)"/>
  <text x="328" y="56" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#B45309">日光</text>

  <!-- Reflected straight beam from mirror to cardboard slits -->
  <polygon points="434,186 434,210 172,210 172,186" fill="#FEF08A" opacity="0.85"/>
  <!-- 3 parallel narrow beams continuing straight through the 3 slits! -->
  <rect x="44" y="187" width="128" height="5" fill="#FACC15" opacity="0.9"/>
  <rect x="44" y="196" width="128" height="5" fill="#FACC15" opacity="0.9"/>
  <rect x="44" y="205" width="128" height="5" fill="#FACC15" opacity="0.9"/>
  <line x1="400" y1="198" x2="210" y2="198" stroke="#CA8A04" stroke-width="2" marker-end="url(#arrY)"/>

  <!-- Cardboard with 3 slits (あつ紙) -->
  <g transform="translate(154, 148)">
    <!-- Stand support -->
    <polygon points="16,66 36,66 16,44" fill="#94A3B8" stroke="#475569" stroke-width="1.3"/>
    <!-- Upright cardboard -->
    <polygon points="0,12 22,0 22,66 0,78" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/>
    <!-- 3 slits at bottom -->
    <rect x="4" y="42" width="3" height="26" fill="#FACC15" stroke="#475569" stroke-width="0.8"/>
    <rect x="10" y="39" width="3" height="26" fill="#FACC15" stroke="#475569" stroke-width="0.8"/>
    <rect x="16" y="36" width="3" height="26" fill="#FACC15" stroke="#475569" stroke-width="0.8"/>
  </g>
  <line x1="176" y1="154" x2="216" y2="144" stroke="#475569" stroke-width="1.3"/>
  <text x="222" y="149" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">あつ紙</text>

  <!-- Zoomed inset showing 切れこみ -->
  <circle cx="136" cy="86" r="46" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <line x1="158" y1="128" x2="164" y2="152" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="104" y="68" width="64" height="44" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <!-- 3 clear slits cut from bottom -->
  <rect x="114" y="88" width="8" height="24" fill="#FEF08A" stroke="#475569" stroke-width="1.2"/>
  <rect x="132" y="88" width="8" height="24" fill="#FEF08A" stroke="#475569" stroke-width="1.2"/>
  <rect x="150" y="88" width="8" height="24" fill="#FEF08A" stroke="#475569" stroke-width="1.2"/>
  <text x="136" y="60" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#0369A1">切れこみ</text>

  <!-- Mirror held by crouching child -->
  <g transform="translate(426, 174)">
    <polygon points="0,0 16,-8 22,28 6,36" fill="#BAE6FD" stroke="#0284C7" stroke-width="2.4"/>
    <line x1="5" y1="6" x2="14" y2="18" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  </g>
  <text x="414" y="168" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#0369A1">かがみ</text>

  <!-- Child crouching on right -->
  <g transform="translate(468, 92)">
    <circle cx="38" cy="20" r="15" fill="#FEF3C7" stroke="#92400E" stroke-width="1.6"/>
    <path d="M24,18 Q38,2 54,18 Q48,12 24,18 Z" fill="#1E293B"/>
    <circle cx="31" cy="21" r="2" fill="#0F172A"/>
    <!-- Body leaning forward -->
    <path d="M36,36 C56,36 74,56 68,88 L36,92 C28,74 26,50 36,36 Z" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.8"/>
    <!-- Arm reaching to mirror -->
    <path d="M34,50 L-12,92" stroke="#60A5FA" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-16" cy="96" r="7" fill="#FEF3C7" stroke="#92400E" stroke-width="1.4"/>
    <!-- Crouched legs -->
    <path d="M58,86 L34,108 L64,116" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="64" cy="122" rx="14" ry="6" fill="#475569"/>
  </g>

  <text x="112" y="236" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#854D0E">かがみではね返した日光</text>
</svg>
