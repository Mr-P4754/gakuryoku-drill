<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260">
  <rect width="620" height="260" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="310" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">じしゃくにつく物調べ</text>

  <!-- Left panel: Table of 5 items -->
  <g transform="translate(20, 42)">
    <rect width="346" height="202" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
    <rect x="0" y="0" width="346" height="34" rx="8" fill="#ECFDF5"/>
    <line x1="0" y1="34" x2="346" y2="34" stroke="#64748B" stroke-width="1.5"/>
    <line x1="226" y1="0" x2="226" y2="202" stroke="#64748B" stroke-width="1.4"/>
    <text x="113" y="22" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#065F46">調べる物</text>
    <text x="286" y="22" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#065F46">じしゃくにつくか</text>

    <g font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5">
      <text x="12" y="54" fill="#1E293B">アルミニウムはく</text>
      <text x="12" y="69" font-size="11" fill="#64748B">（アルミニウム）</text>
      <text x="286" y="61" text-anchor="middle" font-weight="bold" fill="#64748B">つかない。</text>
      <line x1="0" y1="76" x2="346" y2="76" stroke="#CBD5E1" stroke-width="1.2"/>

      <text x="12" y="99" fill="#1E293B">クリップ（鉄）</text>
      <text x="286" y="99" text-anchor="middle" font-weight="bold" fill="#B45309">[ ① ]</text>
      <line x1="0" y1="108" x2="346" y2="108" stroke="#CBD5E1" stroke-width="1.2"/>

      <text x="12" y="131" fill="#1E293B">十円玉（どう）</text>
      <text x="286" y="131" text-anchor="middle" font-weight="bold" fill="#B45309">[ ② ]</text>
      <line x1="0" y1="140" x2="346" y2="140" stroke="#CBD5E1" stroke-width="1.2"/>

      <text x="12" y="163" fill="#1E293B">わりばし（木）</text>
      <text x="286" y="163" text-anchor="middle" font-weight="bold" fill="#B45309">[ ③ ]</text>
      <line x1="0" y1="172" x2="346" y2="172" stroke="#CBD5E1" stroke-width="1.2"/>

      <text x="12" y="193" fill="#1E293B">スプーン（鉄）</text>
      <text x="286" y="193" text-anchor="middle" font-weight="bold" fill="#B45309">[ ④ ]</text>
    </g>
  </g>

  <!-- Right panel: Pulling through paper / from a distance -->
  <g transform="translate(382, 42)">
    <rect width="218" height="202" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="109" y="24" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">じしゃくのはたらき</text>

    <!-- Sub-panel 1: Through paper -->
    <rect x="14" y="34" width="190" height="72" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <!-- Magnet -->
    <rect x="26" y="54" width="38" height="24" rx="2" fill="#EF4444" stroke="#991B1B" stroke-width="1.4"/>
    <rect x="64" y="54" width="38" height="24" rx="2" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.4"/>
    <text x="45" y="71" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">N</text>
    <text x="83" y="71" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">S</text>
    <!-- Paper sheet barrier -->
    <polygon points="116,44 128,38 128,86 116,92" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <!-- Steel clip pulled toward magnet -->
    <rect x="144" y="58" width="24" height="14" rx="6" fill="none" stroke="#475569" stroke-width="2.5"/>
    <path d="M138,65 L130,65" stroke="#059669" stroke-width="2.2"/>
    <text x="109" y="100" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#1E40AF">紙につつまれていても引きつける</text>

    <!-- Sub-panel 2: Across a distance -->
    <rect x="14" y="116" width="190" height="74" rx="8" fill="#FEFCE8" stroke="#FDE047" stroke-width="1.2"/>
    <rect x="26" y="136" width="38" height="24" rx="2" fill="#EF4444" stroke="#991B1B" stroke-width="1.4"/>
    <rect x="64" y="136" width="38" height="24" rx="2" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.4"/>
    <text x="45" y="153" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">N</text>
    <text x="83" y="153" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">S</text>
    <!-- Air gap attraction waves -->
    <path d="M112,140 Q118,148 112,156 M124,138 Q132,148 124,158" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="148" y="141" width="24" height="14" rx="6" fill="none" stroke="#475569" stroke-width="2.5"/>
    <text x="109" y="182" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#92400E">すこし [⑦] いても引きつける</text>
  </g>
</svg>
