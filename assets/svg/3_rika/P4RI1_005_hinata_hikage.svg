<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250">
  <defs>
    <linearGradient id="sunnyGround" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="shadyGround" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="250" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="300" y="28" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">日なたと日かげの地面のようす</text>

  <!-- Scene frame -->
  <rect x="22" y="42" width="556" height="190" rx="12" fill="#E0F2FE" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Left half: 日なた (Sunny ground) -->
  <polygon points="23,128 330,128 270,231 23,231" fill="url(#sunnyGround)"/>
  <!-- Right half: 日かげ (Shaded ground) -->
  <polygon points="330,128 577,128 577,231 270,231" fill="url(#shadyGround)"/>
  <line x1="330" y1="128" x2="270" y2="231" stroke="#64748B" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Sun in upper left -->
  <g transform="translate(80, 82)">
    <circle cx="0" cy="0" r="20" fill="#FACC15" stroke="#EA580C" stroke-width="2.2"/>
    <g stroke="#EA580C" stroke-width="2.4" stroke-linecap="round">
      <line x1="0" y1="-29" x2="0" y2="-23"/><line x1="0" y1="23" x2="0" y2="29"/>
      <line x1="-29" y1="0" x2="-23" y2="0"/><line x1="23" y1="0" x2="29" y2="0"/>
      <line x1="-20" y1="-20" x2="-16" y2="-16"/><line x1="16" y1="16" x2="20" y2="20"/>
      <line x1="20" y1="-20" x2="16" y2="-16"/><line x1="-16" y1="16" x2="-20" y2="20"/>
    </g>
  </g>
  <!-- Warm sun rays hitting 日なた -->
  <g stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="6,4" opacity="0.8">
    <line x1="106" y1="98" x2="164" y2="148"/>
    <line x1="112" y1="88" x2="218" y2="148"/>
    <line x1="94" y1="106" x2="120" y2="152"/>
  </g>

  <!-- Shade-casting tree on far right -->
  <rect x="524" y="88" width="20" height="44" fill="#92400E"/>
  <circle cx="534" cy="74" r="32" fill="#22C55E" stroke="#15803D" stroke-width="1.8"/>
  <circle cx="508" cy="82" r="24" fill="#4ADE80" stroke="#15803D" stroke-width="1.6"/>
  <circle cx="556" cy="84" r="20" fill="#16A34A" stroke="#15803D" stroke-width="1.5"/>

  <!-- Girl touching sunny ground (日なた) -->
  <g transform="translate(152, 134)">
    <circle cx="26" cy="14" r="13" fill="#FEF3C7" stroke="#92400E" stroke-width="1.6"/>
    <path d="M13,12 Q26,-2 39,12" fill="#451A03"/>
    <circle cx="22" cy="14" r="1.8" fill="#0F172A"/>
    <circle cx="30" cy="14" r="1.8" fill="#0F172A"/>
    <path d="M23,20 Q26,23 29,20" fill="none" stroke="#92400E" stroke-width="1.3"/>
    <path d="M14,28 L38,28 L44,58 L8,58 Z" fill="#F472B6" stroke="#BE185D" stroke-width="1.6"/>
    <!-- Arms touching ground -->
    <path d="M16,38 L4,68 M36,38 L48,68" stroke="#FEF3C7" stroke-width="7" stroke-linecap="round"/>
    <path d="M16,38 L4,68 M36,38 L48,68" stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Warm wavy heat lines -->
    <path d="M-12,68 Q-15,58 -12,50 M62,68 Q59,58 62,50" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Boy touching shady ground (日かげ) -->
  <g transform="translate(384, 134)">
    <circle cx="26" cy="14" r="13" fill="#FEF3C7" stroke="#92400E" stroke-width="1.6"/>
    <path d="M13,11 Q26,-3 39,11 Z" fill="#1E293B"/>
    <circle cx="22" cy="14" r="1.8" fill="#0F172A"/>
    <circle cx="30" cy="14" r="1.8" fill="#0F172A"/>
    <path d="M23,20 Q26,22 29,20" fill="none" stroke="#92400E" stroke-width="1.3"/>
    <path d="M14,28 L38,28 L42,58 L10,58 Z" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.6"/>
    <path d="M16,38 L4,68 M36,38 L48,68" stroke="#FEF3C7" stroke-width="7" stroke-linecap="round"/>
    <path d="M16,38 L4,68 M36,38 L48,68" stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Labels -->
  <rect x="44" y="192" width="84" height="30" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
  <text x="86" y="212" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#C2410C">日なた</text>

  <rect x="470" y="192" width="84" height="30" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  <text x="512" y="212" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">日かげ</text>
</svg>
