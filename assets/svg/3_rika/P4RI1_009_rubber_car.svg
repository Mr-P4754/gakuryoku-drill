<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
  <defs>
    <marker id="arrR9" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrR9Rev" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,1 L1,5 L10,9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="640" height="270" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">のばしたゴムの長さと車の動くきょり</text>

  <!-- Score zone bands on right (matching PDF: 20点, 40点, ゴール100点, 50点) -->
  <rect x="290" y="42" width="64" height="214" fill="#FEF9C3" opacity="0.65"/>
  <rect x="354" y="42" width="64" height="214" fill="#FDE68A" opacity="0.65"/>
  <rect x="418" y="42" width="84" height="214" fill="#FECACA" opacity="0.72"/>
  <rect x="502" y="42" width="60" height="214" fill="#E0F2FE" opacity="0.65"/>
  <g font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">
    <text x="322" y="58" fill="#854D0E">20点</text>
    <text x="386" y="58" fill="#92400E">40点</text>
    <text x="460" y="58" fill="#B91C1C">ゴール100点</text>
    <text x="532" y="58" fill="#0369A1">50点</text>
  </g>

  <!-- Start line -->
  <line x1="176" y1="42" x2="176" y2="256" stroke="#334155" stroke-width="2.5"/>
  <text x="176" y="266" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#334155">スタート線</text>

  <!-- Divider between lanes -->
  <line x1="20" y1="150" x2="620" y2="150" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,4"/>

  <!-- Top lane: SHORT stretched rubber -->
  <rect x="568" y="72" width="58" height="44" rx="8" fill="#64748B"/>
  <text x="597" y="90" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">のばした</text>
  <text x="597" y="106" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#FEF08A">短い</text>
  <!-- Rubber band stretched short (128 to 176) -->
  <circle cx="176" cy="96" r="5" fill="#475569"/>
  <line x1="126" y1="96" x2="176" y2="96" stroke="#E11D48" stroke-width="4" stroke-linecap="round"/>
  <circle cx="126" cy="96" r="6" fill="#FDE68A" stroke="#92400E" stroke-width="1.5"/>
  <text x="150" y="84" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#BE123C">短いゴム</text>
  <!-- Car stops around 20点 -->
  <g transform="translate(292, 76)">
    <rect x="0" y="12" width="52" height="14" rx="4" fill="#38BDF8" stroke="#0369A1" stroke-width="1.6"/>
    <rect x="10" y="4" width="26" height="10" rx="3" fill="#BAE6FD" stroke="#0369A1" stroke-width="1.3"/>
    <circle cx="12" cy="28" r="6.5" fill="#1E293B"/><circle cx="12" cy="28" r="2.2" fill="#E2E8F0"/>
    <circle cx="40" cy="28" r="6.5" fill="#1E293B"/><circle cx="40" cy="28" r="2.2" fill="#E2E8F0"/>
  </g>
  <line x1="182" y1="128" x2="290" y2="128" stroke="#059669" stroke-width="2.2" marker-start="url(#arrR9Rev)" marker-end="url(#arrR9)"/>
  <text x="236" y="122" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#047857">動いたきょり</text>

  <!-- Bottom lane: LONG stretched rubber -->
  <rect x="568" y="176" width="58" height="44" rx="8" fill="#DC2626"/>
  <text x="597" y="194" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">のばした</text>
  <text x="597" y="210" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#FEF08A">長い</text>
  <!-- Rubber band stretched long (42 to 176) -->
  <circle cx="176" cy="198" r="5" fill="#475569"/>
  <line x1="42" y1="198" x2="176" y2="198" stroke="#E11D48" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="42" cy="198" r="6" fill="#FDE68A" stroke="#92400E" stroke-width="1.5"/>
  <text x="108" y="186" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#BE123C">長くのばしたゴム</text>
  <!-- Car rolls far into ゴール100点 -->
  <g transform="translate(434, 178)">
    <rect x="0" y="12" width="52" height="14" rx="4" fill="#F97316" stroke="#9A3412" stroke-width="1.6"/>
    <rect x="10" y="4" width="26" height="10" rx="3" fill="#FFEDD5" stroke="#9A3412" stroke-width="1.3"/>
    <circle cx="12" cy="28" r="6.5" fill="#1E293B"/><circle cx="12" cy="28" r="2.2" fill="#E2E8F0"/>
    <circle cx="40" cy="28" r="6.5" fill="#1E293B"/><circle cx="40" cy="28" r="2.2" fill="#E2E8F0"/>
  </g>
  <line x1="182" y1="234" x2="430" y2="234" stroke="#059669" stroke-width="2.4" marker-start="url(#arrR9Rev)" marker-end="url(#arrR9)"/>
  <text x="306" y="228" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#047857">動いたきょり（速く、遠くまで！）</text>
</svg>
