<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" width="660" height="280">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <marker id="arrSun" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#EA580C"/>
    </marker>
    <marker id="arrShd" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="660" height="280" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="330" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">太陽とかげのかんけい・動き</text>

  <!-- Left panel: Sun & Shadow relationship -->
  <g transform="translate(18, 40)">
    <rect width="290" height="224" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="64" y="8" width="162" height="24" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="145" y="25" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#92400E">太陽とかげのかんけい</text>
    <!-- Ground -->
    <rect x="8" y="138" width="274" height="78" rx="8" fill="#FEF9C3" opacity="0.55"/>
    <!-- Sun upper left -->
    <g transform="translate(46, 62)">
      <circle cx="0" cy="0" r="15" fill="#FACC15" stroke="#EA580C" stroke-width="2"/>
      <g stroke="#EA580C" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="-22" x2="0" y2="-18"/><line x1="0" y1="18" x2="0" y2="22"/>
        <line x1="-22" y1="0" x2="-18" y2="0"/><line x1="18" y1="0" x2="22" y2="0"/>
        <line x1="-15" y1="-15" x2="-12" y2="-12"/><line x1="12" y1="12" x2="15" y2="15"/>
        <line x1="15" y1="-15" x2="12" y2="-12"/><line x1="-12" y1="12" x2="-15" y2="15"/>
      </g>
    </g>
    <!-- Sunlight rays -->
    <g stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7">
      <line x1="66" y1="74" x2="130" y2="112"/>
      <line x1="72" y1="68" x2="184" y2="118"/>
    </g>
    <!-- Horizontal bar & shadow -->
    <polygon points="74,154 128,154 156,184 102,184" fill="#94A3B8" opacity="0.45"/>
    <g stroke="#475569" stroke-width="3.5" stroke-linecap="round">
      <line x1="74" y1="106" x2="74" y2="154"/>
      <line x1="102" y1="96" x2="102" y2="154"/>
      <line x1="128" y1="88" x2="128" y2="154"/>
      <line x1="74" y1="112" x2="102" y2="104"/>
      <line x1="102" y1="98" x2="128" y2="90"/>
    </g>
    <!-- Standing child & shadow on opposite side -->
    <path d="M206,174 L244,204 L260,202 L222,174 Z" fill="#64748B" opacity="0.5"/>
    <circle cx="212" cy="112" r="11" fill="#FEF3C7" stroke="#92400E" stroke-width="1.6"/>
    <path d="M201,108 Q212,96 223,108" fill="#334155"/>
    <rect x="202" y="124" width="20" height="28" rx="5" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <line x1="206" y1="152" x2="206" y2="174" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="218" y1="152" x2="218" y2="174" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <text x="145" y="212" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#475569">かげは太陽の [①] がわにできる</text>
  </g>

  <!-- Right panel: Sun & Shadow daily motion -->
  <g transform="translate(324, 40)">
    <rect width="318" height="224" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="84" y="8" width="150" height="24" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.3"/>
    <text x="159" y="25" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#0369A1">太陽とかげの動き</text>

    <!-- Sky & Horizon -->
    <rect x="12" y="38" width="294" height="90" rx="6" fill="url(#sky5)"/>
    <!-- Hills -->
    <path d="M12,128 Q64,102 114,116 Q170,104 224,118 Q270,104 306,120 L306,128 Z" fill="#86EFAC" stroke="#16A34A" stroke-width="1"/>
    <!-- Ground -->
    <rect x="12" y="128" width="294" height="84" rx="6" fill="#FEFCE8" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Sun arc: East (left) -> South (top) -> West (right) -->
    <path d="M40,116 Q159,28 278,114" fill="none" stroke="#EA580C" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrSun)"/>
    <!-- Rising Sun in East -->
    <circle cx="44" cy="108" r="11" fill="#FACC15" stroke="#EA580C" stroke-width="1.8"/>
    <!-- Noon Sun ghost -->
    <circle cx="159" cy="66" r="11" fill="#FDE047" stroke="#EA580C" stroke-width="1.6" stroke-dasharray="3,2"/>
    <!-- Setting Sun ghost -->
    <circle cx="274" cy="108" r="10" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Vertical stick -->
    <rect x="151" y="142" width="16" height="12" rx="3" fill="#CBD5E1" stroke="#475569" stroke-width="1.3"/>
    <rect x="156" y="102" width="6" height="42" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>

    <!-- Shadows: West (right) -> North (down) -> East (left) -->
    <polygon points="160,152 254,174 250,180 158,154" fill="#475569" opacity="0.72"/>
    <polygon points="159,154 155,186 163,186" fill="#94A3B8" opacity="0.45"/>
    <polygon points="158,152 68,174 72,180 160,154" fill="#94A3B8" opacity="0.4"/>
    <!-- Shadow movement curved arrow -->
    <path d="M236,184 Q159,204 82,184" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrShd)"/>

    <!-- Compass directions -->
    <text x="26" y="144" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#B45309">東</text>
    <text x="182" y="126" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#B45309">南</text>
    <text x="292" y="144" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#B45309">西</text>
    <text x="159" y="207" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#1E40AF">北</text>
  </g>
</svg>
