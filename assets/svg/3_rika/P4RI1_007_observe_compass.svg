<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
  <rect width="640" height="270" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">太陽のかんさつと方いじしんの使い方</text>

  <!-- Left panel: Sun & shadow direction + shade plate -->
  <g transform="translate(20, 40)">
    <rect width="292" height="214" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="66" y="8" width="160" height="24" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="146" y="25" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#92400E">太陽とかげの向き</text>

    <!-- Sun upper left -->
    <g transform="translate(52, 68)">
      <circle cx="0" cy="0" r="14" fill="#FACC15" stroke="#EA580C" stroke-width="2"/>
      <g stroke="#EA580C" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="-21" x2="0" y2="-17"/><line x1="0" y1="17" x2="0" y2="21"/>
        <line x1="-21" y1="0" x2="-17" y2="0"/><line x1="17" y1="0" x2="21" y2="0"/>
        <line x1="-15" y1="-15" x2="-12" y2="-12"/><line x1="12" y1="12" x2="15" y2="15"/>
        <line x1="15" y1="-15" x2="12" y2="-12"/><line x1="-12" y1="12" x2="-15" y2="15"/>
      </g>
    </g>
    <!-- Sunlight ray -->
    <line x1="68" y1="80" x2="132" y2="128" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="5,4"/>

    <!-- Vertical pole on cylinder base -->
    <ellipse cx="132" cy="166" rx="16" ry="6" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
    <rect x="116" y="146" width="32" height="20" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="132" cy="146" rx="16" ry="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <rect x="128" y="68" width="8" height="78" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
    <!-- Shadow extending to lower-right (opposite side) -->
    <polygon points="146,162 264,194 258,204 140,170" fill="#64748B" opacity="0.65"/>
    <text x="206" y="168" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#475569">かげ</text>

    <!-- Shade plate icon in bottom-left corner -->
    <rect x="16" y="152" width="76" height="48" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="24" y="160" width="60" height="32" rx="3" fill="#334155"/>
    <circle cx="54" cy="176" r="8" fill="#F97316" opacity="0.85"/>
    <text x="54" y="147" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#0F172A">かんさつ道具 [③]</text>
  </g>

  <!-- Right panel: Compass -->
  <g transform="translate(328, 40)">
    <rect width="292" height="214" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="66" y="8" width="160" height="24" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
    <text x="146" y="25" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" font-weight="bold" fill="#1D4ED8">方いじしんの使い方</text>

    <!-- Compass dial -->
    <g transform="translate(146, 122)">
      <circle cx="0" cy="0" r="70" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
      <circle cx="0" cy="0" r="63" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <!-- 8 radiating lines -->
      <g stroke="#CBD5E1" stroke-width="1.2">
        <line x1="0" y1="-44" x2="0" y2="44"/><line x1="-44" y1="0" x2="44" y2="0"/>
        <line x1="-32" y1="-32" x2="32" y2="32"/><line x1="-32" y1="32" x2="32" y2="-32"/>
      </g>
      <!-- Cardinal labels -->
      <text x="0" y="-47" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#DC2626">北</text>
      <text x="0" y="57" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">南</text>
      <text x="51" y="5" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">東</text>
      <text x="-51" y="5" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">西</text>
      <!-- Magnetic needle: RED pointing North (up), WHITE pointing South (down) -->
      <polygon points="0,-42 -8,0 8,0" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.2"/>
      <polygon points="0,42 -8,0 8,0" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="4.5" fill="#334155"/>
    </g>
    <text x="146" y="206" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" fill="#475569">色のついたはり（赤）を合わせる</text>
  </g>
</svg>
