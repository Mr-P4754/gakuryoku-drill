<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <rect width="600" height="320" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="300" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">電気の通しやすさと、じしゃくへのつきやすさの分け方</text>

  <!-- Round compartmentalized tray (3D perspective matching PDF p.27) -->
  <g transform="translate(274, 174)">
    <!-- Tray bottom rim -->
    <ellipse cx="0" cy="24" rx="206" ry="108" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
    <!-- Tray outer wall -->
    <path d="M-206,0 L-206,24 A206,108 0 0,0 206,24 L206,0 Z" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
    <!-- Tray top interior -->
    <ellipse cx="0" cy="0" rx="206" ry="108" fill="#FFFFFF" stroke="#475569" stroke-width="2.2"/>
    <ellipse cx="0" cy="0" rx="196" ry="100" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>

    <!-- Section fills (subtle tint to make partitions crystal clear) -->
    <!-- Upper half イ -->
    <path d="M-196,0 A196,100 0 0,1 196,0 Z" fill="#EFF6FF" opacity="0.65"/>
    <!-- Bottom-right ア -->
    <path d="M0,0 L196,0 A196,100 0 0,1 0,100 Z" fill="#FEFCE8" opacity="0.78"/>
    <!-- Bottom-left (unlabeled) -->
    <path d="M-196,0 L0,0 L0,100 A196,100 0 0,1 -196,0 Z" fill="#F1F5F9" opacity="0.7"/>

    <!-- Divider walls -->
    <line x1="-196" y1="0" x2="196" y2="0" stroke="#334155" stroke-width="3.5"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#334155" stroke-width="3.5"/>

    <!-- === TOP HALF (イ): Steel items === -->
    <!-- Steel wire coil (針金) -->
    <g fill="none" stroke="#475569" stroke-width="2.6">
      <ellipse cx="-82" cy="-56" rx="34" ry="20"/>
      <ellipse cx="-82" cy="-56" rx="24" ry="14"/>
      <ellipse cx="-82" cy="-56" rx="14" ry="8"/>
    </g>
    <!-- 2 Paper clips (クリップ) -->
    <g fill="none" stroke="#334155" stroke-width="2.4">
      <rect x="-24" y="-66" width="12" height="32" rx="6" transform="rotate(24 -18 -50)"/>
      <rect x="0" y="-62" width="12" height="32" rx="6" transform="rotate(14 6 -46)"/>
    </g>
    <!-- Iron nail (くぎ) -->
    <g transform="translate(54, -50) rotate(28)">
      <rect x="-2" y="-30" width="5" height="54" rx="2" fill="#94A3B8" stroke="#334155" stroke-width="1.3"/>
      <rect x="-8" y="-33" width="17" height="5" rx="1" fill="#64748B" stroke="#334155" stroke-width="1.3"/>
    </g>
    <!-- Steel can (スチールかん) -->
    <g transform="translate(118, -50) rotate(18)">
      <rect x="-20" y="-34" width="40" height="62" rx="6" fill="#CBD5E1" stroke="#334155" stroke-width="1.8"/>
      <ellipse cx="0" cy="-34" rx="20" ry="6" fill="#E2E8F0" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="-6" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10.5" font-weight="bold" fill="#0F172A">スチール</text>
      <text x="0" y="10" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10.5" font-weight="bold" fill="#0F172A">かん</text>
    </g>

    <!-- Scissors straddling left divider: METAL blades in イ (top), PLASTIC handles in bottom-left! -->
    <g transform="translate(-148, -2)">
      <!-- Metal blades in upper half イ -->
      <polygon points="-4,0 2,-52 8,-52 6,0" fill="#CBD5E1" stroke="#334155" stroke-width="1.5"/>
      <polygon points="-2,0 -10,-48 -4,-50 4,0" fill="#94A3B8" stroke="#334155" stroke-width="1.5"/>
      <circle cx="1" cy="-12" r="2.2" fill="#1E293B"/>
      <!-- Plastic handles in bottom-left -->
      <ellipse cx="-8" cy="24" rx="9" ry="14" fill="none" stroke="#F59E0B" stroke-width="4"/>
      <ellipse cx="10" cy="24" rx="9" ry="14" fill="none" stroke="#F59E0B" stroke-width="4"/>
    </g>

    <!-- === BOTTOM-LEFT (Non-metal, non-magnetic) === -->
    <!-- Wooden ruler -->
    <g transform="translate(-108, 44) rotate(-14)">
      <rect x="-8" y="-30" width="16" height="62" rx="2" fill="#FDE68A" stroke="#92400E" stroke-width="1.4"/>
      <g stroke="#92400E" stroke-width="0.9">
        <line x1="-8" y1="-20" x2="-2" y2="-20"/><line x1="-8" y1="-10" x2="-2" y2="-10"/>
        <line x1="-8" y1="0" x2="-2" y2="0"/><line x1="-8" y1="10" x2="-2" y2="10"/><line x1="-8" y1="20" x2="-2" y2="20"/>
      </g>
    </g>
    <!-- Plastic set square (三角じょうぎ) -->
    <polygon points="-86,58 -40,22 -52,66" fill="#E0F2FE" fill-opacity="0.8" stroke="#0284C7" stroke-width="1.6"/>
    <circle cx="-62" cy="52" r="5" fill="#F1F5F9" stroke="#0284C7" stroke-width="1.2"/>
    <!-- 2 squares of paper -->
    <rect x="-44" y="42" width="24" height="28" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" transform="rotate(8 -32 56)"/>
    <rect x="-32" y="52" width="24" height="28" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" transform="rotate(-6 -20 66)"/>

    <!-- === BOTTOM-RIGHT (ア): Non-iron metals (Copper/Aluminum) === -->
    <!-- 10-yen copper coin -->
    <g transform="translate(30, 68)">
      <circle cx="0" cy="0" r="17" fill="#D97706" stroke="#78350F" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#FEF3C7" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11" font-weight="bold" fill="#FEF3C7">10円</text>
    </g>
    <!-- Aluminum can (アルミかん) -->
    <g transform="translate(74, 44) rotate(-14)">
      <rect x="-18" y="-30" width="36" height="58" rx="6" fill="#E2E8F0" stroke="#475569" stroke-width="1.6"/>
      <ellipse cx="0" cy="-30" rx="18" ry="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10.5" font-weight="bold" fill="#1E293B">アルミ</text>
      <text x="0" y="12" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10.5" font-weight="bold" fill="#1E293B">かん</text>
    </g>
    <!-- Aluminum foil (アルミはく) -->
    <g transform="translate(132, 34) rotate(14)">
      <rect x="-26" y="-22" width="52" height="44" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
      <rect x="-26" y="-22" width="14" height="44" rx="4" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
      <text x="6" y="-2" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10" font-weight="bold" fill="#334155">アルミ</text>
      <text x="6" y="12" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="10" font-weight="bold" fill="#334155">はく</text>
    </g>

    <!-- Brace for イ (upper half) -->
    <path d="M196,-92 L226,-92 L226,-4 L204,-4" fill="none" stroke="#2563EB" stroke-width="2"/>
    <line x1="226" y1="-48" x2="244" y2="-48" stroke="#2563EB" stroke-width="2"/>
    <circle cx="262" cy="-48" r="17" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="262" y="-42" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#1D4ED8">イ</text>

    <!-- Brace for ア (bottom-right quarter) -->
    <path d="M204,10 L226,10 L226,78 L112,112" fill="none" stroke="#D97706" stroke-width="2"/>
    <circle cx="238" cy="84" r="17" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
    <text x="238" y="90" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="16" font-weight="bold" fill="#B45309">ア</text>
  </g>
</svg>
