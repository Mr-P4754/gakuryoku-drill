<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
  <defs>
    <linearGradient id="bat3c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="640" height="270" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">電気を通す物の実験</text>

  <!-- Left panel: Conductivity tester circuit with ? gap -->
  <rect x="18" y="40" width="268" height="214" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>

  <!-- Wires -->
  <path d="M84,200 L52,200 Q38,200 38,184 L38,130 Q38,114 52,114 L126,114 L126,104" fill="none" stroke="#1E293B" stroke-width="3.2"/>
  <path d="M138,104 L138,128 Q138,144 156,144 L212,144" fill="none" stroke="#1E293B" stroke-width="3.2"/>
  <path d="M172,200 L212,200" fill="none" stroke="#1E293B" stroke-width="3.2"/>
  <path d="M212,144 L212,152 M212,192 L212,200" fill="none" stroke="#1E293B" stroke-width="3.2"/>

  <!-- Lightbulb at top -->
  <g transform="translate(132, 76)">
    <circle cx="0" cy="-6" r="14" fill="#F8FAFC" stroke="#475569" stroke-width="1.8"/>
    <path d="M-4,6 L-3,-8 L0,-4 L3,-8 L4,6" fill="none" stroke="#64748B" stroke-width="1.4"/>
    <rect x="-8" y="7" width="16" height="15" rx="2" fill="#CBD5E1" stroke="#475569" stroke-width="1.4"/>
    <rect x="-10" y="21" width="20" height="9" rx="2" fill="#475569"/>
  </g>
  <text x="132" y="54" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#334155">豆電球</text>

  <!-- Battery -->
  <g transform="translate(88, 182)">
    <rect x="-8" y="10" width="9" height="16" rx="2" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="2" width="84" height="32" rx="4" fill="url(#bat3c)" stroke="#065F46" stroke-width="1.8"/>
    <rect x="0" y="2" width="20" height="32" rx="3" fill="#DC2626" opacity="0.88"/>
    <text x="10" y="23" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">＋</text>
    <text x="72" y="23" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">－</text>
  </g>
  <text x="130" y="236" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#065F46">かん電池</text>

  <!-- ? test box -->
  <rect x="192" y="148" width="74" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2" stroke-dasharray="5,3"/>
  <text x="229" y="180" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="24" font-weight="bold" fill="#B45309">？</text>
  <text x="229" y="138" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="11.5" font-weight="bold" fill="#92400E">つなぐもの</text>

  <!-- Right panel: Data Table -->
  <g transform="translate(300, 40)">
    <rect width="322" height="214" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
    <!-- Header row -->
    <rect x="0" y="0" width="322" height="34" rx="8" fill="#ECFDF5"/>
    <line x1="0" y1="34" x2="322" y2="34" stroke="#64748B" stroke-width="1.5"/>
    <line x1="208" y1="0" x2="208" y2="214" stroke="#64748B" stroke-width="1.4"/>
    <text x="104" y="22" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#065F46">？の部分につなぐもの</text>
    <text x="265" y="22" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12.5" font-weight="bold" fill="#065F46">明かりがつくか</text>

    <!-- Rows -->
    <g font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13">
      <!-- Row 1: 10 yen -->
      <text x="14" y="57" fill="#1E293B">十円玉（どう）</text>
      <text x="265" y="57" text-anchor="middle" font-weight="bold" fill="#059669">つく。</text>
      <line x1="0" y1="64" x2="322" y2="64" stroke="#CBD5E1" stroke-width="1.2"/>

      <!-- Row 2: Glass -->
      <text x="14" y="87" fill="#1E293B">コップ（ガラス）</text>
      <text x="265" y="87" text-anchor="middle" font-weight="bold" fill="#B45309">[ ① ]</text>
      <line x1="0" y1="94" x2="322" y2="94" stroke="#CBD5E1" stroke-width="1.2"/>

      <!-- Row 3: Notebook -->
      <text x="14" y="117" fill="#1E293B">ノート（紙）</text>
      <text x="265" y="117" text-anchor="middle" font-weight="bold" fill="#B45309">[ ② ]</text>
      <line x1="0" y1="124" x2="322" y2="124" stroke="#CBD5E1" stroke-width="1.2"/>

      <!-- Row 4: Iron nail -->
      <text x="14" y="147" fill="#1E293B">くぎ（鉄）</text>
      <text x="265" y="147" text-anchor="middle" font-weight="bold" fill="#B45309">[ ③ ]</text>
      <line x1="0" y1="154" x2="322" y2="154" stroke="#CBD5E1" stroke-width="1.2"/>

      <!-- Row 5: 1 yen -->
      <text x="14" y="177" fill="#1E293B">一円玉（アルミニウム）</text>
      <text x="265" y="177" text-anchor="middle" font-weight="bold" fill="#B45309">[ ④ ]</text>
      <line x1="0" y1="184" x2="322" y2="184" stroke="#CBD5E1" stroke-width="1.2"/>

      <!-- Row 6: Chopsticks -->
      <text x="14" y="205" fill="#1E293B">わりばし（木）</text>
      <text x="265" y="205" text-anchor="middle" font-weight="bold" fill="#B45309">[ ⑤ ]</text>
    </g>
  </g>
</svg>
