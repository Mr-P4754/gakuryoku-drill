<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320">
  <defs>
    <linearGradient id="sky7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <marker id="arrOrg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#EA580C"/>
    </marker>
  </defs>

  <rect width="620" height="320" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="310" y="26" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15" font-weight="bold" fill="#065F46">1日の太陽とかげの動き</text>

  <!-- Sky area -->
  <rect x="22" y="38" width="576" height="162" rx="10" fill="url(#sky7)" stroke="#94A3B8" stroke-width="1.4"/>

  <!-- 3 Sun positions: 午前10時 (left/East) -> 正午 (top/South) -> 午後2時 (right/West) -->
  <!-- 午前10時 -->
  <g transform="translate(154, 92)">
    <circle cx="0" cy="0" r="16" fill="#FACC15" stroke="#EA580C" stroke-width="2"/>
    <g stroke="#EA580C" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-23" x2="0" y2="-19"/><line x1="0" y1="19" x2="0" y2="23"/>
      <line x1="-23" y1="0" x2="-19" y2="0"/><line x1="19" y1="0" x2="23" y2="0"/>
      <line x1="-16" y1="-16" x2="-13" y2="-13"/><line x1="13" y1="13" x2="16" y2="16"/>
      <line x1="16" y1="-16" x2="13" y2="-13"/><line x1="-13" y1="13" x2="-16" y2="16"/>
    </g>
  </g>
  <text x="154" y="132" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#9A3412">午前10時</text>

  <!-- 正午 -->
  <g transform="translate(310, 68)">
    <circle cx="0" cy="0" r="16" fill="#FACC15" stroke="#EA580C" stroke-width="2"/>
    <g stroke="#EA580C" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-23" x2="0" y2="-19"/><line x1="0" y1="19" x2="0" y2="23"/>
      <line x1="-23" y1="0" x2="-19" y2="0"/><line x1="19" y1="0" x2="23" y2="0"/>
      <line x1="-16" y1="-16" x2="-13" y2="-13"/><line x1="13" y1="13" x2="16" y2="16"/>
      <line x1="16" y1="-16" x2="13" y2="-13"/><line x1="-13" y1="13" x2="-16" y2="16"/>
    </g>
  </g>
  <text x="310" y="108" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#9A3412">正午</text>

  <!-- 午後2時 -->
  <g transform="translate(466, 92)">
    <circle cx="0" cy="0" r="16" fill="#FACC15" stroke="#EA580C" stroke-width="2"/>
    <g stroke="#EA580C" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-23" x2="0" y2="-19"/><line x1="0" y1="19" x2="0" y2="23"/>
      <line x1="-23" y1="0" x2="-19" y2="0"/><line x1="19" y1="0" x2="23" y2="0"/>
      <line x1="-16" y1="-16" x2="-13" y2="-13"/><line x1="13" y1="13" x2="16" y2="16"/>
      <line x1="16" y1="-16" x2="13" y2="-13"/><line x1="-13" y1="13" x2="-16" y2="16"/>
    </g>
  </g>
  <text x="466" y="132" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#9A3412">午後2時</text>

  <!-- Arrows between sun positions -->
  <path d="M188,84 Q234,68 278,68" fill="none" stroke="#EA580C" stroke-width="2.2" marker-end="url(#arrOrg)"/>
  <path d="M342,68 Q386,68 432,84" fill="none" stroke="#EA580C" stroke-width="2.2" marker-end="url(#arrOrg)"/>

  <!-- Mountain horizon -->
  <path d="M23,200 L23,174 Q92,148 164,168 Q232,150 302,166 Q384,152 462,164 Q532,146 597,172 L597,200 Z" fill="#86EFAC" stroke="#15803D" stroke-width="1.3"/>

  <!-- Ground area -->
  <rect x="22" y="200" width="576" height="106" rx="8" fill="#FEFCE8" stroke="#94A3B8" stroke-width="1.4"/>

  <!-- Compass directions along horizon -->
  <text x="48" y="220" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#B45309">← 東</text>
  <text x="336" y="220" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#B45309">南</text>
  <text x="572" y="220" text-anchor="end" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#B45309">西 →</text>

  <!-- 3 Shadows fanning downward from stick base (310, 232) -->
  <!-- ア (left = Eastward, afternoon 2PM shadow) -->
  <polygon points="304,230 232,278 248,284 310,234" fill="#64748B" opacity="0.65"/>
  <!-- イ (center = Northward, noon shortest shadow) -->
  <polygon points="306,232 302,276 318,276 314,232" fill="#64748B" opacity="0.65"/>
  <!-- ウ (right = Westward, morning 10AM shadow) -->
  <polygon points="316,230 388,278 372,284 310,234" fill="#64748B" opacity="0.65"/>

  <!-- Vertical stick in base -->
  <rect x="298" y="216" width="24" height="18" rx="3" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <rect x="306" y="156" width="8" height="62" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>

  <!-- Labels ア, イ, ウ -->
  <circle cx="232" cy="292" r="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="232" y="297" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#1D4ED8">ア</text>

  <circle cx="310" cy="292" r="13" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="310" y="297" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#065F46">イ</text>

  <circle cx="388" cy="292" r="13" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="388" y="297" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13.5" font-weight="bold" fill="#B45309">ウ</text>
</svg>
