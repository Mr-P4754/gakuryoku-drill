<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 256" width="540" height="256" role="img" aria-label="割合と百分率の関係と対応数直線">
  <title>割合と百分率の関係と対応数直線</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 11.5px; font-weight: 600; fill: #475569; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .dim-sm { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .th { font-size: 13.5px; font-weight: 700; fill: #1E293B; }
      .td { font-size: 15px; font-weight: 600; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="540" height="256" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="270" y="28" text-anchor="middle" class="title">割合と百分率（％）の関係</text>
  <rect x="20" y="42" width="500" height="58" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="270" y="66" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1D4ED8">割合 ＝ 比べられる量 ÷ もとにする量</text>
  <text x="270" y="88" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0F766E">比べられる量 ＝ もとにする量 × 割合</text>
  <text x="256" y="124" text-anchor="middle" class="lbl-sm">百分率（％）と小数の割合の対応</text>
  <line x1="56.0" y1="154.0" x2="456.0" y2="154.0" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/>
  <text x="494" y="159" text-anchor="middle" class="lbl-sm" fill="#2563EB">百分率(%)</text>
  <line x1="56.0" y1="194.0" x2="456.0" y2="194.0" stroke="#DC2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="494" y="199" text-anchor="middle" class="lbl-sm" fill="#DC2626">割合(小数)</text>
  <line x1="56.0" y1="147.0" x2="56.0" y2="161.0" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round"/>
  <text x="56.0" y="141" text-anchor="middle" class="dim-sm" fill="#2563EB">0</text>
  <line x1="56.0" y1="187.0" x2="56.0" y2="201.0" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round"/>
  <text x="56.0" y="217" text-anchor="middle" class="dim-sm" fill="#DC2626">0</text>
  <line x1="56.0" y1="162.0" x2="56.0" y2="186.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="96.0" y1="147.0" x2="96.0" y2="161.0" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round"/>
  <text x="96.0" y="141" text-anchor="middle" class="dim-sm" fill="#2563EB">10</text>
  <line x1="96.0" y1="187.0" x2="96.0" y2="201.0" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round"/>
  <text x="96.0" y="217" text-anchor="middle" class="dim-sm" fill="#DC2626">0.1</text>
  <line x1="96.0" y1="162.0" x2="96.0" y2="186.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="136.0" y1="147.0" x2="136.0" y2="161.0" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round"/>
  <text x="136.0" y="141" text-anchor="middle" class="dim-sm" fill="#2563EB">20</text>
  <line x1="136.0" y1="187.0" x2="136.0" y2="201.0" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round"/>
  <text x="136.0" y="217" text-anchor="middle" class="dim-sm" fill="#DC2626">0.2</text>
  <line x1="136.0" y1="162.0" x2="136.0" y2="186.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="256.0" y1="147.0" x2="256.0" y2="161.0" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round"/>
  <text x="256.0" y="141" text-anchor="middle" class="dim-sm" fill="#2563EB">50</text>
  <line x1="256.0" y1="187.0" x2="256.0" y2="201.0" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round"/>
  <text x="256.0" y="217" text-anchor="middle" class="dim-sm" fill="#DC2626">0.5</text>
  <line x1="256.0" y1="162.0" x2="256.0" y2="186.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="336.0" y1="147.0" x2="336.0" y2="161.0" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round"/>
  <text x="336.0" y="141" text-anchor="middle" class="dim-sm" fill="#2563EB">70</text>
  <line x1="336.0" y1="187.0" x2="336.0" y2="201.0" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round"/>
  <text x="336.0" y="217" text-anchor="middle" class="dim-sm" fill="#DC2626">0.7</text>
  <line x1="336.0" y1="162.0" x2="336.0" y2="186.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="456.0" y1="147.0" x2="456.0" y2="161.0" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round"/>
  <text x="456.0" y="141" text-anchor="middle" class="dim-sm" fill="#2563EB">100</text>
  <line x1="456.0" y1="187.0" x2="456.0" y2="201.0" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round"/>
  <text x="456.0" y="217" text-anchor="middle" class="dim-sm" fill="#DC2626">1</text>
  <line x1="456.0" y1="162.0" x2="456.0" y2="186.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3,2"/>
  <text x="270" y="242" text-anchor="middle" class="lbl-xs" fill="#475569">★ 割合の 0.01 が 1% ／ 0.1 が 10% ／ 1 が 100%（もとにする量そのもの）</text>
</svg>
