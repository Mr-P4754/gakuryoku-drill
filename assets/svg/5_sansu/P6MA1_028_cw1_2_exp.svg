<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 256" width="490" height="256" role="img" aria-label="4つの三角形を等積変形でよせた解説図">
  <title>4つの三角形を等積変形でよせた解説図</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 11.5px; font-weight: 600; fill: #475569; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .dim-sm { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .th { font-size: 13.5px; font-weight: 700; fill: #1E293B; }
      .td { font-size: 15px; font-weight: 600; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="490" height="256" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <polygon points="46.0,36.0 46.0,186.0 196.0,186.0 196.0,36.0" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <polygon points="46.0,36.0 46.0,103.5 196.0,136.5" fill="#BFDBFE" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="46.0,103.5 46.0,136.5 196.0,136.5" fill="#BFDBFE" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="46.0,136.5 74.5,186.0 148.0,136.5" fill="#CBD5E1" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="148.0,136.5 161.5,186.0 196.0,136.5" fill="#CBD5E1" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="46.0" y1="136.5" x2="196.0" y2="136.5" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
  <text x="34" y="40" text-anchor="middle" class="lbl-sm">A</text>
  <text x="34" y="192" text-anchor="middle" class="lbl-sm">B</text>
  <text x="208" y="192" text-anchor="middle" class="lbl-sm">C</text>
  <text x="208" y="40" text-anchor="middle" class="lbl-sm">D</text>
  <text x="34" y="140.5" text-anchor="middle" class="lbl-sm">E</text>
  <text x="208" y="140.5" text-anchor="middle" class="lbl-sm">F</text>
  <text x="121" y="216" text-anchor="middle" class="lbl-sm" fill="#2563EB">① 上の三角形をFによせる</text>
  <text x="242" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#DC2626">⇒</text>
  <polygon points="290.0,36.0 290.0,186.0 440.0,186.0 440.0,36.0" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <polygon points="290.0,36.0 290.0,103.5 440.0,136.5" fill="#BFDBFE" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="290.0,103.5 290.0,136.5 440.0,136.5" fill="#BFDBFE" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="290.0,136.5 290.0,186.0 392.0,136.5" fill="#A7F3D0" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="392.0,136.5 290.0,186.0 440.0,136.5" fill="#A7F3D0" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="290.0" y1="136.5" x2="440.0" y2="136.5" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
  <text x="278" y="40" text-anchor="middle" class="lbl-sm">A</text>
  <text x="278" y="192" text-anchor="middle" class="lbl-sm">B</text>
  <text x="452" y="192" text-anchor="middle" class="lbl-sm">C</text>
  <text x="452" y="40" text-anchor="middle" class="lbl-sm">D</text>
  <text x="278" y="140.5" text-anchor="middle" class="lbl-sm">E</text>
  <text x="452" y="140.5" text-anchor="middle" class="lbl-sm">F</text>
  <text x="365" y="216" text-anchor="middle" class="lbl-sm" fill="#0F766E">② 下の三角形をBによせる</text>
  <text x="245" y="242" text-anchor="middle" class="lbl-sm" fill="#DC2626">→ 上も下も長方形の半分！あわせて正方形のちょうど半分！</text>
</svg>
