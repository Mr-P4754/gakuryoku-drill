  </defs>
  <rect x="0" y="0" width="240" height="210" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="120.0" y1="40.0" x2="120.0" y2="138.0" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="72.0" y1="158.0" x2="120.0" y2="138.0" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="168.0" y1="158.0" x2="120.0" y2="138.0" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4,3"/>
  <polygon points="72.0,60.0 94.0,80.0 94.0,178.0 72.0,158.0" fill="#DBEAFE" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="94.0,80.0 146.0,80.0 146.0,178.0 94.0,178.0" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="146.0,80.0 168.0,60.0 168.0,158.0 146.0,178.0" fill="#BFDBFE" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
