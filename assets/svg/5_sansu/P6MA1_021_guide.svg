<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" width="600" height="236" role="img" aria-label="円の半径・直径・円周と円周の公式">
  <title>円の半径・直径・円周と円周の公式</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="236" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="136" cy="122" r="82" fill="#EFF6FF" stroke="#DC2626" stroke-width="3.6"/>
  <line x1="54" y1="122" x2="218" y2="122" stroke="#2563EB" stroke-width="2.4"/>
  <line x1="136" y1="122" x2="190.9" y2="61.1" stroke="#059669" stroke-width="2.4" stroke-dasharray="5,3"/>
  <circle cx="136" cy="122" r="4.5" fill="#1E293B"/>
  <text x="136" y="144" text-anchor="middle" class="lbl blue halo">直径（8cm）</text>
  <text x="176" y="96" text-anchor="middle" class="lbl-sm green halo">半径(4cm)</text>
  <text x="136" y="28" text-anchor="middle" class="lbl red">円周（まわりの長さ）</text>
  <rect x="256" y="26" width="324" height="186" rx="10" fill="#FEFCE8" stroke="#FDE047" stroke-width="1.6"/>
  <text x="418" y="58" text-anchor="middle" class="title red">円周 ＝ 直径 × 円周率(3.14)</text>
  <line x1="274" y1="74" x2="562" y2="74" stroke="#FDE047" stroke-width="1.5"/>
  <text x="276" y="104" class="lbl-sm">● 直径がわかっているとき</text>
  <text x="290" y="128" class="lbl blue">直径 × 3.14</text>
  <text x="276" y="160" class="lbl-sm">● 半径がわかっているとき（要注意！）</text>
  <text x="290" y="186" class="lbl green">半径 × 2 × 3.14（まず直径に！）</text>
</svg>
