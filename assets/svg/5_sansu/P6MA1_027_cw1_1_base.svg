      .th { font-size: 13.5px; font-weight: 700; fill: #1E293B; }
      .td { font-size: 15px; font-weight: 600; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="540" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="270" y="28" text-anchor="middle" class="lbl-sm" fill="#475569">2日め・3日めの線と必要な数字をかき入れよう</text>
  <text x="54" y="77" text-anchor="middle" class="lbl">1日め</text>
  <text x="54" y="145" text-anchor="middle" class="lbl">2日め</text>
  <text x="54" y="213" text-anchor="middle" class="lbl">3日め</text>
  <line x1="106.0" y1="52.0" x2="106.0" y2="226.0" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/>
  <line x1="106.0" y1="72.0" x2="418.0" y2="72.0" stroke="#1E293B" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="106.0" y1="64.0" x2="106.0" y2="80.0" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="418.0" y1="64.0" x2="418.0" y2="80.0" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="106.0" y1="132.0" x2="106.0" y2="148.0" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="106.0" y1="200.0" x2="106.0" y2="216.0" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round"/>
