<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 146" width="520" height="146" role="img" aria-label="長方形の横の長さと面積の表">
  <title>長方形の横の長さと面積の表</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 11.5px; font-weight: 600; fill: #475569; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .dim-sm { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .th { font-size: 13.5px; font-weight: 700; fill: #1E293B; }
      .td { font-size: 15px; font-weight: 600; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="520" height="146" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="260" y="30" text-anchor="middle" class="lbl">たて3cmの長方形の横の長さと面積</text>
  <rect x="22" y="46" width="156" height="38" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="100.0" y="70.0" text-anchor="middle" class="th">横の長さ □ (cm)</text>
  <rect x="178" y="46" width="70" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="213.0" y="70.0" text-anchor="middle" class="td">1</text>
  <rect x="248" y="46" width="70" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="283.0" y="70.0" text-anchor="middle" class="td">2</text>
  <rect x="318" y="46" width="70" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="353.0" y="70.0" text-anchor="middle" class="td">3</text>
  <rect x="388" y="46" width="70" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="423.0" y="70.0" text-anchor="middle" class="td">4</text>
  <rect x="22" y="84" width="156" height="38" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="100.0" y="108.0" text-anchor="middle" class="th">面積 ○ (cm²)</text>
  <rect x="178" y="84" width="70" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="213.0" y="108.0" text-anchor="middle" class="td">3</text>
  <rect x="248" y="84" width="70" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="283.0" y="108.0" text-anchor="middle" class="td">6</text>
  <rect x="318" y="84" width="70" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="353.0" y="108.0" text-anchor="middle" class="td">9</text>
  <rect x="388" y="84" width="70" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="423.0" y="108.0" text-anchor="middle" class="td">12</text>
  <rect x="458" y="46" width="34" height="76" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1" stroke-dasharray="3,2"/>
  <line x1="458.0" y1="84.0" x2="492.0" y2="84.0" stroke="#94A3B8" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3,2"/>
  <text x="475.0" y="70.0" text-anchor="middle" class="lbl-xs">…</text>
  <text x="475.0" y="108.0" text-anchor="middle" class="lbl-xs">…</text>
  <rect x="22" y="46" width="436" height="76" fill="none" stroke="#1E293B" stroke-width="1.6"/>
</svg>
