<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 178" width="320" height="178" role="img" aria-label="赤いタイル12cmと青いタイル20cmを横に並べる図">
  <title>赤いタイル12cmと青いタイル20cmを横に並べる図</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="320" height="178" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="34" y="66" text-anchor="middle" class="lbl red">赤</text>
  <rect x="66" y="46" width="60" height="28" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
  <rect x="126" y="46" width="60" height="28" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
  <rect x="186" y="46" width="60" height="28" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
  <text x="260" y="66" class="num-lg muted">…</text>
  <path d="M 66.0 46.0 Q 96.0 22.0 126.0 46.0" fill="none" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="96.0" y="37.2" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626" class="halo">12cm</text>
  <text x="34" y="120" text-anchor="middle" class="lbl blue">青</text>
  <rect x="66" y="92" width="100" height="44" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/>
  <rect x="166" y="92" width="80" height="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="260" y="120" class="num-lg muted">…</text>
  <path d="M 166.0 136.0 Q 116.0 164.8 66.0 136.0" fill="none" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="116.0" y="157.6" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB" class="halo">20cm</text>
</svg>
