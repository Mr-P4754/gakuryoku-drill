<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 228" width="600" height="228" role="img" aria-label="多角形の角の和の求め方と早見表">
  <title>多角形の角の和の求め方と早見表</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="228" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="20" y="28" class="title">1つの頂点から対角線をひいて三角形に分けよう！</text>
  <polygon points="105.0,56.0 195.0,92.0 176.0,186.0 78.0,186.0 48.0,114.0" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="78" y1="186" x2="105" y2="56" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="78" y1="186" x2="195" y2="92" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="78" cy="186" r="5" fill="#DC2626"/>
  <text x="74" y="136" text-anchor="middle" class="lbl-xs red">①</text>
  <text x="122" y="114" text-anchor="middle" class="lbl-xs red">②</text>
  <text x="150" y="160" text-anchor="middle" class="lbl-xs red">③</text>
  <text x="122" y="214" text-anchor="middle" class="lbl red">五角形：180°×3＝540°</text>
  <rect x="240" y="48" width="84" height="32" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="282.0" y="69" text-anchor="middle" class="lbl-xs blue">多角形</text>
  <rect x="324" y="48" width="108" height="32" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="378.0" y="69" text-anchor="middle" class="lbl-xs blue">三角形の数</text>
  <rect x="432" y="48" width="152" height="32" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="508.0" y="69" text-anchor="middle" class="lbl-xs blue">角の大きさの和</text>
  <rect x="240" y="80" width="84" height="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="282.0" y="101" text-anchor="middle" class="lbl-xs">五角形</text>
  <rect x="324" y="80" width="108" height="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="378.0" y="101" text-anchor="middle" class="lbl-xs">3つ（5−2）</text>
  <rect x="432" y="80" width="152" height="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="508.0" y="101" text-anchor="middle" class="lbl-xs red">180°×3 ＝ 540°</text>
  <rect x="240" y="112" width="84" height="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="282.0" y="133" text-anchor="middle" class="lbl-xs">六角形</text>
  <rect x="324" y="112" width="108" height="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="378.0" y="133" text-anchor="middle" class="lbl-xs">4つ（6−2）</text>
  <rect x="432" y="112" width="152" height="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="508.0" y="133" text-anchor="middle" class="lbl-xs red">180°×4 ＝ 720°</text>
  <rect x="240" y="144" width="84" height="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="282.0" y="165" text-anchor="middle" class="lbl-xs">七角形</text>
  <rect x="324" y="144" width="108" height="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="378.0" y="165" text-anchor="middle" class="lbl-xs">5つ（7−2）</text>
  <rect x="432" y="144" width="152" height="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="508.0" y="165" text-anchor="middle" class="lbl-xs red">180°×5 ＝ 900°</text>
  <rect x="240" y="176" width="84" height="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="282.0" y="197" text-anchor="middle" class="lbl-xs">八角形</text>
  <rect x="324" y="176" width="108" height="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="378.0" y="197" text-anchor="middle" class="lbl-xs">6つ（8−2）</text>
  <rect x="432" y="176" width="152" height="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="508.0" y="197" text-anchor="middle" class="lbl-xs red">180°×6 ＝ 1080°</text>
</svg>
