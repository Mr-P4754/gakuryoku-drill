<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 178" width="560" height="178" role="img" aria-label="直径40cmの車輪が100回転で進む距離の解説図">
  <title>直径40cmの車輪が100回転で進む距離の解説図</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="178" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="20" y="28" class="title">車輪1回転 ＝ 円周1つぶん の長さだけ進む！</text>
  <circle cx="92" cy="106" r="46" fill="#EFF6FF" stroke="#2563EB" stroke-width="3.2"/>
  <line x1="92" y1="60" x2="92" y2="152" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="92" cy="106" r="4" fill="#1E293B"/>
  <text x="92" y="112" text-anchor="middle" class="lbl-xs red halo">直径40cm</text>
  <line x1="36" y1="152" x2="544" y2="152" stroke="#334155" stroke-width="2.2"/>
  <line x1="92" y1="152" x2="360" y2="152" stroke="#DC2626" stroke-width="4.5"/>
  <circle cx="92" cy="152" r="4" fill="#DC2626"/>
  <circle cx="360" cy="152" r="4" fill="#DC2626"/>
  <text x="226" y="138" text-anchor="middle" class="lbl-sm red">1回転 ＝ 40×3.14 ＝ 125.6cm</text>
  <rect x="174" y="48" width="366" height="62" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="190" y="74" class="lbl-sm green">100回転：125.6 × 100 ＝ 12560cm</text>
  <text x="190" y="98" class="lbl red">単位を m に直す（1m＝100cm）→ 125.6m！</text>
</svg>
