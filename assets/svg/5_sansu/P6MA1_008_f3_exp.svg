<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 192" width="620" height="192" role="img" aria-label="40本は25本の何倍かの二重数直線解説図">
  <title>40本は25本の何倍かの二重数直線解説図</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="192" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="20" y="28" class="title">40本は25本の何倍か（25本が1倍＝もとにする大きさ）</text>
  <line x1="56" y1="82" x2="410" y2="82" stroke="#1E293B" stroke-width="2.2"/>
  <line x1="56" y1="134" x2="410" y2="134" stroke="#1E293B" stroke-width="2.2"/>
  <text x="418" y="87" class="lbl-sm">(本)</text>
  <text x="418" y="139" class="lbl-sm">(倍)</text>
  <line x1="56.0" y1="74" x2="56.0" y2="90" stroke="#1E293B" stroke-width="2"/>
  <text x="56.0" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">0</text>
  <line x1="264.8" y1="74" x2="264.8" y2="90" stroke="#1E293B" stroke-width="2"/>
  <text x="264.8" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB">25</text>
  <line x1="390.0" y1="74" x2="390.0" y2="90" stroke="#1E293B" stroke-width="2"/>
  <text x="390.0" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">40</text>
  <line x1="56.0" y1="126" x2="56.0" y2="142" stroke="#1E293B" stroke-width="2"/>
  <text x="56.0" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">0</text>
  <line x1="264.8" y1="126" x2="264.8" y2="142" stroke="#1E293B" stroke-width="2"/>
  <text x="264.8" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB">1</text>
  <line x1="390.0" y1="126" x2="390.0" y2="142" stroke="#1E293B" stroke-width="2"/>
  <rect x="376.0" y="150" width="28" height="28" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="390.0" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">□</text>
  <line x1="264.8" y1="90" x2="264.8" y2="126" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3,3"/>
  <line x1="390.0" y1="90" x2="390.0" y2="126" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3,3"/>
  <rect x="462" y="66" width="144" height="86" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="534" y="96" text-anchor="middle" class="lbl-xs blue">求める式</text>
  <text x="534" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#1D4ED8">□＝40÷25</text>
</svg>
