  <line x1="484" y1="36" x2="484" y2="178" stroke="#059669" stroke-width="2.6" stroke-dasharray="5,3"/>
  <rect x="319" y="166" width="212" height="28" rx="6" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/>
  <text x="425" y="185" text-anchor="middle" class="lbl-sm green">最小公倍数 30cm でぴったり！</text>
