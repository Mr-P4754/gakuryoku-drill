  <rect x="400" y="52" width="84" height="32" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
  <text x="442" y="73" text-anchor="middle" class="lbl-xs red">6cm</text>
  <text x="484" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">30</text>
