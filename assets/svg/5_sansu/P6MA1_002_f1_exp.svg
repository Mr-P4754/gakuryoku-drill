  <rect x="148" y="52" width="84" height="32" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
  <text x="190" y="73" text-anchor="middle" class="lbl-xs red">6cm</text>
  <text x="232" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">12</text>
  <rect x="232" y="52" width="84" height="32" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
  <text x="274" y="73" text-anchor="middle" class="lbl-xs red">6cm</text>
