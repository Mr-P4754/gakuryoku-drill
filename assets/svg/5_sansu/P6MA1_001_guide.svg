<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 226" width="600" height="226" role="img" aria-label="10と15の公倍数と最小公倍数の見つけ方">
  <title>10と15の公倍数と最小公倍数の見つけ方</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="226" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="20" y="32" class="title">10と15の 公倍数・最小公倍数 の見つけ方</text>
  <rect x="20" y="48" width="96" height="32" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="68" y="69" text-anchor="middle" class="lbl blue">10の倍数</text>
  <text x="148" y="70" text-anchor="middle" class="num-lg">10</text>
  <text x="212" y="70" text-anchor="middle" class="num-lg">20</text>
  <circle cx="276" cy="64" r="18" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="276" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">30</text>
  <text x="340" y="70" text-anchor="middle" class="num-lg">40</text>
  <text x="404" y="70" text-anchor="middle" class="num-lg">50</text>
  <circle cx="468" cy="64" r="18" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.2"/>
  <text x="468" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">60</text>
  <text x="524" y="70" class="num-lg muted">…</text>
  <rect x="20" y="102" width="96" height="32" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="68" y="123" text-anchor="middle" class="lbl green">15の倍数</text>
  <text x="180" y="124" text-anchor="middle" class="num-lg">15</text>
  <circle cx="276" cy="118" r="18" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="276" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">30</text>
  <text x="372" y="124" text-anchor="middle" class="num-lg">45</text>
  <circle cx="468" cy="118" r="18" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.2"/>
  <text x="468" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">60</text>
  <text x="530" y="124" text-anchor="middle" class="num-lg">75</text>
  <text x="560" y="124" class="num-lg muted">…</text>
  <line x1="276" y1="82" x2="276" y2="100" stroke="#DC2626" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="468" y1="82" x2="468" y2="100" stroke="#0F766E" stroke-width="2" stroke-dasharray="3,2"/>
  <rect x="20" y="152" width="265" height="58" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="34" y="175" class="lbl red">最小公倍数 ＝ 30</text>
  <text x="34" y="198" class="lbl-xs">公倍数のうち、いちばん小さい数！</text>
  <rect x="300" y="152" width="280" height="58" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="314" y="175" class="lbl teal">公倍数 ＝ 30，60，90，…</text>
  <text x="314" y="198" class="lbl-xs">最小公倍数（30）の倍数になっているよ</text>
</svg>
