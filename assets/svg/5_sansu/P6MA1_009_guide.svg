<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 226" width="600" height="226" role="img" aria-label="もとにする大きさをわり算で求める関係図">
  <title>もとにする大きさをわり算で求める関係図</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="226" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="20" y="28" class="title">もとにする大きさを求めるときは「わり算」になる！</text>
  <rect x="28" y="56" width="166" height="68" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="111" y="84" text-anchor="middle" class="lbl red">もとにする大きさ</text>
  <text x="111" y="108" text-anchor="middle" class="lbl-sm">とおるさんの体重（□kg）</text>
  <rect x="350" y="56" width="218" height="68" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="459" y="84" text-anchor="middle" class="lbl blue">1.8倍にあたる大きさ</text>
  <text x="459" y="108" text-anchor="middle" class="lbl-sm">お父さんの体重（63kg）</text>
  <line x1="202" y1="74" x2="340" y2="74" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <text x="272" y="66" text-anchor="middle" class="lbl blue">× 1.8</text>
  <line x1="342" y1="108" x2="204" y2="108" stroke="#DC2626" stroke-width="2.4" marker-end="url(#arr-red)"/>
  <text x="272" y="130" text-anchor="middle" class="lbl red">÷ 1.8</text>
  <rect x="28" y="148" width="540" height="62" rx="10" fill="#FEFCE8" stroke="#FDE047" stroke-width="1.5"/>
  <text x="298" y="175" text-anchor="middle" class="lbl">□ × 1.8 ＝ 63　→　□ ＝ 63 ÷ 1.8</text>
  <text x="298" y="198" text-anchor="middle" class="lbl-xs">「□の●倍は▲」のとき，もとにする大きさ □ ＝ ▲ ÷ ● だよ！</text>
</svg>
