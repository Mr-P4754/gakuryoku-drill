<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-label="平行四辺形・台形・ひし形の面積公式">
  <title>平行四辺形・台形・ひし形の面積公式</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 11.5px; font-weight: 600; fill: #475569; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .dim-sm { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="560" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="14" y="14" width="166" height="212" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="97" y="38" text-anchor="middle" class="lbl" fill="#2563EB">平行四辺形</text>
  <polygon points="34.0,146.0 124.0,146.0 158.0,76.0 68.0,76.0" fill="#DBEAFE" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="68.0" y1="76.0" x2="68.0" y2="146.0" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="4,3"/>
  <polyline points="60.0,146.0 60.0,138.0 68.0,138.0" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <text x="79" y="166" text-anchor="middle" class="dim-sm" fill="#2563EB">底辺</text>
  <text x="92" y="116" text-anchor="middle" class="dim-sm halo" fill="#DC2626">高さ</text>
  <text x="97" y="198" text-anchor="middle" font-size="13.5" font-weight="700">底辺 × 高さ</text>
  <text x="97" y="216" text-anchor="middle" class="lbl-xs">高さは底辺と垂直！</text>
  <rect x="190" y="14" width="176" height="212" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="278" y="38" text-anchor="middle" class="lbl" fill="#0F766E">台形</text>
  <polygon points="214.0,146.0 342.0,146.0 324.0,76.0 254.0,76.0" fill="#CCFBF1" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="254.0" y1="76.0" x2="254.0" y2="146.0" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="4,3"/>
  <polyline points="262.0,146.0 262.0,138.0 254.0,138.0" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <text x="289" y="68" text-anchor="middle" class="dim-sm" fill="#0F766E">上底</text>
  <text x="278" y="166" text-anchor="middle" class="dim-sm" fill="#0F766E">下底</text>
  <text x="280" y="116" text-anchor="middle" class="dim-sm halo" fill="#DC2626">高さ</text>
  <text x="278" y="198" text-anchor="middle" font-size="13" font-weight="700">(上底＋下底)×高さ÷2</text>
  <text x="278" y="216" text-anchor="middle" class="lbl-xs">平行な2辺が上底・下底</text>
  <rect x="376" y="14" width="170" height="212" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="461" y="38" text-anchor="middle" class="lbl" fill="#D97706">ひし形</text>
  <polygon points="461.0,66.0 528.0,112.0 461.0,158.0 394.0,112.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="394.0" y1="112.0" x2="528.0" y2="112.0" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="461.0" y1="66.0" x2="461.0" y2="158.0" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4,3"/>
  <polyline points="468.0,112.0 468.0,105.0 461.0,105.0" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <text x="434" y="106" text-anchor="middle" class="lbl-xs halo" fill="#DC2626">対角線</text>
  <text x="488" y="132" text-anchor="middle" class="lbl-xs halo" fill="#DC2626">対角線</text>
  <text x="461" y="198" text-anchor="middle" font-size="13" font-weight="700">対角線×対角線÷2</text>
  <text x="461" y="216" text-anchor="middle" class="lbl-xs">÷2を忘れずに！</text>
</svg>
