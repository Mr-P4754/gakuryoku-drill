<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 238" width="600" height="238" role="img" aria-label="小数の倍の式のたて方ガイド">
  <title>小数の倍の式のたて方ガイド</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="238" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="20" y="28" class="title">倍の問題は「の」の前 ＝【もとにする大きさ】に注目！</text>
  <rect x="18" y="44" width="564" height="82" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="34" y="72" class="lbl blue">① ●倍にあたる大きさを求める（かけ算）</text>
  <text x="34" y="104" font-size="16" font-weight="700">16L の 0.3倍</text>
  <text x="164" y="104" font-size="15" font-weight="700" class="muted">→</text>
  <text x="192" y="104" font-size="18" font-weight="700" fill="#DC2626">16 × 0.3</text>
  <text x="310" y="104" class="lbl-xs">（もとにする大きさ × 倍）</text>
  <rect x="18" y="140" width="564" height="82" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="34" y="168" class="lbl green">② 何倍かを求める（わり算）</text>
  <text x="34" y="200" font-size="16" font-weight="700">96g は 120g の 何倍？</text>
  <text x="226" y="200" font-size="15" font-weight="700" class="muted">→</text>
  <text x="254" y="200" font-size="18" font-weight="700" fill="#059669">96 ÷ 120</text>
  <text x="368" y="200" class="lbl-xs">（くらべる大きさ ÷ もとにする大きさ）</text>
</svg>
