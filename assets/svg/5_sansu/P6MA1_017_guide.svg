  <rect x="362" y="44" width="164" height="176" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="444" y="66" text-anchor="middle" class="lbl-sm" fill="#D97706">③ 一部を取り除く</text>
  <polygon points="445.0,115.5 382.0,115.5 405.1,97.9 468.1,97.9" fill="#FEFCE8" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
