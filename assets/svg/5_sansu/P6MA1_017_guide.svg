  <polygon points="487.0,147.0 445.0,147.0 468.1,129.4 510.1,129.4" fill="#FEFCE8" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <polygon points="487.0,168.0 487.0,147.0 510.1,129.4 510.1,150.4" fill="#FDE68A" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <polygon points="382.0,168.0 487.0,168.0 487.0,147.0 445.0,147.0 445.0,115.5 382.0,115.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <line x1="445.0" y1="115.5" x2="487.0" y2="115.5" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="487.0" y1="115.5" x2="487.0" y2="147.0" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="487.0" y1="115.5" x2="510.1" y2="97.9" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="468.1" y1="97.9" x2="510.1" y2="97.9" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="510.1" y1="97.9" x2="510.1" y2="129.4" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4,3"/>
  <text x="444" y="196" text-anchor="middle" class="lbl-xs">大－欠け ＝ 200－48</text>
  <text x="444" y="212" text-anchor="middle" class="lbl-xs" fill="#DC2626">＝ 152cm³</text>
</svg>
