  <text x="96" y="212" text-anchor="middle" class="lbl-xs" fill="#DC2626">＝ 152cm³</text>
  <rect x="188" y="44" width="164" height="176" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="270" y="66" text-anchor="middle" class="lbl-sm" fill="#0F766E">② 上下に分ける</text>
