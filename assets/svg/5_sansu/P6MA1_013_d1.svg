  <rect x="0" y="0" width="350" height="206" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="175" y="30" text-anchor="middle" class="lbl">部屋の面積と子どもの人数</text>
