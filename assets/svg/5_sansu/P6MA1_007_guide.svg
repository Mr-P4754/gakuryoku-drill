<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="積や商が1より小さい小数のかけ算とわり算のポイント">
  <title>積や商が1より小さい小数のかけ算とわり算のポイント</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="14" y="14" width="276" height="232" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="152" y="40" text-anchor="middle" class="title blue">積が1より小さいかけ算</text>
  <text x="172" y="76" text-anchor="end" font-size="20" font-weight="700" font-family="monospace">1.4</text>
  <text x="172" y="104" text-anchor="end" font-size="20" font-weight="700" font-family="monospace">× 0.6</text>
  <line x1="88" y1="114" x2="180" y2="114" stroke="#1E293B" stroke-width="2"/>
  <rect x="108" y="121" width="32" height="28" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="3,2"/>
  <text x="124" y="142" text-anchor="middle" font-size="21" font-weight="700" fill="#DC2626" font-family="monospace">0.</text>
  <text x="158" y="142" text-anchor="middle" font-size="21" font-weight="700" font-family="monospace">84</text>
  <text x="152" y="186" text-anchor="middle" class="lbl-sm red">小数点を左へ2けたうつしたら</text>
  <text x="152" y="210" text-anchor="middle" class="lbl-sm red">一の位に「0」を書き足すよ！</text>
  <rect x="306" y="14" width="280" height="232" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="446" y="40" text-anchor="middle" class="title green">商が1より小さいわり算</text>
  <text x="434" y="74" text-anchor="middle" font-size="20" font-weight="700" fill="#DC2626" font-family="monospace">0.</text>
  <text x="462" y="74" text-anchor="middle" font-size="20" font-weight="700" fill="#059669" font-family="monospace">48</text>
  <line x1="406" y1="82" x2="508" y2="82" stroke="#1E293B" stroke-width="2"/>
  <path d="M 406 82 Q 416 96 404 110" fill="none" stroke="#1E293B" stroke-width="2"/>
  <text x="386" y="106" text-anchor="middle" font-size="20" font-weight="700" font-family="monospace">5</text>
  <text x="444" y="106" text-anchor="middle" font-size="20" font-weight="700" font-family="monospace">2.4</text>
  <circle cx="476" cy="99" r="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="3,2"/>
  <text x="476" y="106" text-anchor="middle" font-size="19" font-weight="700" fill="#2563EB" font-family="monospace">0</text>
  <text x="446" y="132" text-anchor="middle" font-size="18" font-weight="600" font-family="monospace">20</text>
  <line x1="420" y1="139" x2="494" y2="139" stroke="#1E293B" stroke-width="1.6"/>
  <text x="462" y="160" text-anchor="middle" font-size="18" font-weight="600" font-family="monospace">40</text>
  <text x="462" y="180" text-anchor="middle" font-size="18" font-weight="600" font-family="monospace">40</text>
  <line x1="420" y1="186" x2="494" y2="186" stroke="#1E293B" stroke-width="1.6"/>
  <text x="474" y="204" text-anchor="middle" font-size="18" font-weight="700" font-family="monospace">0</text>
  <text x="446" y="224" text-anchor="middle" class="lbl-xs red">①商の一の位に「0.」を立てる</text>
  <text x="446" y="240" text-anchor="middle" class="lbl-xs blue">②わり進む「0」を書き足す</text>
</svg>
