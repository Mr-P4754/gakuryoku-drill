<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 246" width="540" height="246" role="img" aria-label="角柱と円柱の特徴と展開図">
  <title>角柱と円柱の特徴と展開図</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 11.5px; font-weight: 600; fill: #475569; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .dim-sm { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="540" height="246" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="14" y="14" width="170" height="218" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="99" y="38" text-anchor="middle" class="lbl" fill="#2563EB">角柱（例：四角柱）</text>
  <line x1="54.0" y1="168.0" x2="80.4" y2="147.8" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="80.4" y1="147.8" x2="152.4" y2="147.8" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="80.4" y1="147.8" x2="80.4" y2="59.8" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4,3"/>
  <polygon points="54.0,80.0 126.0,80.0 152.4,59.8 80.4,59.8" fill="#BFDBFE" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <polygon points="54.0,168.0 126.0,168.0 126.0,80.0 54.0,80.0" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <polygon points="126.0,168.0 152.4,147.8 152.4,59.8 126.0,80.0" fill="#DBEAFE" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <text x="112" y="64" text-anchor="middle" class="lbl-xs" fill="#1D4ED8">底面</text>
  <text x="90" y="130" text-anchor="middle" class="lbl-xs">側面</text>
  <text x="99" y="196" text-anchor="middle" class="lbl-xs">平面だけで囲まれた立体</text>
  <text x="99" y="214" text-anchor="middle" class="lbl-xs" fill="#2563EB">底面の形で名前が決まる</text>
  <rect x="196" y="14" width="160" height="218" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="276" y="38" text-anchor="middle" class="lbl" fill="#0F766E">円柱</text>
  <path d="M 238 74 L 238 158 A 38 13 0 0 0 314 158 L 314 74 Z" fill="#ECFDF5" stroke="#1E293B" stroke-width="2"/>
  <path d="M 238 158 A 38 13 0 0 1 314 158" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4,3"/>
  <ellipse cx="276" cy="74" rx="38" ry="13" fill="#A7F3D0" stroke="#1E293B" stroke-width="2"/>
  <text x="276" y="78" text-anchor="middle" class="lbl-xs" fill="#0F766E">底面</text>
  <text x="276" y="128" text-anchor="middle" class="lbl-xs">側面（曲面）</text>
  <text x="276" y="196" text-anchor="middle" class="lbl-xs">2つの底面は合同な円</text>
  <text x="276" y="214" text-anchor="middle" class="lbl-xs" fill="#0F766E">側面を広げると長方形</text>
  <rect x="368" y="14" width="158" height="218" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="447" y="38" text-anchor="middle" class="lbl" fill="#D97706">円柱の展開図</text>
  <circle cx="447" cy="74" r="19" fill="#FEF3C7" stroke="#1E293B" stroke-width="1.8"/>
  <rect x="394" y="93" width="106" height="54" fill="#FFFBEB" stroke="#1E293B" stroke-width="1.8"/>
  <circle cx="447" cy="166" r="19" fill="#FEF3C7" stroke="#1E293B" stroke-width="1.8"/>
  <text x="447" y="125" text-anchor="middle" class="lbl-xs">側面</text>
  <text x="447" y="206" text-anchor="middle" class="lbl-xs">底面の円周 ＝ 側面の横</text>
</svg>
