<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 256" width="540" height="256" role="img" aria-label="三角形の面積の求め方">
  <title>三角形の面積の求め方</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 11.5px; font-weight: 600; fill: #475569; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .dim-sm { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="540" height="256" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="16" y="14" width="508" height="36" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="270" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8">三角形の面積 ＝ 底辺 × 高さ ÷ 2</text>
  <text x="26" y="74" class="lbl" fill="#2563EB">(1)</text>
  <polygon points="150.0,74.0 68.0,184.0 198.0,184.0" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="150.0" y1="74.0" x2="68.0" y2="184.0" stroke="#2563EB" stroke-width="3.0" stroke-linecap="round"/>
  <line x1="198.0" y1="184.0" x2="114.4" y2="121.7" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5,3"/>
  <polyline points="119.8,114.5 127.0,119.9 121.7,127.1" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M 68.0 184.0 Q 73.7 102.7 150.0 74.0" fill="none" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="85.4" y="120.9" text-anchor="middle" class="dim-sm halo" fill="#2563EB">底辺 10cm</text>
  <text x="142.2" y="164.9" text-anchor="middle" class="dim-sm halo" fill="#DC2626">高さ 7cm</text>
  <path d="M 150.0 74.0 Q 203.3 116.2 198.0 184.0" fill="none" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="188.7" y="127.6" text-anchor="middle" class="lbl-xs halo" fill="#64748B">8cm</text>
  <text x="134" y="216" text-anchor="middle" class="lbl-sm">10 × 7 ÷ 2 ＝ <tspan fill="#DC2626" font-weight="700">35cm²</tspan></text>
  <line x1="268.0" y1="62.0" x2="268.0" y2="224.0" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
  <text x="284" y="74" class="lbl" fill="#2563EB">(2)</text>
  <polygon points="452.0,74.0 306.0,184.0 384.0,184.0" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="306.0" y1="184.0" x2="384.0" y2="184.0" stroke="#2563EB" stroke-width="3.0" stroke-linecap="round"/>
  <line x1="384.0" y1="184.0" x2="452.0" y2="184.0" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="452.0" y1="74.0" x2="452.0" y2="184.0" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5,3"/>
  <polyline points="443.0,184.0 443.0,175.0 452.0,175.0" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M 306.0 184.0 Q 345.0 220.0 384.0 184.0" fill="none" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="345.0" y="207.0" text-anchor="middle" class="dim-sm halo" fill="#2563EB">底辺 4m</text>
  <path d="M 452.0 184.0 Q 500.0 129.0 452.0 74.0" fill="none" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="486.0" y="134.0" text-anchor="middle" class="dim-sm halo" fill="#DC2626">高さ 5m</text>
  <path d="M 306.0 184.0 Q 359.7 103.4 452.0 74.0" fill="none" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="369.4" y="121.2" text-anchor="middle" class="lbl-xs halo" fill="#64748B">9m</text>
  <text x="400" y="218" text-anchor="middle" class="lbl-sm">4 × 5 ÷ 2 ＝ <tspan fill="#DC2626" font-weight="700">10m²</tspan></text>
  <text x="270" y="242" text-anchor="middle" class="lbl-xs" fill="#DC2626">★ 高さは必ず「底辺に垂直な線」の長さをさがそう！（斜めの辺8cmや9mではないよ）</text>
</svg>
