  <text x="180" y="60" text-anchor="middle" class="lbl-sm blue">横 12cm（3cm × 4こ）</text>
  <text x="72" y="142.0" text-anchor="end" class="lbl-sm green">縦 9cm</text>
  <text x="72" y="160.0" text-anchor="end" class="lbl-xs green">(3cm×3こ)</text>
  <rect x="304" y="66" width="276" height="154" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="318" y="94" class="lbl red">余りなく切り分けるときは…</text>
  <text x="318" y="120" class="lbl-sm">縦（9の約数）にも 横（12の約数）にも</text>
