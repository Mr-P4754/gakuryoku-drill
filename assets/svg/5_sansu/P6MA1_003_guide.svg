<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 254" width="600" height="254" role="img" aria-label="8と12の公約数と最大公約数の見つけ方">
  <title>8と12の公約数と最大公約数の見つけ方</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="254" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="20" y="30" class="title">8と12の 公約数・最大公約数 の見つけ方</text>
  <rect x="20" y="48" width="96" height="32" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="68" y="69" text-anchor="middle" class="lbl blue">8の約数</text>
  <circle cx="155" cy="64" r="17" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.2"/>
  <text x="155" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">1</text>
  <circle cx="220" cy="64" r="17" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.2"/>
  <text x="220" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">2</text>
  <circle cx="350" cy="64" r="17" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="350" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">4</text>
  <text x="480" y="70" text-anchor="middle" class="num-lg">8</text>
  <rect x="20" y="106" width="96" height="32" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="68" y="127" text-anchor="middle" class="lbl green">12の約数</text>
  <circle cx="155" cy="122" r="17" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.2"/>
  <text x="155" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">1</text>
  <circle cx="220" cy="122" r="17" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.2"/>
  <text x="220" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">2</text>
  <text x="285" y="128" text-anchor="middle" class="num-lg">3</text>
  <circle cx="350" cy="122" r="17" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="350" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">4</text>
  <text x="415" y="128" text-anchor="middle" class="num-lg">6</text>
  <text x="545" y="128" text-anchor="middle" class="num-lg">12</text>
  <line x1="155" y1="81" x2="155" y2="105" stroke="#0F766E" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="220" y1="81" x2="220" y2="105" stroke="#0F766E" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="350" y1="81" x2="350" y2="105" stroke="#DC2626" stroke-width="2" stroke-dasharray="3,2"/>
  <path d="M 285 141 Q 317.5 162 350 141" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
  <path d="M 220 141 Q 317.5 174 415 141" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
  <path d="M 155 141 Q 350 188 545 141" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="350" y="180" text-anchor="middle" class="lbl-xs">かけて12になるペア（1×12, 2×6, 3×4）でさがすとぬけもれなし！</text>
  <rect x="20" y="194" width="265" height="46" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="152" y="222" text-anchor="middle" class="lbl teal">公約数 ＝ 1，2，4</text>
  <rect x="300" y="194" width="280" height="46" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="440" y="222" text-anchor="middle" class="lbl red">最大公約数 ＝ 4</text>
</svg>
