<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" role="img" aria-label="直方体と立方体の体積の公式">
  <title>直方体と立方体の体積の公式</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 11.5px; font-weight: 600; fill: #475569; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .dim-sm { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="540" height="250" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="14" y="14" width="256" height="222" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="142" y="38" text-anchor="middle" class="lbl" fill="#2563EB">直方体の体積</text>
  <polygon points="58.0,105.5 174.0,105.5 221.8,69.0 105.8,69.0" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <polygon points="58.0,178.0 174.0,178.0 174.0,105.5 58.0,105.5" fill="#DBEAFE" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <polygon points="174.0,178.0 221.8,141.5 221.8,69.0 174.0,105.5" fill="#BFDBFE" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <path d="M 58.0 105.5 Q 60.1 58.6 105.8 69.0" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="71.0" y="77.9" text-anchor="middle" class="dim halo" fill="#1E293B">縦 6cm</text>
  <path d="M 58.0 105.5 Q 116.0 141.5 174.0 105.5" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="116.0" y="128.5" text-anchor="middle" class="dim halo" fill="#1E293B">横 8cm</text>
  <path d="M 58.0 178.0 Q 14.0 141.8 58.0 105.5" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="36.0" y="146.8" text-anchor="middle" class="dim halo" fill="#1E293B">高さ 5cm</text>
  <text x="142" y="206" text-anchor="middle" font-size="13.5" font-weight="700">縦 × 横 × 高さ</text>
  <text x="142" y="226" text-anchor="middle" class="lbl-xs">6 × 8 × 5 ＝ <tspan fill="#DC2626" font-weight="700">240cm³</tspan></text>
  <rect x="284" y="14" width="242" height="222" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="405" y="38" text-anchor="middle" class="lbl" fill="#0F766E">立方体の体積</text>
  <polygon points="358.0,102.0 430.0,102.0 469.6,71.8 397.6,71.8" fill="#ECFDF5" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <polygon points="358.0,174.0 430.0,174.0 430.0,102.0 358.0,102.0" fill="#D1FAE5" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <polygon points="430.0,174.0 469.6,143.8 469.6,71.8 430.0,102.0" fill="#A7F3D0" stroke="#1E293B" stroke-width="2.0" stroke-linejoin="round"/>
  <path d="M 358.0 102.0 Q 356.0 58.3 397.6 71.8" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="366.9" y="77.6" text-anchor="middle" class="dim halo" fill="#1E293B">3cm</text>
  <path d="M 358.0 102.0 Q 394.0 138.0 430.0 102.0" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="394.0" y="125.0" text-anchor="middle" class="dim halo" fill="#1E293B">3cm</text>
  <path d="M 358.0 174.0 Q 314.0 138.0 358.0 102.0" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="3.5,3"/>
  <text x="336.0" y="143.0" text-anchor="middle" class="dim halo" fill="#1E293B">3cm</text>
  <text x="405" y="206" text-anchor="middle" font-size="13.5" font-weight="700">1辺 × 1辺 × 1辺</text>
  <text x="405" y="226" text-anchor="middle" class="lbl-xs">3 × 3 × 3 ＝ <tspan fill="#DC2626" font-weight="700">27cm³</tspan></text>
</svg>
