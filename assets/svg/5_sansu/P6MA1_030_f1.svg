<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 146" width="520" height="146" role="img" aria-label="リボンの長さと代金の表">
  <title>リボンの長さと代金の表</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 11.5px; font-weight: 600; fill: #475569; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .dim-sm { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .th { font-size: 13.5px; font-weight: 700; fill: #1E293B; }
      .td { font-size: 15px; font-weight: 600; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="520" height="146" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="260" y="30" text-anchor="middle" class="lbl">リボンの長さと代金の関係</text>
  <rect x="22" y="46" width="152" height="38" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="98.0" y="70.0" text-anchor="middle" class="th">長さ □ (m)</text>
  <rect x="174" y="46" width="72" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="210.0" y="70.0" text-anchor="middle" class="td">1</text>
  <rect x="246" y="46" width="72" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="282.0" y="70.0" text-anchor="middle" class="td">2</text>
  <rect x="318" y="46" width="72" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="354.0" y="70.0" text-anchor="middle" class="td">3</text>
  <rect x="390" y="46" width="72" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="426.0" y="70.0" text-anchor="middle" class="td">4</text>
  <rect x="22" y="84" width="152" height="38" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="98.0" y="108.0" text-anchor="middle" class="th">代金 ○ (円)</text>
  <rect x="174" y="84" width="72" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="210.0" y="108.0" text-anchor="middle" class="td">60</text>
  <rect x="246" y="84" width="72" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="282.0" y="108.0" text-anchor="middle" class="td">120</text>
  <rect x="318" y="84" width="72" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="354.0" y="108.0" text-anchor="middle" class="td">180</text>
  <rect x="390" y="84" width="72" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="426.0" y="108.0" text-anchor="middle" class="td">240</text>
  <rect x="462" y="46" width="34" height="76" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1" stroke-dasharray="3,2"/>
  <line x1="462.0" y1="84.0" x2="496.0" y2="84.0" stroke="#94A3B8" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3,2"/>
  <text x="479.0" y="70.0" text-anchor="middle" class="lbl-xs">…</text>
  <text x="479.0" y="108.0" text-anchor="middle" class="lbl-xs">…</text>
  <rect x="22" y="46" width="440" height="76" fill="none" stroke="#1E293B" stroke-width="1.6"/>
</svg>
