<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 268" width="540" height="268" role="img" aria-label="速さ・道のり・時間の公式と数直線">
  <title>速さ・道のり・時間の公式と数直線</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 11.5px; font-weight: 600; fill: #475569; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .dim-sm { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .th { font-size: 13.5px; font-weight: 700; fill: #1E293B; }
      .td { font-size: 15px; font-weight: 600; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="540" height="268" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="270" y="30" text-anchor="middle" class="title">速さ・道のり・時間の関係</text>
  <rect x="18" y="44" width="160" height="68" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="98" y="68" text-anchor="middle" class="lbl" fill="#2563EB">速さ</text>
  <text x="98" y="94" text-anchor="middle" class="dim-sm">＝ 道のり ÷ 時間</text>
  <rect x="190" y="44" width="160" height="68" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.4"/>
  <text x="270" y="68" text-anchor="middle" class="lbl" fill="#0F766E">道のり</text>
  <text x="270" y="94" text-anchor="middle" class="dim-sm">＝ 速さ × 時間</text>
  <rect x="362" y="44" width="160" height="68" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="442" y="68" text-anchor="middle" class="lbl" fill="#D97706">時間</text>
  <text x="442" y="94" text-anchor="middle" class="dim-sm">＝ 道のり ÷ 速さ</text>
  <rect x="18" y="124" width="504" height="132" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="34" y="146" class="lbl-sm" fill="#1E293B">【数直線で考えよう】秒速15mで飛ぶ鳥が600m飛ぶ時間</text>
  <line x1="56.0" y1="194.0" x2="456.0" y2="194.0" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="56.0" y1="187.0" x2="56.0" y2="201.0" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="124.0" y1="187.0" x2="124.0" y2="201.0" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="404.0" y1="187.0" x2="404.0" y2="201.0" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round"/>
  <text x="56" y="182" text-anchor="middle" class="dim-sm">0</text>
  <text x="124" y="182" text-anchor="middle" class="dim-sm" fill="#2563EB">15</text>
  <text x="404" y="182" text-anchor="middle" class="dim-sm" fill="#DC2626">600</text>
  <text x="486" y="198" text-anchor="middle" class="lbl-sm">(m)</text>
  <line x1="56.0" y1="224.0" x2="456.0" y2="224.0" stroke="#0F766E" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="56.0" y1="217.0" x2="56.0" y2="231.0" stroke="#0F766E" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="124.0" y1="217.0" x2="124.0" y2="231.0" stroke="#0F766E" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="404.0" y1="217.0" x2="404.0" y2="231.0" stroke="#0F766E" stroke-width="2.0" stroke-linecap="round"/>
  <text x="56" y="246" text-anchor="middle" class="dim-sm">0</text>
  <text x="124" y="246" text-anchor="middle" class="dim-sm" fill="#0F766E">1</text>
  <text x="404" y="246" text-anchor="middle" class="dim-sm" fill="#DC2626">□＝40</text>
  <text x="486" y="228" text-anchor="middle" class="lbl-sm">(秒)</text>
  <path d="M 134 176 Q 264 156 392 176" fill="none" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4,2"/>
  <text x="264" y="168" text-anchor="middle" class="lbl-xs halo" fill="#DC2626">600 ÷ 15 ＝ 40倍</text>
</svg>
