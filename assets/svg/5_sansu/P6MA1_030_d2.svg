  <rect x="186" y="84" width="68" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="220.0" y="108.0" text-anchor="middle" class="td">4</text>
  <rect x="254" y="84" width="68" height="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
