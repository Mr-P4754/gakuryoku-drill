<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 265" width="600" height="265" role="img" aria-label="長方形をしきつめて正方形を作る考え方">
  <title>長方形をしきつめて正方形を作る考え方</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .sub { font-size: 13px; font-weight: 600; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .num-lg { font-size: 17px; font-weight: 700; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .green { fill: #059669; }
      .amber { fill: #B45309; }
      .muted { fill: #64748B; }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="265" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="20" y="30" class="title">縦9cm・横12cmの長方形をしきつめて正方形をつくる</text>
  <rect x="110" y="74" width="56" height="42" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <rect x="166" y="74" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="222" y="74" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="110" y="116" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="166" y="116" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="222" y="116" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="110" y="158" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="166" y="158" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="222" y="158" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="110" y="200" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="166" y="200" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="222" y="200" width="56" height="42" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="110" y="74" width="168" height="168" fill="none" stroke="#1E293B" stroke-width="2.6"/>
  <text x="138.0" y="100.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">1まい</text>
  <line x1="110" y1="60" x2="278" y2="60" stroke="#2563EB" stroke-width="1.8" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="194.0" y="53" text-anchor="middle" class="lbl-sm blue">横：12cmの倍数 → 36cm（3まい）</text>
  <line x1="96" y1="74" x2="96" y2="242" stroke="#059669" stroke-width="1.8"/>
  <text x="88" y="98" text-anchor="end" class="lbl-xs green">9cm</text>
  <text x="88" y="166" text-anchor="end" class="lbl-sm green">9の倍数</text>
  <text x="88" y="186" text-anchor="end" class="lbl-sm green">36cm</text>
  <text x="88" y="204" text-anchor="end" class="lbl-xs green">（4まい）</text>
  <rect x="308" y="68" width="272" height="176" rx="10" fill="#FEFCE8" stroke="#FDE047" stroke-width="1.5"/>
  <text x="324" y="96" class="lbl amber">正方形の1辺の長さは…</text>
  <text x="324" y="124" class="lbl-sm">縦（9cmの倍数）と</text>
  <text x="324" y="146" class="lbl-sm">横（12cmの倍数）が等しくなる！</text>
  <line x1="324" y1="160" x2="564" y2="160" stroke="#FDE047" stroke-width="1.5"/>
  <text x="324" y="184" class="lbl-sm">いちばん小さい正方形の1辺は</text>
  <text x="324" y="208" class="lbl red">9と12の最小公倍数 ＝ 36cm</text>
  <text x="324" y="232" class="lbl-xs">（9の倍数: 9,18,27,36 / 12: 12,24,36）</text>
</svg>
