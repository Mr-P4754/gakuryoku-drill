<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" role="img" aria-label="まわりの長さ10cmの長方形4種と変わり方解説">
  <title>まわりの長さ10cmの長方形4種と変わり方解説</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .title { font-size: 16px; font-weight: 700; fill: #1E293B; }
      .lbl { font-size: 14px; font-weight: 700; }
      .lbl-sm { font-size: 13px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 14px; font-weight: 700; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .th { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .td { font-size: 14px; font-weight: 600; fill: #1E293B; }
    </style>
  </defs>
  <rect x="0" y="0" width="560" height="210" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="26" y="16" width="88" height="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="70.0" y="54.0" text-anchor="middle" font-size="12" font-weight="700">1×4</text>
  <rect x="136" y="16" width="66" height="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="169.0" y="76.0" text-anchor="middle" font-size="12" font-weight="700">2×3</text>
  <rect x="226" y="16" width="44" height="66" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="248.0" y="98.0" text-anchor="middle" font-size="12" font-weight="700">3×2</text>
  <rect x="300" y="16" width="22" height="88" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="311.0" y="120.0" text-anchor="middle" font-size="12" font-weight="700">4×1</text>
  <rect x="355" y="58" width="96" height="34" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
  <text x="403.0" y="80.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">たて(cm)</text>
  <rect x="451" y="58" width="26" height="34" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <text x="464.0" y="80.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">1</text>
  <rect x="477" y="58" width="26" height="34" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <text x="490.0" y="80.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">2</text>
  <rect x="503" y="58" width="26" height="34" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <text x="516.0" y="80.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">3</text>
  <rect x="529" y="58" width="26" height="34" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <text x="542.0" y="80.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">4</text>
  <rect x="355" y="92" width="96" height="34" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
  <text x="403.0" y="114.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">横(cm)</text>
  <rect x="451" y="92" width="26" height="34" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <text x="464.0" y="114.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">4</text>
  <rect x="477" y="92" width="26" height="34" fill="#DCFCE7" stroke="#475569" stroke-width="1.2"/>
  <text x="490.0" y="114.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">3</text>
  <rect x="503" y="92" width="26" height="34" fill="#DCFCE7" stroke="#475569" stroke-width="1.2"/>
  <text x="516.0" y="114.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">2</text>
  <rect x="529" y="92" width="26" height="34" fill="#DCFCE7" stroke="#475569" stroke-width="1.2"/>
  <text x="542.0" y="114.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">1</text>
  <rect x="355" y="58" width="200" height="68" fill="none" stroke="#1E293B" stroke-width="1.8"/>
  <text x="492" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">+1  +1  +1</text>
  <text x="492" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">-1  -1  -1</text>
  <text x="280" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E">たてが1cmふえると、横は1cmずつへる（たて＋横＝5cm）</text>
</svg>
