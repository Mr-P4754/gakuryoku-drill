  <line x1="82" y1="108" x2="148" y2="108" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="5,3"/>
  <circle cx="115.0" cy="75.0" r="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
