<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 175" width="640" height="175" role="img" aria-label="がい数のはんい（265以上275未満）">
  <title>がい数のはんい（265以上275未満）</title>
  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .lbl { font-size: 16px; font-weight: 600; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 13px; font-weight: 500; fill: #475569; }
      .num { font-size: 16px; font-weight: 700; }
      .arrow-lbl { font-size: 18px; font-weight: 700; fill: #2563EB; }
      .blank-num { font-size: 18px; font-weight: 700; fill: #2563EB; }
      .ans-num { font-size: 18px; font-weight: 700; fill: #0F766E; }
      .unit-txt { font-size: 15px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="142" y="76" width="360" height="30" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="322.0" y="96" text-anchor="middle" class="lbl-sm" fill="#1D4ED8">四捨五入して 270 になるはんい</text>
  <line x1="54" y1="62" x2="590" y2="62" stroke="#1E293B" stroke-width="2"/>
  <line x1="70" y1="56" x2="70" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="106" y1="56" x2="106" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="142" y1="51" x2="142" y2="73" stroke="#1E293B" stroke-width="1.6"/>
  <text x="142" y="44" text-anchor="middle" class="num">265</text>
  <line x1="178" y1="56" x2="178" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="214" y1="56" x2="214" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="250" y1="56" x2="250" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="286" y1="56" x2="286" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="322" y1="51" x2="322" y2="73" stroke="#1E293B" stroke-width="1.6"/>
  <text x="322" y="44" text-anchor="middle" class="num">270</text>
  <line x1="358" y1="56" x2="358" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="394" y1="56" x2="394" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="430" y1="56" x2="430" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="466" y1="56" x2="466" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="502" y1="51" x2="502" y2="73" stroke="#1E293B" stroke-width="1.6"/>
  <text x="502" y="44" text-anchor="middle" class="num">275</text>
  <line x1="538" y1="56" x2="538" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="574" y1="56" x2="574" y2="68" stroke="#1E293B" stroke-width="1.6"/>
  <circle cx="142" cy="62" r="6" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
  <circle cx="502" cy="62" r="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.4"/>
  <text x="142" y="132" text-anchor="middle" class="lbl-sm" fill="#1D4ED8">265以上（265は入る ●）</text>
  <text x="502" y="132" text-anchor="middle" class="lbl-sm" fill="#DC2626">275未満（275は入らない ○）</text>
  <text x="320" y="158" text-anchor="middle" class="lbl-xs">整数で考えると、いちばん小さい数は 265、いちばん大きい数は 274 だよ。</text>
</svg>
