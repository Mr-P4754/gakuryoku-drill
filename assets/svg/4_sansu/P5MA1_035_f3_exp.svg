  <rect x="115" y="94" width="64" height="24" fill="#DCFCE7" stroke="#1E293B" stroke-width="1.8"/>
  <rect x="125.0" y="71" width="44" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="M 115.0 94.0 Q 147.0 84.0 179.0 94.0" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="147.0" y="84.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">□m</text>
