      .teal { fill: #0F766E; }
      .th { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .td { font-size: 14px; font-weight: 600; fill: #1E293B; }
    </style>
  </defs>
  <rect x="0" y="0" width="460" height="185" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="115" y="44" width="128" height="24" fill="#DBEAFE" stroke="#1E293B" stroke-width="1.8"/>
  <line x1="179" y1="44" x2="179" y2="68" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3,2"/>
  <path d="M 115.0 44.0 Q 179.0 26.0 243.0 44.0" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="179.0" y="24.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">24m</text>
