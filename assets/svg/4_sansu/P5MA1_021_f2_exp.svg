<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-label="凸字形の面積の解説図">
  <title>凸字形の面積の解説図</title>

  <defs>
    <style>
      text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #1E293B; }
      .lbl { font-size: 16px; font-weight: 700; }
      .lbl-sm { font-size: 14px; font-weight: 600; }
      .lbl-xs { font-size: 12px; font-weight: 600; fill: #475569; }
      .num { font-size: 15px; font-weight: 700; }
      .blue { fill: #2563EB; }
      .red { fill: #DC2626; }
      .teal { fill: #0F766E; }
      .dim { font-size: 14px; font-weight: 700; fill: #1E293B; }
    </style>
  </defs>
  <rect x="0" y="0" width="360" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="168" y="42" width="48" height="96" fill="#FEF3C7" stroke="none"/>
  <rect x="72" y="138" width="216" height="72" fill="#DBEAFE" stroke="none"/>
  <polygon points="168.0,42.0 216.0,42.0 216.0,138.0 288.0,138.0 288.0,210.0 72.0,210.0 72.0,138.0 168.0,138.0" fill="none" stroke="#1E293B" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="168" y1="138" x2="216" y2="138" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="5,3"/>
  <circle cx="192.0" cy="90.0" r="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="192.0" y="95.0" text-anchor="middle" font-size="14" font-weight="700" fill="#D97706">え</text>
  <circle cx="180.0" cy="174.0" r="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="180.0" y="179.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">う</text>
  <text x="180" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">う(3×9＝27)＋え(4×2＝8)＝35 cm²</text>
</svg>
